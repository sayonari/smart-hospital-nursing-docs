e":"文言をアプリに載せない"}],"assessment_points":["不安を訴える患者でも，まず体の原因を除外する：SpO2・血圧・脈・心電図・血糖・痛み・薬・離脱．低酸素や頻脈が不安として出ていることがある（不安の対応だけで済ませない）","「何が一番心配か」を本人の言葉で聞く（死・痛み・手術・ICD・仕事・家族・お金）．心配の中身によって必要な対応（情報・傾聴・専門職・家族）が変わる","不安のサインは言葉だけでなく行動で拾う：落ち着かない，眠れない，同じ質問を繰り返す，ナースコールの増加，食欲低下，逆に黙り込む","パニック発作（突然の強い恐怖，動悸，息苦しさ，死ぬのではという感覚が数分〜十数分）と心臓の症状（労作時胸痛・失神など）は区別して記録し，どちらも医師に伝える","「消えてしまいたい」「生きていても仕方ない」などの言葉があれば，自傷・自殺のリスクとして速やかに医師に報告し，一人にしない（院内の対応手順に従う）"]},"goals":{"long_term":"不安が本人にとって対処できる程度に収まり，治療・検査・リハビリに落ち着いて取り組め，退院後の生活の見通しを持てる","short_term":["24 時間以内：一番心配なことを本人が言葉にでき，看護師がそれを記録・チームで共有している","検査・手術の前日まで：手順・流れ・痛みへの対応・術後の様子について本人の理解に合った説明を受け，質問できている","3 日以内：不安の強さ（主観的評価）が本人の言う「楽になった」水準に下がり，夜間の睡眠が取れている","退院までに：不安が強くなったときの自分なりの対処法（呼吸法・相談先など）を 1 つ以上言える"]},"OP":["不安の訴えと内容（何が心配か），強さ（0〜10 など），いつ強くなるか（夜間・検査前・面会後・一人のとき）","行動のサイン：落ち着きのなさ，表情，涙，同じ質問の繰り返し，ナースコールの回数，黙り込み，離床やリハビリを避ける","体の症状：動悸・息苦しさ・胸の違和感・手のふるえ・発汗・吐き気と，そのときのバイタル・SpO2・心電図（心臓の症状との区別）","睡眠：入眠困難，中途覚醒，昼間の眠気","不安を強める身体要因：低酸素，頻脈・不整脈，低血糖，痛み，便秘・尿閉，カフェイン，薬（β刺激薬・ステロイドなど），アルコールやベンゾジアゼピンの離脱","病気・治療の理解の程度：説明をどう受け取っているか，誤解や情報不足（インターネットの情報を含む）","ICD 患者：作動の回数・状況，作動への恐れ，活動を控えていないか","支え：家族の反応（過度に不安・過保護・無関心），キーパーソン，相談できる人がいるか","抗不安薬・睡眠薬を使っているときの効果と副作用（眠気・ふらつき・呼吸抑制・せん妄・転倒）","自傷・自殺をほのめかす言葉や，希望のなさの訴え"],"TP":["まず体の原因を確認する：不安の訴えがあるときは SpO2・脈・血圧・心電図・痛みを見て，異常があれば院内の緊急対応へ．確認できた所見はそのまま伝え（「今の心電図と酸素の値は問題ありません」），まだ原因がはっきりしない部分と分けて説明する（看護の観察だけで「体の原因はない」と断定しない）．初めての・続く・強くなる胸痛や息苦しさは，不安の訴えが繰り返されていても医師へ報告し，再評価につなぐ","そばにいて話を聴く：さえぎらず，否定せず（「大丈夫」「気にしすぎ」で片付けない），本人の言葉を繰り返して確認する．短時間でも「また来ます」と約束して守る","情報を本人のペースで：今起きていること・これからの流れ・痛みや不快への対応を，専門用語を避けて説明する．一度に多くを言わず，質問を歓迎し，同じ質問にも同じ内容で答える（説明の内容はチームで統一）","検査・手術前：手順の説明，見学できる部分（術後に入る部屋・モニタ）を事前に見せる，麻酔・痛み止め・術後の過ごし方を伝える．本人が希望すれば家族にも同席してもらう","急性期の環境：モニタ音や処置の意味を説明し（アラームの減音・消音はしない），照明・騒音を調整し，時計や家族の写真など安心できるものを近くに置く","不安の身体反応への対処：ゆっくりした呼吸（吐く息を長く），力を抜く練習，温かい飲み物（水分制限内）や好きな音楽など，本人に合う方法を一緒に試す","ICD 作動を経験した患者へ：作動時の状況を丁寧に聞き，「装置が守ってくれた」という意味づけを伝える．作動への恐れが活動の制限や不眠に及んでいれば医師に報告し，心理士・精神科への相談を検討する","回復期：安静度の範囲での離床・心臓リハビリが不安の軽減にもつながることを伝え，「動いても大丈夫だった」体験を積めるよう見守る","家族と協力する：家族に病状と経過を説明し（本人の同意のもと），本人の前で不安をあおらない関わり方を一緒に考える．家族自身の不安にも耳を傾ける","薬が必要なときは医師に相談する：抗不安薬・睡眠薬を使う場合は転倒・呼吸抑制・せん妄に注意して観察し，急な中止は離脱を起こすため減らし方は医師が決める","不安が強く続く・パニック発作を繰り返す・自傷の危険があるときは，医師に報告し，精神科リエゾン・心療内科・心理士へつなぐ（院内の連携手順）","担当看護師をできるだけ固定し，説明の内容と本人の心配ごとをカルテで共有する"],"EP":["患者へ：心臓の病気や手術の前後で不安になるのは自然な反応で，多くは経過とともに軽くなること．我慢せず話してよいこと","患者へ：不安のときに出る体の症状（動悸・息苦しさ）と，心臓の症状（労作で出る胸痛・失神など）を区別する目安．どちらも知らせてよいこと","患者へ：不安が強くなったときの対処（ゆっくり息を吐く，ナースコール，家族に電話，好きな音楽など）","手術・検査を受ける患者へ：流れ・痛みへの対応・術後の様子を，本人が知りたい範囲で．「聞きたくないこと」も尊重する","ICD の患者へ：作動は命を守る働きであること，作動したときの対処（座って休む，回数と状況をメモ，連絡の目安は疾患別リストと施設の指示）","家族へ：本人の前で不安をあおらず，落ち着いて話を聴く関わり方．家族自身も相談してよいこと","患者・家族へ：退院後も不安・不眠・落ち込みが続くときは外来で伝えてよいこと，相談窓口（心療内科・心臓リハビリ・患者会など）"],"evaluation":{"timing":"毎勤務（特に夜間），検査・手術の前後，ICD 作動後，退院前","indicators":["本人の主観的な不安の強さが下がっている，または「対処できる」と言える","夜間の睡眠が取れ，落ち着きのなさ・ナースコールの増加などのサインが減っている","治療・検査・リハビリに参加できている（回避していない）","本人が心配ごとを言葉にでき，情報の誤解が解けている","自傷・自殺のリスクがあるときは医師・チームで共有され，安全が確保されている"],"revise_if":"不安が強くなった・パニック発作が出た／不眠が続く／治療やリハビリを避ける／ICD が作動した／新しい検査や手術が決まった／自傷・自殺をほのめかす言葉があった／家族の状況が変わった"},"cardio_ward_notes":["不安は交感神経を刺激して頻脈・血圧上昇・不整脈・心筋の酸素需要の増加を招く．急性冠症候群・大動脈解離・重症不整脈では，不安の緩和そのものが循環を守るケアになる","「不安のせい」と決めつける前に心臓を確認する：動悸・息苦しさ・胸の違和感は，不安でも心不全の悪化・不整脈・虚血でも起こる．心電図・SpO2・バイタルを見てから対応し，繰り返す場合は医師に相談する（不安による胸痛の対応は疾患別リストの panic_cardiac_neurosis と整合させる）","ICD 作動後の不安・恐怖・PTSD 様の症状はよく起こる．作動の回数と状況を記録し，本人の体験を聴き，活動の回避や不眠が続けば早めに専門職につなぐ","抗不安薬（ベンゾジアゼピン系）は心不全・COPD の患者で呼吸抑制，高齢者で転倒・せん妄を起こしやすい．使うときは医師・薬剤師と相談し，投与後の呼吸・意識・ふらつきを観察する","CCU/ICU のモニタ・アラーム・処置は不安とせん妄の両方の誘因になる．意味を説明し環境を整えるが，モニタ警報の減音・消音は行わない（せん妄の計画と共通）","術前の不安には，術後の姿（挿管・ドレーン・モニタ）と痛みへの対応を事前に伝えることが役立つ．開心術後の共通管理・カテーテル検査前後の説明内容と矛盾しないよう，チームで説明の内容を統一する"],"sources":[{"name":"Open RN Nursing: Mental Health and Community Concepts 2e, Ch.9 Anxiety Disorders（9.2 Basic Concepts，9.7 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingmhcc/chapter/9-7-applying-the-nursing-process/","license":"CC BY 4.0","note":"不安の段階・身体症状・アセスメント（PQRSTU）・自傷リスクの確認の体系を参考"},{"name":"Open RN Nursing: Mental Health and Community Concepts 2e, Ch.3 Stress, Coping, and Crisis Intervention（3.6 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingmhcc/chapter/3-6-applying-the-nursing-process-to-stress-and-coping/","license":"CC BY 4.0","note":"ストレス・対処のアセスメントと介入の体系を参考"},{"name":"Open RN Nursing: Mental Health and Community Concepts 2e, Ch.2 Therapeutic Communication（2.3）","url":"https://wtcs.pressbooks.pub/nursingmhcc/chapter/2-3-therapeutic-communication/","license":"CC BY 4.0","note":"傾聴・治療的コミュニケーションの技法を参考"},{"name":"NIMH: Anxiety Disorders","url":"https://www.nimh.nih.gov/health/topics/anxiety-disorders","license":"パブリックドメイン","note":"不安症・パニック発作の症状と治療の概要を参考"},{"name":"MedlinePlus: Anxiety","url":"https://medlineplus.gov/anxiety.html","license":"パブリックドメイン","note":"患者向けの言い回しを参考"},{"name":"NHLBI Heart Failure: Living With Heart Failure","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"パブリックドメイン","note":"心疾患に伴う不安・抑うつへの支援（相談・患者会・家族）を参考"},{"name":"PHQ Screeners（GAD-7 の配布サイト）","url":"https://www.phqscreeners.com/select-screener","license":"許可不要（複製・翻訳・表示・配布）と明記","note":"GAD-2／GAD-7 の入手先．点数の解釈は医師と"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"depression_adjustment","group":"心理・社会・セルフケア","problem":"抑うつ・意欲低下・役割やボディイメージの変化がある（心疾患後のうつ，創部・デバイス・活動制限の受け入れ）","problem_plain":"心筋梗塞・心不全・手術のあとに，気分が沈む・何もする気になれない・眠れない・食べられない状態が続いたり，胸の傷やデバイス，運転や仕事の制限で「前の自分ではなくなった」と感じて生活の張りを失うこと．心疾患ではよく起こり，放置すると服薬やリハビリが続かず回復や予後に影響する．","applies_when":["気分の落ち込み・興味や楽しみの喪失が 2 週間程度以上続いている，または入院中に急に出てきた","意欲低下：離床・リハビリ・食事・清潔などのセルフケアをしなくなった，「もういい」「どうでもいい」と言う","心筋梗塞・心不全・心臓手術・ICD 植込みなど，大きな出来事のあと","創部（胸骨正中切開・グラフト採取部）・デバイスの膨らみ・浮腫やるい痩などの見た目の変化を気にしている，見ようとしない，触れない","仕事・家事・運転・趣味・性生活などの役割や活動が制限され，「役に立たない」「迷惑をかけている」と言う","うつ病の既往，抗うつ薬の使用，家族のうつ病歴","不眠・食欲低下・体重減少・便秘など体の症状が心疾患だけでは説明しにくい","「生きていても仕方ない」「消えたい」などの言葉がある（この場合は速やかに医師へ）"],"related_factors":["病気の体験：命に関わる出来事，再発の恐れ，予後への見通しのなさ","身体：低心拍出・低酸素による倦怠感，慢性炎症，睡眠障害，痛み，薬（β遮断薬・ステロイド・一部の降圧薬などが気分に影響することがある）","役割の変化：仕事の休止・失職，家事や介護の担い手でなくなる，運転制限（ICD・失神），経済的な不安","ボディイメージ：創部・デバイス・浮腫・やせ，人工弁やペースメーカという「機械が入った体」への葛藤","活動制限：安静・入院の長期化，「動いてはいけない」と思い込む，社会的な孤立","本人の背景：うつ病の既往，もともとの対処のしかた，支えの少なさ（独居・家族関係）","脳の要因：脳卒中の合併（脳卒中後うつ），高齢での認知機能低下との併存"],"assessment":{"scales":[{"name":"PHQ-2／PHQ-9（うつ症状の 9 項目の自己記入式質問票．PHQ-2 は最初の 2 項目：興味の喪失・気分の落ち込み）","license":"判定 5：公式サイトに「複製・翻訳・表示・配布に許可は不要」と明記．翻訳版も同サイトで配布（日本語版の有無は掲載一覧で確認）","note":"第 9 項目（死や自傷についての考え）に該当があれば点数に関係なくその場で本人に確認し，医師に報告して一人にしない．点数は診断ではなく医師への報告と相談の目安"},{"name":"生活の変化の聞き取り（自前で実装可能）：睡眠・食事・活動・会話量・清潔・「楽しみ」の有無を毎勤務同じ項目で記録","license":"一般的な看護記録（ライセンス不要）","note":"本人の訴えが少ない場合も，行動の変化（起きてこない・食べない・話さない）で拾う"},{"name":"HADS・BDI・GDS などの質問票","license":"各権利者の管理下（有償または許諾が必要なものがある）．施設で使用中なら参照のみ","note":"文言をアプリに載せない．GDS-15 は高齢者向けに施設で使われていれば参照"}],"assessment_points":["「落ち込んでいるか」を直接聞くだけでなく，行動を見る：離床やリハビリを断る，食事が減る，返事が短い，昼間も寝ている，身なりに構わない．せん妄の低活動型・低心拍出による倦怠感・甲状腺機能低下・薬の影響と区別する（体の原因の確認を先に）","役割とボディイメージの変化を本人の言葉で聞く：「仕事は」「家のことは」「傷を見てどう感じるか」「機械が入ったことをどう思うか」．話したくない場合は無理に聞かず，時期を改める","自殺のリスクを確認する：希望のなさ・自分を責める言葉・「消えたい」があれば，はっきりと「死にたいと思うことがありますか」と尋ね，あれば医師に速やかに報告し一人にしない（院内の対応手順に従う）","支えを確認する：家族・友人・職場の理解，経済的な問題，退院後の居場所．誰に話せているか","抗うつ薬を使っている場合は効果の出方（数週間かかる）と副作用（吐き気・不安の一時的な増強・眠気・QT 延長・出血傾向）を観察する"]},"goals":{"long_term":"気分と意欲が回復に向かい，自分の体の変化と生活の制限を受け止めながら，治療・リハビリ・セルフケアを続け，自分なりの役割と楽しみを持って生活できる","short_term":["3 日以内：気分・睡眠・食事・活動の変化がチームで共有され，体の原因（低心拍出・薬・せん妄など）が確認されている","1 週間以内：本人が気持ちや心配（役割・見た目・将来）を一度は言葉にでき，聴いてもらえたと感じている","1 週間以内：本人が選んだ小さな活動（散歩・面会・趣味・リハビリ）を 1 日 1 つ以上行えている","退院までに：気分が落ち込んだときの相談先（外来・心臓リハビリ・心療内科など）を本人・家族が知っている","自傷・自殺のリスクがある場合は速やかに医師・チームで共有され，安全が確保されている"]},"OP":["気分：落ち込み・涙・いらだち・表情の乏しさ・「どうでもいい」などの言葉と，日内変動（朝がつらい，夜に悪化など）","意欲・活動：離床・リハビリ・食事・清潔・会話への取り組み，ベッドで過ごす時間，訪室時の反応","睡眠：入眠困難・早朝覚醒・過眠，昼夜のリズム","食事・体重・便通（うつでは食欲低下・便秘が出やすい．心不全の体重変化と区別）","体の原因：SpO2・血圧・脈，倦怠感の程度，甲状腺・貧血・電解質などの検査値，せん妄（低活動型）のサイン","薬：気分に影響しうる薬（β遮断薬・ステロイド・睡眠薬など）の開始・変更，抗うつ薬の効果と副作用（吐き気・眠気・ふらつき・QT 延長・出血傾向）","ボディイメージ：創部・デバイス・浮腫・やせへの言葉と態度（見る・触れる・隠す・避ける），鏡や清拭のときの反応","役割の変化への受け止め：仕事・家事・運転・趣味・性生活についての言葉，「迷惑をかけている」「役に立たない」の訴え","希望のなさ・自責・「消えたい」などの言葉，自傷の行動（薬をためる，物を隠す）","支え：家族の面会・電話の頻度と本人の反応，家族の受け止め方","本人の強み：これまで乗り越えた経験，大切にしていること，楽しみ"],"TP":["体の原因への対応を先に：倦怠感・不眠・食欲低下が低心拍出・低酸素・薬・せん妄・甲状腺機能によるものではないか医師と確認し，あれば治療につなぐ","話を聴く時間を確保する：短時間でも毎日，落ち着いて座って聴く．励ましや説得（「頑張って」「気の持ちよう」）ではなく，気持ちを認める言葉を返す．沈黙も待つ","小さな目標を本人と決める：「今日は廊下を 1 往復」「面会のときに座って話す」など，達成できることから．できたことを言葉にして返す（成功体験を積む）","生活のリズムを整える：朝はカーテンを開けて着替える，日中は離床・リハビリ・日光，夜は照明を落とす．食事は可能なら誰かと","ボディイメージへの支援：創部やデバイスの手入れを一緒に行い，本人が見られるようになるまで急がせない．見た目の変化が回復とともにどう変わるか（腫れの引き方，傷の落ち着き）を具体的に伝える","役割の変化への支援：「できなくなったこと」だけでなく「今できること」「これからできるようになること」を一緒に整理する．仕事・運転・家事の再開時期は医師の判断を確認し，見通しを伝える（時期は疾患別リストと主治医の指示）","心臓リハビリへつなぐ：運動が気分の改善にも役立つことを伝え，リハビリスタッフと本人の気分・意欲の状況を共有する","家族と協力する：本人の同意のもと，うつは病気の一部で回復すること，責めたり急かしたりせず日常の会話と役割を残す関わり方を家族に伝える","うつが疑われる・持続する・日常生活に支障がある場合は医師に報告し，精神科リエゾン・心療内科・心理士への相談を検討する（院内の連携手順）","抗うつ薬が始まったら，効果に数週間かかること・副作用（吐き気・不安の一時的な増強）を本人に伝え，心電図（QT 延長）・出血傾向（抗血栓薬との併用）・ふらつきを観察する．薬の変更・中止は医師が決める","自傷・自殺のリスクがあるときは一人にせず，危険物（薬・ひも・刃物）を管理し，医師・チームに速やかに報告して院内の手順に従う","本人の大切にしているもの（家族・仕事・趣味・信仰）を聞き，ケアの中に取り入れる（写真・音楽・面会の工夫）"],"EP":["患者へ：心臓の病気や手術のあとに気分が落ち込むのはよくあることで，治療や時間で良くなること．「弱いから」ではないこと","患者へ：気分・眠り・食欲の変化は心臓の回復にも関わるので，医師・看護師に伝えてほしいこと","患者へ：傷やデバイスの変化は時間とともに落ち着くこと，手入れの方法，見た目や生活の心配は相談してよいこと","患者へ：仕事・運転・家事・性生活の再開は医師と相談して段階的に進めること，「何もしてはいけない」ではないこと","患者へ：心臓リハビリ・運動・人との交流が気分の回復にも役立つこと","家族へ：うつは病気の一部で回復すること，責めず急かさず，日常の会話と本人の役割を残すこと．「いつもと違う」「消えたいと言った」ときはすぐに知らせてほしいこと","患者・家族へ：退院後に落ち込みが続くとき・眠れない・食べられないときの相談先（外来・心臓リハビリ・心療内科・地域の相談窓口）","抗うつ薬を使う患者へ：効果には数週間かかること，自己判断でやめないこと，吐き気・ふらつき・動悸が出たら伝えること"],"evaluation":{"timing":"毎勤務（行動の変化），1 週間ごとに気分・活動・睡眠・食事をまとめて評価．退院前と，抗うつ薬開始後・大きな出来事（手術・ICD 作動・退院日の決定）後は重点的に","indicators":["気分の落ち込み・意欲低下のサインが減り，本人が「少し楽になった」と言える","離床・リハビリ・食事・清潔などのセルフケアに参加できている","睡眠と食事のリズムが整っている","本人が体の変化・役割の変化について言葉にでき，「今できること」を 1 つ以上挙げられる","自傷・自殺のリスクがある場合はチームで共有され，安全が保たれている"],"revise_if":"落ち込み・意欲低下が続く・悪化した／セルフケアやリハビリを拒む／自傷・自殺をほのめかす言葉があった／抗うつ薬が始まった・変わった／手術・ICD 作動・脳卒中など新しい出来事があった／家族や仕事の状況が変わった"},"cardio_ward_notes":["心筋梗塞後・心不全・心臓手術後のうつは珍しくなく，服薬・食事・リハビリの継続や再入院・予後に関わる．「気分の問題だから後回し」にせず，身体の看護計画と同じ重さで扱い，心臓リハビリの計画と連動させる","倦怠感・活動低下は低心拍出・低酸素・貧血・甲状腺機能・薬（β遮断薬など）でも起こる．うつと決めつけず，体の原因の確認を先にする（低活動型せん妄との区別はせん妄の計画を参照）","抗うつ薬は心臓との相性を確認する：一部は QT 延長（心電図・電解質の確認），SSRI と抗血栓薬の併用は出血しやすくなる，三環系は心疾患で避けられることが多い．薬の選択は医師・薬剤師が行い，看護師は開始後の心電図・出血・ふらつきを観察する","ICD・ペースメーカ・人工弁の患者では「機械に頼って生きる」ことへの葛藤や，ショック作動後の抑うつが出る．デバイス手帳や遠隔モニタリングの説明と合わせて，気持ちを聴く時間を作る","胸骨正中切開の創・グラフト採取部・デバイスの膨らみは見た目の変化として長く残る．創の手入れを一緒に行いながら本人のペースで受け止めを支え，傷の経過の見通しを具体的に伝える","運転制限（ICD 植込み後・失神後は法令と医師の判断），仕事復帰，性生活の再開など，役割に関わる制限は「いつまで」「どうなれば」を主治医に確認して伝える．見通しのなさが抑うつを強める"],"sources":[{"name":"Open RN Nursing: Mental Health and Community Concepts 2e, Ch.7 Depressive Disorders（7.2 Causes of Depression，7.5 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingmhcc/chapter/7-5-applying-the-nursing-process-to-depressive-disorders/","license":"CC BY 4.0","note":"抑うつのアセスメント（精神状態・行動・自殺リスク）と介入の体系を参考"},{"name":"Open RN Nursing: Mental Health and Community Concepts 2e, Ch.3 Stress, Coping, and Crisis Intervention（3.6 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingmhcc/chapter/3-6-applying-the-nursing-process-to-stress-and-coping/","license":"CC BY 4.0","note":"役割の変化への適応・対処のアセスメントを参考"},{"name":"Open RN Nursing Fundamentals 2e, Ch.17 Grief and Loss（17.2 Basic Concepts）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/17-2-basic-concepts/","license":"CC BY 4.0","note":"喪失（役割・身体機能）への反応と支援の考え方を参考"},{"name":"NIMH: Understanding the Link Between Chronic Disease and Depression","url":"https://www.nimh.nih.gov/health/publications/chronic-illness-mental-health","license":"パブリックドメイン","note":"慢性疾患（心疾患を含む）とうつの相互関係を参考"},{"name":"NIMH: Depression","url":"https://www.nimh.nih.gov/health/topics/depression","license":"パブリックドメイン","note":"うつの症状・治療（薬は効果に数週間）の概要を参考"},{"name":"MedlinePlus: Depression","url":"https://medlineplus.gov/depression.html","license":"パブリックドメイン","note":"患者向けの言い回しを参考"},{"name":"NHLBI Heart Failure: Living With Heart Failure","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"パブリックドメイン","note":"心不全に伴う抑うつへの治療と支援（相談・患者会・家族）を参考"},{"name":"PHQ Screeners（PHQ-2／PHQ-9 の配布サイト）","url":"https://www.phqscreeners.com/select-screener","license":"許可不要（複製・翻訳・表示・配布）と明記","note":"PHQ-2／PHQ-9 の入手先．点数の解釈は医師と"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"family_burden","group":"心理・社会・セルフケア","problem":"家族の負担・介護力の不足がある（老老介護・独居・家族の理解・介護保険・面会）","problem_plain":"退院後の体重測定・服薬・食事・受診・急変時の対応を担う家族が高齢・遠方・仕事持ちで手が回らない，本人が独居で支える人がいない，家族が病気を理解しておらず本人と食い違う，といった「支える側」の問題．家族が疲弊すると本人のセルフケアが崩れて再入院につながるため，家族も看護の対象として早くから調整する．","applies_when":["独居，または同居家族が高齢・病気を抱えている（老老介護・認認介護）","退院後に体重測定・服薬管理・食事（減塩）・受診の付き添い・急変時の対応を家族が担う必要がある","家族が病気・治療・生活の注意点を理解していない，または本人と家族の意向が食い違う","家族が疲れ・不安・いらだちを見せる，面会に来られない，連絡が取りにくい","介護保険・訪問看護・地域包括支援センターなどの利用がない，または手続きが止まっている","認知症・脳卒中の合併，ADL の低下で介助量が増えた","終末期に近く，療養場所や治療の希望（ACP）を家族と話す必要がある","経済的な困難，キーパーソンが決まっていない，家族関係の問題（疎遠・対立）がある"],"related_factors":["介護者側：高齢・病気・仕事・育児との両立，遠方，介護の知識と技術の不足，睡眠不足・疲労","本人側：セルフケアの多さ（体重・塩分・水分・服薬・症状の観察），ADL の低下，認知機能の低下，再入院の繰り返し","情報：病気や退院後の生活の説明が家族に届いていない，本人と家族で受け止めが違う","制度：介護保険の申請・認定に時間がかかる，サービスの知識がない，利用への抵抗（「まだ早い」「他人を家に入れたくない」）","環境：面会制限，自宅の構造（階段・トイレ・浴室），通院手段","心理：家族の不安・罪悪感・「自分がやらなければ」という思い込み，本人の「迷惑をかけたくない」"],"assessment":{"scales":[{"name":"家族・介護状況の聞き取り項目（自前で実装可能）：主介護者と副介護者，年齢・健康・就労，同居か，退院後に誰が何を担うか（体重・薬・食事・受診・急変対応），介護保険の申請状況・要介護度・ケアマネジャー，利用中のサービス，経済面，家族の希望と困りごと","license":"一般的な看護記録（ライセンス不要）","note":"入院早期（入院時〜数日以内）に聞き取り，退院支援部門・医療ソーシャルワーカー（MSW）と共有する"},{"name":"要介護認定（介護保険制度：申請→認定調査・主治医意見書→要支援 1〜2・要介護 1〜5）","license":"厚労省の制度情報（PDL1.0）．認定の基準・手続きの詳細は市町村と院内の退院支援部門の運用に従う","note":"退院後に介護サービスが必要と見込まれれば，入院中から申請を勧める（認定には時間がかかる）"},{"name":"介護負担の質問票（Zarit 介護負担尺度とその短縮版など）","license":"各権利者の管理下（許諾が必要）．施設で使用中なら参照のみ","note":"文言をアプリに載せない．負担の把握は聞き取りと観察で行う"}],"assessment_points":["入院早期に「退院後に誰が何を担うか」を具体的に書き出す：体重測定・薬・食事・受診・急変時の連絡．担い手がいない項目が「介護力の不足」の中身になる","家族の負担は言葉より様子で拾う：面会時の疲れた表情，いらだち，涙，「もう限界」「私が倒れたら」の言葉，面会の減少．家族の健康状態も聞く","本人と家族の理解と希望を別々に聞き，食い違い（退院先・治療の強さ・介護の分担）を把握する．どちらかを責めない","介護保険・訪問看護・地域の支援の利用状況と，利用への抵抗の理由を聞く（「まだ早い」「他人を家に入れたくない」「お金」）","独居の場合は緊急時の連絡先，見守り（近所・民生委員・配食・緊急通報），通院手段を確認し，「誰も気づかない」状態を作らない"]},"goals":{"long_term":"家族の負担が続けられる範囲に収まり，本人のセルフケアと安全が家族と地域の支援で保たれ，再入院や家族の健康悪化を防ぐ","short_term":["入院時から数日以内（施設の基準に従う）：主介護者・キーパーソン・退院後の担い手が把握され，退院支援部門・MSW と共有されている","退院前まで：家族が病気の注意点（増悪のサイン・体重・塩分・薬・連絡の目安）を説明でき，退院後の分担を本人・家族が納得している","退院前まで：必要な制度・サービス（介護保険の申請，訪問看護，配食，通院手段など）の手続きが始まっている，または相談先が決まっている","家族が困りごとを言葉にでき，休息と相談先（家族自身の受診・地域包括支援センター・家族会など）を知っている","終末期に近い場合：本人の希望（療養場所・治療）が家族と共有され，記録されている"]},"OP":["家族の様子：面会の頻度・表情・言葉（疲れ・不安・いらだち・あきらめ），家族自身の健康と睡眠","退院後の担い手と分担：体重測定・服薬・食事（減塩）・受診・急変時の対応を誰が担うか，担い手のいない項目","本人と家族の病気の理解の程度，退院先・治療の希望の一致・不一致","本人の ADL・認知機能・セルフケア能力の変化（介助量が増えていないか）","介護保険の申請・認定状況，ケアマネジャー・訪問看護・かかりつけ医との連絡の有無","自宅環境：階段・トイレ・浴室・寝室の位置，通院手段，緊急時の連絡手段","経済面：医療費・介護費・食事の負担，利用できる助成の有無（MSW と）","独居の場合の見守り体制：近所・民生委員・配食・緊急通報・遠方家族との連絡","家族の介護技術：体重の測り方，薬のセット，減塩の食事，症状の見方を実際にできるか","面会制限や遠方などで情報が家族に届いていない状況"],"TP":["入院早期に家族の状況を聞き取り，退院支援部門・MSW・退院支援看護師と共有して，退院調整を早く始める（退院間際に慌てない）","家族に病気と退院後の生活を説明する機会を作る：増悪のサイン・体重の見方・塩分と水分・薬・受診と連絡の目安を，本人と一緒に，紙や手帳（心不全手帳など施設で使うもの）を使って説明する．遠方の家族には電話やオンラインで","家族の介護技術を練習する場を作る：体重測定，薬のセット（一包化・カレンダー），減塩の食事の工夫，血圧測定，創部やデバイスの手入れなど，退院前に実際にやってもらう","担い手のいない項目は制度と地域で埋める：介護保険の申請（要介護認定），訪問看護・訪問介護，配食サービス，通院の送迎，デイサービス，緊急通報，地域包括支援センターへの相談を MSW・ケアマネジャーと調整する","本人と家族の意向が食い違うときは，双方の話を別々に聴いたうえで，医師・MSW を交えて話し合いの場を設ける．本人の意思を中心に置きつつ，家族の限界も尊重する","家族の負担を言葉にしてもらう：「大変なことは何か」「休めているか」を聞き，休息の必要性を伝える．家族自身の受診・相談先（地域包括支援センター・家族会・かかりつけ医）を案内する","面会の工夫：面会制限がある場合は電話・ビデオ通話・手紙で本人の様子を伝え，家族の心配に答える．面会時は本人の回復した姿を見てもらい，できることを共有する","独居の患者は，退院前に見守り体制（訪問看護の頻度，配食，近所・民生委員，緊急通報，遠方家族の連絡）を具体的に決め，「誰が最初に気づくか」を明確にする","終末期に近い場合は，本人の希望（療養場所・治療・デバイスの扱い）を家族と共有する場を医師と設け，記録する（ACP・人生会議の考え方．記録様式は施設の規定）","退院前カンファレンス（本人・家族・病棟・退院支援・ケアマネジャー・訪問看護・かかりつけ医）で分担と連絡先を確認し，退院後の最初の受診・訪問の予定を決める","退院後の連絡先（病院の外来・夜間の連絡方法，訪問看護のステーション，救急要請の目安）を一枚にまとめて渡す（内容は施設の運用に従う）","家族の中に虐待・ネグレクトの疑いや，介護者の健康が明らかに損なわれている状況があれば，MSW・医師に報告して院内の手順に従う"],"EP":["家族へ：病気の注意点（増悪のサイン・体重・塩分・水分・薬）と，「いつ・どこに連絡するか」の目安（数値や日数は施設・主治医の指示）","家族へ：介護は一人で抱えないこと．介護保険・訪問看護・配食・デイサービスなどは「頼ってよい仕組み」であること，申請には時間がかかるので早めに動くこと","家族へ：家族自身の休息と健康が本人を支える土台であること．疲れ・眠れない・気分の落ち込みがあれば相談してよいこと","本人へ：家族に何をしてほしいか，自分で何ができるかを一緒に決めること．「迷惑をかけたくない」で隠さないこと","本人・家族へ：地域包括支援センター・ケアマネジャー・MSW の役割と連絡先","本人・家族へ：急変時の対応（胸痛・強い息切れ・意識消失のときの救急要請，AED の場所，家族の CPR 講習）","終末期に近い本人・家族へ：これからの過ごし方の希望はいつでも変えてよいこと，話し合った内容は医療者に伝えてほしいこと"],"evaluation":{"timing":"入院早期（聞き取り完了時），退院支援カンファレンス時，退院前，および家族の状況・本人の ADL が変わったとき","indicators":["主介護者・キーパーソン・退院後の分担が記録され，担い手のいない項目が制度・サービスで補われている","家族が増悪のサイン・体重・薬・連絡の目安を説明でき，介護技術（体重測定・薬のセットなど）を実施できる","介護保険・訪問看護などの手続きが始まっている，または相談先が決まっている","家族が困りごとを言葉にでき，休息と相談先を知っている","本人と家族の希望が共有され，食い違いがあれば話し合いの場が持たれている"],"revise_if":"介護者の健康悪化・疲弊が見えた／本人の ADL・認知機能が低下した／退院先や希望が変わった／サービスの利用が断られた・止まった／再入院した／終末期の話し合いが必要になった"},"cardio_ward_notes":["心不全のセルフケア（毎朝の体重・塩分・水分・薬・症状の観察）は家族の負担がとくに大きい．「本人に指導した」で終わらせず，誰が毎日見るかを決め，訪問看護・心不全手帳・遠隔モニタリングなど施設で使える手段で家族の負担を減らす","老老介護・独居では，増悪のサイン（体重増加・むくみ・息切れ）に気づく人がいないまま再入院になりやすい．退院後の最初の受診・訪問を早めに設定し，「誰が最初に気づくか」を決める","ICD・ペースメーカの患者の家族には，作動時の対応，遠隔モニタリング機器の意味，救急要請の目安を説明する．失神・心停止を目の前で見た家族の不安にも耳を傾ける（疾患別リストの vt_vf・cied_management と整合）","急変時の対応（救急要請の目安・AED の場所・CPR）を家族と確認する．家族の CPR・AED 講習の案内は本人・家族の希望を踏まえて行う","認知症や脳卒中を合併した患者では，服薬（とくに抗凝固薬）と体重・水分の管理が家族頼みになる．一包化・服薬カレンダー・訪問看護・薬局の関与を薬剤師と調整する（dementia_cardiac・post_stroke_dysphagia_paralysis と整合）","終末期の心不全では，療養場所・治療の強さ・ICD のショック機能の扱いを本人・家族・医師で早めに話す．家族の「延命してほしい」と本人の希望が食い違うことがあり，緩和ケアの計画（hf_palliative_care）と連動させる"],"sources":[{"name":"厚生労働省 介護保険制度の概要","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/kaigo_koureisha/gaiyo/index.html","license":"PDL1.0","note":"介護保険制度・地域包括支援センター・訪問介護看護などの制度の枠組みを参考"},{"name":"厚生労働省 要介護認定","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/kaigo_koureisha/nintei/index.html","license":"PDL1.0","note":"要介護認定の流れを参考"},{"name":"厚生労働省 地域包括ケアシステム","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/kaigo_koureisha/chiiki-houkatsu/","license":"PDL1.0","note":"在宅療養を支える地域の仕組みを参考"},{"name":"厚生労働省 「人生会議」してみませんか（ACP：アドバンス・ケア・プランニング）","url":"https://www.mhlw.go.jp/stf/newpage_02783.html","license":"PDL1.0（ポスター等のイラストは第三者の著作物のため使わない）","note":"本人の希望を家族・医療者と繰り返し話し合う考え方を参考"},{"name":"NIA: Taking Care of Yourself: Tips for Caregivers","url":"https://www.nia.nih.gov/health/caregiving/taking-care-yourself-tips-caregivers","license":"パブリックドメイン（出典表記：National Institute on Aging, National Institutes of Health）","note":"介護者のストレスのサインと自己ケアの考え方を参考"},{"name":"NIA: Caregiving","url":"https://www.nia.nih.gov/health/caregiving","license":"パブリックドメイン","note":"介護者支援の話題の全体像を参考"},{"name":"MedlinePlus: Caregivers","url":"https://medlineplus.gov/caregivers.html","license":"パブリックドメイン","note":"介護者の役割と負担の患者向け説明を参考"},{"name":"Open RN Nursing: Mental Health and Community Concepts 2e, Ch.16 Community Health（16.2 Community Health Concepts）／Ch.3（3.6 Applying the Nursing Process to Stress and Coping）","url":"https://wtcs.pressbooks.pub/nursingmhcc/chapter/16-2-community-health-concepts/","license":"CC BY 4.0","note":"家族・介護者への心理社会的支援と地域資源へのつなぎ方の考え方を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"knowledge_selfcare","group":"心理・社会・セルフケア","problem":"疾患と治療の理解が不足し，セルフケア（毎日の体重・塩分と水分・症状の観察・受診の目安）ができない","problem_plain":"心不全などの病気は，退院後に本人が毎日の体重を測り，塩分と水分に気をつけ，むくみや息切れの変化に自分で気づいて早めに連絡することで悪化と再入院を防ぐ．病気の仕組みや薬の意味がわからない，何を見ればよいか知らない，やり方が生活に合っていない，といった理由でそれができていない状態．","applies_when":["心不全（初回診断，または増悪による再入院）で退院後のセルフケアが必要になる","「なぜ体重を測るのか」「なぜ塩分を減らすのか」を本人が説明できない，または誤解している","自宅で体重測定・記録をしていない，減塩や水分の指示が守れていない，症状が出ても受診が遅れた経緯がある","薬を飲む理由や飲み続ける必要性を理解していない（自己判断で中止・減量した経験がある）","高齢・独居・認知機能の低下・視力や聴力の低下・読み書きの困難など，学習と実行の妨げになる要因がある","家族や支援者が病気とセルフケアの内容を知らない","退院後に生活が大きく変わる（食事の作り手が変わる，仕事に戻る，一人になる）","植込みデバイス（ICD・CRT・ペースメーカ）や抗凝固薬など，新たに管理を覚える必要のある治療が始まった"],"related_factors":["情報不足：病気・薬・生活上の注意についての説明を受けていない，または理解できていない","認知・感覚：高齢，認知機能の低下，視力・聴力の低下，読み書きの困難，日本語以外の言語","心理：病気の受け止めができていない（否認），不安・抑うつ，「治った」という誤解，あきらめ","身体：息切れ・倦怠感で説明を聞く余裕がない，急性期で学習の準備ができていない","生活：独居，食事を作らない，外食や惣菜が中心，仕事や介護で時間がない，経済的な制約","支援：家族の関心や協力が得られない，支援者がいない","医療側：説明が専門用語だけ，一度に多くを伝えすぎる，本人の生活に合わせた具体化がない"],"assessment":{"scales":[{"name":"ティーチバック（説明したことを本人に自分の言葉で言い直してもらい，理解を確かめる方法）","license":"一般的手技（事実）","note":"『理解できましたか』ではなく『ご家族に説明するとしたらどう言いますか』と聞く．言えなければ伝え方を変えてもう一度説明する．理解の確認は本人を試すためではなく，説明の仕方を直すためと伝える"},{"name":"NYHA 心機能分類（日常の動作でどの程度息切れ・疲れが出るかの 4 段階）","license":"一般的な分類（事実）","note":"本人の活動の目安と『どの程度の息切れなら連絡するか』の共有に使う．判定は医師が行う"},{"name":"施設の心不全手帳・自己管理ノート（体重・血圧・脈拍・症状・服薬の記録欄と連絡の目安）","license":"施設の様式を使う（学会等が配布する手帳の文言は転載しない）","note":"記録の構造（毎日の体重，症状のチェック，連絡の目安，薬の一覧，緊急連絡先）を本人の生活に合わせて使う"},{"name":"心不全セルフケアの質問票（例：Self-Care of Heart Failure Index，European Heart Failure Self-care Behaviour Scale）や生活の質の質問票（KCCQ）","license":"研究用尺度で利用条件は権利者ごとに異なる（KCCQ は有償ライセンス）．アプリには載せず，施設で使用中なら参照のみ","note":"日常の看護では『体重を測っているか』『むくんだらどうするか』を会話で確かめれば足りる"}],"assessment_points":["入院時に『病気をどう理解しているか』『退院後に何をすればよいと思っているか』『これまで自宅で何をしていたか』を本人の言葉で聞き，記録する．前回入院からの経過があれば，何がうまくいかなかったか（測っていなかった，測っていたが連絡しなかった，連絡先を知らなかった）を一緒に振り返る","学習の準備状態を見る：息切れ・倦怠感・眠気・不安の程度，急性期の治療が落ち着いているか．説明は本人が聞ける状態になってから，短く分けて行う","できることとできないことを分ける：体重計に乗れるか（立位保持・視力・置き場所），数字を読んで書けるか，食事は誰が作るか，塩分表示を読めるか，電話で症状を伝えられるか","支援者の把握：家族・訪問看護・かかりつけ薬局・ケアマネジャーの有無と，誰が体重や症状を一緒に見られるか","本人の価値観と生活の希望（仕事・旅行・食事の楽しみ・家族の行事）を聞き，セルフケアを『禁止』ではなく『続けたい生活のための方法』として組み立てる"]},"goals":{"long_term":"本人（または支援者）が病気の悪化のサインを見つけて早めに連絡でき，退院後もセルフケアを続けて増悪と再入院を防げる","short_term":["退院前までに：本人（または支援者）が『体重が増える・むくむ・息切れが増えるのは体に水がたまるサイン』を自分の言葉で説明できる","退院前までに：毎朝同じ条件で体重を測って記録する方法が本人の生活に合わせて決まり，入院中に実際に自分で（または支援者と）行えている","退院前までに：連絡の目安（体重の増え方・症状）と連絡先（外来・夜間休日の窓口）を書いたものを本人が持ち，どこに電話するかを言える","退院前までに：塩分と水分の目安と，具体的に減らせる食品・飲み方を本人と食事を作る人が 2〜3 個挙げられる","退院前までに：薬の名前と目的（『水を出す薬』『心臓を休ませる薬』など）を本人が言え，症状がなくても飲み続ける理由を説明できる"]},"OP":["本人の理解：病気・薬・生活上の注意をどう説明するか（ティーチバックで毎回確認）．誤解（『症状がないから治った』『薬は具合が悪いときだけ』）の有無","セルフケアの実行：入院中の体重測定・記録を自分で行えているか，食事の塩分に気をつけているか，飲水量を意識しているか","症状の自覚：息切れ・むくみ・体重の変化に本人が気づいて訴えられるか（訴えの内容と看護師の観察の差）","毎日の体重（朝・排尿後・同じ条件）とその推移，むくみ（すね・足首・靴下の跡），息切れ（どの動作で出るか），夜間の呼吸苦・枕の数，咳","食事：塩分の多い食品（汁物・漬物・加工食品・外食）の摂り方，食事摂取量，食欲，飲水量と口渇","服薬：飲み忘れ・自己判断の中止の有無，薬の目的を言えるか，市販薬やサプリ（NSAIDs など悪化させる薬）の使用","身体機能：視力・聴力・読み書き・体重計への乗降・数字の記録ができるか","認知機能・気分：説明を覚えていられるか，不安や抑うつが学習を妨げていないか","生活背景：独居か，食事を作る人，仕事・介護の負担，経済面（食事・通院・薬代）","支援者の理解：家族・訪問看護・薬局が病気と観察のポイントを知っているか","退院後の記録（外来）：手帳の記入状況，体重・血圧の推移，連絡があった状況とその判断"],"TP":["説明は本人が聞ける状態（急性期の症状が落ち着き，眠気や不安が強くないとき）に，1 回に 1〜2 つのテーマに絞って行い，毎回ティーチバックで確かめる．資料は文字を大きく，図や実物（体重計・食品のパッケージ・薬）を使う","病気の説明は『心臓のポンプが弱ると体に水がたまる → 体重が増える・むくむ・息が苦しい → 早く見つければ薬の調整で入院を防げる』という一本の筋で伝え，セルフケアの各項目をその筋に結びつける","入院中から本人に体重測定を任せる：毎朝・排尿後・同じ服装で，看護師が横で見守り，記録用紙（施設の手帳）に本人が書く．できない部分（乗降・読み取り・記録）は代わりの方法（家族が測る・大きな表示の体重計・声で記録）を決める","連絡の目安を本人の数値で具体化する：『体重が○ kg を超えたら』『階段で前より息が切れたら』など，退院時の体重と本人の普段の活動に基づいて医師と決め，手帳に書く（体重増加の目安は主治医の指示・施設の心不全手帳に合わせる．例として数日で 2 kg 前後の増加を連絡の目安とすることが多い）","塩分・水分は本人の実際の食事内容から一緒に見直す：よく食べる物を聞き出し，減らせる物・置き換えられる物を管理栄養士と具体的に決める（塩分の目標量・水分の指示量は医師の指示に従う．口渇には氷・うがい・小分けの飲み方など）","薬の目的を薬剤師と一緒に説明し，薬の一覧（名前・目的・飲む時間）を本人が持つ形にする．飲み忘れが心配なら medication_management の計画を併用する","症状観察の練習：入院中に本人と一緒にすねを押してむくみを見る，息切れの程度を言葉にする（『平地で』『階段で』『安静でも』），体重の推移をグラフで見るなど，退院後に一人でできる形で反復する","退院前に外来・訪問看護・薬局・ケアマネジャーへ，本人の理解度・できること・支援が必要なことを申し送る（施設の退院支援の様式を使う）","家族や食事を作る人を説明の場に同席してもらい，本人と同じ内容を共有する．本人ができない部分を誰が担うかを決める","心臓リハビリ（入院中・外来）の教育プログラムにつなぎ，運動・食事・薬・禁煙・気持ちの面をまとめて支援する","不安・抑うつ・あきらめが学習を妨げているときは，まず気持ちを聞き，必要なら anxiety／depression_adjustment の計画や相談先につなぐ","退院後の外来で手帳を一緒に見て，続いていることをまず認め，続かなかった部分は責めずに理由を聞いて方法を変える"],"EP":["患者へ：心臓が弱ると体に水がたまること．体重・むくみ・息切れは『水がたまり始めたサイン』で，早く見つければ薬の調整で入院を防げること","患者へ：毎朝，トイレのあと・朝食の前に同じ服装で体重を測り，手帳に書くこと．増え方の目安と連絡先は手帳に書いてあること","患者・家族へ：塩分は汁物・漬物・加工食品・外食に多いこと．具体的に減らせる物を一緒に決めたこと．水分は指示された量を守り，のどの渇きは氷やうがいで和らげること","患者へ：薬は症状がなくても続けること．ふらつき・徐脈・咳などの副作用が出たら自分でやめずに連絡すれば調整できること．市販の痛み止め・風邪薬・サプリは買う前に薬剤師に相談すること","患者へ：連絡する症状：数日で体重が目安を超えて増えた，むくみが強くなった，前より息が切れる，横になると苦しい，夜に息苦しくて目が覚める．安静でも苦しい・胸が痛い・意識がもうろうとするときは救急要請","患者へ：風邪や発熱をきっかけに悪化しやすいので，予防接種（インフルエンザ・肺炎球菌）を医師と相談し，体調不良時は早めに受診すること","家族へ：本人が気づきにくい変化（顔や足のむくみ，会話中の息切れ，食欲低下，元気のなさ）を見てほしいこと．手帳の記録を一緒に見て，連絡の目安に達したら代わりに連絡してよいこと","患者へ：仕事・旅行・外食も工夫すれば続けられること．やりたいことは事前に相談してほしいこと"],"evaluation":{"timing":"説明のたび（ティーチバックで確認），退院前日までに総合評価，退院後の初回外来と訪問看護の初回訪問で再評価","indicators":["本人（または支援者）が病気の悪化のサイン 3 つ（体重増加・むくみ・息切れ）と連絡の目安・連絡先を自分の言葉で言える","入院中に本人が体重測定と記録を続けられている（できない場合は代わりの方法と担当者が決まっている）","塩分・水分について具体的な行動（減らす食品・飲み方）を本人と食事を作る人が挙げられる","薬の目的と続ける理由を言え，退院後の服薬の仕組み（一覧・カレンダー・一包化など）が決まっている","退院後：手帳の記録が続いている，増悪のサインで連絡があった（連絡できたこと自体を成功とみなす），再入院がない"],"revise_if":"ティーチバックで説明が返ってこない／入院中の体重測定が続かない／認知機能の低下や抑うつが明らかになった／支援者が変わった／退院後の記録が途切れた・連絡が遅れた"},"cardio_ward_notes":["心不全の再入院の多くはセルフケアの途切れ（体重を測らない・塩分過多・薬の中断・受診の遅れ）が引き金になる．入院中は『教える』より『入院中に本人がやってみて，退院後の生活に合う形に直す』時間として使う","体重の変化は利尿薬の調整・食事量・脱水でも動く．『増えたら連絡』だけでなく『急に減った・口が渇く・立ちくらみ』も連絡の目安に入れる（脱水は fluid_deficit を参照）","利尿薬の飲む時間帯（外出や夜間頻尿への影響）と血圧・脈拍の自己測定を一緒に教えると，服薬の継続と転倒予防にもつながる","ICD・CRT・ペースメーカのある患者は，遠隔モニタリングの意味と機器の扱い（cied_management），ICD 作動時の連絡の目安を同じ手帳に入れて一体で教える","抗凝固薬・抗血小板薬がある患者は出血のサインと飲み忘れ時の対処（antithrombotic_management）をセルフケア教育に含める","認知機能の低下がある場合は本人だけに任せず，家族・訪問看護・薬局が観察と記録を担う形を退院前に組む（dementia_cardiac を参照）．説明は短く・繰り返し・実物で"],"sources":[{"name":"NHLBI Heart Failure – Living With Heart Failure","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"米国政府著作物（パブリックドメイン）","note":"在宅での管理（服薬・生活習慣・悪化のサイン・連絡先の準備・心理的支援）の構成を参考"},{"name":"NHLBI Heart Failure – Treatment","url":"https://www.nhlbi.nih.gov/health/heart-failure/treatment","license":"米国政府著作物（パブリックドメイン）","note":"治療と生活習慣の位置づけ"},{"name":"MedlinePlus: Heart failure – home monitoring（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000113.htm","license":"パブリックドメイン","note":"毎日の体重測定の条件（朝・排尿後・同じ服装・記録）と症状の自己チェックの項目を参考．体重増加の目安値は日本の指示に合わせるため転記していない"},{"name":"MedlinePlus: Heart failure – fluids and diuretics（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000112.htm","license":"パブリックドメイン","note":"塩分・水分制限と利尿薬の説明，家族の役割，NSAIDs による悪化の注意"},{"name":"MedlinePlus: Heart failure – discharge（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000114.htm","license":"パブリックドメイン","note":"退院時説明の構成"},{"name":"Open RN Health Alterations, 5.8 Heart Failure（WisTech Open）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-8-heart-failure/","license":"CC BY 4.0","note":"心不全の看護過程と患者教育の体系を参考"},{"na たか』を薬剤師と確認し，飲めていなかった薬とその理由（忘れる・わざと・飲めない・費用）を分けて記録する","薬の目的と飲み方を本人がどう理解しているかを聞く（『この薬は何のため？』『飲み忘れたらどうする？』）．抗凝固薬・抗血小板薬は特に確認","管理能力を行動で見る：薬を PTP シートから出せるか，薬の名前・時間を言えるか，服薬カレンダーに合わせて取り出せるか，錠剤を飲み込めるか","退院後の管理者と環境：誰が薬を用意し，誰が飲んだことを確認するか．処方元と薬局は一つにまとめられるか．訪問看護・薬剤師の訪問（在宅患者訪問薬剤管理）の必要性","退院時の変更点の整理：新規・中止・変更の薬を一覧にし，旧処方の薬が自宅に残っていないかを確認する"]},"goals":{"long_term":"退院後も本人（または管理者）が薬を指示どおりに飲み続けられる仕組みができ，飲み忘れ・重複・自己中断による血栓・出血・不整脈・心不全増悪が起きない","short_term":["入院 2〜3 日以内（施設の運用に合わせる）：持参薬・お薬手帳・残薬の照合が薬剤師と済み，飲めていなかった薬と理由が記録されている","退院前までに：本人（または管理者）が主要な薬の名前と目的（特に抗凝固薬・抗血小板薬・利尿薬）を言え，飲み忘れたときの対処（薬ごとの指示）を言える","退院前までに：退院後の服薬の仕組み（一包化・服薬カレンダー・時間の統一・管理者・薬局の一本化）が決まり，入院中にその方法で本人が飲む練習をしている","退院前までに：退院時の薬の一覧（新規・中止・変更を明記）を本人・家族・かかりつけ薬局・訪問看護が共有している","退院後の初回外来まで：飲み忘れ・重複がなく（残薬・手帳・本人と管理者の話で確認），出血・血栓・徐脈などの有害事象がない"]},"OP":["実際の服薬状況：入院中の与薬時に飲んだことを確認（口に入れて飲み込んだか，隠していないか），拒薬・飲み忘れの回数と理由","本人の理解：薬の名前・目的・飲む時間・飲み忘れ時の対処を言えるか（ティーチバック）","認知機能・意識：記憶・注意力・見当識の変化，せん妄の有無（4AT），日内変動","身体機能：視力，手指の動き（シートから出せるか），嚥下（錠剤でむせないか，口に残らないか）","薬の効果と副作用の指標：ワルファリンは PT-INR，DOAC は腎機能・体重，利尿薬は体重・電解質・血圧，β遮断薬・抗不整脈薬は脈拍・心電図，ジゴキシンは食欲・吐き気・脈拍","出血・血栓のサイン：あざ・歯ぐきや鼻の出血・黒色便・血尿，片麻痺・ろれつ・胸痛（antithrombotic_management を参照）","残薬・お薬手帳：処方どおりに減っているか，複数の処方元・重複・相互作用のある薬（NSAIDs・抗菌薬・漢方・サプリ）","心理：副作用への不安，薬への否定的な考え，抑うつ・意欲低下，『飲まなくても平気』という認識","生活：起床・食事・就寝の時間，仕事や外出のパターン，保管場所，費用の負担感","支援者：家族・訪問看護・薬局が服薬を確認できる体制か，管理者自身の負担","退院後（外来・電話）：残薬数，手帳の記録，飲み忘れの自己申告，有害事象の有無"],"TP":["入院時に薬剤師と持参薬を照合し，飲めていなかった薬・理由・管理能力の評価を医師に報告する（処方の整理は医師・薬剤師が行う．看護師が独自に薬を減らしたり止めたりしない）","入院中の与薬は看護師が手渡し，飲み込んだことを確認する．自己管理へ移す場合は施設の基準（認知機能・理解度・安全性）に沿って段階的に進め，飲み忘れがあれば戻す","処方の単純化を医師・薬剤師に相談する：服用回数を減らす，時間をそろえる，一包化する，剤形（OD 錠・散剤・液剤）を飲みやすいものにする（粉砕・懸濁の可否は薬剤師に確認．抗凝固薬など粉砕不可の薬に注意）","本人の生活に合わせた仕組みを一緒に作る：服薬カレンダー・ピルケース・時間ごとの一包化・スマートフォンのアラーム・食事とセットにする．入院中にその方法で本人が実際に取り出して飲む練習をする","薬の一覧（名前・目的・飲む時間・飲み忘れ時の対処・処方元）を本人が持てる形で薬剤師と作り，お薬手帳と一緒に持ち歩いてもらう．退院時の変更点は一覧に明記し，旧処方の薬を自宅から片づける方法を家族と決める","抗凝固薬・抗血小板薬は個別に重点指導する：飲み忘れに気づいたときの対処は薬の名前・適応・治療の段階で異なるため，薬剤師と確認して薬ごとに手帳に書く（原則は自己判断で追加して飲まないこと．まとめて飲んでよいと決められている薬もあるが，薬剤師が説明した薬と時期に限る），出血のサインと受診の目安，歯科・他科受診時に飲んでいることを伝える練習","副作用への不安や『やめたい』という気持ちは否定せず聞き，医師・薬剤師と相談して調整できることを伝える（減量・中止は医師の判断）．発熱・嘔吐・下痢・食べられないとき（シックデイ）に一時的に止める薬（SGLT2 阻害薬・利尿薬・降圧薬など）があれば，薬ごとの事前指示を医師・薬剤師と確認して手帳に書く．SGLT2 阻害薬は心不全の目的で使っていても対象で，倦怠感・吐き気・腹痛があれば血糖が高くなくても医師にケトンの検査などを相談する","認知機能の低下がある場合：本人だけに任せず，家族・訪問看護・薬局（訪問薬剤管理）が用意と確認を担う体制を退院前に組む．服薬確認の記録を残す方法（カレンダーのチェック・空袋の保管）を決める","処方元と薬局の一本化（かかりつけ薬局）を勧め，他科・他院の薬をお薬手帳に集約する","退院前に薬剤師の退院時指導を受け，本人・家族・訪問看護に同じ内容を共有する（施設の退院時薬剤情報の様式を使う）","退院後の初回外来までに電話や訪問看護で服薬状況を確認する仕組みを決める（誰が・いつ・何を聞くか）","せん妄が疑われるときは delirium_risk の計画へ．拒薬が続く場合は原因（嚥下・味・不安・妄想）を評価して医師に報告する"],"EP":["患者へ：主要な薬の名前と目的（『血栓を防ぐ薬』『水を出す薬』『心臓を守る薬』）．症状がなくても続ける理由．自分でやめたり減らしたりせず，困ったら連絡すれば調整できること","患者へ：飲み忘れに気づいたときの対処は薬ごとに違うので手帳の一覧を見ること．2 回分をまとめて飲まないこと","患者へ（抗凝固薬・抗血小板薬）：出血のサイン（黒い便・血尿・止まらない鼻血・大きなあざ）と受診の目安，頭を打ったら症状がなくても連絡すること，歯科・他科・薬局で必ず飲んでいることを伝えること","患者へ：市販薬・サプリ・漢方・他院の薬は飲み合わせの問題があるので，買う前・飲む前に薬剤師に相談すること．薬局は一つにまとめるとよいこと","患者・家族へ：決めた仕組み（カレンダー・一包化・アラーム）の使い方．飲んだかどうかを後で確認できる方法（空袋を残す・チェックをつける）","家族へ：本人が飲めているかを『責める』のではなく『一緒に確認する』姿勢で見てほしいこと．飲み忘れが続く・混乱している・ふらつきや出血があるときは連絡してほしいこと","患者・家族へ：退院時に変わった薬（新規・中止・変更）と，古い薬を家に残さないこと","患者へ：受診のたびにお薬手帳を持参し，『まだ全部必要か』を医師・薬剤師に聞いてよいこと"],"evaluation":{"timing":"入院時の照合後，自己管理へ移すとき，退院前日，退院後の初回外来（または訪問看護の初回訪問）","indicators":["入院中の飲み忘れ・拒薬がない（回数と理由の記録で確認）．自己管理中は残薬が計算どおり","本人（または管理者）が主要な薬の目的・飲み方・飲み忘れ時の対処・出血や副作用のサインを言える","退院後の服薬の仕組みと管理者が決まり，入院中に本人が実際にその方法で飲めている","退院時の薬の一覧が本人・家族・薬局・訪問看護で共有され，旧処方の薬の整理方法が決まっている","退院後：残薬と手帳で飲み忘れ・重複がなく，INR・腎機能・脈拍などが目標範囲で，出血・血栓・徐脈・心不全増悪がない"],"revise_if":"飲み忘れ・拒薬が続く／せん妄や認知機能の低下が明らかになった／処方が大きく変わった／管理者が変わった・支援が続かない／出血・血栓・副作用が起きた／自己判断で中止していた"},"cardio_ward_notes":["循環器の薬は『1 回の抜け』が事故になるものが多い：抗凝固薬の飲み忘れは心原性塞栓（脳梗塞），ステント後の抗血小板薬の中断はステント血栓，抗不整脈薬・β遮断薬の急な中断は不整脈や狭心症の悪化につながる．退院指導では『やめてはいけない薬』を最初に明確にする","ワルファリンは INR で用量が変わるため，用量表と次回採血日を手帳に書き，食事（納豆・クロレラ・青汁）の注意を含める．DOAC は決まった時間と食事条件（薬による）を守り，腎機能・体重の変化で用量が見直されることを伝える","利尿薬は飲む時間帯が外出・夜間頻尿・転倒に影響するため，生活に合わせた時間を医師と相談する（fall_risk を参照）．『トイレが近いから飲まない』という自己中断が起きやすい","多剤の高齢患者は，ふらつき・食欲低下・混乱・徐脈が薬の害である可能性を常に考え，薬剤師と処方の見直し（厚労省指針の考え方）を医師に提案する","カテーテル検査・手術・抜歯の前後の休薬と再開は，指示を一覧にして本人と共有する（cardiac_cath_periop・antithrombotic_management）．再開忘れが血栓の原因になる","認知症を併せ持つ患者は dementia_cardiac を参照：本人任せにせず，家族・訪問看護・薬局で用意と確認を分担し，説明は短く繰り返し実物で行う"],"sources":[{"name":"厚生労働省 高齢者の医薬品適正使用の指針（総論編）（2018 年 5 月）","url":"https://www.mhlw.go.jp/content/11121000/kourei-tekisei_web.pdf","license":"PDL1.0","note":"ポリファーマシーの考え方と処方見直しの流れを参考．通知ページ：https://www.mhlw.go.jp/stf/shingi2/0000208848.html"},{"name":"NIA: Taking Medicines Safely as You Age（National Institute on Aging, NIH）","url":"https://www.nia.nih.gov/health/medicines-and-medication-management/taking-medicines-safely-you-age","license":"米国政府著作物（パブリックドメイン）","note":"薬の一覧の携行・薬局の一本化・相互作用・副作用時に自己中断しない・飲みにくいときの相談，といった患者向け助言を参考"},{"name":"Open RN Nursing Pharmacology, 2.5 Preventing Medication Errors（WisTech Open）","url":"https://wtcs.pressbooks.pub/pharmacology/chapter/2-5-preventing-medication-errors/","license":"CC BY 4.0","note":"与薬の安全確認と患者教育の枠組み"},{"name":"Open RN Nursing Pharmacology, 6.4 Nursing Process Related to Cardiovascular and Renal Medications（WisTech Open）","url":"https://wtcs.pressbooks.pub/pharmacology/chapter/6-4-nursing-process-related-to-cardiovascular-and-renal-medications/","license":"CC BY 4.0","note":"循環器薬の投与前評価と患者教育"},{"name":"Open RN Nursing Pharmacology, 6.12 Blood Coagulation Modifiers（WisTech Open）","url":"https://wtcs.pressbooks.pub/pharmacology/chapter/6-12-blood-coagulation-modifiers/","license":"CC BY 4.0","note":"抗凝固薬・抗血小板薬の観察と指導"},{"name":"MedlinePlus: Medication Errors（Health Topic）","url":"https://medlineplus.gov/medicationerrors.html","license":"パブリックドメイン","note":"患者向けの服薬誤り防止の言い回しを参考"},{"name":"4AT（rapid clinical test for delirium）","url":"https://www.the4at.com/","license":"CC BY 4.0（日本語版あり）","note":"せん妄の評価"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"discharge_transition","group":"心理・社会・セルフケア","problem":"退院後の生活・社会復帰の調整が必要である","problem_plain":"病気や治療で体の力や生活のしかたが変わり，そのまま家に帰ると生活が回らない，または悪化して戻ってくる見込みがある状態．自宅の環境，介護の手，通院や薬の手配，仕事や運転の再開時期，困ったときの連絡先を，退院前に本人・家族・多職種で整える必要がある．","applies_when":["入院前と比べて ADL（歩行・排泄・入浴・食事）や認知機能が低下し，自宅で同じ生活を続けるのが難しい","高齢・独居・老老介護，または家族の介護力が不足している（仕事・遠方・健康問題）","退院後に新しい管理が必要になる（在宅酸素，持続点滴，植込みデバイスの遠隔モニタリング，抗凝固薬，体重・血圧の自己測定，減塩食）","心不全の再入院を繰り返している，または退院後の受診・服薬が途切れた経緯がある","自宅の環境に問題がある（階段・段差・トイレまでの距離・入浴設備・買い物や調理の手段）","仕事・運転・家事・介護など役割の再開時期や方法に不安がある（ICD 植込み後・開心術後・脳卒中後の運転制限を含む）","介護保険・訪問看護・在宅医療などの制度を使っていない，または見直しが必要","本人と家族で退院先の希望が食い違っている，または転院・施設入所を検討している"],"related_factors":["身体：心機能低下による活動耐性の低下，麻痺・嚥下障害（脳卒中），胸骨保護などの術後の動作制限，フレイル","認知・心理：認知機能の低下，抑うつ・不安，役割喪失感，『迷惑をかけたくない』心理","環境：住宅の構造（階段・段差・浴室），交通手段，買い物・調理の手段","支援：家族の介護力・健康・仕事，独居，支援制度の未利用，キーパーソンの不在","医療・制度：複数の管理（酸素・デバイス・薬・食事）の同時開始，かかりつけ医・訪問看護との連携不足，経済的負担","社会：仕事・運転の制限，職場の理解，役割（家事・介護・稼ぎ手）の変化"],"assessment":{"scales":[{"name":"施設の退院支援スクリーニング票（入院時：年齢・独居・ADL・認知・介護保険・再入院歴・医療処置の継続などの項目）","license":"施設の様式を使う（入退院支援の算定要件と様式は院内の医事担当と最新通知で照合）","note":"入院早期に全員をスクリーニングし，該当者に退院支援計画を立てる"},{"name":"厚労省 障害高齢者の日常生活自立度（寝たきり度）・認知症高齢者の日常生活自立度","license":"厚労省サイト（PDL1.0）．褥瘡対策の診療計画書（別紙 3）などの様式に含まれる","note":"介護保険の主治医意見書とも共通する区分で，多職種・地域との共通言語になる"},{"name":"厚労省 重症度，医療・看護必要度 B 項目（寝返り，移乗，口腔清潔，食事摂取，衣服の着脱，指示が通じる，危険行動）","license":"厚労省サイト（PDL1.0）","note":"入院中の ADL の推移を見る参考情報．退院後の生活能力そのものは実際の動作（トイレまで歩く，階段，入浴）で評価する"},{"name":"ADL 評価尺度（Barthel Index，FIM など）","license":"FIM は要ライセンス．Barthel Index も権利表示の扱いに諸説あるため，アプリには載せず施設で使用中の版を参照のみ","note":"リハビリ部門の評価を共有する"},{"name":"介護保険の要介護認定（申請から認定までの期間があるため入院早期に検討）","license":"制度（事実）．厚労省「介護保険制度の概要」ページを参照","note":"退院前に暫定ケアプランで福祉用具・訪問サービスを使えることが多い．地域の窓口（地域包括支援センター・ケアマネジャー）と相談"}],"assessment_points":["入院早期（目安 3 日以内，施設基準に従う）に退院困難の要因をスクリーニングし，本人と家族に『退院後どこでどう暮らしたいか』を聞く．本人と家族の希望が違う場合はその両方を記録する","入院前の生活を具体的に把握する：一日の過ごし方，家事・買い物・調理を誰がするか，通院手段，仕事，家の構造（階段・段差・トイレ・浴室），使っているサービス","退院後に必要になる管理を一覧にする（薬・体重・血圧・食事・酸素・デバイス・創の観察・リハビリ・受診）と，本人ができること・支援が要ることを分ける","ADL と認知機能の入院中の推移をリハビリ部門と共有し，退院時に見込まれる能力で自宅の動線（ベッドからトイレ・浴室・玄関）を検討する","経済面・制度：介護保険の有無と区分，障害者手帳・医療費助成・傷病手当などの利用可能性を医療ソーシャルワーカーと確認する"]},"goals":{"long_term":"本人が望む場所で安全に生活を続けられ，必要な支援と連絡体制が整い，再入院や生活の破綻を防げる","short_term":["入院早期（施設基準）：退院支援の必要性がスクリーニングされ，本人・家族の希望する退院先と生活のイメージが記録されている","退院支援計画の作成時：退院後に必要な管理と担い手（本人・家族・訪問看護・薬局・ケアマネジャー・かかりつけ医）が一覧になっている","退院前：自宅環境の問題（段差・手すり・浴室・ベッド）への対策と福祉用具・住宅改修の手配が決まっている（必要なら退院前訪問・試験外泊で確認）","退院前：緊急時の連絡先（外来・夜間休日・訪問看護・救急要請の目安）を書いたものを本人と家族が持ち，どの症状でどこに連絡するかを言える","退院前：仕事・運転・家事・入浴などの再開時期と方法について医師の説明を受け，本人が理解している．外来心臓リハビリなど退院後のプログラムの予定が決まっている"]},"OP":["ADL の推移：歩行距離と安定性，階段昇降，トイレ動作，入浴，更衣，食事（リハビリ部門の評価と病棟での実際の様子）","活動時の症状：歩行・階段・入浴での息切れ・胸痛・動悸・ふらつき，血圧・脈拍・SpO2 の変化（activity_intolerance を参照）","認知機能・気分：理解力，記憶，判断（火の元・薬・電話），抑うつ・不安・意欲，本人の退院への気持ち","セルフケアの実行：体重・血圧の自己測定，服薬，食事の管理を入院中に自分で行えているか","家族の状況：介護できる人と時間，家族の健康・仕事，介護への不安と受け止め，面会時の様子","自宅環境：住宅の構造（階段・段差・寝室の場所・トイレと浴室の設備），福祉用具の有無，近隣の支援","制度の利用状況：介護保険の区分と担当ケアマネジャー，訪問看護・訪問診療・通所サービス，障害者手帳・医療費助成","医療的な管理の継続：在宅酸素・持続点滴・デバイスの遠隔モニタリング・創の処置・抗凝固薬の採血など，退院後に続く処置と手配の状況","仕事・運転・役割：職種と復帰の希望，運転の必要性と医学的な制限（ICD・失神・脳卒中後），家事や介護の役割","本人と家族の希望の一致度，転院・施設入所の検討状況","退院後（外来・電話・訪問看護）：生活の実際，サービスの利用状況，困りごと，症状と受診の状況"],"TP":["入院早期に退院支援の担当（病棟看護師・退院支援看護師・医療ソーシャルワーカー）を決め，本人・家族・医師・リハビリ・薬剤師・管理栄養士でカンファレンスを行い，退院支援計画を本人・家族と共有する（施設の様式）","本人の『こう暮らしたい』を出発点にし，必要な管理を『本人がすること』『家族がすること』『サービスに頼むこと』に分けて一覧にする．できないことを責めず，支援を足す方向で組み立てる","介護保険の新規申請・区分変更を早めに検討し，家族と地域包括支援センター・ケアマネジャーにつなぐ（申請は本人・家族が行う．退院前に暫定プランで福祉用具・訪問サービスを使えることが多い）","自宅環境の対策：リハビリ部門と一緒にベッド・トイレ・浴室・玄関の動線を検討し，手すり・段差解消・シャワーチェア・ベッドなど福祉用具や住宅改修をケアマネジャー・福祉用具業者と手配する．必要なら退院前訪問や試験外泊で実際の生活を確認する","退院後の医療の連携：かかりつけ医・訪問看護・訪問診療・薬局へ看護要約（施設の様式）で病状・管理内容・観察のポイント・連絡の目安を申し送る．退院前カンファレンス（在宅側の職種も参加）を開く","緊急時の連絡先カードを作る：外来・夜間休日の窓口・訪問看護・救急要請の目安（安静時の息苦しさ・胸痛・意識の変化・麻痺・大量出血）を書き，冷蔵庫など目につく場所に貼ってもらう","セルフケア（体重・血圧・服薬・食事）は入院中に本人が実際に行う形で練習し，退院後の記録用紙（心不全手帳など施設の様式）を渡す（knowledge_selfcare・medication_management を併用）","仕事・運転・入浴・性生活・旅行などの再開時期は医師の説明を受ける場を設定し，本人の質問を事前に整理しておく．職場への説明が必要なら診断書・意見書の手配を医療ソーシャルワーカーと進める","外来心臓リハビリ・通所リハビリ・訪問リハビリなど退院後のプログラムに申し込み，初回日程を退院前に決める（cardiac_rehab を参照）","家族の介護負担を評価し，介護方法（移乗・食事介助・口腔ケア・薬の管理）を退院前に一緒に練習する．家族の休息とレスパイト（短期入所など）の情報を渡す（family_burden を参照）","本人と家族の希望が違う場合や転院・施設入所を検討する場合は，医師・医療ソーシャルワーカーと面談の場を設け，本人の意思を最優先にしつつ現実的な選択肢を一緒に検討する","退院後の初回外来までに電話または訪問看護で生活の様子を確認し，困りごとがあれば早めに調整する"],"EP":["患者・家族へ：退院後に必要な管理の一覧と，それぞれ誰が担うかを一緒に確認したこと．一人で抱えず，サービスを使ってよいこと","患者・家族へ：緊急時の連絡先カードの内容：どの症状でどこに連絡するか，救急要請が必要な症状（安静時の強い息苦しさ・胸痛・意識の変化・片麻痺やろれつの異常・大量の出血）","患者へ：活動の広げ方：入院中にできた動作を目安に，息切れや疲れの程度を見ながら少しずつ広げること．避けるべき動作（術後の重い物・胸骨に力がかかる動作など）は医師の指示に従うこと","患者へ：仕事・運転・入浴・旅行の再開時期は医師に確認したこと．ICD 植込み後や失神・脳卒中後の運転には医学的な制限があり，主治医の判断に従うこと","患者・家族へ：介護保険・訪問看護・地域包括支援センターなど相談窓口とその役割，申請の手順（担当者名と連絡先を渡す）","家族へ：介護の方法（移乗・食事・口腔ケア・薬）で練習した内容と，家族自身の休息・相談先","患者・家族へ：退院後の受診日・採血・外来心臓リハビリの予定と，受診を続けることの意味（薬の調整・悪化の早期発見）","患者へ：気分の落ち込み・眠れない・何もする気になれない状態が続くときは，遠慮なく外来や訪問看護に相談してよいこと"],"evaluation":{"timing":"入院早期のスクリーニング後，退院支援カンファレンスごと，退院前日，退院後の初回外来（または初回訪問看護）","indicators":["退院支援計画が本人・家族と共有され，必要な管理と担い手が一覧で決まっている","自宅環境の対策・福祉用具・介護保険の手続きが退院までに整っている（または退院後の見通しと担当者が決まっている）","本人と家族が緊急時の連絡先と連絡の目安を言える","退院後の医療・ケア（かかりつけ医・訪問看護・薬局・外来心臓リハビリ）への申し送りと初回予定が済んでいる","退院後：予定どおりに生活とサービスが回っている，症状の悪化で適切に連絡・受診できている，計画外の再入院がない"],"revise_if":"ADL や認知機能が入院中に変化した／家族の介護力や希望が変わった／退院先の希望が食い違ったまま／新たな医療的管理が加わった／退院後に生活が回っていない・サービスが使われていない／再入院した"},"cardio_ward_notes":["心不全は退院直後の数週間が最も悪化しやすい時期．退院後早期の外来・電話・訪問看護での確認を計画に入れ，体重・症状・服薬の記録を一緒に見る体制を退院前に組む","開心術後は胸骨保護の期間（術式・医師の指示による）に重い物を持つ・腕で体を押し上げる動作が制限される．自宅の動線（起き上がり・浴槽のまたぎ・買い物）と仕事内容に合わせて具体的な代わりの方法をリハビリと一緒に決める（post_cardiac_surgery_common を参照）","ICD 植込み後・失神の既往・脳卒中後は運転に医学的な制限があり，法令と主治医の判断に従う．仕事や生活が運転に依存する場合は早めに医師の説明の場と代替手段の検討を","在宅酸素・持続点滴（強心薬）・遠隔モニタリング機器は業者の設置と説明が必要で，訪問看護との役割分担（機器の確認・トラブル時の連絡）を退院前に決める","抗凝固薬は退院後の採血（INR）や休薬指示が続くため，かかりつけ医・薬局・歯科への情報共有を退院前に済ませる","脳卒中を合併した患者は回復期リハビリ病院への転院も選択肢になる．心疾患の管理（抗凝固薬・心不全・デバイス）を転院先に確実に申し送る（stroke_functional を参照）"],"sources":[{"name":"厚生労働省 介護保険制度の概要","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/kaigo_koureisha/gaiyo/index.html","license":"PDL1.0","note":"制度の枠組み（申請・認定・サービス）を参照"},{"name":"厚生労働省 重症度，医療・看護必要度 評価票および褥瘡対策に関する診療計画書（日常生活自立度）（令和 8 年度 基本診療料の施設基準等 通知 別紙 3・別紙 7）","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0","note":"ADL・自立度の区分を参照（standard_care_plans.json と同じ資料）"},{"name":"NHLBI Heart Surgery – Recovery","url":"https://www.nhlbi.nih.gov/health/heart-surgery/recovery","license":"米国政府著作物（パブリックドメイン）","note":"退院後の創管理・活動再開・心臓リハビリの説明の構成を参考"},{"name":"NHLBI Heart Failure – Living With Heart Failure","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"米国政府著作物（パブリックドメイン）","note":"在宅管理と連絡先の準備"},{"name":"MedlinePlus: Heart failure – discharge（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000114.htm","license":"パブリックドメイン","note":"退院時説明の項目"},{"name":"MedlinePlus: Heart bypass surgery – discharge（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000102.htm","license":"パブリックドメイン","note":"術後の活動再開・運転・仕事の説明の構成"},{"name":"MedlinePlus: Cardiac Rehabilitation（Health Topic）","url":"https://medlineplus.gov/cardiacrehabilitation.html","license":"パブリックドメイン","note":"外来心臓リハビリの位置づけ"},{"name":"Open RN Nursing Fundamentals 2e, 13.3 Applying the Nursing Process（Mobility）（WisTech Open）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-3-applying-the-nursing-process/","license":"CC BY 4.0","note":"活動・移動の評価と退院に向けた介入の体系"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"perioperative_cardiac","group":"周術期・特殊","problem":"心臓手術・カテーテル治療の周術期に合併症を起こすリスクがある","problem_plain":"心臓の手術（バイパス・弁・大動脈など）やカテーテル治療（PCI・アブレーション・TAVI・デバイス植込みなど）の前後は，出血・感染・肺の合併症（無気肺・肺炎）・不整脈（術後心房細動）・せん妄・血栓・腎障害・穿刺部のトラブルが起きやすい．術前の準備と説明，術後の観察と早期離床でこれらを防ぎ，起きたときに早く見つける計画．疾患別リストの「開心術後の共通管理」「カテーテル検査の前後」が『何を見るか』の一覧であるのに対し，この計画は『目標を立てて評価する』ための枠組み．","applies_when":["心臓手術（CABG・弁手術・大動脈手術・その他の開心術）の予定または術後","カテーテル治療・検査（PCI・アブレーション・TAVI・MitraClip・ペースメーカや ICD の植込み・心臓カテーテル検査）の予定または術後","合併症の危険が高い背景：高齢，フレイル，糖尿病，腎機能低下，COPD・喫煙，肥満，低栄養，貧血，抗凝固薬・抗血小板薬の内服，緊急手術","せん妄の危険因子（高齢・認知症・せん妄の既往・飲酒歴・視聴覚障害）がある","術前の不安が強い，手術や術後の経過について理解が不十分","術後に ICU/CCU から一般病棟へ移った直後（観察の頻度が下がる時期）","ドレーン・一時ペーシングワイヤ・動脈ライン・尿道カテーテル・穿刺部の止血デバイスなどが留置されている"],"related_factors":["手術侵襲：胸骨切開・人工心肺・麻酔による呼吸機能低下，出血，炎症，体液バランスの乱れ","呼吸：痛みによる浅い呼吸と咳の抑制，臥床，喫煙歴・COPD，肥満，鎮痛薬（オピオイド）による呼吸抑制","循環・不整脈：手術による心房の刺激，電解質異常（K・Mg），脱水，痛み・不眠・低酸素，術後心房細動のピーク（術後 2〜4 日）","感染：創部（胸骨・下肢のグラフト採取部・穿刺部・デバイスポケット），ライン類，尿道カテーテル，高血糖，低栄養","血栓・出血：抗凝固薬・抗血小板薬の休薬と再開，臥床，穿刺部の止血不良，ヘパリン","神経・認知：高齢，認知症，飲酒歴，ICU 環境，睡眠の分断，薬剤（術後せん妄）．塞栓による脳梗塞","腎：造影剤，低血圧・低灌流，脱水，腎毒性のある薬","心理：手術への恐怖，結果への不安，ICU での体験"],"assessment":{"scales":[{"name":"施設の術前チェックリストと術後クリニカルパス（術式ごと：休薬・絶飲食・皮膚準備・術後の観察間隔・離床段階・ドレーン抜去や安静解除の基準）","license":"施設の様式を使う","note":"この計画の値（観察間隔・離床の段階・安静時間）はすべて施設のパスと医師の指示で置き換える"},{"name":"厚労省「せん妄ハイリスク患者ケア加算」のチェックリスト（別紙様式 7 の 3）","license":"厚労省サイト（PDL1.0）","note":"術前にリスク評価し対策を記録する（delirium_risk と同じ）"},{"name":"4AT（せん妄の簡易評価）／CAM-ICU（ICU・人工呼吸中）","license":"4AT は CC BY 4.0．CAM-ICU は臨床実装に許可不要（著作権行の表示必須）（license_check.md）","note":"術後は毎勤務で評価．低活動型を見逃さない"},{"name":"痛みの数値評価（NRS：0〜10 で本人が答える）と，答えられない患者の行動観察（表情・体動・呼吸）","license":"一般的手技（事実）","note":"安静時と深呼吸・咳・体動時を分けて聞く．鎮痛の目標は『深呼吸と離床ができる程度』"},{"name":"フレイルの評価（Clinical Frailty Scale など）","license":"権利者の利用条件あり（商用利用は要許可）．アプリには載せず，施設で使用中なら参照のみ","note":"術前のリスク評価と術後の離床・栄養計画の参考（frailty_sarcopenia を参照）"}],"assessment_points":["術前：既往（糖尿病・腎機能・COPD・喫煙・脳血管障害），内服薬（抗凝固薬・抗血小板薬・糖尿病薬など休薬の指示），アレルギー（造影剤・薬・ラテックス），栄養状態，ADL と認知機能（術後の離床とせん妄の予測），本人の理解と不安を確認する","術後は『呼吸・循環・出血・創・神経・腎・痛み・せん妄』の順に毎回そろえて観察し，前回と比べて変化を見る．ICU 退室直後と夜間は特に注意","術後心房細動のピーク（術後 2〜4 日）と，感染（術後 3 日以降の発熱）・せん妄（術後数日）の時期を意識して観察を組む","カテーテル治療後は穿刺部（出血・血腫・後腹膜出血のサイン）と穿刺側の末梢循環，造影剤の影響（尿量・Cr）を時間経過で見る（cardiac_cath_periop・post_pci を参照）","『いつもと違う』（急な息切れ・冷汗・落ち着きのなさ・ろれつ・尿量の減少）は合併症の始まりとして扱い，発見時に速やかに報告する"]},"goals":{"long_term":"周術期の合併症（呼吸器・感染・出血・不整脈・血栓・腎障害・せん妄・穿刺部トラブル）を起こさず，または早期に発見・対応して，予定どおりの回復と退院ができる","short_term":["術前（手術決定〜前日）：休薬・絶飲食・皮膚準備・持ち物（眼鏡・補聴器・義歯の扱い）が指示どおりに済み，本人が術後の経過（痛み・ドレーン・ICU・深呼吸と離床の必要性）を自分の言葉で説明できる","術前：深呼吸・咳（創を抱える方法）・呼吸訓練器具の使い方・術後の体の動かし方を本人が練習している","術後〜一般病棟移動後（施設のパスに従う）：SpO2・呼吸音・体温・創・ドレーン・穿刺部・心電図・尿量の異常が発見時に報告され，院内基準の対応が始まっている","術後（施設のパスに従う）：鎮痛が効いた状態で深呼吸・咳・段階的な離床（端座位→立位→歩行）が予定どおり進み，無気肺・肺炎・深部静脈血栓の徴候がない","術後毎日：せん妄の評価（4AT または CAM-ICU）が行われ，出た場合は原因への対応が始まり，ルート抜去・転倒がない"]},"OP":["呼吸：呼吸数・SpO2・呼吸パターン，呼吸音の左右差と副雑音，痰の量と色と出しやすさ，深呼吸と咳ができるか，酸素の量（無気肺・肺炎・胸水・気胸）","循環：血圧・脈拍・心電図モニタ（術後心房細動・徐脈・房室ブロック・一時ペーシングの作動），末梢冷感・尿量（低心拍出），ドレーン排液の急増や急な停止＋血圧低下（出血・心タンポナーデ）","出血・血腫：創部・ドレーン・穿刺部（大きさをマーキング），鼠径穿刺後の腰痛や血圧低下（後腹膜出血），Hb の推移，抗凝固薬・抗血小板薬の再開状況","創部：胸骨創・下肢グラフト採取部・デバイスポケット・穿刺部の発赤・腫れ・浸出液・離開，胸骨の動揺（縦隔炎の前兆），体温の推移（術後 3 日以降の発熱は感染を疑う）","神経・認知：意識レベル・見当識・注意力（毎勤務のせん妄評価），急な麻痺・ろれつ・顔のゆがみ（脳梗塞）","腎・電解質：時間尿・水分バランス・体重，Cr（造影剤後は遅れて上がる），K・Mg（低値は不整脈の引き金）","痛み：安静時と深呼吸・咳・体動時の NRS，鎮痛薬の効果と副作用（眠気・便秘・吐き気・呼吸抑制）","離床と血栓：離床の段階と反応（血圧・脈拍・SpO2・症状），下肢の腫れ・痛み（深部静脈血栓），弾性ストッキングや間欠的空気圧迫の実施","穿刺部と末梢（カテーテル後）：止血デバイスの圧と時間，穿刺側の脈・色・温度・しびれ，迷走神経反射（徐脈＋血圧低下＋あくび・冷汗）","血糖：術後は上がりやすい（創感染の危険）．指示の測定と管理","栄養・排泄：食事摂取量，嚥下（挿管後の声のかすれ・むせ），排便（便秘といきみ），排尿（尿道カテーテル抜去後の尿閉）","本人の理解と不安：術前の説明の理解度，術後の『元に戻れるか』という不安，ICU 体験の記憶，睡眠"],"TP":["術前：休薬（抗凝固薬・抗血小板薬・糖尿病薬など）と再開の指示を一覧にして本人・薬剤師と共有し（SGLT2 阻害薬は心不全の目的で使っている患者も対象に拾い，手術前の休薬時期と食事が戻ってからの再開条件を薬ごとに確認する），絶飲食・皮膚準備・輸血同意などの準備を施設のチェックリストで確認する．『飲んでよい薬』は指示を確認して与薬する","術前：術後の経過（ICU・ドレーン・ライン・痛み・深呼吸と離床の必要性・一時的な混乱の可能性）を本人と家族に説明し，眼鏡・補聴器・時計の持参を依頼する（せん妄予防は delirium_risk）","術前：深呼吸・咳（枕やタオルで創を抱える）・呼吸訓練器具・体の動かし方（胸骨を守る起き上がり方，腕で体を押し上げない）を実際に練習する．禁煙と口腔ケアを進める","術後：観察は施設のパスの間隔で行い，異常（呼吸・循環・出血・神経・尿量）は発見時に速やかに医師へ報告し，呼吸・循環の異常は院内の緊急対応へつなぐ","呼吸器合併症の予防：鎮痛を先回りしてから深呼吸・咳・呼吸訓練器具・体位変換を行う．痰が出しにくいときは吸入・体位ドレナージ・吸引を医師・理学療法士と検討する．酸素は指示の範囲で調整し，SpO2 の目標は医師の指示に従う","早期離床：施設のパスと安静度の範囲で，各段階で症状・血圧・脈拍・SpO2 を確認しながら端座位→立位→歩行と進める（activity_intolerance・cardiac_rehab を参照）．離床できない間は足関節の運動・弾性ストッキング・間欠的空気圧迫（指示に従う）で血栓を防ぐ","創部・ライン管理：創の観察と清潔保持（シャワー開始は医師の許可後），ドレーンの固定・屈曲の確認と排液の記録，一時ペーシングワイヤの固定と設定確認，不要なライン・尿道カテーテルは医師と相談して早く抜く（infection_risk を参照）","術後心房細動が出たら心拍数・血圧・症状をすぐ報告し，K・Mg の補正・レートコントロール・抗凝固の指示に従う．誘因（脱水・痛み・不眠・低酸素）を減らす（postop_af_complications・arrhythmia_hemodynamic を参照）","カテーテル後：穿刺部と末梢循環を決められた間隔で観察し，止血デバイスの減圧・安静解除を施設のプロトコルで行う．造影剤の排出のため指示された水分摂取（心不全の制限があれば医師と相談）と尿量・Cr の確認","せん妄予防と対応：毎勤務の評価，見当識の支援，昼夜のリズム，眼鏡・補聴器，早期離床，痛み・便秘・脱水の対応．出たら原因検索と医師への報告（delirium_risk）．身体拘束は原則行わず院内指針とチーム判断","痛みの管理：鎮痛薬は指示の範囲で先回りして使い，効果と副作用（呼吸抑制・便秘・吐き気）を評価する．便秘対策（水分・下剤の指示・離床）を早めに（pain_management・constipation_straining を参照）","家族へ術後の経過と『よくある変化』（一時的な混乱・発熱・不整脈）を前もって伝え，面会での協力（声かけ・なじみの物）を依頼する"],"EP":["患者へ（術前）：手術の流れと術後の様子（ICU・管やライン・痛み・深呼吸と離床の意味）．わからないことは何度でも聞いてよいこと","患者へ（術前）：休薬する薬と再開の予定，絶飲食の時間，当日飲む薬．指示と違うことがあれば必ず知らせること","患者へ（術前・術後）：深呼吸・咳・呼吸訓練器具は肺炎を防ぐ大事な治療であること．痛みは我慢せず，深呼吸や離床の前に鎮痛薬を使ってよいこと","患者へ：胸骨を守る動作（腕で体を押し上げない・重い物を持たない・咳やくしゃみのときは胸を抱える）と，その期間は医師の指示に従うこと","患者へ：動悸・脈の乱れ・急な息苦しさ・冷汗・穿刺部の腫れや出血・手足の冷え・ろれつの異常は，すぐナースコールで知らせること","患者・家族へ：術後に一時的に混乱することがあり，多くは数日で戻ること．眼鏡・補聴器・時計を持ってきてほしいこと．家族が『いつもと違う』と感じたら知らせてほしいこと","患者へ（退院前）：創の観察（赤み・腫れ・浸出液・熱）と受診の目安，シャワー・入浴の開始時期，活動の広げ方，外来心臓リハビリの予定（discharge_transition を併用）","患者へ（カテーテル後）：穿刺部の出血や腫れは手で押さえて知らせること，手首の穿刺後は数日重い物を持たないこと，水分は指示の範囲で摂ること"],"evaluation":{"timing":"術前は手術前日まで，術後は毎勤務（ICU 退室後 3 日間と夜間は重点的に），および離床段階の変更時・ライン抜去時・退院前","indicators":["術前の準備（休薬・絶飲食・皮膚準備・練習）が指示どおりに済み，本人が術後の経過と自分の役割（深呼吸・離床）を言える","呼吸器合併症（無気肺・肺炎）・創感染・縦隔炎・出血・心タンポナーデ・脳梗塞・腎障害が起きていない，または発見時に速やかに報告・対応されている","術後心房細動・せん妄が出ても早期に発見され，心拍数・血圧・苦痛・危険（ルート抜去・転倒）が管理されている","施設のパスどおりに離床が進み，痛みが深呼吸と離床を妨げていない","穿刺部の出血・血腫・末梢循環障害がなく，安静解除後の初回歩行が安全に行えている"],"revise_if":"呼吸状態の悪化・発熱・創の異常・ドレーン排液の変化・新しい不整脈・せん妄・神経症状・尿量減少のいずれかが出た／離床が予定より遅れている／痛みが強く深呼吸できない／ICU へ戻った・再手術になった"},"cardio_ward_notes":["疾患別リストとの役割分担：『開心術後の共通管理』『カテーテル検査の前後』『術後心房細動・術後合併症の早期発見』は観察項目と赤旗の一覧．この看護計画はそれらを使って目標を立て，評価日を決め，計画を見直すための枠組み．病名別の項目（post_cabg・post_valve_replacement・post_pci・cied_management など）と組み合わせて使う","術後心房細動は術後 2〜4 日がピークで，K・Mg の低下・脱水・痛み・不眠・低酸素が引き金になる．この時期は心電図モニタを外さず，誘因を減らすケアを重点的に行う","せん妄は術後合併症の早期発見を妨げる（訴えが取りにくい・ルート抜去・転倒）．低活動型を『静かだから大丈夫』と見ず，低酸素・低心拍出・脳梗塞をまず除外する","抗凝固薬・抗血小板薬の休薬と再開の指示は術式・弁の種類・ステントの有無で異なる．再開忘れは血栓，早すぎる再開は出血につながるため，一覧で共有し与薬のたびに照合する（antithrombotic_management）","IABP・ECMO・一時ペーシングなどの補助が入っている間は体位変換・離床に制限があり，スモールシフトと機器部位の観察，自己抜去の防止が重要（pressure_injury・line_self_removal_risk・delirium_risk を併用）","退院後の生活（胸骨保護・創の観察・運転や仕事の再開・外来心臓リハビリ）は discharge_transition と knowledge_selfcare で引き継ぐ"],"sources":[{"name":"NHLBI Heart Surgery – What Is Heart Surgery?","url":"https://www.nhlbi.nih.gov/health/heart-surgery","license":"米国政府著作物（パブリックドメイン）","note":"手術の種類と経過の概要"},{"name":"NHLBI Heart Surgery – Preparing for Surgery","url":"https://www.nhlbi.nih.gov/health/heart-surgery/preparing","license":"米国政府著作物（パブリックドメイン）","note":"術前準備の項目"},{"name":"NHLBI Heart Surgery – Recovery","url":"https://www.nhlbi.nih.gov/health/heart-surgery/recovery","license":"米国政府著作物（パブリックドメイン）","note":"術後の経過・退院後の注意・心臓リハビリ"},{"name":"NHLBI Heart Surgery – Risks","url":"https://www.nhlbi.nih.gov/health/heart-surgery/risks","license":"米国政府著作物（パブリックドメイン）","note":"合併症（出血・感染・不整脈・脳卒中・腎障害・認知機能の変化）の一覧"},{"name":"NHLBI Cardiac Catheterization – Recovering from a Cardiac Catheterization","url":"https://www.nhlbi.nih.gov/health/cardiac-catheterization/recovery","license":"米国政府著作物（パブリックドメイン）","note":"カテーテル後の穿刺部管理と注意"},{"name":"MedlinePlus: Heart bypass surgery – discharge（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000102.htm","license":"パブリックドメイン","note":"退院時の患者向け説明"},{"name":"厚生労働省 せん妄ハイリスク患者ケア加算 チェックリスト（令和 8 年度 様式（医科） 別紙様式 7 の 3）","url":"https://www.mhlw.go.jp/content/12400000/001713885.pdf","license":"PDL1.0","note":"術前のせん妄リスク評価"},{"name":"4AT（rapid clinical test for delirium）","url":"https://www.the4at.com/","license":"CC BY 4.0（日本語版あり）","note":""},{"name":"Open RN Nursing Fundamentals 2e（WisTech Open）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/","license":"CC BY 4.0","note":"Ch.8 Oxygenation・Ch.11 Comfort・Ch.13 Mobility の看護過程の体系を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"end_of_life_hf","group":"周術期・特殊","problem":"心不全の終末期にあり，症状緩和と意思決定支援が必要である","problem_plain":"治療を尽くしても入退院を繰り返し，息苦しさ・だるさ・むくみが続く段階の心不全．苦痛を和らげるケアと，本人がどう過ごしたいか（療養場所・治療の範囲・ICD の扱い）を本人・家族・チームで話し合う支援（ACP：人生会議）を，心不全の治療と並行して行う．終末期は『治療をやめる』段階ではなく，本人の望みに合わせて治療とケアの重点を変える時期．","applies_when":["最大限の治療（薬・デバイス・手術）を行っても心不全の増悪による入院を繰り返す，または退院しても短期間で再入院する","安静時や軽い動作でも息苦しさ・倦怠感が続き，日常生活の多くに介助が必要になっている","利尿薬や強心薬の効果が乏しく，血圧低下や腎機能悪化で心不全の薬を減らさざるを得ない","食欲低下・体重減少（心臓悪液質）・むくみや腹水が続く","本人や家族から『もう十分』『家に帰りたい』『これからどうなるのか』といった言葉が出ている，または医師から予後についての説明が始まっている","ICD が植え込まれており，終末期のショック作動の扱いを決める必要がある","ACP（人生会議）の話し合いがまだ行われていない，または本人の意向・代理決定者が記録されていない","家族の疲弊・葛藤が強い，または本人と家族の意向が食い違っている"],"related_factors":["身体：低心拍出と肺うっ血による呼吸困難，倦怠感，浮腫・腹水，痛み（胸・関節・皮膚），食欲低下・吐き気，口渇（水分制限・利尿薬），不眠，せん妄","治療：薬の効果の減弱と副作用（低血圧・腎機能悪化・電解質異常），ICD のショック，繰り返す入院と検査の負担","心理：予後への不安・恐れ，抑うつ，喪失感，『見捨てられる』感覚，意思決定の重さ","社会：療養場所の選択（自宅・病院・施設）と介護力，経済面，制度の利用状況","コミュニケーション：予後の説明が段階的でない，本人と家族・医療者の認識のずれ，代理決定者が決まっていない","医療者側：心不全の予後の不確実さ（急に悪化することも回復することもある）によって緩和ケアの開始が遅れやすい"],"assessment":{"scales":[{"name":"症状の数値評価（NRS：息苦しさ・だるさ・痛み・吐き気・不安などを 0〜10 で本人が答える）と，答えられない患者の行動観察（呼吸の様子・表情・落ち着きのなさ）","license":"一般的手技（事実）","note":"数値そのものより『本人が耐えられる程度か』『前回と比べてどうか』を見る．測定自体が負担なら頻度を減らす"},{"name":"NYHA 心機能分類","license":"一般的な分類（事実）","note":"終末期の心不全は多くが IV 度に相当するが，分類より本人の生活と希望を優先する"},{"name":"厚生労働省「人生の最終段階における医療・ケアの決定プロセスに関するガイドライン」（改訂 平成 30 年 3 月）と「人生会議」（ACP）の資材","license":"厚労省サイト（PDL1.0）","note":"尺度ではなく意思決定の枠組み：適切な情報提供と説明のうえで本人の意思決定を基本とし，多職種のチームで方針を決める．本人の意思は変わりうるので繰り返し話し合い，そのつど記録する．本人が意思を伝えられない場合は家族等が本人の意思を推定し，推定できなければ本人にとって最善の方針をチームで慎重に判断する"},{"name":"緩和ケアの症状評価票（IPOS，ESAS，STAS-J など）","license":"各権利者の利用条件（登録・許諾）あり．アプリには載せず，施設の緩和ケアチームが使用中なら参照のみ","note":"多職種で症状を共有するときに有用"},{"name":"4AT（せん妄の簡易評価）","license":"CC BY 4.0","note":"終末期のせん妄は苦痛と意思決定の妨げになるため早期に見つける"}],"assessment_points":["症状は本人の言葉で毎日評価する：息苦しさ（安静時・夜間・会話時・体位），だるさ，むくみ・腹部の張り，痛み，口渇，食欲・吐き気，不眠，不安．数値（血圧・SpO2）より苦しさの訴えを優先する","本人の理解と希望：病気の見通しをどう受け止めているか，大切にしていること，望む療養場所と過ごし方，避けたいこと（蘇生・人工呼吸・透析・強心薬持続点滴・ICD のショック），代理決定者は誰か．話し合いの内容と本人の言葉をそのまま記録し，チームで共有する","家族の状況：本人の希望をどこまで知っているか，介護力と疲弊，葛藤（『延命してほしい』『楽にしてあげたい』），経済面，看取りの準備","治療とモニタの見直し：採血・画像・体重測定・水分制限・モニタが本人の利益になっているか（結果で方針が変わるか）を医師と確認し，負担になっている検査やアラームは減らす方向で相談する","せん妄・抑うつ・自殺念慮のスクリーニングと，苦痛の原因（低酸素・便秘・尿閉・痛み・薬）の確認．スタッフ自身のモヤモヤ（見捨てる感覚・方針のずれ）も話し合いの対象にする"]},"goals":{"long_term":"苦痛が本人の許容できる程度に和らぎ，本人の望む場所で望む過ごし方ができ，家族が支えられながら看取りに備えられる","short_term":["毎日：息苦しさ・だるさ・痛みなどの症状が本人の言葉で評価され，本人が『耐えられる程度』と答えられる時間が増えている（体位・環境・薬の組み合わせが決まっている）","話し合いの開始から（時期は本人の状態と希望に合わせる）：本人の理解・希望・避けたいこと・代理決定者が本人の言葉で記録され，医師・看護師・家族で共有されている．内容は変わってよいことが本人に伝わっている","ICD のある患者：ショック機能の扱いについて本人・家族・医師の話し合いが始まり，方針（継続・停止・時期）と手順が記録されている","療養場所の希望が自宅の場合：訪問看護・在宅医・介護保険・24 時間の連絡先が調整され，家族が症状への対応（体位・扇風機・薬）を練習している","家族：終末期の経過（呼吸の変化・眠る時間の増加・食べられなくなること）の説明を受け，質問や気持ちを表せている"]},"OP":["息苦しさ：安静時・夜間・会話時・体位による違い，強さ（NRS），呼吸数・パターン（チェーンストークス・死前喘鳴），酸素の使用，本人の表現（『押さえつけられる』『空気が足りない』）","だるさ・眠気・活動量：起きていられる時間，食事・会話に使える体力，日内の変動","浮腫・腹水・体重：負担のない範囲で（測定が苦痛なら回数を減らす），尿量，皮膚の緊張と傷つきやすさ","痛み：部位（胸・関節・皮膚・褥瘡・腹部）と強さ，鎮痛薬の効果と副作用（便秘・眠気・吐き気）","口渇・口腔：口の乾燥・口内炎・舌苔，水分制限や利尿薬との関係，飲み込みの様子","食欲・吐き気・便秘・排尿：摂取量，最終排便日，尿閉の有無（せん妄や苦痛の原因）","睡眠・不安・抑うつ・せん妄：夜間の様子，不安の訴え，気分の落ち込み，『死にたい』などの言葉，注意力・見当識の変化（4AT）","循環：血圧・脈拍・SpO2・心電図モニタ（数値より苦しさを優先．モニタの継続の要否を医師と相談），ICD の作動と本人の反応","薬：オピオイド・利尿薬・強心薬・抗不安薬などの効果と副作用，減らせる薬はないか","本人の言葉と希望の変化：療養場所・治療の範囲・大切にしていること・会いたい人・やり残したこと","家族：理解・疲弊・葛藤・看取りへの準備，面会や付き添いの状況，家族の健康","終末期の徴候：意識の変化，呼吸の変化，四肢の冷感・チアノーゼ，尿量減少（家族への事前説明の目安）"],"TP":["息苦しさの緩和：楽な体位（起坐位・前かがみ・枕で支える），顔に風を当てる（扇風機・うちわ），室温と換気，酸素（指示の範囲），オピオイドなど医師の指示薬の使用と効果の評価，不安への対応を組み合わせる．急な増悪は速やかに医師へ報告し，薬と体位で速やかに対応する","苦痛の原因への対応：便秘・尿閉・痛み・低酸素・せん妄を毎日評価し，先回りして対処する．口腔ケアと保湿・氷片・少量の飲水で口渇を和らげる（水分制限は苦痛なら医師と相談して緩める）","体重測定・水分制限・採血・モニタなど負担になる管理は『本人の利益になるか』を医師と確認し，減らす方向で相談する（モニタの警報を睡眠対策として消音・減音するのではなく，モニタ自体の要否を医療チームで決める）","皮膚・体位：浮腫のある皮膚を傷つけない除圧と保湿，体位変換は本人の楽さを優先し，褥瘡予防（pressure_injury）と両立させる","ACP（人生会議）の支援：本人が話したいときに話せる場を作り，医師からの説明のあとに理解と気持ちを聞く．本人の言葉をそのまま記録し，チームで共有する．『いつでも変えてよい』ことを伝え，状態の変化のたびに繰り返す（厚労省ガイドラインの決定プロセスに沿う．本人が意思を伝えられないときは家族等と本人の意思を推定し，推定できなければ本人にとって最善の方針をチームで判断する）","ICD の扱い：終末期にショックが繰り返されると苦痛になることを医師から説明してもらい，本人・家族の意向を聞いて方針（ショック機能の停止・時期・手順・停止後の対応）を記録する．設定変更は医師と臨床工学技士が行い，看護師は本人の理解と気持ちの確認と記録を担う（cied_management を参照）","DNAR（心停止のときに蘇生を試みない）の方針は本人・家族・医師の話し合いで決め，施設の様式で記録し，勤務者全員が把握できるようにする（看護師が独自に判断しない）．DNAR は心停止時の蘇生に限った指示なので，挿管・薬や点滴などの治療・搬送の希望は別に確認して記録する（DNAR だけを理由に治療を控えたり救急要請を不要と決めたりしない）","療養場所の調整：自宅を希望する場合は退院支援担当・医療ソーシャルワーカーと訪問看護・在宅医・介護保険・在宅酸素や持続点滴の手配を進め，24 時間の連絡先を決める（discharge_transition を参照）","家族ケア：休息（付き添いの交代・レスパイト），気持ちの表出の場，終末期の経過の事前説明，看取りの希望（誰が・どこで・何をしたいか）の確認．家族の意向が本人と違うときは，医師・看護師・必要なら倫理相談を交えて話し合う","せん妄予防と対応（delirium_risk）：見当識の支援・昼夜のリズム・眼鏡補聴器・家族の面会．興奮や幻覚には落ち着いた対応と医師への相談","大切にしていること・やり残したことへの支援（会いたい人との面会・外出・宗教的な支え）をチームで検討する","看取りのあと：家族へのねぎらいと説明，遺族の相談先の情報．スタッフでデスカンファレンスを行い，ケアを振り返る"],"EP":["患者・家族へ：息苦しさは体位・風・薬で和らげられること．我慢しなくてよいこと，苦しいときの体位と薬の使い方","患者へ：これからの過ごし方の希望はいつでも話してよく，いつでも変えてよいこと．話したくないときは話さなくてよいこと","患者・家族へ：代理決定者を決めておくこと，本人の希望を家族に伝えておくことの意味（人生会議のリーフレットなど厚労省の資材を使う）","患者・家族へ（ICD のある場合）：終末期にショック作動が苦痛になることがあり，止める選択ができること．止めてもペースメーカ機能は残ること（機種と設定は医師が説明）","家族へ：食べられない・飲めないときに無理に勧めなくてよいこと．口を潤す方法．眠る時間が増える・呼吸が変わるのは自然な経過であること","家族へ：自宅で過ごす場合の連絡先（訪問看護・在宅医・24 時間の窓口）と，救急要請の前に連絡する相手を決めておくこと","患者・家族へ：介護保険・障害福祉・医療費助成などの窓口と相談先（医療ソーシャルワーカーにつなぐ）","家族へ：家族自身の休息と相談先，看取りのあとの手続きと相談窓口"],"evaluation":{"timing":"症状は毎日（毎勤務），ACP の内容は話し合いのたびと状態の大きな変化のとき，療養場所と家族の状況は週 1 回程度（本人の状態に合わせる）","indicators":["息苦しさ・だるさ・痛みなどが本人の許容できる程度に保たれている時間が増え，急な増悪に速やかに対応できている","本人の理解・希望・避けたいこと・代理決定者が記録され，本人・家族・チームで共有されている（内容の変更も記録されている）","ICD・DNAR・治療の範囲の方針が話し合われ，記録され，勤務者全員が把握している","望む療養場所での生活に必要な調整（訪問看護・在宅医・介護保険・連絡先）が整っている","家族が経過を理解し，気持ちを表せ，休息が取れている．スタッフ間で方針のずれがない"],"revise_if":"症状が本人の耐えられる程度を超える／せん妄・強い不安や抑うつが出た／本人の希望や家族の意向が変わった／ICD の作動が繰り返された／療養場所を変える必要が出た／急な悪化で終末期の徴候が出た"},"cardio_ward_notes":["心不全の経過は『悪化と回復を繰り返しながら下がる』ため，がんと違って終末期の見極めが難しい．『回復するかもしれない』と緩和ケアを先送りせず，増悪入院を繰り返す段階から症状緩和と ACP を治療と並行して始める（hf_palliative_care を参照）","利尿薬・強心薬・酸素・非侵襲的陽圧換気などの心不全治療そのものが症状緩和になることが多い．『治療をやめる』ではなく『苦痛を減らす目的で続ける・調整する』と本人と家族に伝える．減量・中止の判断は医師","ICD のショック機能の停止は本人の意向の確認と医師の指示が前提．停止後もペースメーカ・CRT の機能は続くことが多く，機種と設定は医師・臨床工学技士に確認する．マグネットによる一時的な抑制の手順は施設の規定に従う","終末期でもモニタ・体重測定・水分制限・採血を惰性で続けると本人の負担になる．『結果で方針が変わるか』を医師と確認し，負担になる管理は減らす","オピオイドは呼吸困難の緩和に使われるが，便秘・眠気・吐き気・呼吸抑制の観察が必要．腎機能低下のある患者は蓄積しやすいので用量と種類は医師・薬剤師と確認する","在宅での看取りを希望する場合，強心薬の持続点滴や在宅酸素の管理を訪問看護と分担し，急変時の連絡先と順序（訪問看護・在宅医か救急要請か）を本人の意向と実際の支援体制で決めて家族と確認しておく．方針が未確認のとき・本人や家族の希望が変わったとき・訪問看護や在宅医に連絡がつかないときは救急要請してよいことも共有する"],"sources":[{"name":"厚生労働省 人生の最終段階における医療・ケアの決定プロセスに関するガイドライン（改訂 平成 30 年 3 月）","url":"https://www.mhlw.go.jp/file/06-Seisakujouhou-10800000-Iseikyoku/0000197721.pdf","license":"PDL1.0","note":"本人の意思決定を基本とした多職種チームでの方針決定，繰り返しの話し合いと記録，本人の意思が確認できない場合の推定と最善の判断，という決定プロセスを参照．解説編：https://www.mhlw.go.jp/file/06-Seisakujouhou-10800000-Iseikyoku/0000197722.pdf"},{"name":"厚生労働省 「人生会議」してみませんか（ACP 普及・啓発ページ）","url":"https://www.mhlw.go.jp/stf/newpage_02783.html","license":"PDL1.0","note":"ACP の愛称「人生会議」と普及資材（リーフレット：https://www.mhlw.go.jp/content/10802000/000536088.pdf）．文言は転載せず構造のみ参考"},{"name":"NIA: Advance Care Planning: Advance Directives for Health Care（National Institute on Aging, NIH）","url":"https://www.nia.nih.gov/health/advance-care-planning/advance-care-planning-advance-directives-health-care","license":"米国政府著作物（パブリックドメイン）","note":"話し合いが最も重要であること，代理決定者，DNR，内容は見直してよいこと，認知症のある人への早期の話し合い，を参考（米国の法制度の部分は日本には当てはめない）"},{"name":"NIA: Providing Care and Comfort at the End of Life（National Institute on Aging, NIH）","url":"https://www.nia.nih.gov/health/end-life/providing-care-and-comfort-end-life","license":"米国政府著作物（パブリックドメイン）","note":"身体的な快適さ（呼吸・皮膚・消化器・疲労）・心理面・家族支援の構成を参考"},{"name":"NHLBI Heart Failure – Living With Heart Failure","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"米国政府著作物（パブリックドメイン）","note":"重症心不全での緩和ケア・ホスピスの位置づけ"},{"name":"MedlinePlus: Palliative Care（Health Topic）","url":"https://medlineplus.gov/palliativecare.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Advance Directives（Health Topic）","url":"https://medlineplus.gov/advancedirectives.html","license":"パブリックドメイン","note":""},{"name":"Open RN Nursing Fundamentals 2e, 17.6 Applying the Nursing Process at End of Life（WisTech Open）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/17-6-applying-the-nursing-process-at-end-of-life/","license":"CC BY 4.0","note":"終末期の症状緩和と家族ケアの看護過程．17.2 Basic Concepts（https://wtcs.pressbooks.pub/nursingfundamentals/chapter/17-2-basic-concepts/）も参照"},{"name":"4AT（rapid clinical test for delirium）","url":"https://www.the4at.com/","license":"CC BY 4.0（日本語版あり）","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"stroke_functional","group":"周術期・特殊","problem":"脳卒中後の麻痺・失語・嚥下障害により，セルフケア（食事・移動・排泄・整容・意思の伝達）ができない","problem_plain":"脳梗塞や脳出血のあとに，片側の手足が動かない，言葉が出ない・理解できない，飲み込めない，片側に気づかない，といった障害が残り，食事・トイレ・移動・着替え・薬を飲むことなどを自分でできない状態．当院では心房細動やカテーテル治療・心臓手術のあとに起きる脳梗塞が多く，心臓の管理（抗凝固薬・心不全・デバイス）と並行して，誤嚥性肺炎・転倒・褥瘡・拘縮・うつを防ぎ，リハビリで回復を後押しする．","applies_when":["脳梗塞（心原性塞栓・アテローム血栓性）・脳出血・くも膜下出血のあとで，片麻痺・失語・構音障害・嚥下障害・半側空間無視・視野欠損のいずれかが残っている","カテーテル治療・心臓手術・電気的除細動のあと，または心房細動・弁膜症・感染性心内膜炎の経過中に新しい神経症状が出た","食事・移動・排泄・整容・更衣・服薬に介助が必要（入院前より ADL が低下）","嚥下スクリーニングで異常があり，食形態・とろみ・経管栄養の指示が出ている","言葉で意思を伝えられない，または理解が難しく，ナースコールや訴えが期待できない","麻痺側の肩の痛み・関節の硬さ・むくみ，または褥瘡・転倒・深部静脈血栓の危険が高い","気分の落ち込み・意欲低下・感情の起伏（脳卒中後のうつ・感情失禁）がある","回復期リハビリ病院への転院や自宅退院に向けて，本人・家族の介助方法の習得が必要"],"related_factors":["神経：運動麻痺・感覚障害，失語・構音障害，嚥下障害，半側空間無視，視野欠損，注意・記憶・遂行機能の障害，感情の変化","身体：筋力低下・関節拘縮・肩の亜脱臼と痛み，麻痺側のむくみ，バランス障害，疲れやすさ","循環：心房細動・心不全による活動耐性の低下，抗凝固薬による出血の危険（転倒時），血圧の変動","栄養：嚥下障害による摂取不足・脱水，食形態の制限による食の楽しみの低下","心理：喪失感・怒り・抑うつ・意欲低下，伝わらないもどかしさ，回復の遅さへの焦り","環境・支援：ベッド周りの配置（麻痺側・無視側），ナースコールの操作困難，家族の介護力と介助技術の不足"],"assessment":{"scales":[{"name":"意識レベル（JCS・GCS）と神経所見の経時的な観察（瞳孔・麻痺の程度・言葉・視野）","license":"一般的手技（事実）","note":"急性期は施設の脳卒中プロトコルの間隔で，その後も毎勤務で前回と比較する（ischemic_stroke を参照）"},{"name":"脳卒中の重症度・機能評価尺度（NIHSS，modified Rankin Scale など）","license":"NIHSS は NINDS が開発し無償で公開されているが，アプリ搭載時の表示条件は一次情報を確認する（本調査では未確認）．施設で使用中の版を参照","note":"医師・脳卒中チームの評価を共有する"},{"name":"嚥下スクリーニング（反復唾液嚥下テスト，改訂水飲みテスト，フードテストなど施設の方法）と嚥下造影・内視鏡の結果","license":"一般的手技（事実）．施設の手順で置き換える","note":"スクリーニングが済むまで飲食禁止．言語聴覚士の評価に基づく食形態・とろみ・姿勢の指示を確認する（aspiration_risk を参照）"},{"name":"厚労省 障害高齢者の日常生活自立度・認知症高齢者の日常生活自立度，重症度，医療・看護必要度 B 項目","license":"厚労省サイト（PDL1.0）","note":"ADL の推移と退院・転院の調整に使う共通の区分"},{"name":"ADL 評価尺度（Barthel Index，FIM など）","license":"FIM は要ライセンス．アプリには載せず，リハビリ部門が使用中の版を参照のみ","note":"リハビリの目標設定と回復の評価に使う"}],"assessment_points":["『何ができて何に介助が要るか』を動作ごとに具体化する：寝返り・起き上がり・座位保持・移乗・歩行・食事（利き手の麻痺・口の中の残留）・排泄（尿意の有無・トイレ動作）・更衣・整容・服薬（錠剤を飲み込めるか，PTP シートを扱えるか）","コミュニケーションの評価：理解（はい／いいえの質問・指示に従えるか），表出（発語・書字・指さし・絵カード），本人が使いやすい手段を言語聴覚士と決めて全員が同じ方法を使う","嚥下：むせ・湿性嗄声・食事時間の延長・口腔内の残留・食後の発熱や痰の増加．食前の覚醒度と姿勢が保てるか","麻痺側の状態：肩の痛み・亜脱臼・関節の動く範囲・むくみ・皮膚（褥瘡好発部位），感覚の鈍さ（熱傷・圧迫に気づけない）","心理と背景：気分の落ち込み・意欲・感情の起伏・『死にたい』などの言葉，本人の生活史と役割，家族の介護力と介助技術，退院先の希望（自宅・回復期リハビリ病院・施設）"]},"goals":{"long_term":"誤嚥性肺炎・転倒・褥瘡・拘縮・深部静脈血栓を起こさず，残った機能を生かして安全に食べ・動き・伝えられ，本人と家族が介助方法を身につけて次の療養場所へ移れる","short_term":["嚥下評価後から：指示の食形態・とろみ・姿勢・一口量で食事がとれ，食事中のむせ・食後の発熱や痰の増加がない","毎日：口腔ケアが毎食後（または施設基準の回数）に行われ，口腔内が清潔に保たれている","入院早期から：本人が使えるコミュニケーション手段（はい／いいえ・絵カード・筆談・ジェスチャー）が決まり，ベッドサイドに表示され，訴え（痛み・トイレ・不快）が伝わっている","リハビリ開始後（時期は施設のプロトコルに従う）：麻痺側の肩の痛みと関節可動域の悪化がなく，良肢位と関節運動が病棟でも行われている．リハビリで習得した動作（起き上がり・移乗・歩行）を病棟でも同じ方法で行えている","退院・転院前：本人と家族が食事介助・口腔ケア・移乗・薬の飲ませ方と受診の目安を説明でき，実際に練習している"]},"OP":["神経所見：意識レベル・瞳孔・麻痺の程度・言葉・視野の変化（悪化は再発・出血への転化・脳浮腫のサイン：発見時に速やかに報告し，最後に元気だった時刻と発見時刻を記録する）","嚥下・食事：むせ・咳・湿性嗄声・口腔内の残留・食事時間・摂取量・水分摂取量，食前の覚醒度と姿勢，指示の食形態・とろみが守られているか","呼吸・感染：体温・SpO2・呼吸音・痰の量と色（誤嚥性肺炎の早期発見：食後の発熱・痰の増加）","口腔内：汚れ・乾燥・舌苔・義歯の合い具合・口内炎","麻痺側：肩の痛み・亜脱臼・関節可動域・むくみ・皮膚（圧迫・熱傷に気づけない），良肢位が保たれているか","ADL の実際：寝返り・起き上がり・座位保持・移乗・歩行・排泄・更衣・整容を『どこまで自分で・どこから介助か』で記録し，リハビリの評価と比較","コミュニケーション：理解と表出の程度，決めた手段が使えているか，訴えが伝わらないことによるいらだち・あきらめ","半側空間無視・視野欠損：食事の片側を残す，片側にぶつかる，無視側からの声かけに気づかない","排泄：尿意・便意の有無，失禁，尿閉，便秘（脳卒中後は腸の動きが変わる），排泄パターン","転倒・血栓・褥瘡の危険：バランス，ナースコールを押せるか，麻痺側下肢の腫れ・痛み（深部静脈血栓），仙骨・かかとの皮膚","循環と薬：心電図モニタ（心房細動），血圧（指示範囲），抗凝固薬・抗血小板薬の確実な内服（とろみ・粉砕の可否），出血のサイン","心理：気分の落ち込み・意欲・感情の起伏・睡眠・『死にたい』などの言葉，家族の受け止めと介護への不安"],"TP":["新しい神経症状・急な悪化は本計画のリハビリ対応から切り離し，直ちに院内の脳卒中コール（施設手順）へつなぐ．最後に元気だった時刻・症状が出た時刻・発見した時刻を分けて記録し，血糖を確認し，緊急の画像検査の準備を進める（再灌流治療の判断に必要）．評価が済むまで飲食も内服も止め，薬の扱いは医師に確認する","食事：嚥下評価が済むまで飲食禁止（内服薬も含む．薬の扱いは医師・薬剤師に確認）．評価後は指示の食形態・とろみ・姿勢（座位で麻痺側に注意して体幹を支える．頭をやや前屈して顎を引く姿勢は ST・医師の評価で有効と確認された患者に限る）・一口量・ペースで介助し，食事中は見守る．食後しばらく（施設基準．目安 30 分程度）は座位を保ち逆流と誤嚥を防ぐ．疲労時・覚醒不良時は無理に食べさせず報告する","口腔ケア：毎食後（または施設基準）に歯・舌・粘膜・義歯を清掃し，乾燥には保湿を行う．経口摂取していない患者も同様に行う（肺炎予防の要）","薬：錠剤を飲み込めるか，とろみや簡易懸濁・粉砕の可否（抗凝固薬など粉砕不可の薬に注意）を薬剤師と決め，飲み残しを口腔内で確認する．経管の場合は投与方法を薬剤師と確認する","コミュニケーション：言語聴覚士と本人に合った手段を決め（はい／いいえの質問・短い文・ゆっくり・絵カード・筆談・ジェスチャー・タブレット），ベッドサイドに表示して全員が同じ方法を使う．急かさず，先回りして言い当てず，静かな環境で，本人の視野・非無視側から話しかける","麻痺側の管理：良肢位（枕で肩と腕を支える・手を心臓より下にぶら下げない），移動時に麻痺側の腕を引っ張らない，関節可動域運動（理学療法士・作業療法士の指示に沿って病棟でも実施），むくみには挙上","移乗・歩行：リハビリで決めた方法（介助の位置・つかまる場所・装具・車いすのブレーキ）を病棟でも同じ手順で行い，安静度と介助方法をベッドサイドに表示する．初回は複数で介助し，血圧・脈拍・症状を確認する（fall_risk・activity_intolerance を参照）","環境：ナースコール・ティッシュ・飲み物・ベッド柵を健側（非無視側）に配置し，本人が操作できる呼び出し手段（押しやすいコール・センサー）を決める．無視側からの転落に注意し，訪室時は無視側にも意識を向ける声かけをする","褥瘡・血栓・拘縮の予防：体位変換と除圧（pressure_injury），間欠的空気圧迫・薬物予防・足関節運動は個別指示に従う（急性期脳卒中では弾性ストッキングを標準の選択肢にしない，vte_risk），毎日の関節運動","排泄：排泄パターンに合わせた誘導，トイレ動作の介助方法をリハビリと共有，便秘対策（水分・食物繊維・下剤の指示・離床），尿閉の確認（残尿測定は指示に従う）","リハビリ連携：理学療法士・作業療法士・言語聴覚士と目標（『トイレまで介助歩行』『自分で食べる』など）を共有し，病棟で実践する場面を作る（更衣・整容を自分でする時間を確保）","心理：喪失感・怒り・落ち込みを否定せず聞く．できるようになったことを本人に伝える．うつが疑われるときは医師に報告し，depression_adjustment の計画を併用．『死にたい』などの言葉は速やかに医師・チームで共有する","家族への介助練習：食事介助・口腔ケア・移乗・車いす・薬の飲ませ方・コミュニケーションの方法を退院や転院の前に一緒に練習し，回復期リハビリ病院・施設・訪問看護へ心疾患の管理（抗凝固薬・心不全・デバイス・血圧）を含めて申し送る（discharge_transition を参照）"],"EP":["患者・家族へ：むせない姿勢・食形態・とろみ・一口量を守る理由（誤嚥性肺炎の予防）と，食事中に顔色が変わる・激しくむせるときの対応（食事を止めて知らせる）","患者・家族へ：口腔ケアが肺炎予防の要であること．毎食後の方法（歯・舌・義歯・保湿）","患者・家族へ：発熱・痰の増加・食事量の減少・元気のなさは肺炎のサインであり，早めに知らせる・受診すること","家族へ：失語のある人との話し方（静かな場所で・ゆっくり・短く・はい／いいえで答えられる質問・絵や実物・急かさない・言葉が出なくても理解していることがある）","患者・家族へ：麻痺側の腕を引っ張らない・ぶら下げない（肩の痛みと亜脱臼の予防），良肢位の作り方，関節運動の方法","患者・家族へ：心臓の薬（特に抗凝固薬）は飲み忘れも粉砕も危険な場合があり，飲み方（とろみ・懸濁の可否）を薬剤師と確認して続けること．出血のサインと受診の目安","患者・家族へ：新しい麻痺・ろれつの異常・顔のゆがみ・意識の変化は再発のサインで，すぐ救急要請すること（時間との勝負）","患者・家族へ：回復は月単位で続くこと．リハビリは退院後も続けること．落ち込みが続くときは相談してよいこと（うつは治療できる）．介護保険・訪問リハビリ・通所の利用"],"evaluation":{"timing":"神経所見は施設のプロトコルの間隔と毎勤務．嚥下・食事・口腔は毎食．ADL とコミュニケーションは週 1 回（リハビリカンファレンス）．退院・転院前に総合評価","indicators":["誤嚥性肺炎の徴候（食後の発熱・痰の増加・SpO2 低下）がなく，指示の食形態と姿勢で必要量に近い食事・水分がとれている","口腔ケアが計画どおり実施され，口腔内が清潔","本人の訴え（痛み・トイレ・不快）が決めた手段で伝わり，伝わらないことによる苦痛が減っている","麻痺側の肩の痛み・拘縮・褥瘡・深部静脈血栓・転倒が起きていない．リハビリで習得した動作が病棟でも行えている","抗凝固薬など心臓の薬が確実に飲めている．本人と家族が介助方法と受診の目安を説明できる"],"revise_if":"神経症状が悪化した／食事中のむせ・発熱・痰の増加が出た／食形態や安静度が変わった／肩の痛みや拘縮が出た／転倒・褥瘡・血栓が起きた／気分の落ち込みが強い・『死にたい』という言葉が出た／退院先や介護者が変わった"},"cardio_ward_notes":["当院で脳卒中を合併する患者の多くは心房細動・弁膜症・感染性心内膜炎・カテーテル治療や心臓手術後の患者．抗凝固薬の開始時期と用量（梗塞の大きさ・出血への転化の危険で異なる）は医師の指示を確認し，開始後は出血のサインを重点的に観察する（ischemic_stroke・antithrombotic_management を参照）","嚥下障害があると抗凝固薬・抗不整脈薬・利尿薬など心臓の薬が飲めなくなる．粉砕・懸濁の可否は薬ごとに違うため，薬剤師と剤形（OD 錠・散剤・液剤・経管投与）を早めに決め，飲み残しを確認する","心不全のある患者は，とろみ水や経管栄養の水分量が水分制限と両立するかを医師・管理栄養士と確認する．体重・むくみ・呼吸状態の観察を続ける","血圧管理の目標は病型（脳梗塞・脳出血・くも膜下出血），再灌流治療の前後，動脈瘤処置の状況で異なり，『急性期は高め』という共通原則は置かない．指示された目標範囲と逸脱時の対応を確認し，リハビリ・離床時の血圧変動と麻痺の悪化・ふらつきに注意する","植込みデバイス（ICD・ペースメーカ）のある患者は，麻痺側と植込み側の関係（腕の挙上制限・肩の痛みの評価）と，遠隔モニタリングの継続を転院先に申し送る","回復期リハビリ病院への転院では，心疾患の管理（抗凝固薬・INR 目標・心不全の体重管理・デバイス・運転や運動の制限）を看護要約に必ず含める．心臓側の外来受診の予定も引き継ぐ"],"sources":[{"name":"Open RN Health Alterations, 9.9 Cerebrovascular Accident（WisTech Open）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/9-9-cerebrovascular-accident/","license":"CC BY 4.0","note":"脳卒中の看護過程（アセスメント・合併症・看護介入・患者教育・評価）の体系を参考"},{"name":"Open RN Nursing Fundamentals 2e, 2.3 Communicating With Patients（WisTech Open）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/2-3-communicating-with-patients/","license":"CC BY 4.0","note":"コミュニケーションに障害のある患者への対応"},{"name":"Open RN Nursing Fundamentals 2e, 13.3 Applying the Nursing Process（Mobility）（WisTech Open）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-3-applying-the-nursing-process/","license":"CC BY 4.0","note":"移動・体位・拘縮予防の看護介入"},{"name":"NINDS Stroke – Recovery（National Institute of Neurological Disorders and Stroke, NIH）","url":"https://www.ninds.nih.gov/health-information/stroke/recovery","license":"米国政府著作物（パブリックドメイン）","note":"リハビリの早期開始と反復練習の意義，代償手段，療養場所の選択肢"},{"name":"MedlinePlus: Stroke – discharge（Medical Encyclopedia）","url":"https://medlineplus.gov/ency/patientinstructions/000132.htm","license":"パブリックドメイン","note":"家族向けの介助（関節運動・良肢位・褥瘡予防・失語のある人との話し方・排便管理・服薬）の言い回しを参考"},{"name":"MedlinePlus: Stroke Rehabilitation（Health Topic）","url":"https://medlineplus.gov/strokerehabilitation.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Aphasia（Health Topic）","url":"https://medlineplus.gov/aphasia.html","license":"パブリックドメイン","note":"失語の説明"},{"name":"MedlinePlus: Dysphagia（Swallowing Disorders）（Health T "overview":"たばこは血管を縮め，血を固まりやすくし，動脈硬化を進める．心筋梗塞・狭心症・末梢動脈疾患・大動脈瘤の最大の危険因子の一つで，禁煙は薬に劣らない再発予防になる．入院は禁煙の最大のチャンスで，離脱症状の観察と退院後の支援が要る．","observation":{"symptoms":["離脱症状（いらいら・不安・集中できない・強い喫煙欲求）","離脱による不眠・食欲増加・便秘","咳・痰・息切れ（COPD の合併）","胸痛・足の痛み（喫煙で悪化する虚血）","喫煙の再開の徴候（においや外出の増加）","気分の落ち込み（禁煙後のうつに注意）"],"vitals_physical":["血圧・脈拍（喫煙直後は上がる，離脱期は下がることも）","SpO2・呼吸音（肺の状態）","皮膚・指の色・爪（ヤニ・末梢循環）","口腔・歯の状態","体重（禁煙後の増加）","喫煙歴（本数×年数）・加熱式や電子たばこの使用"],"monitor_tests":["呼気一酸化炭素（CO）濃度（禁煙外来で測定）","ニコチン依存度の質問票（施設・保険の様式に従う）","呼吸機能検査（COPD の合併）","脂質・血糖・血圧（他の危険因子との組み合わせ）","足の血流（末梢動脈疾患の合併）","禁煙補助薬の副作用の確認（吐き気・不眠・皮膚）"],"medication_side_effects":["ニコチンパッチ：皮膚のかぶれ・不眠（夜は外す指示も）","ニコチンパッチ：不安定な心疾患では使用の可否を医師に確認","ニコチンガム：口内の刺激・胃の不快感（噛み方の指導）","バレニクリン：吐き気・不眠・異常な夢・気分の変化","禁煙後は一部の薬（テオフィリン・一部の抗精神病薬）の効き方が変わる","禁煙後のカフェインの効きが強くなる（動悸・不眠）"],"psychosocial":["禁煙への意思の段階（考えていない／考えている／始めた）","過去の禁煙の試みと失敗の理由","ストレス対処としての喫煙（代わりの方法があるか）","家族・職場の喫煙環境（受動喫煙・誘惑）","「もう病気になったから遅い」というあきらめ","禁煙外来・薬の費用への抵抗"]},"red_flags":["入院中の隠れ喫煙（酸素使用中は火災の危険）","喫煙後の胸痛・冷汗（冠攣縮・虚血）","禁煙補助薬使用中の強い抑うつ・自殺念慮","ニコチンパッチ使用中の動悸・胸痛の悪化","禁煙後の急な体重増加＋むくみ（心不全との区別）"],"care":["入院時に喫煙状況を必ず聞き，禁煙の意思を確認する","離脱症状を観察し，つらさを受け止める（責めない）","ニコチン代替療法の可否を医師に確認し，早めに使う","隠れ喫煙の徴候を見つけたら火気の危険を含めて話し合う","禁煙のメリットを心臓病と結びつけて具体的に伝える","喫煙欲求の乗り切り方（深呼吸・水・歩く・ガム）を一緒に考える","禁煙外来・薬剤師・心臓リハと連携して退院後の計画を作る","家族に受動喫煙の影響と家庭内禁煙の協力を依頼","退院後の外来で禁煙の継続を毎回確認する","再喫煙しても再挑戦を支える（失敗は次の材料）"],"education":["禁煙は心筋梗塞の再発を減らす最も効果の大きい方法の一つ","本数を減らすだけでは効果が小さい（完全にやめる）","加熱式たばこ・電子たばこも心臓には安全ではない","離脱症状は 2〜3 週間で軽くなる（薬で楽にできる）","吸いたくなったら 3 分間の対処法（水・深呼吸・場所を変える）","ライター・灰皿を捨て，吸う場所・時間の習慣を変える","禁煙外来は保険で受けられる（条件は施設で確認）","体重が増えても禁煙の利益のほうが大きい","1 本吸ってしまっても全部やめたことにしない（すぐ再開）","家族にも協力を頼む（家の中を禁煙に）"],"long_term_goal_example":"禁煙を継続し，虚血性心疾患・末梢動脈疾患の再発を防げる","short_term_goal_examples":["入院中に喫煙せず，離脱症状に対処できる","退院後の禁煙の計画（薬・外来・対処法）を持っている","禁煙が心臓に与える利益を自分の言葉で言える"],"sources":[{"name":"NHLBI Smoking and Your Heart","url":"https://www.nhlbi.nih.gov/health/heart/smoking","license":"パブリックドメイン"},{"name":"CDC Cigarette Smoking","url":"https://www.cdc.gov/tobacco/about/index.html","license":"パブリックドメイン"},{"name":"CDC How to Quit Smoking","url":"https://www.cdc.gov/tobacco/campaign/tips/quit-smoking/index.html","license":"パブリックドメイン"},{"name":"MedlinePlus Quitting Smoking","url":"https://medlineplus.gov/quittingsmoking.html","license":"パブリックドメイン"},{"name":"MedlinePlus Smoking","url":"https://medlineplus.gov/smoking.html","license":"パブリックドメイン"},{"name":"厚生労働省 たばこと健康に関する情報ページ","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/tobacco/index.html","license":"PDL1.0（厚生労働省）"}],"generated_by":"Claude（要看護師レビュー）","notes":"禁煙補助薬の選択・急性期のニコチン代替療法の可否・禁煙外来の保険適用条件は主治医と施設の運用に従う．依存度の質問票の文言は載せていない．"},{"id":"ischemic_stroke","name":"脳梗塞（心原性塞栓・アテローム血栓性：急性期の観察と再発予防）","aliases":["脳梗塞","心原性脳塞栓症","アテローム血栓性脳梗塞","ラクナ梗塞","急性期脳梗塞"],"category":"脳血管疾患","overview":"脳の血管が詰まって，その先の脳が酸素不足で壊れる病気．心房細動でできた血栓が飛ぶ「心原性」と，動脈硬化で詰まる「アテローム血栓性」が多い．発症から数時間が血栓溶解・血栓回収の勝負で，当院では心房細動・カテーテル後・弁膜症の患者に起きることを常に想定する．","observation":{"symptoms":["顔のゆがみ・片側の手足の力が入らない（F・A）","ろれつが回らない・言葉が出ない・理解できない（S）","片側の視野が欠ける・二重に見える","ふらつき・歩けない・めまい（小脳や脳幹の梗塞）","意識がぼんやりする・急な混乱","発症時刻（最後に元気だった時刻）の聞き取り","心房細動の動悸・胸の違和感が先行していないか","麻痺側の感覚の鈍さ・しびれ"],"vitals_physical":["血圧（急性期は高めを許容．下げすぎに注意，指示値を確認）","脈拍のリズム（不整は心房細動を疑い触診で確認）","SpO2・呼吸パターン（舌根沈下・いびき呼吸）","体温（発熱は脳に悪い．早めに報告）","意識レベル（JCS/GCS）・瞳孔の大きさと左右差","麻痺の程度（バレー徴候・握力の左右差）を時間ごとに比較","血糖（低血糖は脳卒中に似た症状を出す）","嚥下の様子（むせ・声のかすれ・口の中に残る）"],"monitor_tests":["心電図モニタ（心房細動・徐脈・ST 変化を持続で見る）","頭部 CT・MRI（出血の除外・梗塞の広がり）","頸動脈エコー・心エコー（血栓の出どころ探し）","採血（凝固・血糖・腎機能・脂質）","血栓溶解薬（t-PA）後は神経所見と血圧を頻回に記録","血栓回収後：穿刺部（鼠径）と足の血流の確認","水分バランス・尿量（脱水は血液を固まりやすくする）"],"medication_side_effects":["血栓溶解薬：出血（口腔・穿刺部・便・尿・皮膚）","抗凝固薬（DOAC・ワルファリン）：出血・血腫・鼻血","抗血小板薬：あざ・歯ぐきの出血・黒色便","降圧薬：下げすぎで麻痺の悪化・ふらつき","脳保護薬・浮腫の薬：腎機能低下・電解質の乱れ","スタチン：筋肉痛・肝機能の変化"],"psychosocial":["突然の麻痺・失語への強いショック・抑うつ","話せない・伝わらないもどかしさ（イライラ・涙）","家族の動揺と介護への不安","仕事・運転・一人暮らしの継続への不安","心臓の病気に加えて脳も，という二重の負担感"]},"red_flags":["麻痺・意識レベルが悪化（梗塞の拡大・出血への転化・脳浮腫）","激しい頭痛・嘔吐・血圧上昇（出血性梗塞・頭蓋内圧上昇）","けいれん","新しい心房細動・頻脈＋血圧低下","SpO2 低下・食後の発熱・痰の増加（誤嚥性肺炎）","血栓溶解薬後の出 "脳血管疾患","overview":"首の太い動脈（頸動脈）が動脈硬化で細くなり，そこから飛んだかけらで脳梗塞や TIA を起こす病気．冠動脈や下肢の動脈硬化と一緒に見つかることが多く，当院の患者では合併が珍しくない．狭窄が強ければ手術（CEA）かステント（CAS）で治す．","observation":{"symptoms":["片側の手足の脱力・しびれ（TIA・脳梗塞）","片目が急に見えなくなる（一過性黒内障）","ろれつ困難・言葉が出ない","無症状で見つかることも多い（狭心症の精査で発見など）","術後：新しい麻痺・言葉の異常（塞栓・血栓）","術後：声のかすれ・飲み込みにくさ（神経の障害）","術後：強い頭痛・けいれん（過灌流症候群）"],"vitals_physical":["血圧（術後は上限・下限とも厳しく管理，指示値を確認）","脈拍（CAS 後は徐脈・血圧低下が起きやすい）","神経所見（顔・腕・言葉）を術後は短い間隔で記録","CEA 後：首の腫れ・創部の血腫・呼吸のしにくさ","CAS 後：穿刺部（鼠径）の出血・血腫・足の血流","頸部の血管雑音（聴診）","SpO2・呼吸パターン"],"monitor_tests":["頸動脈エコー（狭窄率・プラークの性状）","MRA・CTA（狭窄の位置と脳の血管）","頭部 MRI（無症候性の梗塞）","心電図モニタ（CAS 後の徐脈・不整脈）","採血（脂質・血糖・腎機能・凝固）","冠動脈・下肢動脈の評価結果の確認（全身の動脈硬化）"],"medication_side_effects":["抗血小板薬（CAS 後は 2 剤）：出血・あざ・胃の不快感","スタチン：筋肉痛・肝機能の変化","降圧薬：術後の下げすぎで脳血流低下","CAS 後の徐脈治療薬：動悸・口渇"],"psychosocial":["「首の血管の手術」への恐怖","無症状で手術を勧められた戸惑い","冠動脈・下肢と合わせて複数の治療が続く負担感","脳梗塞になるかもしれない不安"]},"red_flags":["術後の新しい麻痺・失語・意識変化（脳梗塞・出血）","CEA 後の首の腫れ・呼吸困難（血腫による気道圧迫）","術後の激しい頭痛・けいれん（過灌流症候群：血圧上昇を伴う）","CAS 後の徐脈＋血圧低下・失神","穿刺部の出血・拡大する血腫・足の冷感","血圧の指示範囲からの逸脱"],"care":["術後は神経所見（顔・腕・言葉）を決められた間隔で記録","血圧を指示範囲内に保つ（上げすぎは過灌流，下げすぎは梗塞）","CEA 後：首の周囲径・創部・嚥下・声を観察，気道確保の準備","CAS 後：穿刺部の圧迫・安静時間・足背動脈の確認","CAS 後の徐脈・低血圧はモニタで監視し，指示薬を準備","抗血小板薬の確実な投与と出血の観察","頭痛の訴えは血圧とセットで評価し報告","外来：エコーの定期検査日と内服の継続を確認","冠動脈・下肢の治療計画と情報共有（同時期の治療を整理）"],"education":["麻痺・言葉の異常・片目の見えにくさはすぐ救急車","抗血小板薬は自己判断でやめない（歯科・手術前は要相談）","血圧・脂質・血糖の管理と禁煙が狭窄の進行を防ぐ","術後の激しい頭痛は我慢せず連絡（過灌流の可能性）","定期的な頸動脈エコーで再狭窄をチェック","首を強く圧迫・マッサージしない","心臓・足の血管も同じ病気，まとめて管理する"],"long_term_goal_example":"脳梗塞を起こさず，動脈硬化の進行を抑える生活と内服を続けられる","short_term_goal_examples":["術後の神経症状・血腫・過灌流が早期に発見される","血圧が指示範囲内で経過する","本人が抗血小板薬の継続と受診のタイミングを説明できる"],"sources":[{"name":"MedlinePlus Carotid Artery Disease","url":"https://medlineplus.gov/carotidarterydisease.html","license":"パブリックドメイン"},{"name":"NINDS Intracranial Atherosclerotic Disease (ICAD)","url":"https://www.ninds.nih.gov/health-information/disorders/intracranial-atherosclerotic-disease-icad","license":"パブリックドメイン"},{"name":"NINDS Stroke – Prevention","url ，動悸・胸の痛み・息苦しさ・しびれ・死ぬのではという恐怖が突然起き，数分から 30 分ほどで治まる．症状は心筋梗塞や不整脈と本当に区別がつかない．まず心臓を除外し，そのうえで「検査は正常」で終わらせず，不安への対応につなげる．心臓病の患者にも合併する．","observation":{"symptoms":["突然の動悸・胸の痛み・息苦しさ（数分でピーク）","手足のしびれ・震え・冷汗・めまい","「死ぬのでは」「おかしくなりそう」という強い恐怖","発作の頻度・きっかけ・持続時間・場所","発作への不安で外出・運動・一人でいることを避けていないか","不眠・食欲低下・気分の落ち込み（うつの合併）","カフェイン・アルコール・喫煙・薬の使用状況","心臓病の経験（心筋梗塞・ICD 作動）がきっかけになっていないか"],"vitals_physical":["発作中の脈拍・血圧・SpO2・呼吸数（記録して後で比較）","脈のリズム（発作中に不整がないか触診・モニタ）","発作が治まった後のバイタルの戻り方","顔色・冷汗・手足の冷え","過呼吸の有無（呼吸が速く浅い）"],"monitor_tests":["12 誘導心電図（発作中に記録できれば最も価値がある）","トロポニン・採血（甲状腺・貧血・電解質・血糖も）","ホルター心電図・イベントレコーダ（症状と不整脈の照合）","心エコー・運動負荷（医師の指示があれば）","「検査が正常」の結果を本人と一緒に確認する","不安・うつのスクリーニング（当院で使う方法）"],"medication_side_effects":["抗不安薬（ベンゾジアゼピン）：眠気・ふらつき・依存・転倒","抗うつ薬（SSRI）：開始初期の吐き気・不安の一時的増強","抗うつ薬と抗血栓薬の併用：出血リスクの増加","β遮断薬：徐脈・だるさ・喘息の悪化","急な中断による離脱症状（不安・不眠・動悸）"],"psychosocial":["「心臓が悪いはず」と検査結果を信じられない","「気のせい」と言われた傷つき・医療者への不信","発作を恐れて行動範囲が狭まる（生活の質の低下）","家族の理解不足・「大げさ」という反応","精神科・心療内科の受診への抵抗感","仕事・家庭のストレス・過去のつらい出来事"]},"red_flags":["発作中の心電図で不整脈・ST 変化がある（心臓の病気）","労作で出る胸痛・冷汗・失神（心臓を疑う）","発作が長引く・治まらない・SpO2 低下","「死にたい」「消えたい」という言葉（自殺の危険）","アルコール・薬の乱用の疑い","食事・睡眠がとれず日常生活が崩れている"],"care":["発作中はまず心電図・バイタルを取り，心臓の病気を除外","そばにいて落ち着いた声で「今は安全」と伝え，ゆっくり呼吸を促す","症状を否定しない（「気のせい」「大丈夫」で片付けない）","心臓の検査結果を本人と一緒に見て，何が正常かを具体的に説明","「体の反応として症状は本物」であることを説明（心臓が原因ではない）","発作の記録（時間・きっかけ・持続）を本人につけてもらう","カフェイン・アルコール・睡眠不足など誘因を一緒に整理","心療内科・精神科・心理士への紹介を医師と相談し，橋渡しする","心臓病の患者では，病気の理解不足が不安の原因になっていないか確認","家族に病気の性質を説明し，責めない対応を依頼","抗不安薬を使う場合は転倒・眠気に注意"],"education":["発作は苦しいが命に関わるものではないと繰り返し説明","ゆっくりした腹式呼吸（吐く息を長く）を練習しておく","発作中は「必ず治まる」と自分に言い，逃げずにやり過ごす","カフェイン・アルコール・喫煙・睡眠不足を減らす","薬は指示どおり続け，急にやめない（離脱症状）","認知行動療法などで良くなる病気であることを伝える","心臓の症状（労作時の胸痛・失神）が新たに出たら別に受診","家族へ：発作時はそばにいて落ち着いて対応，責めない","相談窓口（心療内科・心理相談）を具体的に案内"],"long_term_goal_example":"発作への恐怖が減り，心臓への不安なく生活範囲を取り戻せる","short_term_goal_examples":["心臓の病気が除外され，本人が検査結果を理解できる","発作時に呼吸法で落ち着くことができる","専門の相談先につながる"],"sources":[{"name":"NIMH Panic Disorder: What You Need to Know","url":"https://www.nimh.nih.gov/health/publicat ）","浮腫・頸静脈の怒張"],"monitor_tests":["心エコー（腫瘍の大きさ・付着部・可動性・弁の閉塞）","心臓 MRI・CT（性状・浸潤の有無）","心電図モニタ（不整脈・術後のブロック）","採血：炎症反応・貧血・血小板（粘液腫で異常が出やすい）","頭部画像（塞栓症状があるとき）","術後：心エコーでの再発フォロー（家族性は特に）","家族歴（若年発症・多発は遺伝性の可能性）"],"medication_side_effects":["抗凝固薬（心房細動合併時）：出血","利尿薬：脱水・電解質異常","術後の鎮痛薬：眠気・便秘","抗菌薬（感染性心内膜炎との鑑別中）：下痢・腎機能","化学療法（悪性の場合）：骨髄抑制・吐き気"],"psychosocial":["「心臓に腫瘍」＝がんと受け止める強い不安","手術までの待機期間の恐怖（いつ塞栓が起きるか）","遺伝性が疑われる場合の家族への影響","悪性・転移の場合は予後と治療選択の葛藤","術後の再発フォローを続ける負担"]},"red_flags":["急な麻痺・失語・意識障害（脳塞栓）","体位変換で失神・血圧低下（弁の閉塞）","急な息切れ・起坐呼吸・SpO2 低下（急性肺水腫）","四肢の急な冷感・痛み・脈の消失（末梢塞栓）","術後の血圧低下＋頸静脈怒張（心タンポナーデ）","術後の新しい房室ブロック"],"care":["手術までは急な体位変換を避け，症状が出る体位を把握する","塞栓症の徴候を「顔・腕・言葉」でラウンドごとに見る","失神リスクに備えて転倒予防と離床時の付き添い","点滴ラインの気泡や血栓を避け，右心系腫瘍では特に注意","術後は開心術後の共通管理（創・ドレーン・リズム）を行う","術後の心電図モニタで房室ブロック・心房細動を見る","病理結果の説明の場に同席し，理解と気持ちを確かめる","家族性の疑いがあれば遺伝相談の窓口を案内する","再発フォローの心エコー予定を退院時に確認する","悪性の場合は腫瘍科・緩和ケアと連携する"],"education":["麻痺・言葉の出にくさ・視野の異常は救急車を呼ぶ","急に立ち上がる・体をひねる動作で気分が悪くなったら伝える","手術までは無理な運動を避ける","術後は定期的な心エコーで再発を確認する","家族に同じ病気の人がいれば主治医に伝える","術後の創と胸骨の注意は開心術後と同じ","微熱や倦怠感が続くときは受診する"],"long_term_goal_example":"塞栓症を起こさず手術を受け，再発の有無を定期的に確認しながら生活できる","short_term_goal_examples":["手術までに塞栓症・失神を起こさず過ごせる","塞栓症の症状と受診の目安を本人と家族が言える","術後合併症なく退院し，再発フォローの予定を理解できる"],"sources":[{"name":"MedlinePlus Genetics Carney complex（心臓粘液腫の記載）","url":"https://medlineplus.gov/genetics/condition/carney-complex/","license":"パブリックドメイン"},{"name":"NHLBI Heart Tests","url":"https://www.nhlbi.nih.gov/health/heart-tests","license":"パブリックドメイン"},{"name":"NHLBI Heart Surgery","url":"https://www.nhlbi.nih.gov/health/heart-surgery","license":"パブリックドメイン"},{"name":"NHLBI Heart Surgery – Recovery","url":"https://www.nhlbi.nih.gov/health/heart-surgery/recovery","license":"パブリックドメイン"}],"generated_by":"Claude（要看護師レビュー）","notes":"NCI の心臓腫瘍ページは取得できなかったため出典に含めていない．心臓腫瘍そのものの疫学・分類は Claude の知識による．術後管理は post_cardiac_surgery_common を併用．"},{"id":"takayasu_kawasaki_sequelae","name":"高安動脈炎・川崎病後遺症（若年〜成人の血管炎）","aliases":["高安病","大動脈炎症候群","川崎病冠動脈後遺症","冠動脈瘤（川崎病後）","血管炎"],"category":"特殊な心疾患・その他","overview":"血管の壁に炎症が起きる病気．高安動脈炎は若い女性に多く，大動脈やその枝が細くなって脈が触れにくくなる．川崎病は小児期の病気だが，冠動脈瘤が残った人は成人になっても心筋梗塞の危険があり，循環器で長く診る．","observation":{"symptoms":["発熱・倦怠感・体重減少（炎症の活動期）","腕のだるさ・冷え・しびれ（腕の血管の狭窄）","めまい・失神・視力の変化（頸動脈の狭窄）","胸痛・息切れ（冠動脈病変・大動脈弁逆流）","川崎病後：労作時の胸痛・動悸（冠動脈瘤の血栓）","頭痛・首の痛み（血管の炎症）","ステロイド中の不眠・気分の変化"],"vitals_physical":["血圧は左右の腕と足で測る（左右差・上下肢差）","脈拍は両側の橈骨・頸動脈・足背で触れる（脈なし病）","血管雑音（頸部・鎖骨下・腹部）","体温・SpO2（測る腕は脈の触れる側で）","浮腫・心雑音（大動脈弁逆流）","皮膚（結節性紅斑）・関節の腫れ"],"monitor_tests":["採血：炎症反応（CRP・赤沈）・貧血・腎機能","画像：造影 CT・MRI・エコー（狭窄・瘤・壁肥厚）","川崎病後：冠動脈エコー・CT・負荷検査・冠動脈造影","心電図（虚血・不整脈），心エコー（弁逆流・心機能）","ステロイド・免疫抑制薬中：血糖・肝機能・血算・感染","眼科（高安病の眼合併症）","高血圧（腎動脈狭窄）の家庭血圧"],"medication_side_effects":["ステロイド：高血糖・感染・骨粗鬆症・胃潰瘍・満月様顔貌","免疫抑制薬・生物学的製剤：感染・骨髄抑制・注射部反応","抗血小板薬・抗凝固薬（冠動脈瘤）：出血","降圧薬：ふらつき・腎機能の変化","β遮断薬・硝酸薬（虚血）：徐脈・頭痛"],"psychosocial":["若い女性が多く，妊娠・出産・外見（ステロイド）の悩み","「子どものときの病気」と思って通院をやめている（川崎病後）","指定難病の申請・医療費・就労の不安","感染を恐れて生活が縮む","小児科から成人診療科への移行期の戸惑い","長期の通院と検査の負担"]},"red_flags":["胸痛＋ST 変化（冠動脈瘤の血栓・冠動脈狭窄）","急な麻痺・失語・視力消失（頸動脈病変）","急な激しい胸背部痛（大動脈の解離・瘤の破裂）","発熱＋炎症反応の急上昇（再燃・感染の区別）","急な息切れ・起坐呼吸（大動脈弁逆流の悪化・心不全）","ステロイド中の高熱・意識の変化（重症感染）"],"care":["血圧・脈は「触れる側」「左右差」を記録し，測定部位を統一する","血圧計のカフを狭窄側に巻かない（値が低く出る）","炎症の活動期は安静と発熱・疼痛のケア","ステロイド・免疫抑制薬中は感染予防と血糖・血圧の観察","川崎病後：抗血小板薬の継続と虚血症状の観察を徹底する","胸痛時は心電図と医師への報告を最優先する","小児科からの移行では，病歴（冠動脈瘤の大きさ）を引き継ぐ","妊娠希望があれば早めに主治医と計画を立てる","指定難病・小児慢性特定疾病の制度を案内する","骨粗鬆症予防と転倒予防を組み合わせる"],"education":["血圧は「脈の触れる腕」で測る（家庭血圧の腕を決める）","ステロイドは自己判断でやめない・減らさない","発熱・強いだるさは再燃か感染，早めに受診する","胸痛・麻痺・視力の異常は救急車を呼ぶ","川崎病後は症状がなくても通院と抗血小板薬を続ける","妊娠を考えるときは事前に相談する（薬の調整）","感染予防（手洗い・ワクチン：主治医と相談）","新しい医療機関では「血管炎・冠動脈瘤」の既往を伝える"],"long_term_goal_example":"炎症を抑えて血管の病変を進めず，虚血や脳血管の合併症なく生活できる","short_term_goal_examples":["正しい部位で血圧・脈を測り，左右差を記録できる","ステロイドの副作用と受診の目安を説明できる","胸痛・神経症状の受診行動を本人と家族が言える"],"sources":[{"name":"NHLBI Vasculitis","url":"https://www.nhlbi.nih.gov/health/vasculitis","license":"パブリックドメイン"},{"name":"NHLBI Vasculitis – Symptoms","url":"https://www.nhlbi.nih.gov/health/vasculitis/symptoms","license":"パブリックドメイン"
