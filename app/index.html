<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看護計画レビュー</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#f4f5f6; --surface:#ffffff; --surface-2:#f9fafb; --line:#e6e8eb; --line-2:#d9dde2;
  --text:#1f2733; --text-2:#5b6470; --text-3:#8a929d;
  --accent:#0f766e; --accent-ink:#0b5a54; --accent-soft:#e6f3f1; --accent-line:#b9dbd6;
  --red:#b42323; --red-soft:#fbeeed; --red-line:#f0c6c2;
  --amber:#a15c07; --amber-soft:#fbf3e2; --amber-line:#efd6a0;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  --radius:12px; --radius-s:8px;
  --sidebar:300px; --topbar:56px;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1214; --surface:#171b1f; --surface-2:#1d2226; --line:#262c32; --line-2:#323a41;
  --text:#e6e9ec; --text-2:#a4adb7; --text-3:#727c87;
  --accent:#3fb8a9; --accent-ink:#7fd6cb; --accent-soft:#16302d; --accent-line:#245c55;
  --red:#f07b73; --red-soft:#33201f; --red-line:#5a2e2b;
  --amber:#e0a94a; --amber-soft:#332a18; --amber-line:#5c4a22;
  --on-accent:#0b1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1214; --surface:#171b1f; --surface-2:#1d2226; --line:#262c32; --line-2:#323a41;
    --text:#e6e9ec; --text-2:#a4adb7; --text-3:#727c87;
    --accent:#3fb8a9; --accent-ink:#7fd6cb; --accent-soft:#16302d; --accent-line:#245c55;
    --red:#f07b73; --red-soft:#33201f; --red-line:#5a2e2b;
    --amber:#e0a94a; --amber-soft:#332a18; --amber-line:#5c4a22;
    --on-accent:#0b1f1d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14.5px;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 0}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35}
ul,ol{margin:0;padding:0;list-style:none}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ============ layout ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand small{font-weight:500;color:var(--text-3);font-size:12px}
.grow{flex:1}
.reviewer{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.reviewer input{width:150px;padding:6px 10px;border:1px solid var(--line-2);border-radius:var(--radius-s);background:var(--surface-2);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.reviewer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.reviewer input.warn{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn svg{width:15px;height:15px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-s);color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.menu-btn{display:none}

.layout{display:flex;padding-top:var(--topbar);min-height:100%}
.sidebar{position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.side-top{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text-2);transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08);font-weight:600}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none}
.search input{width:100%;padding:8px 30px 8px 32px;border:1px solid var(--line-2);border-radius:var(--radius-s);background:var(--surface-2);outline:none;font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 11px/1 var(--font);color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;padding:3px 5px;background:var(--surface)}
.search input:focus~kbd{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;color:var(--text-2);background:var(--surface);transition:all .15s}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.chip.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.chip.off{opacity:.55}
.chip .n{color:var(--text-3);font-size:11px}
.tree{flex:1;overflow:auto;padding:8px 8px 24px}
.tree-dash{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-s);font-weight:600;font-size:13.5px;color:var(--text-2)}
.tree-dash svg{width:16px;height:16px}
.tree-dash:hover,.tree-dash.on{background:var(--surface-2);color:var(--text)}
.tree-dash.on{color:var(--accent-ink)}
.group{margin-top:4px}
.group-h{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;color:var(--text-2);text-align:left}
.group-h:hover{background:var(--surface-2)}
.group-h .chev{width:14px;height:14px;transition:transform .15s;color:var(--text-3)}
.group.open .group-h .chev{transform:rotate(90deg)}
.group-h .cnt{margin-left:auto;font-size:11px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px}
.group-body{display:none;padding-left:6px}
.group.open .group-body{display:block}
.tree-item{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-radius:var(--radius-s);font-size:13.5px;color:var(--text);position:relative}
.tree-item:hover{background:var(--surface-2);text-decoration:none}
.tree-item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tree-item .st{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-2)}
.tree-item .st.ok{background:var(--accent)}
.tree-item .st.fix{background:var(--amber)}
.tree-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .pg{font-size:11px;color:var(--text-3)}
.tree-item .snip{display:block;font-size:11.5px;color:var(--text-3);font-weight:400;white-space:normal;line-height:1.4;margin-top:2px}
.tree-item .snip mark{background:var(--amber-soft);color:inherit;border-radius:2px;padding:0 1px}
.tree-empty{padding:20px 12px;color:var(--text-3);font-size:13px;text-align:center}
.tree-sect{padding:12px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}

.main{flex:1;margin-left:var(--sidebar);padding:28px 36px 80px;min-width:0}
.container{max-width:920px;margin:0 auto}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,18,20,.45);z-index:19}

/* ============ dashboard ============ */
.page-title{font-size:24px;letter-spacing:-.01em;margin-bottom:6px}
.lead{color:var(--text-2);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .k{font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.02em}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.stat .v small{font-size:13px;font-weight:500;color:var(--text-3);margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:500;color:var(--text-3);font-size:12.5px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:8px 0 10px}
.bar i{display:block;height:100%}
.bar .ok{background:var(--accent)}
.bar .fix{background:var(--amber)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.legend .dot.ok{background:var(--accent)}
.legend .dot.fix{background:var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.recent{display:flex;flex-direction:column;gap:2px}
.recent a{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:0 -10px;border-radius:var(--radius-s);color:var(--text)}
.recent a:hover{background:var(--surface-2);text-decoration:none}
.recent .t{font-size:12px;color:var(--text-3);margin-left:auto;white-space:nowrap}
.recent .k{font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.notice{border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:var(--radius-s);padding:12px 16px;font-size:13.5px;color:var(--text)}
.notice ul{list-style:disc;padding-left:18px;margin-top:4px}
.notice li{margin:2px 0}
.empty{color:var(--text-3);font-size:13px;padding:10px 0}

/* ============ entity card ============ */
.head{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px}
.head .l{flex:1;min-width:0}
.crumbs{font-size:12.5px;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.crumbs .sep{opacity:.6}
.title{font-size:26px;letter-spacing:-.01em}
.aliases{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--text-3)}
.aliases span{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--text-2)}
.head .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:200px}
.prog{font-size:12.5px;color:var(--text-2);text-align:right}
.prog b{font-weight:600;color:var(--text)}
.prog .mini{height:6px;width:200px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;margin-top:5px}
.prog .mini i{display:block;height:100%}
.prog .mini .ok{background:var(--accent)}
.prog .mini .fix{background:var(--amber)}
.head-actions{display:flex;gap:6px}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px;margin-bottom:18px;box-shadow:var(--shadow)}
.overview .row{border:0}
.overview .row-text{font-size:15px;line-height:1.7}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--topbar);background:var(--bg);z-index:5;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab .n{font-size:11px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 6px;line-height:16px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.tab.on .n{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tab.red.on{color:var(--red);border-bottom-color:var(--red)}
.panel{display:none}
.panel.on{display:block}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px 8px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.sec-h h3{font-size:15px}
.sec-h .n{font-size:12px;color:var(--text-3);font-weight:500}
.sec-h .hint{font-size:12px;color:var(--text-3);margin-left:auto;font-weight:400}
.sec.red{border-color:var(--red-line);background:var(--red-soft)}
.sec.red .sec-h h3{color:var(--red);display:flex;align-items:center;gap:7px}
.sec.red .sec-h h3 svg{width:16px;height:16px}
.sec.red .row{border-top-color:var(--red-line)}
.sec.red .row-idx{color:var(--red);opacity:.7}
.sec.plain{padding:14px 18px}
.sec p{margin:0}
.sub-h{font-size:12.5px;font-weight:600;color:var(--text-3);letter-spacing:.03em;margin:12px 0 2px}
.sub-h:first-child{margin-top:0}

/* rows */
.rows{display:block}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line);position:relative}
.rows>.row:first-child,.rows>.row:first-of-type{border-top:0}
.row-idx{flex:none;width:22px;font-size:11.5px;color:var(--text-3);text-align:right;padding-top:4px;font-variant-numeric:tabular-nums}
.row-body{flex:1;min-width:0}
.row-text{line-height:1.65;word-break:break-word}
.row-text .lbl{display:inline-block;font-size:11.5px;font-weight:600;color:var(--text-3);margin-right:6px;vertical-align:1px}
.row-actions{flex:none;display:flex;gap:2px;opacity:.35;transition:opacity .15s;padding-top:2px}
.row:hover .row-actions,.row:focus-within .row-actions,.row[data-status] .row-actions{opacity:1}
.ract{font-size:11.5px;padding:3px 7px;border-radius:6px;border:1px solid transparent;color:var(--text-2);font-weight:500;line-height:1.3}
.ract:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.row[data-status="ok"] .ract.ok{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.row[data-status="fix"] .ract.fix{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.row[data-status="drop"] .ract.drop{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.row[data-status="drop"] .row-text{text-decoration:line-through;color:var(--text-3)}
.row[data-status]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--line-2)}
.row[data-status="ok"]::before{background:var(--accent)}
.row[data-status="fix"]::before{background:var(--amber)}
.row-note{margin-top:5px;font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.row[data-status="fix"] .row-note{border-color:var(--amber-line);background:var(--amber-soft)}
.row-note .who{font-size:11.5px;color:var(--text-3)}
.row-note .prop{color:var(--text)}
.row-note .prop b,.row-note .cmt b{font-weight:600;color:var(--text-3);margin-right:4px;font-size:11.5px}
.editor{margin-top:8px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius-s);padding:10px 12px}
.editor label{display:block;font-size:12px;font-weight:600;color:var(--text-3);margin:6px 0 3px}
.editor label:first-child{margin-top:0}
.editor textarea{width:100%;min-height:52px;padding:7px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);resize:vertical;outline:none;font-size:13.5px;line-height:1.55}
.editor textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.editor .acts{display:flex;gap:6px;margin-top:8px;align-items:center}
.editor .acts .del{margin-left:auto;color:var(--text-3);font-size:12px}
.editor .acts .del:hover{color:var(--red)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td.nm{font-weight:600;min-width:180px}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr[data-status="ok"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl td.lic{min-width:150px;max-width:260px}
.tbl td.act{width:1%}
.tbl tr[data-status="fix"] td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.tbl tr[data-status="drop"] td{color:var(--text-3);text-decoration:line-through}
.tbl tr[data-status] .row-actions{opacity:1}
.tbl .row-actions{opacity:.35;justify-content:flex-end}
.tbl tr:hover .row-actions{opacity:1}
.tbl .row-note{margin-top:6px}
.tbl .editor-tr td{border-top:0;padding-top:0}
.tbl .lic{font-size:12.5px;color:var(--text-2)}
.tbl-wrap{overflow-x:auto}

/* badges */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:5px;padding:1px 6px;line-height:16px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2);vertical-align:middle;white-space:nowrap}
.badge.green{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.badge.amber{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.src{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src .b{flex:1;min-width:0}
.src .u{font-size:12px;color:var(--text-3);word-break:break-all}
.src .n{font-size:12.5px;color:var(--text-2)}
.gen{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

/* plan view */
.jump{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;position:sticky;top:var(--topbar);background:var(--bg);z-index:5;padding:6px 0;border-bottom:1px solid var(--line)}
.jump a{font-size:12.5px;color:var(--text-2);padding:4px 10px;border-radius:999px;border:1px solid transparent}
.jump a:hover{background:var(--surface);border-color:var(--line-2);text-decoration:none;color:var(--text)}
.sec.anchor{scroll-margin-top:calc(var(--topbar) + 60px)}
.goal-long{font-size:15px;font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--text-3);font-weight:600;font-size:12.5px;padding-top:9px}
.kv dd{margin:0}

/* toast / modal */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;box-shadow:var(--shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:0;border-radius:var(--radius);background:var(--surface);color:var(--text);padding:0;width:min(720px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,18,20,.45)}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:16px 18px}
.dlg-b p{margin:0 0 10px;color:var(--text-2);font-size:13.5px}
.dlg-b textarea{width:100%;height:50vh;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line-2);border-radius:var(--radius-s);background:var(--surface-2);resize:vertical}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.kbd-hint{font-size:12px;color:var(--text-3);margin-top:16px}
kbd.k{font:600 11px/1 var(--font);border:1px solid var(--line-2);border-radius:4px;padding:2px 5px;background:var(--surface-2)}

/* ============ responsive ============ */
@media (max-width:900px){
  .menu-btn{display:inline-flex}
  .sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:none;width:min(320px,86vw)}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .overlay.show{display:block}
  .main{margin-left:0;padding:20px 16px 60px}
  .reviewer span{display:none}
  .reviewer input{width:110px}
  .topbar .btn .t{display:none}
  .topbar .btn{padding:6px 8px}
  .head{flex-direction:column;gap:12px}
  .head .r{align-items:flex-start}
  .two{grid-template-columns:1fr}
  .row-actions{opacity:1}
  .row[data-status]::before{left:-6px}
  .title{font-size:22px}
}

/* ============ print ============ */
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--line:#d0d4d9;--text:#111;--text-2:#444;--text-3:#666;--shadow:none}
  html,body{background:#fff;font-size:11.5pt}
  .topbar,.sidebar,.overlay,.toast,dialog,.row-actions,.head-actions,.editor,.tabs .n,.jump,.kbd-hint{display:none!important}
  .layout{padding-top:0}
  .main{margin:0;padding:0}
  .container{max-width:none}
  .tabs{position:static;border-bottom:0;margin:0;padding:0;display:none}
  .panel{display:block!important;break-inside:auto}
  .panel::before{content:attr(data-label);display:block;font-size:13pt;font-weight:700;margin:14pt 0 6pt;border-bottom:1.5pt solid #111;padding-bottom:3pt;break-after:avoid;page-break-after:avoid}
  .sec{break-inside:avoid;box-shadow:none;border-color:#d0d4d9;page-break-inside:avoid}
  .sec.red{background:#fff;border:1.5pt solid #b42323}
  .row{padding:4pt 2px}
  .row[data-status]::before{left:-8px}
  .row-note{background:#f5f5f5;border-color:#ccc}
  .head{margin-bottom:10pt}
  .prog .mini{display:none}
  .overview{box-shadow:none}
  a{color:inherit}
  .src .u{font-size:9pt}
}
</style>

GN-R の版で評価）と別部位の予防を並行する．状態が変わったとき（安静度の変更，発熱，食事量低下，むくみの増加）に再評価．転棟・退院時は皮膚の状態を引き継ぐ","好発部位を毎日見る：仙骨部（おしりの上の骨），かかと，大転子（腰の横の骨），肩甲骨，後頭部，くるぶし","医療機器の当たる部位も見る：酸素マスク・カニューラの耳と鼻，SpO2 プローブ，弾性ストッキングの縁，尿道カテーテル，点滴ルート","赤みを見つけたら指で押して白くなるか確認（白くならない赤みは褥瘡の始まり）．赤みだけでなく，暗赤色・紫色，熱感や冷感，硬さや軟らかさの変化，痛みも深部の損傷のサイン．失禁による皮膚炎・皮膚裂傷・内出血（抗凝固薬）と区別する"]},"goals":{"long_term":"入院中，褥瘡をつくらない（退院時に皮膚トラブルがない）","short_term":["1 週間以内：好発部位に持続する赤みがない","1 週間以内：2〜3 時間ごとの体位変換または自力での除圧ができている","1 週間以内：皮膚が清潔で乾いた状態が保てている","入院時に栄養リスクを確認し，摂取不足が続く・見込まれる時点で管理栄養士に相談している（必要量は管理栄養士・医師が算定．「配膳の 7 割」ではなく必要エネルギー・たんぱく質に対して評価．心不全・腎機能に応じた塩分・水分制限と両立させる）"]},"OP":["皮膚の状態：好発部位と機器の当たる部位の赤み・水ぶくれ・ただれ・痛み（毎日，体位変換時）","赤みを押して白くなるか（消えない赤みは要注意）","体位変換の回数と実際の姿勢（同じ向きで固まっていないか）","自力で動けるか：寝返り・座り直し・立ち上がりの程度","湿り気：失禁の有無と回数，発汗，オムツ内の状態","栄養：食事摂取量（必要量に対する割合），体重（心不全では除水による減少と区別），血液データ（アルブミンは炎症の影響を受けるので単独で判断しない），嚥下・口腔の状態，絶食の有無．水分状態は出納・うっ血所見・腎機能と合わせて見る（口の渇き・尿量減少は薬や低心拍出でも起こる）","むくみの程度と部位（すねを押してへこみが残るか）","循環：血圧，末梢の冷感・色，血管作動薬（昇圧薬）の使用","痛み・しびれの訴え，鎮静の深さ，意識レベル（痛みに気づけるか）","マットレスの種類が状態に合っているか，シーツのしわ・食べこぼし"],"TP":["体位変換：間隔は皮膚の反応・自力体動・呼吸循環・マットレス・睡眠を見て個別に決める（一般的な目安は 2〜3 時間ごと，施設基準に従う）．30 度側臥位で骨の出っ張りに体重を集中させない．実施後の皮膚と本人の耐えられ具合で見直す","背上げは呼吸状態（起坐呼吸）・誤嚥予防・処置上の指示を優先し，その範囲でできるだけ低く（褥瘡予防上の目安は 30 度以下）．上げるときは膝を先に上げてずり落ちを防ぎ，背上げ後は背抜き（体を一度浮かせてずれを解放）をする","体圧分散マットレス（エアマットなど）をリスクに応じて選ぶ．かかとは浮かせる（クッションで下腿を支える）","移動・体位変換のときは引きずらず，スライディングシートや 2 人介助で持ち上げる","皮膚を清潔に保ち，濡れたままにしない：失禁後はすぐ洗浄し，こすらず押さえ拭き．乾燥肌には保湿剤，湿潤部には撥水クリームで皮膚を守る","オムツやパッドは吸収力のあるものを使い，重ね敷きしない．シーツのしわを伸ばす","医療機器の固定を毎日見直す：カニューラの耳あて，マスクの当たり，プローブの位置を変える","栄養：食事の形態・好みを調整し，摂取量が少なければ栄養士に相談．必要なら補助食品や経腸栄養を医師と検討","むくみのある部位は圧迫を避け，可能なら挙上","赤みや変色を見つけたら：まずその部位に体重をかけない体位にし（揉まない），圧迫の原因を確認してから医師・皮膚排泄ケア認定看護師に報告．被覆材は除圧と原因評価のあとに検討","座位が長い患者にはクッションを使い，こまめに除圧する（前かがみ・左右への重心移動・介助での座り直しなど．上肢で持ち上げるプッシュアップは術後や上肢制限のある患者には促さない）"],"EP":["患者へ：同じ姿勢を続けると皮膚が傷むこと，寝返りや座り直しを自分でできる範囲でしてほしいこと","患者へ：おしりやかかとに痛み・違和感があれば教えてほしい（我慢しない）","患者・家族へ：食事をしっかり取ることが皮膚を守ること，食べにくいときは相談してほしい","家族へ：面会時に見つけた赤みや，患者の姿勢がずっと同じことに気づいたら看護師に伝えてほしい","家族へ：退院後も続く場合は，体位変換の方法，マットレスのレンタル，皮膚の見方を退院前に一緒に練習する","患者へ：オムツを使っている場合は，汚れたら遠慮なく知らせてほしいこと"],"evaluation":{"timing":"1 週間ごと，および状態が変わったとき（安静度変更・発熱・食事量低下・浮腫増加）","indicators":["好発部位に消えない赤み・水ぶくれ・ただれがない","計画した体位変換が実施できている（記録で確認）","皮膚が清潔・乾燥している時間が保てている","必要量に対する摂取量が確保され，浮腫を考慮した体重・筋肉量が維持または改善（アルブミン単独では判断しない）"],"revise_if":"赤みが出た／安静度が変わった／栄養状態が悪化した／機器が増えた"},"cardio_ward_notes":["心不全の急性期は安静＋むくみ＋低灌流が重なり，短期間で褥瘡ができやすい．利尿が進んで体重が落ちる時期は骨の出っ張りが目立ってくるので再評価","カテーテル後の穿刺部の安静は穿刺部位（橈骨・大腿）・止血法・出血状況で時間が異なる．大腿穿刺で臥床が続くと仙骨部の圧迫が続くため，安静中も安全にできる範囲（小さな体のずらし）で皮膚・穿刺部・末梢循環を確認し，解除後にも必ず皮膚を見る","IABP・ECMO・人工呼吸中は体位変換に制限があるため，小さな体位のずらし（スモールシフト）と機器部位の観察を増やす","抗凝固薬を使っている患者は皮膚の内出血・血腫ができやすく，赤みとの区別に注意"],"sources":[{"name":"厚生労働省 褥瘡対策に関する診療計画書（令和 8 年度 基本診療料の施設基準等 通知 保医発0305第7号 別紙 3，p.306-307）","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0（CC BY 4.0 互換）","note":"参考様式．危険因子評価の項目を利用"},{"name":"Open RN Nursing Fundamentals 2e, Ch.10 Integumentary（10.4 Pressure Injuries，10.6 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/","license":"CC BY 4.0（10.5 の Braden 表は Fair Use 扱いで対象外）","note":"予防ケアの体系を参考"},{"name":"AHRQ Preventing Pressure Ulcers in Hospitals: A Toolkit for Improving Quality of Care","url":"https://www.ahrq.gov/patient-safety/settings/hospital/resource/pressureulcer/tool/index.html","license":"米国政府著作物（パブリックドメイン）","note":"予防バンドル（皮膚評価・体圧分散・湿潤管理・栄養・体位変換）の構成を参考"},{"name":"MedlinePlus: Pressure sores（Health Topic）","url":"https://medlineplus.gov/pressuresores.html","license":"パブリックドメイン","note":"患者向け説明の言い回しを参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"fall_risk","group":"安全・リスク","problem":"転倒・転落のリスクがある","problem_plain":"ベッドやトイレへの移動，夜間の歩行などで転んだり，ベッドから落ちたりする危険があること．入院中は環境が変わり，薬や点滴ルートの影響で普段より転びやすい．","applies_when":["過去 1 年以内に転倒したことがある","歩行が不安定，杖・歩行器を使う，立ち上がりに時間がかかる","ふらつきを起こす薬を使っている：利尿薬，降圧薬，睡眠薬，抗不安薬，オピオイド，抗不整脈薬","夜間にトイレへ行く回数が多い（利尿薬の効く時間帯）","認知機能の低下，せん妄，見当識障害がある","視力・聴力の低下，点滴ルート・ドレーン・酸素チューブがある","起立性低血圧（立ち上がると血圧が下がる），不整脈，失神の既往"],"related_factors":["身体：筋力低下，バランス障害，麻痺，しびれ，視力低下","循環：起立性低血圧，徐脈・頻脈，脱水（利尿薬），失神","薬剤：睡眠薬・抗不安薬・利尿薬・降圧薬・オピオイド・血糖降下薬","認知・意識：せん妄，認知症，鎮静，夜間の見当識障害","環境：慣れない病室，暗い廊下，濡れた床，ベッドの高さ，履物，ルート類","行動：ナースコールを押さずに自分で動く，「迷惑をかけたくない」心理，急いでトイレへ行く"],"assessment":{"scales":[{"name":"転倒・転落アセスメントシート（施設独自：既往・年齢・活動・認知・薬剤・排泄・環境の項目で点数化）","license":"施設の様式を使う","note":"多くの病院が独自様式を持つ．豊橋ハートセンターの様式をそのまま使うのが早い"},{"name":"Morse Fall Scale（転倒歴・副診断・歩行補助具・点滴・歩き方・精神状態の 6 項目）","license":"判定 3：無償だが著者の許可が必要（\"free of charge but permission from the author is required\"）．AHRQ ツールキットでも Competency Request Form の提出が条件","note":"世界的に使われる簡便スケール．採用するなら許可申請"},{"name":"厚労省・重症度，医療・看護必要度 B 項目（寝返り，移乗，口腔清潔，食事摂取，衣服の着脱，診療・療養上の指示が通じる，危険行動）","license":"厚労省サイト（PDL1.0）","note":"転倒専用の尺度ではなく参考情報．評価の頻度は入院料・年度で異なる．転倒歴・薬剤・排泄・循環は別途評価する"},{"name":"起立性低血圧の確認（臥位で 5 分安静後 → 立位 1 分・3 分の血圧・脈拍・症状）","license":"一般的手技（事実）","note":"安全に立てる患者に行う．収縮期 20 mmHg 以上または拡張期 10 mmHg 以上の低下で陽性．症状（めまい・目の前が暗い）が出れば数値にかかわらず中止して座らせる"}],"assessment_points":["入院時に全員評価し，安静度の変更・薬の変更・夜間の様子で再評価","『どんなときに転びそうか』を具体的にする：夜間トイレ，起き上がり直後，点滴を持って歩くとき，シャワー後","患者本人の認識を聞く：自分は大丈夫と思っているか，ナースコールを押す気があるか","利尿薬の投与時刻と排尿パターン（何時ごろトイレに行くか）を把握する"]},"goals":{"long_term":"入院中，転倒・転落によるけががなく，安全に活動範囲を広げて退院できる（転倒ゼロだけを追って活動を制限しすぎない）","short_term":["入室時：ナースコールを理解し操作できるか確認し，できる患者とは『動く前に呼ぶ』を共有，難しい患者は訪室・排泄援助・代替の呼び出し手段を決めている","入室時：ベッド周りの環境（高さ・柵・ライト・履物・ルート）が整っている","初回離床前：起立性低血圧・ふらつきの有無を確認し，暫定の移動方法（介助の要否）が決まっている．翌勤務以降，実際の様子で更新","初夜から：排泄の援助方法が決まり，観察した排泄パターンに合わせて誘導や環境調整を更新している"]},"OP":["歩き方・立ち上がり・座り方（ふらつき，つかまる，時間がかかる，足を引きずる）","起立時の血圧・脈拍の変化，めまい・目の前が暗くなる訴え","意識レベル・見当識（今どこにいるか，時間），夜間の落ち着きのなさ","薬：睡眠薬・抗不安薬・利尿薬・降圧薬・オピオイドの開始や増量，服用後の様子","排泄パターン：トイレの回数・時間帯，尿意の切迫，下痢，夜間の回数","視力・聴力・履物・眼鏡の使用","ルート類：点滴，酸素チューブ，モニタ電極，ドレーン，尿道カテーテルの長さと絡み","環境：ベッドの高さ・柵・ストッパー，床の水濡れ，照明，ナースコールの位置，床頭台の距離","本人の行動：ナースコールを押すか，一人で動こうとするか，急ぐか","検査データ：貧血（ヘモグロビン），電解質（ナトリウム・カリウム），血糖，脱水の指標","心電図モニタ：徐脈・頻脈・ポーズ（心停止に近い間隔），失神の前兆"],"TP":["就床中はベッドを低くし，ストッパーをかける．移乗・立ち上がりのときは足底が床につき立ちやすい高さに調整する（低すぎると立ち上がりにくい）．柵は必要な側だけ上げ，本人が降りられないよう囲う使い方は行動制限にあたるため院内指針に従う","ナースコール・眼鏡・ティッシュ・飲み物を手の届く位置に置く","履物はかかとのある滑りにくいものにし，スリッパは避ける","点滴・酸素チューブ・モニタのコードをまとめ，歩行時の長さを確保するか一時的に外せるか医師と相談","夜間は足元灯をつけ，トイレまでの通路に物を置かない","利尿薬は可能なら午前中に投与し，夜間排尿を減らす（医師と相談）","観察した排泄パターンに合わせて先回りの声かけ・誘導（例：利尿薬 1〜2 時間後，就寝前）．眠っている患者を一律に起こす固定時刻の誘導はしない","起立性低血圧がある患者：起き上がりは段階的に（座る → 足を下ろす → 立つ，各段階で症状がないことを確認してから進む．時間は目安であり症状と安静指示を優先）","歩行が不安定な患者は見守りまたは介助歩行にし，安静度・介助方法をベッドサイドに表示する","離床センサー・ベッドセンサーは本人の行動パターンに合わせて使い，鳴ったらすぐ対応できる配置にする","せん妄・認知症がある患者は，訪室の頻度を上げ，日中の覚醒と夜間の睡眠のリズムを整える","転倒したときは：無理に起こさず，まず意識・呼吸・循環・出血・痛みを確認し応援を呼ぶ．意識低下や呼吸循環の異常があれば院内の緊急対応へ．医師に報告し，頭部打撲の有無が不明な場合や抗凝固薬・抗血小板薬使用時は画像検査の要否を早めに判断してもらう．その後の神経症状・バイタル・痛みの再評価の頻度と担当を医師と決める（薬を独断で休止しない）．インシデント報告と計画の見直し"],"EP":["患者へ：『必要なときは遠慮なく呼んでください』と伝え，動く前に呼んでほしいことを共有する（理解や操作が難しい患者は約束に頼らず訪室・援助で補う）","患者へ：起き上がるときはゆっくり，座ってから立つ．めまいがしたら座って待つ","患者へ：利尿薬でトイレが近くなること，夜間は特に転びやすいことを説明し，夜は必ず呼んでもらう","患者へ：睡眠薬や痛み止めを飲んだ後はふらつきやすいことを説明する","患者・家族へ：自宅から歩きやすい靴・慣れた杖を持ってきてもらう","家族へ：面会時にベッドの高さを変えたり柵を下げたりしたら元に戻してほしいこと","家族へ：退院後の自宅環境（段差・手すり・夜間の照明・トイレまでの動線）の見直し，必要なら退院支援に相談"],"evaluation":{"timing":"毎日（夜勤帯の様子を含む）と 1 週間ごと，薬や安静度の変更時","indicators":["けがの有無，転倒・転落，ヒヤリハットを分けて記録し，いずれも増えていない．安全に行えた活動（歩行距離など）が広がっている","ナースコールを使って動けている（一人で動いた回数の減少）","環境チェック（高さ・柵・履物・ルート・ライト）が毎勤務で確認されている","起立時の血圧低下・ふらつきが改善または対応方法が定着している"],"revise_if":"転倒・ヒヤリハットがあった／薬が変わった／安静度が上がった／せん妄が出た／夜間の排尿回数が増えた"},"cardio_ward_notes":["利尿薬（フロセミドなど）の静注後 30 分〜2 時間はトイレの回数が急に増える．投与時刻を把握し，先回りで誘導する","降圧薬・硝酸薬・β遮断薬の開始や増量の直後は起立性低血圧が出やすい．初回歩行は見守りで","徐脈・房室ブロック・洞不全で失神する患者は，前兆なく倒れることがある．モニタのポーズと『目の前が暗くなる』訴えを重視","カテーテル後の穿刺部の安静解除直後（初回歩行）は，長時間の臥床で立ちくらみが出やすい","抗凝固薬・抗血小板薬を使っている患者は，転倒時の頭部出血・血腫のリスクが高い．転倒後は症状がなくても医師へ報告","ペースメーカ植込み後は術式・時期に応じた術側上肢の動作制限（挙上・荷重）が指示されることがある．個別の指示を確認し，ベッド柵をつかむ動作に注意"],"sources":[{"name":"AHRQ Preventing Falls in Hospitals: A Toolkit for Improving Quality of Care","url":"https://www.ahrq.gov/patient-safety/settings/hospital/fall-prevention/toolkit/index.html","license":"米国政府著作物（パブリックドメイン）","note":"リスク因子と介入バンドルの構成を参考"},{"name":"CDC STEADI (Stopping Elderly Accidents, Deaths & Injuries)","url":"https://www.cdc.gov/steadi/","license":"パブリックドメイン","note":"高齢者の転倒リスク因子・薬剤・起立性低血圧の確認方法"}, ","転室・転棟はできるだけ避け，担当看護師をなるべく固定する"],"EP":["患者へ（入院時・術前）：入院や手術のあとに一時的に混乱することがあり，多くは数日で戻ること．眼鏡・補聴器・時計を持ってきてほしいこと","患者へ：眠れない・痛い・便が出ない・不安なときは我慢せず知らせてほしいこと","家族へ：せん妄とは何か，認知症とは別の状態で原因への対応で改善が期待できること．ただし回復までの期間には個人差があり（数日〜数週間以上），認知症と併存することもあること","家族へ：面会時にできること（普段の話をする，日付や場所をさりげなく伝える，なじみの物を置く）","家族へ：『いつもと違う』と感じたらすぐ看護師に伝えてほしいこと（家族が最初に気づくことが多い）","家族へ：興奮しているときに否定したり叱ったりしないこと，落ち着いて短い言葉で話すこと","患者・家族へ（回復後）：本人が覚えていないことがあり不安になるので，起きたことを簡単に説明する"],"evaluation":{"timing":"毎勤務（特に夜勤帯の様子），および手術後・ICU 退室後・薬変更後 3 日間は重点的に","indicators":["注意力・見当識の低下が出ていない，または出ても原因への対応が進み，症状の日内変動・苦痛・危険が減っている（回復期間は個人差があるので日数で一律に判定しない）","夜間睡眠が確保され，昼夜逆転がない","身体の引き金（酸素・脱水・痛み・便秘・尿閉）が管理されている","ルート抜去・転倒・身体拘束が起きていない","家族が変化に気づいて知らせてくれる関係ができている"],"revise_if":"せん妄が出た／興奮・幻覚が出た／低活動型が疑われる／手術・ICU 入室が決まった／薬が変わった"},"cardio_ward_notes":["心臓手術（CABG・弁手術）後と CCU 入室中はせん妄が特に多い．術前から家族に説明し，眼鏡・補聴器・時計の持参を依頼する","低心拍出・低酸素・低血圧は脳への血流低下からせん妄を起こす．『せん妄＝精神的なもの』ではなく，まず循環と酸素を確認する","利尿薬による脱水・電解質異常（ナトリウム・カリウム低下）はせん妄の引き金．採血と水分バランスを確認","抗不整脈薬・ジギタリス・β遮断薬の一部は混乱を起こすことがある．開始後の変化に注意","モニタ・点滴・IABP などで安静が必要な患者は，離床の代わりにベッド上で会話・軽い運動・日光を取り入れる","IABP・ECMO・動脈ライン・ペーシングリードなどの自己抜去は，大量出血や循環補助の中断に直結する．せん妄の早期発見が循環器病棟では特に重要"],"sources":[{"name":"厚生労働省 せん妄ハイリスク患者ケア加算 チェックリスト（令和 8 年度 様式（医科） 別紙様式 7 の 3，p.19）","url":"https://www.mhlw.go.jp/content/12400000/001713885.pdf","license":"PDL1.0","note":""},{"name":"Open RN Nursing Fundamentals 2e, Ch.6 Cognitive Impairments（6.2 Delirium，6.4）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/","license":"CC BY 4.0","note":"せん妄の原因・予防介入の体系を参考"},{"name":"4AT（rapid clinical test for delirium）","url":"https://www.the4at.com/","license":"CC BY 4.0（日本語版あり）","note":""},{"name":"MedlinePlus: Delirium（Health Topic）","url":"https://medlineplus.gov/delirium.html","license":"パブリックドメイン","note":""},{"name":"AHRQ／HELP（Hospital Elder Life Program）の多因子介入の考え方（見当識・早期離床・睡眠・視聴覚・水分）","url":"https://help.agscocare.org/","license":"HELP のプログラム資料は権利あり（考え方のみ参照，文言は転載しない）．公式サイトは JS 描画で条文未取得","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"line_self_removal_risk","group":"安全・リスク","problem":"点滴・ドレーン・カテーテル類を自己抜去するリスクがある","problem_plain":"点滴の管，尿の管，胸やお腹のドレーン，酸素チューブ，動脈ライン，IABP などを，患者が自分で引き抜いたり，体を動かした拍子に抜けたりする危険．せん妄・認知症・不快感が主な原因で，重要なルートが抜けると大量出血や治療の中断につながる．","applies_when":["せん妄・認知症・意識障害があり，ルートの意味が理解できない，または落ち着きがない","ルート・チューブが多い（点滴，尿道カテーテル，胸腔・心嚢ドレーン，酸素，モニタ電極）","抜けると命にかかわる重要ルートがある：動脈ライン，中心静脈カテーテル，IABP，ECMO，一時ペーシングリード，気管チューブ，スワンガンツカテーテル","過去にルートを引っ張った・触った・抜いたことがある","不快や痛み（固定テープのかゆみ，尿道カテーテルの違和感，口の渇き，同じ体位のつらさ）を訴える，または訴えられない","鎮静薬・睡眠薬を使っている，鎮静から覚める途中で混乱している（術後・CCU）","手が自由に動き，ルートが視界や手の届く位置にある"],"related_factors":["認知・意識：せん妄，認知症，鎮静からの覚醒途中，低酸素・低血糖・低灌流による混乱","不快：刺入部の痛み・かゆみ，尿道カテーテルによる尿意の錯覚，口渇，固定テープ，長時間同じ体位","理解：ルートの必要性が説明されていない・覚えていない，言語や聴覚の障害","環境：ルートが手の届く位置・視界に入る，夜間の見当識低下，一人の時間が長い","固定：固定の緩み，寝衣の着脱・体位変換・移乗時の引っ張り，回路やドレーンの重み","抑えつけへの抵抗：手を押さえられると余計に抜こうとする"],"assessment":{"scales":[{"name":"厚労省「せん妄ハイリスク患者ケア加算」のチェックリスト（別紙様式 7 の 3）","license":"厚労省サイト（PDL1.0）","note":"自己抜去の最大の原因はせん妄なので，せん妄リスクの評価をそのまま使う（delirium_risk の計画と共有）"},{"name":"4AT（せん妄の有無：覚醒／AMT4／注意／急性変化）","license":"判定 5：CC BY 4.0，日本語版あり","note":"『今せん妄があるか』を毎勤務 2 分で確認"},{"name":"CAM-ICU（人工呼吸中でも使える版）","license":"判定 4：臨床実装は許可不要，著作権行の表示必須","note":"CCU/ICU で気管チューブ・IABP・ECMO のある患者に"},{"name":"ルート類の自己抜去リスク評価表（施設独自：意識・行動・ルートの種類と危険度・不快の有無で段階分け）","license":"施設の様式を使う","note":"多くの病院が独自様式を持つ．『抜けたときの危険度』をルートごとに分けて記載できる様式がよい"}],"assessment_points":["入院時・ルート追加時・せん妄出現時に評価し，『どのルートが抜けると命にかかわるか』を分けて考える（優先度は器材名だけでなく，投与している薬（末梢からの昇圧薬など）・治療が中断したときの危険（酸素依存度が高い，致死性不整脈の監視中）・再確保の難しさで決める．動脈ライン・中心静脈・IABP・ECMO・一時ペーシング・気管チューブ・胸腔や心嚢のドレーンは常に最優先．末梢点滴・酸素・モニタ電極も条件によっては最優先で守る）","行動を観察する：ルートを触る・見つめる・引っ張る，テープをはがす，起き上がろうとする．夜間・覚醒直後・処置直後に多い","不快の原因を探す：痛み，かゆみ，尿意，口渇，便秘，体位．『抜こうとする』は多くの場合『不快を取りたい』の表れ","せん妄の身体的原因（低酸素・低灌流・脱水・電解質・感染・薬剤）は delirium_risk の計画に沿って必ず探す","そのルートは今も必要かを毎日医師と確認する（不要なルートを残すことが最大のリスク）"]},"goals":{"long_term":"入院中，重要ルートの計画外抜去がなく，必要な治療が中断されない（ルートは必要最小限にし，身体拘束に頼らずに安全を保つ）","short_term":["入室時／ルート追加時：抜去リスクと『抜けたときの危険度』が評価され，固定方法・観察頻度・抜けたときの対応がベッドサイドで共有されている","毎日：不要なルート・カテーテル・モニタが医師と確認され，外せるものは外されている","毎勤務：不快の原因（痛み・かゆみ・尿意・口渇・体位）が確認され，対処されている","3 日以内（目安）：せん妄の原因への対応と昼夜リズムの調整が進み，夜間にルートを触る行動が減っている","発生時：抜去に気づいた時点で出血・全身状態・再挿入の要否が確認され，医師に報告されている"]},"OP":["各ルートの種類・挿入部位・挿入日・固定の状態・必要性（毎勤務．重要ルートは訪室ごと）","刺入部と固定テープ：発赤・腫れ・かゆみ・テープのはがれ，ルートに余裕があるか（引っ張られていないか）","ルートに触る・見る・引っ張る行動，テープをはがそうとする仕草，起き上がり・ベッドからの降りようとする動き","意識レベル・注意力・見当識，夜間の落ち着きのなさ，会話のかみ合わなさ（せん妄の兆候）","不快の訴え：痛み，かゆみ，尿意や排尿感（尿道カテーテル），口渇，便意，体位のつらさ．訴えられない患者は表情・体動で判断","鎮静薬・睡眠薬・オピオイドの投与状況と覚醒の程度（覚醒途中が最も危険）","動脈ライン・IABP・ECMO・一時ペーシング：接続部と固定，波形・作動状況，刺入部の出血，大腿挿入側の下肢の血流（色・温度・動脈触知）","ドレーン：固定，排液量と性状，接続の緩み，たるみ，体動時の引っ張られ方","気管チューブ：固定位置（口角の目盛り），カフ圧（施設基準），バイトブロック，人工呼吸器回路の重みがチューブにかかっていないか","手の動き・握力・上肢の可動範囲（ルートに手が届くか）","家族の面会状況，本人が理解できる説明ができているか","抜去・ヒヤリハットの記録（時間帯・状況・きっかけ）"],"TP":["不要なルートは医師と相談して早く抜く（尿道カテーテルの適応，末梢点滴の必要性，モニタ電極，酸素）．『念のため』で残さない","固定：ループを作ってテープで固定し，引っ張られても刺入部に力が直接かからないようにする．ルートは寝衣の中や背側を通すなど，視界と手の届く範囲から外す．固定材は皮膚障害を起こしにくいものを選ぶ（skin_damage_risk 参照）","不快を取り除く：固定部のかゆみは固定材の変更，尿道カテーテルの違和感は固定位置の調整と必要性の再確認，口渇は口腔ケア・含嗽・許可された範囲の氷片（心不全の水分制限内），痛みは鎮痛の指示を確認","せん妄の予防と対応（delirium_risk の計画を併用）：見当識の援助，昼夜リズム，眼鏡・補聴器，家族の面会，身体的原因の是正","訪室の頻度を上げる（危険な時間帯：夜間，覚醒直後，鎮静を減らす時期）．ナースステーションに近い部屋，見える位置のベッドにする","説明を繰り返す：訪室のたびに『これは点滴の管です．抜けると血が出ます』のように短く．理解できない患者には説明だけに頼らず，環境と観察で補う","鎮静薬・睡眠薬は医師と相談し，過鎮静と覚醒途中の混乱を避ける（薬で抑えることを第一の手段にしない）","身体拘束（ミトン・抑制帯）は原則行わない．重要ルートで代替策を尽くしても危険が続く場合はチームで判断し，患者・家族に説明，理由・部位・時間・観察・解除条件を院内指針に沿って記録し，勤務ごとに解除できないか検討する．拘束中は皮膚・循環・呼吸・精神状態を観察し，家族の同意だけを根拠にしない","体位変換・移乗・清拭・寝衣交換の前にルートの位置と長さを確認し，2 人で行うときは声を掛け合う．人工呼吸器の回路やドレーンは事前に余裕を作る．IABP・ECMO の挿入側は屈曲制限を守る","抜去したとき：まず出血と全身状態を見る．末梢点滴は刺入部を圧迫（抗凝固薬中は長めに）．動脈ライン・大腿シース・IABP・ECMO は強く圧迫しながら応援と医師を呼び，院内の緊急対応へ．気管チューブは気道確保と用手換気で応援を呼ぶ．胸腔ドレーン・心嚢／縦隔ドレーンが抜けたら直ちに応援を呼び，呼吸・循環を評価し，施設手順に沿って抜去孔を覆って空気の流入を防ぎ，緊急診察につなぐ（抜けた管を押し戻さない）．その他のドレーン・尿道カテーテルは抜けた部位を清潔なガーゼで覆い，抜けた長さ・排液・出血を確認して医師に報告．再挿入の要否は医師が判断．インシデント報告と計画の見直し","家族に協力を依頼：面会中の見守り，落ち着く声かけ，なじみの物の持ち込み"],"EP":["患者へ：ルートの目的と，抜けると困ること．触りたくなったら・気になったら呼んでほしいこと（理解できる患者に）","患者へ：かゆい・痛い・トイレに行きたい気がする・喉が渇くなど，つらさは我慢せず知らせてほしいこと","患者へ：起き上がる・寝返る・トイレに行くときは呼んでほしいこと（ルートが引っかかりやすい動作）","家族へ：せん妄では無意識に抜いてしまうことがあり，本人を責めないこと．面会中に手元のルートを触っていたら看護師に知らせてほしいこと","家族へ：身体拘束を検討する場合は，理由・代替策・解除の見通しを説明し，意見を聞くこと","家族へ：眼鏡・補聴器・時計・写真など，本人が落ち着く物の持参"],"evaluation":{"timing":"毎勤務（夜勤帯を重点）と，ルートの追加・抜去時，せん妄の出現時","indicators":["重要ルートの計画外抜去がない（末梢点滴などの抜去・ヒヤリハットは分けて記録し，減っている）","不要なルートが毎日見直され，ルートの本数が減っている","不快の訴えに対処され，ルートを触る・引っ張る行動が減っている","身体拘束を使わずに管理できている，または使った場合は記録と解除の検討が毎勤務行われている"],"revise_if":"抜去・ヒヤリハットがあった／せん妄が出た／重要ルート（IABP・ECMO・動脈ライン・一時ペーシング・気管チューブ）が入った／鎮静を減らす時期に入った／身体拘束を開始・解除した"},"cardio_ward_notes":["IABP・ECMO・大腿シース・動脈ラインは抜けると数分で大量出血や循環補助の中断になる．IABP・ECMO の大腿挿入側は股関節の屈曲制限があり，体動でカニューレがずれるだけでも危険．訪室ごとに固定と刺入部を見る","一時ペーシングリード（経静脈・心外膜）が抜けると徐脈・心停止に直結する．リードの固定と本体の設定を勤務ごとに確認し，本体は患者の手の届かない場所に置く","心臓術後・CCU では術後せん妄と覚醒途中の混乱が重なる時期（術後数日）が最も危険．鎮静を減らす日は観察の頻度を上げ，家族の面会を活用する","抗凝固薬・抗血小板薬・ヘパリン使用中はルートが抜けると出血が止まりにくく，血腫が大きくなる．末梢点滴でも圧迫時間を長めにし，止血を確認してから離れる（bleeding_risk 参照）","胸腔・心嚢ドレーンやペースメーカ植込み後の創部ドレーンの抜去は気胸・心タンポナーデにつながることがある．抜去後は呼吸・血圧・心拍・頸静脈怒張を観察して医師へ","尿道カテーテルは心不全の尿量管理で入ることが多いが，利尿が落ち着いたら適応を医師と再確認する（尿路感染と自己抜去の両方を減らす）"],"sources":[{"name":"厚生労働省 医療安全管理マニュアル作成例「人工呼吸器」（自己抜管の予防，回路の重みによるチューブの牽引防止）","url":"https://www.mhlw.go.jp/topics/bukyoku/isei/i-anzen/1/torikumi/naiyou/manual/2a.html","license":"PDL1.0","note":"チューブ固定・体位変換時の回路の扱いを参考"},{"name":"厚生労働省 医療安全管理マニュアル作成例 ヒヤリ・ハット事例集「窒息」（経管チューブの自己抜去事例と防止策）","url":"https://www.mhlw.go.jp/topics/bukyoku/isei/i-anzen/1/torikumi/naiyou/manual/5h.html","license":"PDL1.0","note":"自己抜去しやすい患者の把握・固定・注入中の観察"},{"name":"厚生労働省 せん妄ハイリスク患者ケア加算 チェックリスト（令和 8 年度 様式（医科） 別紙様式 7 の 3）","url":"https://www.mhlw.go.jp/content/12400000/001713885.pdf","license":"PDL1.0","note":""},{"name":"Open RN Nursing Fundamentals 2e, 5.7 Restraints（拘束の定義，ミトンの扱い，代替策）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/5-7-restraints/","license":"CC BY 4.0","note":"身体拘束の代替策と観察の考え方を参考．米国の時間規定は日本の院内指針で置き換える"},{"name":"Open RN Nursing Skills 2e, 20.13 Checklist for Drain Management（ドレーンの固定・たるみ・排液観察）","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/20-13-checklist-for-drain-management/","license":"CC BY 4.0","note":""},{"name":"Open RN Nursing Skills 2e, 23.4 IV Therapy Site Assessment & Complications","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/23-4-iv-therapy-site-assessment-complications/","license":"CC BY 4.0","note":"刺入部の観察項目"},{"name":"4AT（rapid clinical test for delirium）","url":"https://www.the4at.com/","license":"CC BY 4.0（日本語版あり）","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"aspiration_risk","group":"安全・リスク","problem":"誤嚥・窒息のリスクがある","problem_plain":"食べ物・飲み物・唾液・吐いたものが食道ではなく気管に入ること（誤嚥）と，食べ物などがのどに詰まって息ができなくなること（窒息）．高齢，脳卒中のあと，鎮静のあと，心不全で食欲がなく体力が落ちている人に起きやすく，誤嚥性肺炎の原因になる．","applies_when":["脳卒中・麻痺・失語がある，過去に誤嚥性肺炎を起こした","食事中や食後にむせる・咳が出る・声がガラガラになる・食べ物が口に残る","高齢で歯が少ない・義歯が合わない・口の中が乾燥している／汚れている","意識レベルが低い，鎮静・麻酔・鎮痛薬のあと（カテーテル・アブレーション・電気的除細動・手術の後）","心不全の急性期で呼吸が速い（食事中に息が続かない），食思不振・体力低下がある","経鼻胃管が入っている，気管挿管を抜いた直後，人工呼吸中","嘔吐・逆流がある，ベッド上で体を起こせないまま飲食する必要がある","認知症・せん妄で一口の量やペースを自分で調整できない"],"related_factors":["嚥下機能の低下：脳卒中，加齢，サルコペニア（筋肉量の低下），意識障害・鎮静","呼吸：頻呼吸・呼吸困難で飲み込みと呼吸のタイミングが乱れる（心不全・肺炎・COPD）","口腔：口の中の細菌の増加・乾燥，義歯の不適合，歯の欠損","姿勢・環境：臥位や首が反った姿勢での飲食，急いで食べる，介助のペースが速い，食事中の会話","食形態：とろみ・形態が合っていない，薄い水分・パサつく物・餅など詰まりやすい物","薬剤：鎮静薬・睡眠薬・抗精神病薬（嚥下反射の低下），抗コリン薬（口渇）","消化管：胃食道逆流，経管栄養の注入速度や体位，嘔吐"],"assessment":{"scales":[{"name":"嚥下スクリーニング（反復唾液嚥下テスト，改訂水飲みテスト，フードテストなど施設の方法）","license":"一般的手技（事実）．実施基準と判定は施設の手順に従う","note":"意識と呼吸状態が安定してから行う．疑わしければ言語聴覚士（ST）に相談し，嚥下造影・嚥下内視鏡は医師が判断"},{"name":"厚労省 医療安全管理マニュアル作成例「窒息」の要点（食事姿勢・食事形態・介助・吸引の準備）","license":"厚労省サイト（PDL1.0）","note":"リスクの高い患者の観察と環境の整え方の枠組み"},{"name":"口腔内の評価（施設のアセスメント表：乾燥・汚れ・舌苔・義歯・歯・舌の動き）","license":"施設の様式を使う","note":"口腔ケアの計画に直結する"},{"name":"厚労省 重症度，医療・看護必要度 B 項目「口腔清潔」「食事摂取」","license":"厚労省サイト（PDL1.0）","note":"介助の必要性の把握に．嚥下専用の尺度ではない"}],"assessment_points":["入院時に『むせ・肺炎の既往・食形態・とろみ・義歯』を聞き，鎮静・手術・脳卒中発症・意識変化のときに再評価．初回の飲食は必ず看護師が見る","食事の場面を観察する：むせ，咳，湿った声（食後の『ガラガラ声』），食べこぼし，口の中の残留，食事時間の延長，疲れ","発熱・痰の増加・SpO2 低下・呼吸音の変化は誤嚥性肺炎のサイン（むせのない誤嚥もある）","経管栄養中は胃管の位置，注入中の体位，逆流・嘔吐の有無","食べられない原因が『飲み込めない』のか『食欲がない』のかを分ける（心不全の食思不振）．摂取量と体重の推移を見る"]},"goals":{"long_term":"入院中，誤嚥性肺炎・窒息を起こさず，安全な方法で口から食べることができる（または適切な栄養法に移行できる）","short_term":["入院時／初回飲食前：嚥下スクリーニングの結果と，食形態・とろみ・姿勢・介助方法がベッドサイドで共有されている","毎食：安全な姿勢（可能なら座位，首をやや前に傾ける）で食事ができ，食後も一定時間（目安 30 分〜1 時間．ただし呼吸・循環・安静度の指示を優先）上体を起こしている","毎日：口腔ケアが起床時・毎食後・就寝前に実施されている","1 週間以内：むせ・湿った声・発熱・SpO2 低下がなく，摂取量が必要量に近づいている（不足なら管理栄養士・ST に相談済み）","窒息時：発見者が直ちに応援を呼び，気道確保と院内の緊急対応を始められる"]},"OP":["食事中・食後のむせ・咳・湿った声・呼吸の乱れ・顔色（毎食）","口の中の残留，食べこぼし，一口の量，食事にかかる時間，途中の疲れ","体温・SpO2・呼吸数・呼吸音・痰の量と性状（誤嚥性肺炎の早期発見．毎勤務）","意識レベル・覚醒度（食事の前に十分起きているか），鎮静薬・睡眠薬の投与時刻","口の中：乾燥，汚れ，舌苔，義歯の適合，口内炎，歯の状態","食事の姿勢と食後の体位，ベッドの背上げの角度（褥瘡予防との兼ね合い）","指示された食形態・とろみと，実際に提供されているもの・家族の持ち込みが一致しているか","摂取量・水分量・体重の推移（心不全の水分制限との両立）","嘔吐・逆流・腹部膨満，経管栄養の注入速度・胃内の残量・胃管の位置と固定","胸部 X 線・採血（炎症反応）の結果，抗菌薬の開始の有無","患者の食べる意欲，家族の持ち込み食の内容（餅・こんにゃく・団子・大きな肉など詰まりやすい物）"],"TP":["食事は可能な限り座位（車いす・端座位）にし，ベッド上なら上体を起こして首をやや前に傾ける（厚労省マニュアルの目安は 45 度以上）．ただし循環・呼吸状態と安静度の指示を優先し，起こせない場合は食事の可否を医師と相談する","食前に覚醒を確認し，口腔ケアと必要なら吸引をしてから始める．眠い・呼吸が速い・SpO2 が低いときは無理に食べさせず医師に報告","一口の量は小さくし，一口ごとに飲み込んだことを確認してから次を入れる．食事中は不要な会話を避け，急がせない．介助は一人の患者に集中する","食形態・とろみは指示どおりに提供し，家族の持ち込みも同じ形態にしてもらう．合わないと感じたら ST・管理栄養士に相談","食後は上体を起こしたまま一定時間過ごし（目安 30 分〜1 時間），すぐに寝かせない．食後に口の中の残留を確認して口腔ケアをする","口腔ケアを起床時・毎食後・就寝前に行う（歯・舌・口蓋・義歯）．乾燥には保湿剤．自分で磨けない患者は看護師が行う","経管栄養：胃管の位置確認は施設手順に従う（挿入・再挿入時は X 線などの画像で確認し，毎回の注入前は外部の長さ・固定・ずれの兆候を確認する．気泡音だけで判断しない）．位置がわからない・ずれた疑いがあるときは栄養・水分・薬を注入せず医師に確認する．注入中〜注入後は上体を起こす．注入速度は指示どおり．嘔吐・逆流があれば中止して医師へ","吸引器と救急カートの場所を確認しておく．窒息時は直ちに食事を中止して応援を呼ぶ．有効な咳ができる（声が出る・息ができる）なら咳を促して見守る．有効な咳ができない重度の閉塞には院内採用の気道異物除去手技（背部叩打・腹部突き上げ）．反応がなくなったら胸骨圧迫から CPR を開始し，院内の緊急対応へ（BLS 手順に従う）","鎮静薬・睡眠薬・抗精神病薬の影響が疑われるときは医師・薬剤師に相談する（減量・中止は医師の判断）","摂取量が少ない場合は原因（嚥下か食欲か）を分けて ST・管理栄養士・医師に相談し，栄養法を検討する（nutrition_deficit の計画を併用）","疑わしいむせ・発熱・痰の増加は発見時に呼吸・SpO2・体温を確認して医師へ報告し，胸部 X 線・採血の指示を確認する"],"EP":["患者へ：座って食べる，一口を小さく，飲み込んでから次を食べる，食べながら話さない","患者へ：むせたときは無理に飲み込まず咳をする．食事中に苦しくなったら手を挙げて知らせる","患者へ：とろみや形態の理由（薄い水分が一番むせやすい）と，退院後も続ける必要があるかは ST の評価で決まること","家族へ：持ち込み食は看護師に確認してから．餅・こんにゃく・団子・大きな肉など詰まりやすい物を避ける","家族へ：食事介助の方法（姿勢・一口の量・ペース）と口腔ケアを退院前に一緒に練習する","家族へ：発熱・痰の増加・食事中のむせが続くときは受診の目安になること"],"evaluation":{"timing":"毎食（介助時の観察）と毎勤務，意識・呼吸状態の変化時，鎮静・手術のあと，1 週間ごと","indicators":["むせ・湿った声・食後の呼吸の変化がない，または減っている","発熱・SpO2 低下・痰の増加・肺炎の診断がない","指示された姿勢・食形態・食後の体位が毎食実施されている（記録）","口腔ケアが 1 日 3 回以上実施され，口の中が清潔で潤っている","摂取量が必要量に対して確保されている（不足時は栄養法の変更が検討されている）"],"revise_if":"むせ・発熱・肺炎が出た／意識レベルや呼吸状態が変わった／鎮静・手術・抜管があった／食形態や安静度が変わった／経管栄養が始まった"},"cardio_ward_notes":["急性心不全で呼吸が速い時期は，飲み込みと呼吸のタイミングが合わず誤嚥しやすい．呼吸数・SpO2 が落ち着くまでは少量から始め，食事開始の時期は医師と相談する","心不全の水分制限と『薄い水分はむせやすい』が重なる．とろみ水分の量も水分制限に含めて計算し，口渇には口腔ケア・含嗽で対応する","心臓カテーテル・アブレーション・電気的除細動・TAVI 後の鎮静から覚める途中や，開心術後の抜管直後は嚥下反射が鈍い．初回飲水は覚醒と嚥下スクリーニングを確認してから（施設の手順）","脳梗塞（心原性塞栓）を併発した患者は嚥下障害の頻度が高い．抗凝固薬など粉砕できない薬があるため，服薬方法は薬剤師と相談する（post_stroke_dysphagia_paralysis 参照）","誤嚥性肺炎は心不全を増悪させる（発熱・頻脈・低酸素）．発熱時は肺炎と心不全増悪の両方を疑って報告する","ベッドの背上げを長く保つと仙骨部のずれが増える．褥瘡計画（pressure_injury）と両立させ，食後の座位は車いすや端座位も検討する"],"sources":[{"name":"厚生労働省 医療安全管理マニュアル作成例「窒息」（食事姿勢・食事形態・介助・吸引）","url":"https://www.mhlw.go.jp/topics/bukyoku/isei/i-anzen/1/torikumi/naiyou/manual/2g.html","license":"PDL1.0","note":"姿勢（頸部前屈・正中位），一口量，形態，吸引器の準備の要点"},{"name":"厚生労働省 医療安全管理マニュアル作成例 ヒヤリ・ハット事例集「窒息」","url":"https://www.mhlw.go.jp/topics/bukyoku/isei/i-anzen/1/torikumi/naiyou/manual/5h.html","license":"PDL1.0","note":"45 度以上の上体挙上，一口ごとの嚥下確認，食事中の会話を避ける等の事例"},{"name":"Open RN Nursing Fundamentals 2e, 14.3 Applying the Nursing Process（Nutrition：嚥下障害の観察，とろみ，経管栄養の誤嚥予防）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/14-3-applying-the-nursing-process/","license":"CC BY 4.0","note":""},{"name":"Open RN Nursing Skills 2e, 22.2 Basic Concepts Related to Suctioning","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/22-2-basic-concepts-related-to-suctioning/","license":"CC BY 4.0","note":"吸引の適応と観察"},{"name":"Open RN Health Alterations, 6.7 Pneumonia","url":"https://wtcs.pressbooks.pub/healthalts/chapter/6-7-pneumonia/","license":"CC BY 4.0","note":"誤嚥性肺炎の徴候と予防"},{"name":"Open RN Health Alterations, 9.9 Cerebrovascular Accident","url":"https://wtcs.pressbooks.pub/health う場合も単独で除外しない）","license":"一般的手技（事実）","note":"感染が疑われる患者に新しい臓器障害（意識変化・血圧低下・頻呼吸・尿量減少）や全身状態の悪化があれば，発熱がなくても・低体温でも院内の緊急対応へ．qSOFA が陰性でも除外しない"}],"assessment_points":["入院時に感染源になりうるもの（創・ルート・デバイス・褥瘡・口腔）を一覧にし，各ルートの挿入日を把握する．追加・抜去のたびに更新","毎勤務，局所（創部・刺入部の発赤・腫れ・熱感・痛み・浸出液・膿）と全身（発熱・悪寒・頻脈・血圧低下・意識変化・尿量減少）を分けて観察する","発熱の原因を一つに決めつけない：創，ルート，尿，肺，褥瘡，薬剤熱，心不全増悪，心内膜炎（新しい心雑音・点状出血）","抗菌薬の投与状況（開始日・投与時刻・血中濃度・腎機能・下痢）と，血液培養が抗菌薬の前に採取されているか","患者・家族が感染予防行動（手洗い，創を触らない，口腔ケア）を理解し実行できているか"]},"goals":{"long_term":"入院中，創部・カテーテル・尿路・肺・デバイスの感染および感染性心内膜炎を起こさず，起きた場合は早期に発見して治療につながる","short_term":["毎勤務：創部・刺入部に感染徴候がなく，異常があれば発見時に医師へ報告されている","毎日：尿道カテーテル・中心静脈カテーテル・末梢点滴・ドレーンの必要性が医師と確認され，不要なものは抜去されている","毎日：口腔ケアが 1 日 3 回以上（人工呼吸中は施設基準の頻度で）実施されている","術後：深呼吸・咳嗽・早期離床（安静度の範囲）が進み，無気肺・肺炎の徴候がない","退院時：患者・家族が創部の観察・清潔の保ち方・受診の目安を言える"]},"OP":["体温（1 日数回，解熱薬の影響も記録），脈拍，血圧，呼吸数，SpO2，意識レベル，尿量（敗血症の早期発見）","創部・穿刺部・デバイス創部：発赤，腫れ，熱感，痛み，浸出液の量と性状，離開，胸骨の動揺","中心静脈・末梢・動脈ラインの刺入部：発赤，圧痛，硬結，滲出，ドレッシングのはがれ・汚染，留置日数","尿道カテーテル：尿の混濁・浮遊物・血尿・臭い，尿量，バッグの位置（膀胱より低く床につけない），閉鎖式が保たれているか，留置日数と必要性","呼吸：呼吸音，痰の量・色・粘性，咳の力，自分で痰を出せるか，無気肺のサイン（SpO2 低下・呼吸音の減弱）","口の中：汚れ，乾燥，歯肉の出血，義歯，歯の痛み（心内膜炎の入口）","皮膚：褥瘡，失禁による皮膚炎，浮腫部位のびらん（感染の入口）","採血：白血球・CRP・プロカルシトニン，腎機能（抗菌薬の調整），血糖（高血糖は傷の治りと免疫を落とす）","培養：血液（心内膜炎疑いでは複数セット），尿，痰，創，カテーテル先端の結果","心内膜炎の徴候：新しい心雑音や雑音の変化，点状出血（眼瞼結膜・爪），塞栓症状（麻痺・言語障害・腹痛・四肢の痛み）","抗菌薬：投与時刻，副作用（下痢・発疹・腎機能），血中濃度","栄養：食事摂取量，アルブミン，体重（治癒力）"],"TP":["手指衛生：患者に触れる前，清潔操作の前，体液に触れた後，患者に触れた後，患者の周囲環境に触れた後に，アルコール手指消毒（目に見える汚れ，C. difficile やノロウイルスの疑いは石けんと流水）．家族・面会者にも協力を依頼する","標準予防策（手袋・マスク・エプロン・ゴーグルを場面に応じて）と，必要時は施設基準の感染経路別予防策","創部：ドレッシングは指示どおり無菌操作で交換し，汚染・はがれ時はすぐ交換．創を濡らさない・触らない．胸骨正中創は咳嗽時に枕で保護する","中心静脈カテーテル：接続部・三方活栓の操作前に消毒し，ドレッシングは施設基準の間隔と汚染時に交換，不要になったら早く抜去．末梢点滴は刺入部を毎勤務観察し，発赤・痛みがあれば抜去して医師に報告","尿道カテーテル：閉鎖式を保ち，バッグは膀胱より低く床につけない．陰部洗浄は 1 日 1 回と排便後．留置の適応を毎日医師と確認し，不要なら早く抜去する（urinary_issues 参照）","肺炎予防：深呼吸・咳嗽・インセンティブスパイロメトリー（施設で使用中なら），安静度内の早期離床と体位変換，痰を出せないときは吸引．人工呼吸中は頭側挙上（目安 30 度以上．ただし血圧・IABP の屈曲制限・褥瘡予防を優先して個別に決める）と施設基準の口腔ケア","口腔ケア：起床時・毎食後・就寝前に歯・舌・義歯を清掃する．人工弁・弁膜症・デバイス植込み患者は特に丁寧に．歯科受診が必要なときは医師・歯科と連携","皮膚を清潔に保ち，褥瘡・失 出血）を起こさず，出血の徴候を早期に発見して対処できる．抗血栓薬を必要な治療として続けられる","short_term":["入院時／処置後：抗血栓薬の種類と最終内服時刻，穿刺部の止血法と観察間隔がベッドサイドで共有されている","処置後の安静時間中（施設基準）：穿刺部の出血・血腫の拡大がなく，末梢の血流が保たれている","毎勤務：皮膚・粘膜・便・尿の出血徴候が観察され，新たな出血は発見時に医師へ報告されている","毎日：転倒・打撲を防ぐ環境（fall_risk 参照）が整い，出血を増やす行為（硬い歯ブラシ・かみそり・いきみ）が避けられている","退院前：患者・家族が出血のサインと受診の目安，薬を自己判断でやめないことを言える"]},"OP":["穿刺部・創部：出血，血腫の大きさ（マーキングして拡大を見る），拍動性の腫れ（仮性動脈瘤），痛み，圧迫の状態（止血デバイスの圧と解除時刻は施設基準）","穿刺側の末梢：動脈の触知，色，温度，しびれ，動き（圧迫しすぎによる虚血）","血圧・脈拍・呼吸数・SpO2・尿量・意識レベル（出血による循環の変化．β遮断薬で頻脈が隠れることがある）","皮膚・粘膜：あざ（部位・大きさ・新旧），点状出血，歯肉出血，鼻出血，注射部位の血腫","便の色（黒色便・血便）・量・回数，尿の色（血尿），痰・吐物への血の混入","腰痛・背部痛・腹部膨満・下腹部痛（後腹膜出血），頭痛・嘔吐・意識変化・麻痺・ろれつ（頭蓋内出血）","採血：Hb・Ht・血小板の推移，PT-INR・APTT・ACT（薬に応じて），腎機能・肝機能，便潜血","薬：抗血栓薬の種類・用量・投与時刻，休薬と再開の指示，ヘパリンの投与量，併用薬（NSAIDs・抗菌薬・抗真菌薬・アミオダロン）","転倒・打撲の有無，ベッド周囲の環境","患者の自覚：めまい，動悸，冷汗，倦怠感（貧血の進行）","ドレーンの排液量と性状（急な増加・鮮血）"],"TP":["抗血栓薬は指示の薬名・用量・時刻を照合して投与し，休薬・再開の指示（処置の前後）を必ず確認する．INR・腎機能・血小板の結果を投与前に確認し，異常値は医師へ（用量の変更は医師が決める．antithrombotic_management 参照）","穿刺部：決められた間隔で観察する（帰室直後は頻回，施設基準）．出血・血腫の拡大があれば用手圧迫を続けながら応援を呼び医師へ報告．止血できない・急速に腫れる・血圧低下は院内の緊急対応へ","処置後の安静と体位（穿刺側の屈曲制限・臥床時間）は施設基準と医師の指示に従い，解除後の初回歩行は見守る","圧迫止血のときは末梢の血流を確認し，虚血（冷感・蒼白・しびれ）があれば圧を調整して医師へ","出血を増やす行為を避ける：柔らかい歯ブラシ・電動かみそりを使う，筋肉注射・浣腸・直腸検温を避ける（必要なら医師と相談），採血・点滴抜去後は長めに圧迫して止血を確認する","便秘の予防と排便時のいきみの回避（constipation_straining 参照），咳の管理，血圧の管理（指示範囲）","転倒予防（fall_risk）：転倒したら症状がなくても医師へ報告し，頭部打撲があれば画像検査の要否を早めに判断してもらう","消化管出血の予防：NSAIDs を避ける（鎮痛薬の選択は医師・薬剤師と），胃薬の指示を確認，黒色便・貧血の症状を毎日確認する","出血を見つけたら：圧迫，安静，バイタル，出血量の推定と記録，医師へ報告．中和薬・輸血・内視鏡などの要否は医師が判断する．大量出血や意識変化は院内の緊急対応へ","ヘパリン持続投与中は投与量と APTT/ACT の指示を確認し，ルートの接続と投与速度を勤務ごとに照合する．血小板の急な低下は HIT（ヘパリンで血小板が減り，出血よりも血栓ができやすくなる副作用）を疑い，血小板の推移と低下の割合・ヘパリンの投与歴（ルートのフラッシュ・ロックを含む）・新しい四肢の虚血や呼吸・循環の症状をそろえて直ちに医師へ報告する．すべてのヘパリンを止めるか代わりの抗凝固薬にするかは医師が速やかに判断する（血小板の低下だけで看護師が一律に止めない）","抗血栓薬の手帳（カード）を渡し，他科・歯科の受診時に見せる練習をする"],"EP":["患者へ：出血しやすい薬を飲んでいる理由（血栓・脳梗塞・ステント閉塞の予防）と，出血が怖くても自己判断で減らしたりやめたりしないこと","患者へ：出血のサイン（あざが増える，歯ぐき・鼻からの出血が止まりにくい，黒い便，血尿，吐血，強い頭痛，急なめまい）と，見つけたらすぐ知らせる／受診すること","患者へ：穿刺部が腫れる・出血したら手で押さえて呼ぶこと（退院後も同じ）","患者へ：柔らかい歯ブラシ，電動かみそり，鼻を強くかまない，便秘を避ける，転ばない工夫","患者へ：他科・歯科・手術・内視鏡の前に必ず薬を伝える．市販の痛み止め（NSAIDs）やサプリは相談してから","患者へ（ワルファリン）：納豆・青汁・クロレラを避けること，INR の定期検査を続けること","家族へ：転倒や頭部打撲があれば症状がなくても受診．意識がおかしい・ろれつが回らないときは救急要請"],"evaluation":{"timing":"毎勤務（穿刺部・皮膚・便・バイタル），採血結果ごと，処置の前後，薬の変更時，1 週間ごと","indicators":["処置・輸血を要する出血や頭蓋内出血がない","穿刺部・創部の出血・血腫が拡大していない（マーキングで確認）","Hb・血小板・INR／APTT が医師の目標範囲で安定している（値は施設基準・医師の指示）","出血の徴候が発見時に報告され，対応が記録されている","患者・家族が出血のサインと受診の目安，薬を続ける理由を言える"],"revise_if":"出血・血腫が出た／転倒・頭部打撲があった／Hb・血小板の低下や INR の上昇があった／抗血栓薬が追加・増量・再開された／処置・手術が予定された／血栓溶解療法・ヘパリン持続投与が始まった"},"cardio_ward_notes":["PCI 後の 2 剤抗血小板療法（DAPT），心房細動の抗凝固薬，機械弁のワルファリン，ステント＋心房細動の 3 剤併用など，循環器病棟では『出血しやすい薬を止められない』患者が多い．出血を見つけても看護師が薬を止める判断はせず，止血と報告を最優先にする（antithrombotic_management，post_pci，post_valve_replacement 参照）","大腿穿刺後の後腹膜出血は外から見えず，腰痛・血圧低下・Hb 低下で気づく．橈骨穿刺は前腕の腫れ・しびれ（コンパートメント症候群）に注意する（post_pci，cardiac_cath_periop 参照）","IABP・ECMO・大腿シース留置中はヘパリンが持続投与され，刺入部の出血・血腫と下肢の虚血を訪室ごとに確認する．ルートの自己抜去は致命的（line_self_removal_risk 参照）","開心術後はドレーン排液の急増・鮮血・心タンポナーデ（血圧低下・頻脈・頸静脈怒張・尿量減少）を疑い，発見時に院内の緊急対応へ．ペースメーカ植込み後の創部血腫は抗凝固薬で増え，感染につながる","血栓溶解療法後（心筋梗塞・肺塞栓・脳梗塞）は頭蓋内出血の観察（頭痛・意識・麻痺・瞳孔）を頻回に．脳神経外科併設の施設として，抗血栓薬中の脳出血・慢性硬膜下血腫は転倒後に遅れて出ることを念頭に置く（intracerebral_hemorrhage，chronic_subdural_hematoma 参照）","出血による貧血は心不全を悪化させ，頻脈は虚血を誘発する．β遮断薬で頻脈が隠れるため，血圧低下・冷汗・尿量減少・意識変化を重視する（anemia_cardiac 参照）"],"sources":[{"name":"Open RN Health Alterations, 3.10 Thrombocytopenia（Bleeding Precautions：柔らかい歯ブラシ・電動かみそり・筋注や浣腸の回避・出血徴候の教育）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/3-10-thrombocytopenia/","license":"CC BY 4.0","note":"出血予防策の体系を参考（NIC の文言は転載しない）"},{"name":"Open RN Health Alterations, 3.3 General Hematological System Assessment","url":"https://wtcs.pressbooks.pub/healthalts/chapter/3-3-general-hematological-system-assessment/","license":"CC BY 4.0","note":"出血徴候の観察項目"},{"name":"Open RN Nursing Skills 2e, 23.4 IV Therapy Site Assessment & Complications","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/23-4-iv-therapy-site-assessment-complications/","license":"CC BY 4.0","note":"刺入部の血 師へ"},{"name":"D ダイマー・下肢静脈エコー","license":"一般的検査（事実）","note":"検査の要否は医師が判断．D ダイマーは術後・炎症・心不全でも上がる"}],"assessment_points":["入院時・手術の前後・安静度の変更時にリスクを評価し，予防法（早期離床・足関節運動・弾性ストッキング・間欠的空気圧迫・抗凝固薬）が指示されているか確認する","下肢を毎日見る：左右差のある腫れ・痛み・熱感・色の変化．片側のふくらはぎの腫れは要注意．脳卒中の麻痺側，中心静脈カテーテル・リード側の上肢も見る","肺塞栓の徴候（急な息切れ・胸痛・頻脈・SpO2 低下・失神・冷汗）は発見時に院内の緊急対応へ．初回離床・排便後・体位変換後に起きやすい","弾性ストッキング・間欠的空気圧迫の適応と禁忌（末梢動脈疾患・皮膚障害・急性の深部静脈血栓症の疑い）を確認し，装着状態と皮膚を毎勤務確認する","抗凝固薬の投与状況と出血リスク（bleeding_risk）を同時に見る"]},"goals":{"long_term":"入院中，深部静脈血栓症・肺塞栓症を起こさず，安全に活動を広げて退院できる","short_term":["入院時／術前：VTE リスク評価と予防法の指示が確認され，ベッドサイドで共有されている","毎日：指示された予防法（離床・足関節運動・弾性ストッキング・間欠的空気圧迫・抗凝固薬）が実施されている（記録）","毎勤務：下肢の腫れ・痛み・左右差が観察され，異常は発見時に医師へ報告されている","安静度が上がるごと：初回離床時に呼吸・SpO2・脈拍の異常がなく，段階的に活動が広がっている","退院前：患者が足の運動・水分のとり方・症状（片足の腫れ・急な息切れ）と受診の目安を言える"]},"OP":["下肢：腫れ（周径の左右差），痛み・圧痛，熱感，色（赤み・暗赤色），表在静脈の怒張（毎日）","上肢：中心静脈カテーテル・ペースメーカリード側の腫れ・痛み・静脈の怒張","呼吸・循環：息切れ，胸痛，頻呼吸，SpO2 低下，血痰，頻脈，冷汗，失神・気が遠くなる感じ（肺塞栓）","安静度と実際の活動量（座位・歩行の回数），臥床時間","予防法の実施状況：足関節運動の回数，弾性ストッキングの装着（しわ・ずれ・サイズ），間欠的空気圧迫装置の作動と装着時間，中断の理由","弾性ストッキング・装置による皮膚トラブル（発赤・水疱・圧迫痕），末梢の血流（足背動脈・色・温度）","抗凝固薬の投与状況（薬名・用量・時刻・休薬）と出血の徴候","水分バランス：脱水の徴候（口渇・皮膚の乾燥・尿量減少・Ht 上昇），利尿薬の使用と心不全の水分制限","採血：D ダイマー，血小板（ヘパリン使用中の HIT），腎機能（DOAC の用量）","下肢静脈エコー・造影 CT の結果","心電図モニタ：突然の頻脈，右心負荷を示す変化"],"TP":["早期離床：安静度の範囲で座位・立位・歩行を進める（循環器の安静指示・穿刺部の安静時間を優先）．離床できない間はベッド上で足首の曲げ伸ばし運動と下肢の挙上を促す（目安は 1 時間に数回．痛みや呼吸状態で調整）","弾性ストッキング：指示があれば正しいサイズを選び，しわ・ずれなく装着する．末梢動脈疾患・皮膚障害・急性の深部静脈血栓症の疑いがあれば装着前に医師へ確認．急性期脳卒中で歩けない患者では予防効果が確認されておらず皮膚障害の問題もあるため，標準の選択肢とせず，間欠的空気圧迫や薬物予防の個別指示に従う．1 日 1 回は外して皮膚と血流を確認する","間欠的空気圧迫装置：指示に従い，離床時以外は続けて装着する．急性の血栓が疑われる下肢には装着せず医師へ","抗凝固薬：指示どおり投与し（皮下注射は部位を変え，注射部位の血腫を観察），出血の徴候を同時に観察する（bleeding_risk 参照）","脱水を避ける：水分制限のある心不全患者では，制限の範囲で摂取できているか，利尿薬で脱水になっていないかを医師と確認する（一律に水分を増やさない）","下肢を圧迫する体位・膝の下の枕・長時間の足の交差を避ける．麻痺側は良肢位を保つ","便秘の予防（いきみは静脈還流を急に変える．constipation_straining 参照）","深部静脈血栓症を疑ったら（片側の腫れ・痛み）：その脚のマッサージや強い運動をせず，安静にして医師へ報告し，検査（エコー・D ダイマー）の指示を確認する．弾性ストッキング・圧迫装置の中止は医師と相談","肺塞栓を疑ったら（急な息切れ・胸痛・SpO2 低下・頻脈・失神）：直ちに応援を呼び，酸素投与と院内の緊急対応へ．離床直後は特に注意し，患者を一人にしない","診断後は抗凝固療法・血栓溶解療法の指示に従い，出血の観察と安静度を確認する（疾患別リスト dvt，pe 参照）"],"EP":["患者へ：寝ている時間が長いと足に血栓ができること，足首を動かす運動・寝返り・許可された範囲で歩くことが予防になること","患者へ：弾性ストッキング・空気圧迫装置の目的と正しい着け方．外したままにしない，皮膚が痛い・かゆいときは知らせる","患者へ：片足だけ腫れる・痛い，急に息が苦しい・胸が痛い・気が遠くなるときはすぐに知らせること（退院後は救急要請）","患者へ：水分は医師の指示の範囲でこまめに（心不全の制限内），便秘を避ける","患者へ（抗凝固薬）：飲み忘れない・自己判断でやめない，出血のサイン","家族へ：面会時に足の運動を促す，長時間同じ姿勢で座らせない"],"evaluation":{"timing":"毎勤務（下肢・呼吸）と 1 週間ごと，安静度の変更時，手術・処置の前後","indicators":["深部静脈血栓症・肺塞栓症の発症がない","指示された予防法の実施（離床・運動・ストッキング・圧迫装置・抗凝固薬）が記録で確認できる","下肢の腫れ・痛みの左右差がない，または発見時に報告・検査されている","弾性ストッキング・装置による皮膚障害がない","患者が予防行動と症状・受診の目安を言える"],"revise_if":"下肢の腫れ・痛みが出た／急な息切れ・胸痛があった／安静度が変わった（臥床の延長・手術）／抗凝固薬が休薬・中止された／脱水・感染・がんが判明した／中心静脈カテーテル・リードが入った"},"cardio_ward_notes":["心不全の急性期は臥床・静脈うっ滞・利尿薬による脱水が重なり血栓ができやすい．一方で水分負荷は心不全を悪化させるため，『脱水予防』は水分制限と医師の指示の範囲で行う（fluid_overload，fluid_deficit 参照）","カテーテル後の大腿穿刺の安静，IABP・ECMO 中の下肢屈曲制限は VTE リスクを上げる．安静解除後の初回歩行で肺塞栓が起きることがあり，立位直後の息切れ・失神に注意する","弾性ストッキング・間欠的空気圧迫は，閉塞性動脈硬化症・急性動脈閉塞・下肢の虚血（IABP・ECMO の挿入側）では禁忌または要注意．足背動脈の触知と色・温度を確認してから使う（pad，acute_limb_ischemia 参照）","心房細動・機械弁で抗凝固薬を飲んでいる患者は VTE の予防効果もあるが，処置前の休薬期間中は無防備になる．休薬・ヘパリン置換の指示を確認する（antithrombotic_management 参照）","肺塞栓は右心不全・ショック・心停止を起こしうる．突然の頻脈・低血圧・SpO2 低下は心筋梗塞・不整脈と区別がつきにくいので，一人で判断せず院内の緊急対応へ（pe 参照）","ペースメーカ・ICD 植込み後の同側上肢の腫れは静脈血栓を疑う．中心静脈カテーテル留置側も同様（cied_management 参照）"],"sources":[{"name":"Open RN Health Alterations, 5.11 Deep Vein Thrombosis（予防介入：早期離床・下肢運動・圧迫・LMWH，出血予防，患者教育）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-11-deep-vein-thrombosis-2/","license":"CC BY 4.0","note":"Homans 徴候の限界についての記述も参照"},{"name":"Open RN Nursing Fundamentals 2e, 13.2 Basic Concepts（Mobility：不動の合併症と DVT）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-2-basic-concepts/","license":"CC BY 4.0","note":""},{"name":"Open RN Health Alterations, 2.5 Postoperative Nursing Care","url":"https://wtcs.pressbooks.pub/healthalts/chapter/2-5-postoperative-nursing-care/","license":"CC BY 4.0","note":"術後の VTE 予防"},{"name":"NHLBI: Venous Thromboembolism","url":"https://www.nhlbi.nih.gov/health/venous-thromboembolism","license":"パブリックドメイン","note":"リスク因子・症状・予防"},{"name":"MedlinePlus: Deep Vein Thrombosis（Health Topic）","url":"https://medlineplus.gov/deepveinthrombosis.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Pulmonary Embolism（Health Topic）","url":"https://medlineplus.gov/pulmonaryembolism.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus Medical Encyclopedia: Compression stockings","url":"https://medlineplus.gov/ency/patientinstructions/000597.htm","license":"パブリックドメイン（A.D.A.M. 提供部分は出典表示）","note":"着け方・皮膚の注意"},{"name":"MedlinePlus Medical Encyclopedia: Pulmonary embolus","url":"https://medlineplus.gov/ency/article/000132.htm","license":"パブリックドメイン（A.D.A.M. 提供部分は出典表示）","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"skin_damage_risk","group":"安全・リスク","problem":"浮腫・失禁・医療機器による皮膚障害のリスクがある（失禁関連皮膚炎・皮膚裂傷・機器の圧迫・テープ剥離）","problem_plain":"むくんだ皮膚は薄く裂けやすく，尿や便で濡れた皮膚はただれ（失禁関連皮膚炎），酸素マスク・弾性ストッキング・モニタ・固定テープなどが当たったり剥がしたりすると皮膚が傷む．高齢で皮膚が薄い人，抗凝固薬やステロイドを使っている人は特に起きやすい．原因（湿潤・摩擦・テープ・機器の圧迫）で分けて予防する．機器の圧迫による傷は褥瘡の仲間として扱い，自重による褥瘡（pressure_injury）と区別しつつ施設の褥瘡管理から外さない．","applies_when":["下肢・仙骨部・陰部・上肢にむくみ（浮腫）がある（心不全・腎不全・低アルブミン）","尿・便失禁があり，オムツ・パッドを使っている．下痢がある","高齢で皮膚が薄い・乾燥している，ステロイド・抗凝固薬を使っている，紫斑や皮膚裂傷の既往がある","医療機器が皮膚に接している：酸素マスク・カニューラ，NPPV マスク，弾性ストッキング，間欠的空気圧迫装置，SpO2 プローブ，モニタ電極，尿道カテーテル，点滴・動脈ライン・IABP・ECMO の固定，頸椎カラー","テープ・ドレッシング・電極の貼り替えが多い（点滴の固定，創部のドレッシング，モニタ電極の交換）","発汗が多い，皮膚が湿っている，肥満で皮膚が重なる部分（間擦部）がある","移乗・体位変換で皮膚が引っ張られる，ベッド柵や車いすにぶつける","低栄養，低灌流（ショック・血管作動薬），糖尿病がある"],"related_factors":["浮腫：皮膚が引き伸ばされて薄くなり血流が落ち，わずかな外力で裂ける・水疱ができる","湿潤：尿・便・汗・浸出液で皮膚がふやけ，便の消化酵素や pH の変化で皮膚が傷む","摩擦・ずれ・剥離：テープや電極の剥離，移乗時の引きずり，ベッド柵への接触，掻く行為","機器の圧迫：マスク・チューブ・ストッキングの縁・プローブ・固定具による局所の圧迫と湿潤","皮膚の脆弱性：加齢，ステロイド，抗凝固薬（紫斑・血腫），低栄養，乾燥，糖尿病，末梢循環障害","ケアの方法：洗浄時のこすり，強いアルカリ性の洗浄剤，オムツの重ね敷き，保湿の不足"],"assessment":{"scales":[{"name":"厚労省「褥瘡対策に関する診療計画書」の危険因子評価のうち，皮膚湿潤・浮腫・皮膚の脆弱性の項目","license":"厚労省サイト（PDL1.0）","note":"褥瘡の評価と共有して使う．皮膚障害専用の尺度ではないので，機器接触部位・テープ部位は別に記録する"},{"name":"失禁関連皮膚炎・皮膚裂傷・医療関連機器圧迫創傷の分類（施設で使用中のもの）","license":"学会等の分類は権利に注意（license_check.md に未収載）．施設の運用に従い，文言はアプリに載せない","note":"発生後の重症度の記録用．予防計画では発生の有無・部位・原因を記録する"},{"name":"皮膚の観察表（施設の様式：部位・浮腫の程度・湿潤・機器接触部位・テープ部位）","license":"施設の様式を使う","note":"入院時と毎勤務の観察を同じ表で追う"}],"assessment_points":["入院時に全身の皮膚を見る（浮腫，乾燥，紫斑，既存の傷，間擦部，機器の接触部位，テープ部位）．機器の追加・失禁の出現・浮腫の増減・利尿の進行で再評価する","失禁による皮膚炎は，尿・便が当たる範囲に広がる赤み・びらん・ヒリヒリした痛みで，骨の出っ張りに一致する褥瘡と区別する．両方が重なることもある","機器の当たる部位は機器を外す（または位置をずらす）ことで皮膚を直接見る．目安は毎勤務（NPPV マスクや弾性ストッキングは施設の手順で）","浮腫の程度と経過を見る（利尿で減ってくる時期は皮膚がたるみ，摩擦・裂傷が増える）．下肢からの浸出（リンパ漏）の有無","皮膚裂傷・紫斑は抗凝固薬による内出血と区別し，出血が止まりにくい場合は bleeding_risk も併用する"]},"goals":{"long_term":"入院中，失禁関連皮膚炎・皮膚裂傷・医療機器による皮膚障害・テープ剥離による損傷を起こさず，皮膚を清潔で潤いの保たれた状態に保つ","short_term":["入院時：皮膚の状態と機器接触部位・失禁・浮腫が記録され，予防方法（洗浄・保護・固定材・機器の位置替え）が決まっている","毎勤務：機器の当たる部位・テープ部位・オムツ内の皮膚が観察され，赤み・びらん・水疱があれば発見時に対処と報告がされている","毎日：失禁後の洗浄と皮膚保護剤の塗布，保湿が実施されている","1 週間以内：新たな皮膚障害がなく，既存の赤み・びらんが拡大していない","退院前：家族が皮膚の見方・洗い方・保湿・オムツの当て方を実施できる（必要な患者）"]},"OP":["全身の皮膚：赤み，びらん，水疱，裂傷，紫斑，乾燥，ふやけ（浸軟），浸出液（毎日．体位変換・清拭・オムツ交換のとき）","失禁の有無・回数・性状（水様便は特に皮膚を傷める），オムツ・パッド内の湿り具合と交換の間隔","浮腫の部位・程度（押してへこむか）・経過，下肢の皮膚の張り・光沢・浸出，利尿薬の効果と体重の変化","医療機器の接触部位：酸素マスク・カニューラ（鼻・耳・頬），NPPV マスク（鼻根部・頬），SpO2 プローブ（指），弾性ストッキング・圧迫装置（縁・かかと・膝裏），尿道カテーテル（尿道口・大腿内側），ルート固定部，モニタ電極","テープ・ドレッシングのはがれ・かゆみ・赤み，剥がしたときの表皮のはがれ","間擦部（乳房の下・鼠径・腹部のしわ・腋窩）の湿潤・赤み・臭い","かゆみの訴えと掻く行動（乾燥・薬剤・肝や腎の障害）","栄養・水分：食事摂取量，アルブミン，体重，脱水","皮膚を脆くする薬：ステロイド，抗凝固薬・抗血小板薬，血管作動薬（末梢循環の低下）","移乗・体位変換の方法（引きずり・ベッド柵への接触）と介助者の人数","患者の訴え：痛み，ヒリヒリ感，機器の当たりの不快"],"TP":["失禁したら速やかに洗浄する：弱酸性の洗浄剤とぬるま湯でこすらず押さえ洗い，押さえ拭き．拭き取りだけの繰り返しは避ける","洗浄後は皮膚保護剤（撥水性クリーム・皮膚被膜剤）で尿・便から皮膚を守る．乾燥している部位は保湿剤を 1 日 1〜2 回（施設の採用品）","オムツ・パッドは吸収力に合ったものを 1 枚で使い，重ね敷きしない．濡れたら早めに交換する．可能なら排泄パターンに合わせたトイレ誘導・ポータブルトイレで失禁自体を減らす（urinary_issues 参照）．水様便が続くときは原因（下剤・抗菌薬・経管栄養）を医師・薬剤師と相談","浮腫のある皮膚は引っ張らない・こすらない．移乗はスライディングシートや 2 人介助で持ち上げる．ベッド柵・車いすのフレームにはカバー，長袖・レッグウォーマーで保護．爪は短く．下肢の挙上は心機能と医師の指示の範囲で","医療機器：接触部位を毎勤務観察し，可能な機器は位置を少しずつ変える（SpO2 プローブ・電極は指示の間隔で貼り替え，カニューラの耳あてにはクッション）．マスク・ストッキングは正しいサイズを選び，締めすぎない．皮膚保護材を挟むかは施設基準","テープ・ドレッシング：皮膚に負担の少ない固定材を選び，貼るときは引っ張らず，剥がすときは皮膚を押さえて低い角度でゆっくり，必要なら剥離剤を使う．同じ場所への貼り直しを避ける．剥がすときに表皮がはがれる患者は皮膚被膜剤を使う","弾性ストッキング・圧迫装置：しわ・ずれをなくし，1 日 1 回は外して皮膚と血流を確認する．発赤・水疱があれば中止して医師へ（末梢動脈疾患では装着自体を医師に確認）","皮膚裂傷ができたら：出血を圧迫止血し（抗凝固薬中は長めに），皮弁があればもとの位置に戻して非固着性のドレッシングで保護．剥がす方向をドレッシングに書く．医師・皮膚排泄ケア認定看護師に報告する","赤み・びらん・水疱を見つけたら原因（湿潤・機器・テープ・摩擦）を特定して取り除き，原因の分類を記録する．機器の圧迫による傷は褥瘡に含めて pressure_injury と連携して評価・報告し，施設の褥瘡管理から外さない．改善しなければ医師・皮膚科・皮膚排泄ケア認定看護師へ","間擦部は洗浄して乾かし，皮膚同士が触れる部分に吸湿性の素材を挟む（施設の採用品）","栄養・水分を整える（管理栄養士と連携）．かゆみは保湿と原因の検索（薬剤・腎・肝）を医師と"],"EP":["患者へ：皮膚が薄く傷つきやすい状態であること．ぶつけない・掻かない・テープを自分で剥がさない","患者へ：オムツやパッドが濡れたら遠慮なく知らせる（放置がただれの原因）．マスクやストッキングが痛い・かゆいときも知らせる","患者へ：入浴・清拭のあとの保湿と，こすらず押さえて洗う方法","家族へ：面会時に皮膚の赤み・傷を見つけたら看護師へ．ベッド柵に足や腕をぶつけないよう注意","家族へ：退院後の洗浄・保湿・オムツの当て方・皮膚保護剤の使い方を退院前に一緒に練習する．在宅で酸素・弾性ストッキングを使う場合は当たる部位の見方","患者へ：抗凝固薬で内出血しやすいこと．紫斑が広がる・血が止まらないときは知らせる"],"evaluation":{"timing":"毎勤務（機器接触部位・オムツ内），1 週間ごと，浮腫の増減・失禁の出現・機器の追加時","indicators":["失禁関連皮膚炎・皮膚裂傷・機器による赤み／水疱／びらん・テープ剥離による損傷の新規発生がない","既存の皮膚障害が拡大せず，改善している","失禁後の洗浄・保護剤・保湿が記録どおり実施されている","機器接触部位の観察と位置替え・テープ交換が記録で確認できる","患者・家族が皮膚の保護方法を実践できている"],"revise_if":"新たな皮膚障害ができた／失禁・下痢が始まった／浮腫が増えた，または利尿で急に減った／機器・ルートが増えた（NPPV・IABP・ECMO・弾性ストッキング）／ステロイド・血管作動薬が始まった／低栄養が進んだ"},"cardio_ward_notes":["心不全の下肢浮腫は皮膚が薄く光沢を帯び，わずかな摩擦で裂けたり浸出液がにじむ．利尿が進んで浮腫が引く時期はたるんだ皮膚がずれやすく別の傷ができる．どちらの時期も観察を増やす（fluid_overload 参照）","利尿薬の効く時間帯は失禁が増え，オムツ内の湿潤が長引く．投与時刻に合わせたトイレ誘導とパッド交換の計画を立て，夜間の交換は転倒予防と両立させる（fall_risk 参照）","NPPV（マスクによる人工呼吸）のマスクは鼻根部・頬に圧迫創をつくりやすい．装着中も定期的に皮膚を確認し，保護材やマスクの種類の変更を医師・臨床工学技士と相談する（impaired_gas_exchange 参照）","IABP・ECMO・動脈ライン・大腿シースの固定テープと屈曲制限で，同じ部位への圧迫と剥離が繰り返される．ルートの安全（line_self_removal_risk）を優先しつつ，固定材の種類と貼り替えの方法を統一する","抗凝固薬・抗血小板薬・ステロイドを使う患者は紫斑・血腫・皮膚裂傷が出やすく，小さな傷でも出血が止まりにくい．テープの剥離と移乗時の摩擦を減らす","低心拍出・血管作動薬使用中は末梢の血流が落ち，SpO2 プローブ・弾性ストッキング・圧迫装置による皮膚障害と虚血が同時に起こりうる．接触部位の色・温度・痛みを確認し，虚血が疑われれば装着を見直して医師へ（peripheral_perfusion 参照）"],"sources":[{"name":"厚生労働省 褥瘡対策に関する診療計画書（令和 8 年度 基本診療料の施設基準等 通知 保医発0305第7号 別紙 3，p.306-307）","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0（CC BY 4.0 互換）","note":"危険因子（皮膚湿潤・浮腫・皮膚の脆弱性）の項目を共有"},{"name":"Open RN Nursing Fundamentals 2e, 10.2 Integumentary Basic Concepts","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/10-2-integumentary-basic-concepts/","license":"CC BY 4.0","note":"皮膚の加齢変化と脆弱性"},{"name":"Open RN Nursing Fundamentals 2e, 10.3 Wounds","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/10-3-wounds/","license":"CC BY 4.0","note":"皮膚裂傷・摩擦・ずれ・湿潤による損傷"},{"name":"Open RN Nursing Fundamentals 2e, 16.4 Urinary Incontinence","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/16-4-urinary-incontinence/","license":"CC BY 4.0","note":"失禁のケアと皮膚保護"},{"name":"Open RN Nursing Skills 2e, 14.2 Basic Integumentary Concepts","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/14-2-basic-integumentary-concepts/","license":"CC BY 4.0","note":""},{"name":"Open RN Nursing Skills 2e, 14.3 Common Integumentary Conditions","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/14-3-common-integumentary-conditions/","license":"CC BY 4.0","note":""},{"name":"Open RN Nursing Skills 2e, 23.4 IV Therapy Site Assessment & Complications","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/23-4-iv-therapy-site-assessment-complications/","license":"CC BY 4.0","note":"固定部の皮膚観察"},{"name":"MedlinePlus: Edema（Health Topic）","url":"https://medlineplus.gov/edema.html","license":"パブリックドメイン","note":"患者向け説明"},{"name":"MedlinePlus: Urinary Incontinence（Health Topic）","url":"https://medlineplus.gov/urinaryincontinence.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Skin Conditions（Health Topic）","url":"https://medlineplus.gov/skinconditions.html","license":"パブリックドメイン","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"low_cardiac_output","group":"循環・呼吸","problem":"心拍出量の低下により全身の循環が保てない","problem_plain":"心臓が 1 回に送り出す血液が減り，脳・腎臓・手足など全身に血が届きにくくなっている状態．血圧が下がる，尿が減る，手足が冷たくなる，ぼんやりするなどが目印で，心不全の悪化・心原性ショック・重い不整脈・心臓手術後に起こる．昇圧薬や IABP などの補助循環で支えている間は，機器と体の両方を見続ける必要がある．","applies_when":["急性心不全・心不全の急性増悪で，血圧低下・尿量減少・四肢冷感のいずれかがある","心原性ショック，またはその疑い（血圧が保てず，臓器の血流不足のサインがある）","昇圧薬・強心薬（ノルアドレナリン・ドブタミンなど）を持続投与している","IABP・ECMO・Impella などの補助循環，一時ペーシングを使用している","心臓手術・カテーテル治療の直後で循環が安定していない","血行動態に影響する不整脈（持続する頻脈・高度徐脈）がある","広い心筋梗塞，重症の弁膜症，心筋炎，心タンポナーデの疑いなど心機能が急に落ちる病態","低心機能（EF 低下）で，感染・脱水・出血など全身状態が変化した"],"related_factors":["心筋の収縮力低下：心筋梗塞・心筋症・心筋炎・術後の心筋ダメージ","心拍数・リズムの異常：頻脈で心室が満たされない，徐脈で拍出回数が足りない，心房細動で心房の押し出しがなくなる","前負荷の異常：脱水・出血・過度の利尿で戻ってくる血液が足りない，逆にうっ血で心臓が伸びきっている","後負荷の増大：高血圧・血管収縮で心臓が押し出しにくい","機械的な原因：弁の逆流・狭窄，心室中隔穿孔，心タンポナーデ，肺塞栓","薬剤：β遮断薬・Ca 拮抗薬・抗不整脈薬・鎮静薬による血圧低下・徐脈","電解質異常・低酸素・アシドーシス・感染（敗血症の合併）"],"assessment":{"scales":[{"name":"低灌流のサインの観察セット（意識・血圧と脈圧・心拍数・毛細血管再充満時間・四肢の冷感と色・時間尿量・乳酸値）","license":"一般的手技（事実）","note":"「うっ血があるか（湿／乾）」と「灌流が保てているか（温／冷）」の 2 軸で全体像をつかむ考え方が広く使われる．冷たく湿っている（低灌流＋うっ血）が最も重い．判断の閾値（血圧・尿量・乳酸値）は施設基準・医師の指示"},{"name":"意識レベル（JCS または GCS）と毛細血管再充満時間（爪を押して色が戻るまでの秒数）","license":"一般的手技（事実）．Open RN Health Alterations 5.3 では約 2〜3 秒以内を目安とする","note":"低体温・末梢血管収縮・昇圧薬でも延びるので，血圧・尿量・意識と合わせて見る"},{"name":"施設の急変予測スコア・バイタルサイン報告基準（早期警告スコア等）","license":"施設の様式を使う","note":"報告の閾値と連絡先（当直医・RRT・CCU）は施設基準に従う"},{"name":"厚労省「重症度，医療・看護必要度」A 項目（自院が届け出ている病棟区分・必要度 I／II・適用年度の評価票の正式な項目名で確認する）","license":"厚労省サイト（PDL1.0）","note":"看護の手間の評価であり，重症度そのものの尺度ではない．一般病棟用と ICU・HCU 用では項目が異なる（心電図モニターの管理は一般病棟用にはなく，ポンプ類は「シリンジポンプの管理」で一般の輸液ポンプは含まない）ため，臨床上のモニタ観察と診療報酬上の評価は分けて考え，実施内容・薬剤が当該評価票の定義を満たす場合だけ評価する"}],"assessment_points":["「血圧の数字」だけでなく「臓器に血が届いているか」で見る：意識がはっきりしているか，尿が出ているか，手足が温かいか，乳酸値が下がっているか．血圧が保てていても尿量減少・四肢冷感・意識の変化があれば低灌流を疑う","うっ血の有無を同時に評価する：起坐呼吸・肺の湿性ラ音・頸静脈怒張・浮腫・体重．低灌流とうっ血が重なると，利尿と昇圧の両方が必要になり管理が難しい．疾患別リスト「急性心不全」「心原性ショック」の観察項目と合わせて見る","原因と誘因を探す：心筋梗塞の再燃（胸痛・ST 変化・トロポニン），不整脈，出血・脱水，感染，薬剤（降圧薬・鎮静薬の投与直後），心タンポナーデ（急な血圧低下＋頸静脈怒張）","昇圧薬・強心薬・補助循環を使っている患者は「薬や機器で支えられた状態」であることを前提に，設定・投与量・ラインの状態を含めて評価する","本人の不安・恐怖と，家族の受け止め・意思決定の状況を早い段階で把握する（急に重症化しうるため）"]},"goals":{"long_term":"循環が安定して臓器障害を最小限にとどめ，昇圧薬・補助循環から離脱して回復期の治療（心臓リハビリ・セルフケア指導）へ移行できる","short_term":["毎勤務：意識・血圧・心拍数・時間尿量・四肢の冷感・乳酸値が施設基準・医師の指示する範囲に保たれ，悪化のサインは発見時に速やかに報告されている","投与開始・接続変更・シリンジ交換・引き継ぎの各時点：昇圧薬・強心薬の投与量とラインの接続先がその都度照合され，血管外漏出・重複投与・ラインの絡みがない状態が 24 時間を通して保たれている","補助循環使用中：穿刺部の出血・下肢の虚血・機器の警報が毎勤務チェックされ，異常は発見時に報告されている","48 時間以内：うっ血と低灌流の両方の所見が改善傾向にある（体重・浮腫・呼吸苦・尿量・冷感で評価）","本人・家族が状態と治療方針の説明を受け，質問できている"]},"OP":["意識レベル・見当識・不穏の有無（脳への血流低下は「ぼんやり」「落ち着かない」から始まる）","血圧（動脈ライン使用時は波形と非観血の照合），脈圧の狭さ，心拍数・リズム，モニタ心電図（頻脈・徐脈・心室性不整脈・ST 変化）","時間尿量・水分出納・体重（尿量減少は低灌流の早いサイン．腎機能 Cr・BUN の推移）","末梢循環：手足の冷感・色（蒼白・チアノーゼ・網状皮斑）・毛細血管再充満時間・末梢の脈","呼吸：呼吸数・SpO2・呼吸様式・起坐呼吸・肺の湿性ラ音・血液ガス（酸素化・pH・乳酸値）","うっ血のサイン：頸静脈怒張・浮腫・肝腫大・腹部膨満・胸部 X 線の肺うっ血","採血：乳酸値・トロポニン・BNP／NT-proBNP・電解質（K・Na・Mg）・腎機能・肝機能・血糖・凝固","昇圧薬・強心薬：投与量・シリンジ交換のタイミングと交換時の血圧変動・ラインの刺入部（血管外漏出・発赤・腫脹）・ポンプの警報","補助循環（IABP・ECMO・Impella）：機器の作動状況と警報・設定値，穿刺部の出血・血腫，穿刺側下肢の脈・色・温度・感覚，抗凝固中の出血徴候と ACT／APTT","一時ペーシング中：ペーシングとセンシングの状況，刺入部・固定，設定した心拍数と実際の脈の一致","胸痛・心雑音の変化・急な血圧低下（再梗塞・機械的合併症・心タンポナーデ）","体温・感染徴候（ライン刺入部・肺炎・尿路），皮膚の状態（低灌流と浮腫で褥瘡ができやすい）．本人の訴え（息苦しさ・不安・痛み）と家族の様子"],"TP":["低灌流のサイン（意識の変化・尿量減少・四肢冷感・血圧低下）や新しい不整脈を見つけたら，発見時に速やかに医師へ報告する．呼吸・循環の急な悪化は院内の緊急対応（RRT・コードコール）へ．蘇生の方針（DNAR の有無）を事前に確認しておく","昇圧薬・強心薬は指示量を厳守し，投与量とラインの接続先を投与開始・接続変更・シリンジ交換・引き継ぎの各時点で照合する．増減は医師の指示に基づいて行う．投与量を変えた後は血圧・心拍数・不整脈を続けて確認する．独断で減量・中止しない","薬剤ラインを整理する：昇圧薬は専用ルートにし，側管からの急速注入や同じルートでのフラッシュを避ける．ラインは患者側からたどって接続先を表示する．シリンジ交換は血圧が途切れないよう施設手順（並行交換など）で行う","動脈ライン・中心静脈ラインの固定・刺入部・波形を確認し，動脈ラインの接続外れ（大量出血）に備えて警報を有効にしておく","体位・処置は循環の変動を見ながら最小限に：体位変換・吸引・清拭は血圧と心拍数を見ながら分けて行い，実施後の変化を記録する．IABP 中は挙上角度と下肢の屈曲の制限を施設手順に従う","安静度は指示に従い，安静中もできる範囲の小さな体のずらし・関節可動域運動・皮膚保護で褥瘡と廃用を防ぐ（褥瘡計画と連動）","酸素・NPPV・人工呼吸は指示に従い管理し，酸素化が悪いときは早めに報告する（ガス交換の計画と連動）","水分出納と時間尿量を正確に記録し，点滴の総量・速度を厳守する．利尿薬・輸液の指示変更後は尿量と血圧を追う","補助循環中は穿刺部の圧迫・固定，穿刺側下肢の循環（脈・色・温度）を毎勤務以上に確認し，出血・虚血の徴候は発見時に報告する．機器の警報は消音せず，原因を確認して対応する","せん妄予防（見当識・睡眠・家族の声かけ）と，ライン・機器の自己抜去を防ぐ観察を強める（せん妄計画と連動）","本人には処置の前に短く声をかけ，状況を説明する．家族には状態が急に変わりうることと連絡体制を伝え，医師からの説明の場と意思決定支援（本人の意向の確認）を調整する","急変・蘇生に備えて救急カート・除細動器・気道確保物品の位置と点検状況を毎勤務確認し，役割を共有しておく"],"EP":["患者へ：息苦しさ・胸の痛み・めまい・気分の悪さは我慢せずすぐに知らせてほしいこと．動くときは必ず看護師に声をかけること","患者へ：点滴の薬（昇圧薬など）で血圧を支えていること，ラインを引っ張ったり自分で触ったりしないでほしいこと","患者へ：処置や体位変換のときに血圧が変わりやすいので，ゆっくり行うこと，つらければ途中で言ってよいこと","家族へ：状態は短時間で変わることがあり，連絡先と面会の方法を決めておくこと．医師の説明に同席し，わからないことは看護師に聞いてよいこと","家族へ：本人が話せるうちに治療の希望（延命治療・補助循環）を一緒に確認することの意味を伝え，話し合いの場を調整する","回復期に入ったら：心不全・心筋梗塞の再発予防（体重・塩分・薬・活動）の指導へつなぎ，ICU 後の不安・不眠・記憶の混乱が起こりうることを本人・家族に伝える"],"evaluation":{"timing":"毎勤務（急性期は施設基準の頻度で連続監視），および昇圧薬・補助循環の設定変更後，処置後，状態変化時","indicators":["意識・血圧・心拍数・時間尿量・乳酸値・四肢の温かさが施設基準・医師の指示する範囲にあり，改善傾向にある","昇圧薬・強心薬の投与量が減らせている，または補助循環から離脱の方向にある","昇圧薬の血管外漏出，ラインの事故，補助循環の穿刺部出血・下肢虚血が起きていない","うっ血の所見（呼吸苦・浮腫・体重）と低灌流の所見が両方とも改善している","本人・家族が状態と方針を理解し，希望を表明できている"],"revise_if":"血圧・尿量・乳酸値が悪化した／新しい不整脈・胸痛・心雑音が出た／昇圧薬を増やしても保てない／補助循環が導入・離脱された／感染・出血など新しい問題が加わった"},"cardio_ward_notes":["心原性ショックでは「血圧が保てているか」より「臓器に血が届いているか（意識・尿量・乳酸値・四肢冷感）」を追い続けるのが看護の要．目標血圧・尿量の値は施設の CCU プロトコルと医師の指示に従い，一律の値で判断しない","うっ血（湿）と低灌流（冷）の組み合わせで治療が変わる：うっ血だけなら利尿・血管拡張が中心，低灌流が加わると強心薬・昇圧薬・補助循環が必要になる．どちらの所見が増えているかを報告に含める","昇圧薬の投与ルートの取り扱い（側管注入・フラッシュ・シリンジ交換）で血圧が急変する．ラインを患者側からたどる確認と，交換時の手順を施設で統一する（厚労省 医療安全管理マニュアル作成例「注射」参照）","IABP・ECMO・Impella 中は体位変換の制限があるため褥瘡・廃用・せん妄のリスクが重なる．穿刺側下肢の虚血（冷たい・脈がない・痛み）と穿刺部出血は発見時に即報告","心筋梗塞後の急な血圧低下＋新しい心雑音は機械的合併症（乳頭筋断裂・心室中隔穿孔），血圧低下＋頸静脈怒張は心タンポナーデを疑う．いずれも院内の緊急対応へ","β遮断薬・降圧薬・利尿薬の投与直後の血圧低下は薬剤性のことがある．投与時刻と低下のタイミングを合わせて報告し，薬の調整は医師・薬剤師と行う"],"sources":[{"name":"Open RN Health Alterations, 5.8 Heart Failure（急性非代償性心不全の徴候・薬剤・看護介入）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-8-heart-failure/","license":"CC BY 4.0（WisTech Open）","note":"低心拍出の徴候・利尿薬と電解質・β遮断薬の注意を参考．NANDA-I ラベル表は使わない"},{"name":"Open RN Health Alterations, 5.3 General Cardiovascular System Assessment（毛細血管再充満時間・不整脈と心拍出量）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-3-general-cardiovascular-system-assessment/","license":"CC BY 4.0（WisTech Open）","note":"灌流評価の手技を参考"},{"name":"Open RN Nursing Skills 2e, 9.3 Cardiovascular Assessment","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/9-3-cardiovascular-assessment/","license":"CC BY 4.0（WisTech Open）","note":"末梢循環・浮腫・頸静脈の観察手順を参考"},{"name":"NHLBI Cardiogenic Shock（Symptoms／Treatment を含む）","url":"https://www.nhlbi.nih.gov/health/cardiogenic-shock","license":"米国政府著作物（パブリックドメイン）","note":"昇圧薬・強心薬・IABP・ECMO・VAD の位置づけを参考（https://www.nhlbi.nih.gov/health/cardiogenic-shock/treatment）"},{"name":"NHLBI Heart Failure: Treatment","url":"https://www.nhlbi.nih.gov/health/heart-failure/treatment","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Shock（Health Topic）","url":"https://medlineplus.gov/shock.html","license":"パブリックドメイン","note":"患者・家族向けの言い回しを参考"},{"name":"厚生労働省 医療安全管理マニュアル作成例（注射：点滴・輸液ポンプ・側管注入の確認）","url":"https://www.mhlw.go.jp/topics/bukyoku/isei/i-anzen/1/torikumi/naiyou/manual/2c.html","license":"PDL1.0","note":"ラインを患者側からたどる・輸液ポンプの警報時の確認を参考"},{"name":"厚生労働省 重症度，医療・看護必要度 評価票（令和 8 年度 通知 別紙 7）A 項目","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0","note":"心電図モニター・輸液ポンプ・シリンジポンプ・昇圧剤の項目を参考情報として"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"fluid_overload","group":"循環・呼吸","problem":"体液量が過剰でうっ血・浮腫がある","problem_plain":"心臓のポンプが弱って体に水分と塩分がたまり，肺に水がたまって息が苦しい（肺うっ血），足やおなかがむくむ，体重が急に増える状態．心不全の入院の多くはこれが理由で，利尿薬で余分な水を出しながら，出しすぎ（脱水・腎機能悪化・電解質異常）にも気をつける．","applies_when":["急性心不全・心不全の急性増悪で入院した","数日で体重が急に増えた（目安は施設の心不全手帳・主治医の指示に従う），下腿・仙骨部・腹部の浮腫がある","起坐呼吸（横になると苦しい）や夜間の発作的な呼吸苦がある，肺に湿性ラ音・胸水がある","頸静脈怒張・肝腫大・腹部膨満・食欲低下など右心不全のサインがある","利尿薬の静注や増量が始まった，または水分・塩分制限の指示がある","腎機能低下・低アルブミン・輸液量が多い（術後・大量輸液後）など水分がたまりやすい背景がある","心不全の誘因（塩分・水分の摂りすぎ・薬の中断・感染・不整脈・虚血）が疑われる"],"related_factors":["心機能低下：左心不全（肺うっ血）・右心不全（体のむくみ）・弁膜症・心筋症","塩分・水分の摂りすぎ，指示された制限を守れなかった（理解不足・嗜好・環境）","薬：利尿薬や心不全治療薬の中断・飲み忘れ，NSAIDs・ステロイド・一部の糖尿病薬など水をためる薬","腎機能低下・低アルブミン（ネフローゼ・肝硬変・低栄養）","誘因：感染・貧血・頻脈性不整脈（心房細動）・虚血・高血圧・甲状腺","輸液や輸血の量が多い，点滴速度が速い","安静臥床による下肢からの水分移動（夜間頻尿・臥位での呼吸苦）"],"assessment":{"scales":[{"name":"体重（毎日同じ条件：起床後・排尿後・同じ服・同じ体重計）と水分出納（飲水・輸液・食事の水分／尿量・便・排液）","license":"一般的手技（事実）","note":"体重は出納より信頼できる．体重の目標（ドライウェイト）と連絡の目安（何日で何 kg）は主治医の指示・施設の心不全手帳に従う"},{"name":"浮腫の評価（すね・足首・仙骨部を指で押し，へこみの深さと戻るまでの時間で段階づけ），頸静脈怒張，肺の副雑音","license":"一般的手技（事実）．Open RN Nursing Skills 2e 9.3 に段階づけの記載あり","note":"同じ部位を同じ人が同じ方法で追うと変化がわかる．臥床が長いと仙骨部・背部にたまる"},{"name":"NYHA 心機能分類（日常の活動でどの程度息切れ・疲れが出るか，I〜IV 度）","license":"一般に公開された機能分類（Open RN Health Alterations 5.8 に掲載）","note":"入院前の「いつもの状態」を知る目安．悪化・改善の判断は入院前の分類と比べる"},{"name":"施設の心不全手帳・セルフケアチェック表（体重・浮腫・息切れ・服薬）","license":"施設の様式を使う","note":"退院指導と評価に同じ表を使うと本人が続けやすい"}],"assessment_points":["「肺にたまっているか（左）」と「体にたまっているか（右）」を分けて見る：肺うっ血は呼吸数・SpO2・起坐呼吸・湿性ラ音・ピンク色の泡沫痰，体のうっ血は浮腫・頸静脈怒張・肝腫大・腹部膨満・食欲低下","低灌流のサイン（血圧低下・尿量減少・四肢冷感・意識の変化）が重なっていないかを毎回確認する．重なっていれば低心拍出の計画も立て，利尿の進め方を医師に確認する","利尿薬の効き方を追う：投与後の尿量の立ち上がり，血圧の変化，体重の減り方，K・Na・Cr の推移，口渇・めまい・筋けいれん（出しすぎのサイン）","誘因を本人・家族から聞き取る：塩分の多い食事・飲水量・薬の飲み忘れや中断・感冒・過労・他科の薬（NSAIDs など）．再発予防の指導に直結する","入院前のセルフケアの状況（体重測定の習慣・減塩の理解・服薬管理・支援者）を早い時期に把握する"]},"goals":{"long_term":"うっ血がとれて呼吸が楽になり，退院後も体重・塩分・水分・薬の管理を続けて再入院を防げる","short_term":["48 時間以内：起坐呼吸・夜間の呼吸苦が軽くなり，安静時の呼吸数・SpO2 が施設基準・医師の指示する範囲にある","毎日：体重が減少傾向にあり，尿量が確保されている（目標体重・尿量は医師の指示）．K・Na・腎機能が指示の範囲に保たれている","1 週間以内：浮腫（すね・仙骨部）の程度が入院時より軽くなっている","毎日：水分・塩分の制限を本人が理解し，飲水量・食事内容が指示の範囲に収まっている","退院前：本人・家族が毎朝の体重測定と記録，むくみ・息切れの見方，連絡の目安を言える"]},"OP":["体重（毎日同じ条件），水分出納（飲水・輸液・食事／尿量・便・排液），時間尿量（利尿薬静注後）","呼吸：呼吸数・SpO2・呼吸様式・起坐呼吸の程度（枕の数・ベッドの角度）・夜間の呼吸苦・咳・痰の性状（ピンク色の泡沫痰は肺水腫）","肺の副雑音（湿性ラ音の範囲）・呼吸音の左右差（胸水）・胸部 X 線の推移","浮腫：部位（下腿・足背・仙骨部・背部・陰部・腹部）・圧痕の程度・左右差，腹部膨満・腹囲，頸静脈怒張","循環：血圧・脈拍・リズム（心房細動などの頻脈は誘因にも結果にもなる），低灌流のサイン（四肢冷感・尿量減少・意識）","採血：BNP／NT-proBNP・K・Na・Mg・Cr・BUN・アルブミン・肝機能・Hb","利尿薬・血管拡張薬・強心薬の投与量と投与時刻，投与後の尿量・血圧・症状（めまい・口渇・筋けいれん・耳鳴り）","点滴の速度と総量（ポンプ設定），輸血・抗菌薬など「見えない水分」の量","食事：塩分の摂取状況（配膳内容と摂取量・持ち込み食品），飲水量（コップの数・氷・薬の水），食欲・吐き気","皮膚：浮腫部の皮膚の張り・傷・浸出液・褥瘡の初期サイン（褥瘡計画と連動）","睡眠と夜間の状態（呼吸苦で眠れない・夜間頻尿），不安の程度","誘因の情報：感染徴候（発熱・咳・尿）・胸痛・貧血・服薬状況・他科の薬"],"TP":["呼吸が楽な体位をとる：起坐位・ファーラー位，オーバーテーブルにもたれる前傾姿勢．背上げの角度は呼吸を優先し，ずれ・褥瘡の予防（背抜き・かかとの除圧）と両立させる","酸素・NPPV は指示に従って管理し，SpO2・呼吸数の悪化やピンク色の泡沫痰は発見時に速やかに報告する．呼吸・循環の急な悪化は院内の緊急対応へ（ガス交換の計画と連動）","利尿薬は指示どおり投与し，静注後は尿量の立ち上がり・血圧・症状を追う．効きが悪い（尿量が増えない）・効きすぎ（血圧低下・めまい・尿量過多）はいずれも報告し，増減は医師の指示で行う．K 補正の指示があれば投与後に採血結果を確認する","利尿薬の投与時刻は生活に合わせて調整を医師と相談する（夜間頻尿・転倒予防のため午前中が望ましいことが多い）．投与後はトイレ誘導・ポータブルトイレ・尿器を先回りで準備する（転倒計画と連動）","水分制限：1 日の許可量を本人と分け方まで決める（食事・薬・飲み物の配分），飲水量を見える化する（目盛り付きコップ・記録表）．口渇には氷片・含嗽・口腔ケアで対応する．制限量は医師の指示に従う","塩分制限：減塩食の指示を確認し，持ち込み食品（漬物・汁物・加工食品・調味料）を本人・家族と確認する．管理栄養士と協働して食べられる工夫をする","点滴は指示の速度・総量を厳守し，ポンプの警報は消音せず原因を確認する．薬剤の溶解量や抗菌薬の輸液量も水分として把握し，多い場合は医師・薬剤師に相談する","体重・出納は毎日同じ条件で正確に測り，推移をグラフや表で本人と一緒に見る（退院後の習慣づけにつながる）","浮腫部の皮膚を保護する：締めつける衣類・弾性ストッキングの縁の食い込みに注意，保湿，傷をつくらない，下肢はできる範囲で挙上（呼吸苦があるときは無理をしない）","安静度の範囲で活動を進める：安静が長いと廃用と褥瘡が進む．労作時の呼吸・SpO2・脈拍を見ながら段階的に（活動耐性の計画と連動）．排便コントロール：いきみは心臓に負担になるため，便秘があれば医師に緩下剤を相談する","夜間の呼吸苦・不眠・不安に対応する：訪室の頻度を上げ，体位・酸素・環境を整える．不安が強いときはそばにいて短い説明をする","回復期に入ったら，本人・家族と誘因を振り返り，退院後のセルフケア（体重・塩分・水分・薬・活動）の指導を早めに始める（セルフケア・退院支援の計画と連動）"],"EP":["患者へ：体にたまった水を薬で出している最中で，体重と尿量が治療の目安になること．毎朝同じ条件で体重を測る習慣を入院中から始めること","患者へ：水分・塩分の制限は治療の一部であり，飲み物の量（薬の水・氷・汁物を含む）を意識すること．のどが渇くときの工夫（氷片・含嗽）を伝える","患者へ：横になると苦しい・夜に苦しくて目が覚める・むくみが増えた・体重が急に増えたときは我慢せず知らせること","患者へ：利尿薬でトイレが近くなること，起き上がるときはゆっくり，ふらつくときは呼ぶこと（転倒予防）","患者・家族へ：退院後の連絡の目安（体重増加の幅と日数・むくみ・息切れ・横になれない）は主治医の指示・施設の心不全手帳に沿って具体的に伝える","患者・家族へ：薬（利尿薬・心不全の薬）は症状がなくても続け，自己判断でやめないこと．市販の痛み止め・風邪薬は買う前に相談すること","家族へ：家での食事（汁物・漬物・加工食品・外食）の塩分の見直しと，本人が続けられる工夫を一緒に考えること．必要なら管理栄養士の指導を受けること","家族へ：面会時に息苦しさ・むくみ・ぼんやりなど「いつもと違う」に気づいたら看護師に伝えてほしいこと"],"evaluation":{"timing":"毎日（体重・出納・呼吸・浮腫），利尿薬の変更後と状態変化時，および退院前","indicators":["体重が目標（医師の指示するドライウェイト）に向かって減り，尿量が確保されている","起坐呼吸・夜間の呼吸苦・湿性ラ音が減り，安静時の呼吸数・SpO2 が指示の範囲にある","浮腫の程度と範囲が入院時より軽い","K・Na・腎機能が指示の範囲にあり，脱水・低血圧・めまいなど出しすぎのサインがない","本人が水分・塩分の制限を理解して守れ，退院後の体重測定・連絡の目安を言える"],"revise_if":"体重が減らない・増えた／呼吸苦・SpO2 が悪化した／血圧低下・尿量減少・四肢冷感（低灌流）が出た／K・Na・Cr が悪化した／利尿薬の種類や投与法が変わった／新しい不整脈・感染が出た"},"cardio_ward_notes":["「うっ血がとれたか」は体重・呼吸・浮腫・頸静脈で総合的に見る．BNP は参考値で，1 回の値だけで判断しない．目標体重（ドライウェイト）と退院後の連絡の目安は主治医の指示と施設の心不全手帳に合わせ，一律の値を患者に伝えない","利尿が進む時期は「出しすぎ」に転じやすい：血圧低下・起立性めまい・尿量過多・Cr 上昇・低 K・低 Na．脱水の計画（fluid_deficit）へ切り替えるタイミングを医師と共有する","低灌流（冷たい・尿が出ない・ぼんやり）が重なる患者では，利尿だけでは改善せず強心薬や補助循環が必要になることがある．低心拍出の計画（low_cardiac_output）を併用する","心房細動などの頻脈は心不全の誘因にも結果にもなる．心拍数のコントロール状況と抗凝固薬の出血徴候を合わせて見る（不整脈・出血の計画と連動）","利尿薬の静注後は数時間トイレが近くなる．投与時刻と排尿パターンを転倒計画に反映し，夜間投与は避けられないか医師に相談する","ACE 阻害薬・ARB・ARNI・MRA・SGLT2 阻害薬の導入期は血圧低下・高 K・腎機能変化・脱水が出やすい．採血結果と症状を合わせて報告し，薬の調整は医師・薬剤師と行う（疾患別リスト「急性心不全」「慢性心不全」の薬の副作用欄参照）"],"sources":[{"name":"Open RN Health Alterations, 5.8 Heart Failure（左心不全・右心不全の徴候，急性非代償性心不全，看護介入と患者教育）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-8-heart-failure/","license":"CC BY 4.0（WisTech Open）","note":"体重増加・浮腫・息切れの報告項目，起坐呼吸の体位，減塩・水分制限の枠組みを参考（具体的な数値は施設基準に置き換え）"},{"name":"Open RN Nursing Skills 2e, 9.3 Cardiovascular Assessment（浮腫の段階づけ・頸静脈・末梢循環）","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/9-3-cardiovascular-assessment/","license":"CC BY 4.0（WisTech Open）","note":""},{"name":"Open RN Nursing Fundamentals 2e, 15.2 Basic Fluid and Electrolyte Concepts（体液量の過剰・不足の基本）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/15-2-basic-fluid-and-electrolyte-concepts/","license":"CC BY 4.0（WisTech Open）","note":"浮腫・尿量・水分調節の基礎を参考"},{"name":"NHLBI Heart Failure（Symptoms／Treatment／Living With）","url":"https://www.nhlbi.nih.gov/health/heart-failure","license":"パブリックドメイン","note":"https://www.nhlbi.nih.gov/health/heart-failure/symptoms ，/treatment ，/living-with も取得確認済"},{"name":"MedlinePlus: Heart Failure（Health Topic）","url":"https://medlineplus.gov/heartfailure.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Edema（Health Topic）","url":"https://medlineplus.gov/edema.html","license":"パブリックドメイン","note":"浮腫の患者向け説明の言い回しを参考"},{"name":"MedlinePlus: Sodium（Health Topic）","url":"https://medlineplus.gov/sodium.html","license":"パブリックドメイン","note":"減塩の患者向け説明を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"fluid_deficit","group":"循環・呼吸","problem":"体液量不足・脱水のリスクがある","problem_plain":"体の水分が足りなくなり，血圧が下がる・立ちくらみ・腎臓の働きが落ちる・電解質（ナトリウム・カリウム）が乱れる危険がある状態．循環器病棟では利尿薬の効きすぎ，食欲低下や水分制限のやりすぎ，発熱・下痢・嘔吐，造影剤検査前後の絶飲食が重なって起こりやすい．","applies_when":["利尿薬を使っている（特に静注・増量直後，複数の利尿薬の併用，SGLT2 阻害薬の併用）","食事・飲水量が減っている（食欲低下・吐き気・嚥下障害・認知機能低下・自分で飲み物を取れない）","水分制限の指示があり，本人が制限を厳しく守りすぎている，または暑い環境・発汗が多い","発熱・下痢・嘔吐・出血・ドレーン排液など水分を失う状態がある","検査・手術前後の絶飲食（カテーテル検査・造影剤の使用）","高齢で口渇を感じにくい，腎機能低下・糖尿病（高血糖による多尿）がある","起立性低血圧・めまい・尿量減少・Cr 上昇・Na や K の異常が出始めている"],"related_factors":["薬剤：ループ利尿薬・サイアザイド・MRA の効きすぎ，SGLT2 阻害薬による多尿，下剤の乱用","摂取不足：食欲低下・吐き気（ジゴキシン・うっ血・腎機能）・嚥下障害・認知機能低下・水分制限の誤解","喪失：発熱・発汗・下痢・嘔吐・出血・ドレーン・造影剤による利尿","高齢：口渇を感じにくい，体の水分の割合が少ない，腎臓の濃縮力が落ちている","環境：飲み物が手の届く所にない，トイレが心配で飲まない，絶飲食の指示","血糖コントロール不良（多尿），高カルシウム血症など"],"assessment":{"scales":[{"name":"起立性低血圧の確認（臥位で安静後 → 立位または座位での血圧・脈拍・症状の変化）","license":"一般的手技（事実）","note":"安全に立てる患者に行う．陽性の基準（収縮期・拡張期の低下幅）は転倒計画と同じ院内基準に従い，症状（めまい・目の前が暗い）が出れば数値にかかわらず中止して座らせる"},{"name":"脱水の身体所見セット（口腔粘膜・舌の乾燥，皮膚の張り（ツルゴール），腋窩の乾燥，毛細血管再充満時間，尿の色・量，体重の減少，意識・見当識）","license":"一般的手技（事実）","note":"高齢者では皮膚の張りは加齢で落ちているため単独で判断しない．体重と尿量・血圧の推移が信頼できる"},{"name":"水分出納表と体重（毎日同じ条件）","license":"一般的手技（事実）","note":"体液過剰の計画と同じ表を使い，減りすぎの方向にも目を向ける．尿量の下限の目安は施設基準・医師の指示"},{"name":"施設の脱水・飲水チェック表（飲水量の記録・提供回数）","license":"施設の様式を使う","note":"自分で飲めない患者には提供した量と実際に飲めた量を分けて記録する"}],"assessment_points":["「入る量」と「出る量」の両方を見る：飲水・食事の水分・輸液と，尿量・便・発汗・ドレーン・発熱による不感蒸泄．体重の急な減少はうっ血の改善と脱水の両方の可能性がある","循環への影響を見る：起立時の血圧低下・脈拍上昇，安静時の血圧低下，頻脈，尿量減少，四肢冷感．心不全の患者は「うっ血がとれた」直後に脱水へ転じやすい","腎機能と電解質を追う：Cr・BUN の上昇（BUN が Cr より大きく上がるのは脱水の目安の 1 つ），Na・K の異常（低 Na・低 K・高 K），血糖","口渇・皮膚の乾燥・尿の濃さだけでなく，意識の変化（ぼんやり・混乱）や倦怠感も脱水のサインとして見る（せん妄計画と連動）","水分制限の指示と本人の理解を確認する：「制限＝なるべく飲まない」と誤解して飲水を極端に減らしていないか"]},"goals":{"long_term":"うっ血の管理と両立させながら適切な水分量を保ち，脱水による血圧低下・転倒・腎機能悪化・電解質異常を起こさない","short_term":["毎日：飲水量・尿量・体重が記録され，医師の指示する水分量の範囲に収まっている（多すぎず少なすぎず）","毎勤務：起立時のめまい・血圧低下・頻脈・尿量減少がない，または出た場合は発見時に報告されている","採血のたびに：Cr・BUN・Na・K が指示の範囲にある，または変化が医師に報告されている","3 日以内：本人が「制限の範囲でしっかり飲む」意味を理解し，飲み物が手の届く所にある","絶飲食のある日：再開の時刻と量が本人・チームで共有され，再開後の飲水が確認されている"]},"OP":["飲水量（提供量と実際に飲めた量）・食事の摂取量・輸液量，尿量（時間尿・回数・色・濃さ），便（下痢の回数・性状），発汗・発熱・ドレーン排液","体重（毎日同じ条件）の減り方：目標体重を下回っていないか，急に減っていないか","血圧・脈拍（安静時と起立時の変化），めまい・ふらつき・目の前が暗くなる訴え","口腔粘膜・舌の乾燥，皮膚の張り，腋窩の乾燥，毛細血管再充満時間，四肢の冷感","意識・見当識・倦怠感・頭痛・吐き気（脱水・低 Na・高 Na のサイン）","採血：Cr・BUN・Na・K・Mg・Ca・血糖・Hb・Ht・アルブミン，尿比重（施設で測る場合）","利尿薬・SGLT2 阻害薬・下剤の投与量と投与時刻，増量・追加の有無，投与後の尿量の変化","水分制限の指示量と本人の理解，飲み物の置き場所・自分で取れるか，「トイレが心配で飲まない」などの理由","絶飲食の指示（検査・手術・造影剤）の開始と解除の時刻，造影剤使用後の尿量","筋けいれん・脱力・不整脈（低 K・低 Mg），口渇と多尿（高血糖）
