const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFKC').toLowerCase();

/* ---- entity model ---- */
const ENT = [];
const BYREF = {};
const groupOf = p => p.group || 'その他';
PLANS.forEach(p => { const e = {kind:'p', id:p.id, ref:'p/'+p.id, name:p.problem, category:groupOf(p), obj:p}; ENT.push(e); BYREF[e.ref]=e; });
DISEASES.forEach(d => { const e = {kind:'d', id:d.id, ref:'d/'+d.id, name:d.name, category:d.category||'その他', obj:d}; ENT.push(e); BYREF[e.ref]=e; });
const DCATS = []; DISEASES.forEach(d => { const c=d.category||'その他'; if(!DCATS.includes(c)) DCATS.push(c); });
const PLAN_GROUP_ORDER = ['安全・リスク','循環・呼吸','活動・休息','栄養・排泄','心理・社会・セルフケア','周術期・特殊'];
const PCATS = PLAN_GROUP_ORDER.filter(g => PLANS.some(p => groupOf(p)===g));
PLANS.forEach(p => { const g = groupOf(p); if (g!=='その他' && !PCATS.includes(g)) PCATS.push(g); });
if (PLANS.some(p => groupOf(p)==='その他')) PCATS.push('その他');

const OBS = [
  ['symptoms','症状'], ['vitals_physical','バイタル・身体所見'], ['monitor_tests','モニタ・検査'],
  ['medication_side_effects','薬の副作用'], ['psychosocial','心理・社会']
];
const DTABS = [['obs','観察項目'],['red','急変サイン'],['care','ケア'],['edu','指導'],['goal','目標例'],['src','出典']];

/* items(): reviewable rows of an entity, in display order */
function items(e){
  const o = e.obj, out = [];
  const add = (path, text, section) => { if (text != null && String(text).trim() !== '') out.push({path:e.ref+'/'+path, text:String(text), section}); };
  const list = (arr, base, section) => (arr||[]).forEach((t,i) => add(base+'/'+i, t, section));
  if (e.kind === 'd') {
    add('overview', o.overview, '概要');
    OBS.forEach(([k,l]) => list(o.observation && o.observation[k], 'observation/'+k, '観察項目 › '+l));
    list(o.red_flags, 'red_flags', '急変サイン');
    list(o.care, 'care', 'ケア');
    list(o.education, 'education', '指導');
    add('long_term_goal_example', o.long_term_goal_example, '長期目標例');
    list(o.short_term_goal_examples, 'short_term_goal_examples', '短期目標例');
    add('notes', o.notes, '備考');
  } else {
    add('problem_plain', o.problem_plain, '看護問題の説明');
    list(o.applies_when, 'applies_when', '立案基準（対象となる患者の状態）');
    list(o.related_factors, 'related_factors', '関連因子');
    (o.assessment && o.assessment.scales || []).forEach((s,i) => add('assessment/scales/'+i, s.name+(s.license?'｜'+s.license:'')+(s.note?'｜'+s.note:''), 'アセスメント › スケール'));
    list(o.assessment && o.assessment.assessment_points, 'assessment/assessment_points', 'アセスメント › ポイント');
    add('goals/long_term', o.goals && o.goals.long_term, '長期目標');
    list(o.goals && o.goals.short_term, 'goals/short_term', '短期目標');
    list(o.OP, 'OP', 'O-P（観察計画）');
    list(o.TP, 'TP', 'T-P（ケア計画）');
    list(o.EP, 'EP', 'E-P（指導計画）');
    add('evaluation/timing', o.evaluation && o.evaluation.timing, '評価 › 時期');
    list(o.evaluation && o.evaluation.indicators, 'evaluation/indicators', '評価 › 指標');
    add('evaluation/revise_if', o.evaluation && o.evaluation.revise_if, '評価 › 見直しの契機');
    list(o.cardio_ward_notes, 'cardio_ward_notes', '循環器病棟での特記事項');
  }
  return out;
}
const ITEMS = {}; ENT.forEach(e => ITEMS[e.ref] = items(e));
const TOTAL_ITEMS = ENT.reduce((n,e)=>n+ITEMS[e.ref].length,0);
/* search index */
ENT.forEach(e => {
  const o = e.obj;
  const parts = [e.name, e.category, ...(o.aliases||[]), ...(ITEMS[e.ref].map(i=>i.text)), ...((o.sources||[]).map(s=>s.name||''))];
  e.hay = norm(parts.join('\n'));
  e.hayName = norm([e.name, ...(o.aliases||[])].join(' '));
});

/* ============ storage ============ */
const store = {
  get(path){ try{ const v=localStorage.getItem(KEY+path); return v?JSON.parse(v):null; }catch(_){ return null; } },
  set(path,rec){ try{ localStorage.setItem(KEY+path, JSON.stringify(rec)); }catch(_){ toast('保存できませんでした（ブラウザの保存領域）'); } },
  del(path){ try{ localStorage.removeItem(KEY+path); }catch(_){} },
  meta(k, v){ if (v===undefined){ try{ const s=localStorage.getItem(KEY+'_'+k); return s?JSON.parse(s):null; }catch(_){return null;} } try{ localStorage.setItem(KEY+'_'+k, JSON.stringify(v)); }catch(_){} },
  allItems(){ const out={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(KEY)&&!k.startsWith(KEY+'_')){ try{ out[k.slice(KEY.length)]=JSON.parse(localStorage.getItem(k)); }catch(_){} } } }catch(_){} return out; }
};
function reviewer(){ return ($('#reviewer').value||'').trim(); }
function now(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

/* entity-level status: fix > ok > none */
function entStat(e){
  const its = ITEMS[e.ref]; let ok=0, fix=0, drop=0;
  its.forEach(i => { const r=store.get(i.path); if(!r||!r.status) return; if(r.status==='ok') ok++; else if(r.status==='fix') fix++; else if(r.status==='drop') drop++; });
  const reviewed = ok+fix+drop, total = its.length;
  const conf = store.meta('entity:'+e.ref);
  let st = 'none';
  if (fix+drop>0) st='fix'; else if (total>0 && (reviewed===total || (conf&&conf.confirmed))) st='ok';
  return {ok,fix,drop,reviewed,total,st,conf};
}

/* ============ state ============ */
let mode = 'd';
let filters = new Set(['none','ok','fix']);
let query = '';
let current = null;      // ref
let curTab = 'obs';
const openGroups = new Set([...DCATS, ...PCATS]);
const STATE_LABEL = {none:'未確認', ok:'確認済', fix:'要修正'};

/* ============ sidebar ============ */
function renderTree(){
  const tree = $('#tree');
  const q = norm(query).split(/\s+/).filter(Boolean);
  const match = e => q.length===0 || q.every(t => e.hay.includes(t));
  const counts = {none:0,ok:0,fix:0};
  const list = ENT.filter(e => e.kind===mode);
  list.forEach(e => counts[entStat(e).st]++);
  $$('#chips .chip').forEach(c => { c.querySelector('.n').textContent = counts[c.dataset.st]; c.classList.toggle('off', !filters.has(c.dataset.st)); c.classList.toggle('on', filters.has(c.dataset.st)); });
  const vis = list.filter(e => match(e) && filters.has(entStat(e).st));
  let h = `<a class="tree-dash ${current?'':'on'}" href="#dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="12" width="8" height="9" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/></svg>ダッシュボード</a>`;
  const item = e => {
    const s = entStat(e);
    let snip = '';
    if (q.length && !q.every(t=>e.hayName.includes(t))) {
      const hit = ITEMS[e.ref].find(i => q.some(t => norm(i.text).includes(t)));
      if (hit) { let t = hit.text; const nt=norm(t); let idx = -1; q.forEach(w=>{ const j=nt.indexOf(w); if(j>=0&&(idx<0||j<idx)) idx=j; }); const st=Math.max(0, idx-18); t = (st>0?'…':'')+t.slice(st, st+60)+(t.length>st+60?'…':''); snip = `<span class="snip">${hl(esc(t), q)}</span>`; }
    }
    return `<a class="tree-item ${current===e.ref?'on':''}" href="#${e.ref}" data-ref="${e.ref}"><i class="st ${s.st}"></i><span class="nm">${esc(e.name)}${snip}</span>${s.reviewed?`<span class="pg num">${s.reviewed}/${s.total}</span>`:''}</a>`;
  };
  if (vis.length===0) h += `<div class="tree-empty">該当なし</div>`;
  else if (q.length) {
    h += `<div class="tree-sect">検索結果 ${vis.length} 件</div>`;
    h += vis.map(item).join('');
  } else {
    const cats = mode==='d' ? DCATS : PCATS;
    cats.forEach(c => {
      const es = vis.filter(e => e.category===c); if(!es.length) return;
      const tot = list.filter(e=>e.category===c).length;
      h += `<div class="group ${openGroups.has(c)?'open':''}" data-cat="${esc(c)}"><button class="group-h"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>${esc(c)}<span class="cnt num">${es.length===tot?tot:es.length+'/'+tot}</span></button><div class="group-body">${es.map(item).join('')}</div></div>`;
    });
  }
  tree.innerHTML = h;
}
function hl(escText, terms){ let t = escText; terms.forEach(w => { if(!w) return; const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'); t = t.replace(re, m=>`<mark>${m}</mark>`); }); return t; }

/* ============ rendering helpers ============ */
function licBadge(t){
  t = String(t||''); let cls='', label=t||'不明';
  if (/CC[\s-]?BY/i.test(t)) { cls='green'; label='CC BY 4.0'; }
  else if (/PDL/i.test(t)) { cls='green'; label='PDL1.0'; }
  else if (/パブリックドメイン|public domain|米国政府/i.test(t)) { cls='green'; label='PD'; }
  else if (/有償|不可|保留|許可|無断|要確認/.test(t)) { cls='amber'; label = /有償/.test(t)?'有償':/保留|要確認/.test(t)?'要確認':/許可/.test(t)?'要許可':'転載不可'; }
  else if (/施設|一般的/.test(t)) { cls=''; label='施設様式'; if(/一般的/.test(t)) label='一般的手技'; }
  return `<span class="badge ${cls}" title="${esc(t)}">${esc(label)}</span>`;
}
function genBadge(t){ return `<span class="badge" title="${esc(t)}">${/Claude/.test(t||'')?'Claude 生成・要看護師レビュー':esc(t||'生成元不明')}</span>`; }
function noteHTML(rec){
  if (!rec || !rec.status) return '';
  const lab = {ok:'OK',fix:'修正案',drop:'不要'}[rec.status];
  let h = '';
  if (rec.status==='fix' && rec.proposal) h += `<div class="prop"><b>修正案</b>${esc(rec.proposal)}</div>`;
  if (rec.comment) h += `<div class="cmt"><b>コメント</b>${esc(rec.comment)}</div>`;
  h += `<div class="who">${lab}${rec.bulk?'（一括）':''} · ${esc(rec.reviewer||'（名前なし）')} · ${fmtDate(rec.ts)}</div>`;
  return `<div class="row-note">${h}</div>`;
}
function actsHTML(){
  return `<div class="row-actions"><button class="ract ok" data-act="ok" title="この項目は問題なし">OK</button><button class="ract fix" data-act="fix" title="修正案を書く">修正案</button><button class="ract drop" data-act="drop" title="この項目は不要">不要</button></div>`;
}
function row(path, textHTML, idx){
  const rec = store.get(path);
  return `<div class="row" data-path="${esc(path)}" ${rec&&rec.status?`data-status="${rec.status}"`:''}><span class="row-idx num">${idx!=null?idx:''}</span><div class="row-body"><div class="row-text">${textHTML}</div>${noteHTML(rec)}</div>${actsHTML()}</div>`;
}
function rowsList(arr, base, ref){ return `<div class="rows">${(arr||[]).map((t,i)=>row(ref+'/'+base+'/'+i, esc(t), i+1)).join('')}</div>`; }
function secOpen(title, n, cls, hint){ return `<section class="sec ${cls||''}"><div class="sec-h"><h3>${title}</h3>${n!=null?`<span class="n num">${n} 項目</span>`:''}${hint?`<span class="hint">${hint}</span>`:''}</div>`; }
const WARN_ICO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4m0 3h.01"/></svg>`;
function sourcesHTML(o){
  const s = (o.sources||[]);
  let h = secOpen('出典', s.length);
  h += s.length ? `<div class="rows">` + s.map(x => `<div class="src"><div class="b"><div>${esc(x.name||x.url||'')} ${licBadge(x.license)}</div>${x.url?`<div class="u"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></div>`:''}${x.note?`<div class="n">${esc(x.note)}</div>`:''}</div></div>`).join('') + `</div>` : `<div class="empty">出典の記載なし</div>`;
  h += `<div class="gen">生成元 ${genBadge(o.generated_by)}</div></section>`;
  return h;
}
function headHTML(e, crumbs){
  const s = entStat(e); const o=e.obj;
  const pct = s.total? Math.round(s.reviewed/s.total*100):0;
  const okw = s.total? s.ok/s.total*100:0, fxw = s.total? (s.fix+s.drop)/s.total*100:0;
  return `<div class="head"><div class="l"><div class="crumbs">${crumbs}</div><h1 class="title">${esc(e.name)}</h1>${e.kind==='d'&&(o.aliases||[]).length?`<div class="aliases">別名 ${o.aliases.map(a=>`<span>${esc(a)}</span>`).join('')}</div>`:''}</div>
  <div class="r"><div class="prog"><b class="num">${s.reviewed}</b> / <span class="num">${s.total}</span> 項目レビュー済（<span class="num">${pct}</span>%）${s.fix+s.drop?` · 要修正 <b class="num">${s.fix+s.drop}</b>`:''}<div class="mini"><i class="ok" style="width:${okw}%"></i><i class="fix" style="width:${fxw}%"></i></div></div>
  <div class="head-actions"><button class="btn sm" id="btnPrint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>印刷</button>
  ${s.conf&&s.conf.confirmed ? `<button class="btn sm" id="btnUnconfirm">確認済（取り消す）</button>` : `<button class="btn sm primary" id="btnConfirm">${e.kind==='d'?'この疾患':'この計画'}を確認済にする</button>`}</div></div></div>`;
}

/* ============ disease view ============ */
function renderDisease(e){
  const o = e.obj, r = e.ref;
  const cnt = {
    obs: OBS.reduce((n,[k])=>n+((o.observation||{})[k]||[]).length,0),
    red: (o.red_flags||[]).length, care:(o.care||[]).length, edu:(o.education||[]).length,
    goal: (o.long_term_goal_example?1:0)+(o.short_term_goal_examples||[]).length, src:(o.sources||[]).length
  };
  let h = headHTML(e, `<a href="#dash">疾患別リスト</a><span class="sep">›</span>${esc(e.category)}`);

  h += `<nav class="tabs">${DTABS.map(([k,l])=>`<button class="tab ${k==='red'?'red':''} ${curTab===k?'on':''}" data-tab="${k}">${l}<span class="n num">${cnt[k]}</span></button>`).join('')}</nav>`;
  // obs
  h += `<div class="panel ${curTab==='obs'?'on':''}" data-tab="obs" data-label="観察項目">`;

  h += `</div>`;
  h += `<div class="panel ${curTab==='red'?'on':''}" data-tab="red" data-label="急変サイン">` + secOpen(WARN_ICO+'急変サイン（すぐ報告）', cnt.red, 'red') + rowsList(o.red_flags,'red_flags',r) + `</section></div>`;
  h += `<div class="panel ${curTab==='care'?'on':''}" data-tab="care" data-label="ケア">` + secOpen('ケア', cnt.care) + rowsList(o.care,'care',r) + `</section></div>`;
  h += `<div class="panel ${curTab==='edu'?'on':''}" data-tab="edu" data-label="指導">` + secOpen('指導（患者・家族へ）', cnt.edu) + rowsList(o.education,'education',r) + `</section></div>`;
  h += `<div class="panel ${curTab==='goal'?'on':''}" data-tab="goal" data-label="目標例">` + secOpen('長期目標の例') + `<div class="rows">${row(r+'/long_term_goal_example', `<span class="goal-long">${esc(o.long_term_goal_example)}</span>`)}</div></section>` + secOpen('短期目標の例', (o.short_term_goal_examples||[]).length) + rowsList(o.short_term_goal_examples,'short_term_goal_examples',r) + `</section></div>`;

  h += `</div>`;
  return h;
}

  const ev = o.evaluation||{};
  h += `<section class="sec anchor" id="s-ev"><div class="sec-h"><h3>評価</h3></div><div class="sub-h">評価の時期</div><div class="rows">${row(r+'/evaluation/timing', esc(ev.timing))}</div><div class="sub-h">評価の指標</div>${rowsList(ev.indicators,'evaluation/indicators',r)}<div class="sub-h">こんなときは計画を見直す</div><div class="rows">${row(r+'/evaluation/revise_if', esc(ev.revise_if))}</div></section>`;
  h += `<section class="sec anchor" id="s-cw"><div class="sec-h"><h3>循環器病棟での特記事項</h3><span class="n num">${(o.cardio_ward_notes||[]).length} 項目</span></div>${rowsList(o.cardio_ward_notes,'cardio_ward_notes',r)}</section>`;
  h += `<div class="anchor" id="s-src">` + sourcesHTML(o) + `</div></div>`;
  return h;
}

/* ============ dashboard ============ */
function renderDash(){
  const dz = ENT.filter(e=>e.kind==='d'), pl = ENT.filter(e=>e.kind==='p');
  const es = {none:0,ok:0,fix:0}; let iOk=0,iFix=0,iRev=0;
  ENT.forEach(e => { const s=entStat(e); es[s.st]++; iOk+=s.ok; iFix+=s.fix+s.drop; iRev+=s.reviewed; });
  const n = ENT.length, pc = k => n? Math.round(es[k]/n*100):0;
  const recent = (store.meta('recent')||[]).filter(r=>BYREF[r.ref]).slice(0,8);
  let h = `<h1 class="page-title">看護計画レビュー</h1><p class="lead">標準看護計画（${pl.length} 本）と循環器疾患別の観察項目・ケア・指導リスト（${dz.length} 疾患）のたたき台です．左の一覧から開き，各項目の行末にある <b>OK</b>／<b>修正案</b>／<b>不要</b> で確認結果を残してください．</p>`;
  h += `<div class="stats"><div class="stat"><div class="k">疾患</div><div class="v num">${dz.length}<small>件</small></div></div><div class="stat"><div class="k">カテゴリ</div><div class="v num">${DCATS.length}<small>区分</small></div></div><div class="stat"><div class="k">標準看護計画</div><div class="v num">${pl.length}<small>本</small></div></div><div class="stat"><div class="k">レビュー対象項目</div><div class="v num">${TOTAL_ITEMS.toLocaleString()}<small>項目</small></div></div><div class="stat"><div class="k">項目レビュー済</div><div class="v num">${iRev.toLocaleString()}<small>/ ${TOTAL_ITEMS.toLocaleString()}</small></div></div></div>`;
  h += `<div class="card"><h2>レビュー進捗 <span class="sub">疾患・計画ごとの状態（${n} 件）</span></h2><div class="bar"><i class="ok" style="width:${pc('ok')}%"></i><i class="fix" style="width:${pc('fix')}%"></i></div><div class="legend"><span><i class="dot ok"></i>確認済 <b class="num">${es.ok}</b>（${pc('ok')}%）</span><span><i class="dot fix"></i>要修正 <b class="num">${es.fix}</b>（${pc('fix')}%）</span><span><i class="dot"></i>未確認 <b class="num">${es.none}</b>（${pc('none')}%）</span><span style="margin-left:auto;color:var(--text-3)">項目単位：OK ${iOk} · 修正／不要 ${iFix}</span></div></div>`;
  h += `<div class="two"><div class="card"><h2>最近レビューした項目</h2>`;
  h += recent.length ? `<div class="recent">${recent.map(r=>{const e=BYREF[r.ref]; const s=entStat(e); return `<a href="#${e.ref}"><span class="k">${e.kind==='d'?'疾患':'計画'}</span>${esc(e.name)}<span class="t num">${s.reviewed}/${s.total} · ${fmtDate(r.ts)}</span></a>`;}).join('')}</div>` : `<div class="empty">まだレビューはありません．左の一覧から疾患を開いて始めてください．</div>`;
  h += `</div><div class="card"><h2>データについて</h2><dl class="kv"><dt>作成</dt><dd>${esc(PLAN_META.created||'')}（ビルド ${esc(DATA.built||'')}）</dd><dt>作成者</dt><dd>${esc(PLAN_META.author||'')}</dd><dt>状態</dt><dd>${esc(PLAN_META.review_status||'')}</dd><dt>版</dt><dd>${esc(PLAN_META.version||'')}</dd></dl></div></div>`;
  h += `<div class="notice"><b>ご利用にあたって</b><ul><li>この内容は著作権フリー素材（厚労省様式・米国政府資料・オープン教科書）と AI（Claude）の看護知識から書き下した<b>たたき台</b>です．診療上の判断を示すものではありません．</li><li>看護師によるレビューを前提としています．施設のプロトコル・様式に合わせて置き換えてください．</li><li>学会ガイドラインの文言・図表，NANDA-I のラベル，有償の質問票（Braden・Morse・CAM 等）は使っていません．素材のライセンスは各ページの「出典」にバッジで示しています（PD＝パブリックドメイン，PDL1.0＝政府標準利用規約，CC BY＝表示ライセンス）．</li><li>レビュー結果はこのブラウザ内（localStorage）に保存されます．別の端末に渡すときは右上の「書き出す」で JSON にしてください．</li></ul></div>`;
  h += `<p class="kbd-hint"><kbd class="k">/</kbd> 検索　<kbd class="k">Esc</kbd> 閉じる　URL の <code>#d/疾患ID</code>・<code>#p/計画ID</code> で直接開けます</p>`;
  return h;
}

/* ============ routing ============ */
function route(){
  const hash = decodeURIComponent(location.hash.replace(/^#/,''));
  const m = hash.match(/^([dp])\/([^/]+)(?:\/([a-z]+))?$/);
  const main = $('#main');
  if (m && BYREF[m[1]+'/'+m[2]]) {
    const e = BYREF[m[1]+'/'+m[2]];
    if (current !== e.ref) curTab = 'obs';
    if (m[3]) curTab = m[3];
    current = e.ref; if (mode!==e.kind){ mode=e.kind; syncMode(); }
    main.innerHTML = e.kind==='d' ? renderDisease(e) : renderPlan(e);
    document.title = e.name + ' · 看護計画レビュー';
    window.scrollTo(0,0);
  } else {
    current = null; main.innerHTML = renderDash(); document.title = '看護計画レビュー';
  }
  renderTree(); closeDrawer();
  const on = $('#tree .tree-item.on'); if (on) on.scrollIntoView({block:'nearest'});
}
function syncMode(){ $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode===mode)); }

/* ============ review actions ============ */
function ensureReviewer(){
  if (reviewer()) return true;
  const inp = $('#reviewer'); inp.classList.add('warn'); inp.focus(); toast('先にレビュアー名を入力してください'); setTimeout(()=>inp.classList.remove('warn'), 2500); return false;
}
function touchRecent(ref){
  let r = (store.meta('recent')||[]).filter(x=>x.ref!==ref); r.unshift({ref, ts:now()}); store.meta('recent', r.slice(0,20));
}
function rowEl(path){ return $(`[data-path="${CSS.escape(path)}"]`); }
function refreshRow(rowE){
  const path = rowE.dataset.path, rec = store.get(path);
  if (rec && rec.status) rowE.dataset.status = rec.status; else rowE.removeAttribute('data-status');
  const body = rowE.querySelector('.row-body'); const old = body.querySelector('.row-note'); if (old) old.remove();
  const ed = body.querySelector('.editor');
  if (rec && rec.status) body.insertAdjacentHTML(ed?'afterbegin':'beforeend', noteHTML(rec));
  if (rec && rec.status && ed) { const n=body.querySelector('.row-note'); body.insertBefore(n, ed); }
  refreshHead(); renderTree();
}
function refreshHead(){
  if (!current) return; const e = BYREF[current];
  const head = $('#main .head'); if (!head) return;
  const crumbs = head.querySelector('.crumbs').innerHTML;
  head.outerHTML = headHTML(e, crumbs);
}
function itemText(path){ const e = BYREF[path.split('/').slice(0,2).join('/')]; const it = e && ITEMS[e.ref].find(i=>i.path===path); return it ? it.text : ''; }
function saveRec(path, patch){
  const old = store.get(path) || {};
  const rec = Object.assign({}, old, patch, {reviewer: reviewer(), ts: now(), text: itemText(path)});
  delete rec.bulk;
  store.set(path, rec); touchRecent(path.split('/').slice(0,2).join('/'));
  return rec;
}
function openEditor(rowE){
  closeEditor();
  const path = rowE.dataset.path, rec = store.get(path)||{};
  const isFix = rec.status==='fix';
  const ed = document.createElement('div'); ed.className='editor';
  ed.innerHTML = `${isFix?`<label>修正案（修正後の文言）</label><textarea name="proposal" placeholder="この項目をどう書き換えるか">${esc(rec.proposal||'')}</textarea>`:''}<label>コメント${isFix?'（理由・補足）':''}</label><textarea name="comment" placeholder="${isFix?'根拠・施設の運用など':'メモ（任意）'}">${esc(rec.comment||'')}</textarea><div class="acts"><button class="btn sm primary" data-ed="save">保存</button><button class="btn sm" data-ed="cancel">閉じる</button><button class="del" data-ed="clear">レビューを取り消す</button></div>`;
  rowE.querySelector('.row-body').appendChild(ed);
  const ta = ed.querySelector('textarea'); ta.focus();
}
function closeEditor(){ $$('.editor').forEach(x=>x.remove()); }

document.addEventListener('click', ev => {
  const act = ev.target.closest('[data-act]');
  if (act) {
    const rowE = act.closest('.row,.trow'); const path = rowE.dataset.path; const a = act.dataset.act;
    if (!ensureReviewer()) return;
    const rec = store.get(path)||{};
    if (rec.status===a && a==='ok') { store.del(path); refreshRow(rowE); closeEditor(); toast('OK を取り消しました'); return; }
    saveRec(path, {status:a});
    refreshRow(rowE);
    if (a==='ok') { closeEditor(); toast('OK として保存しました'); }
    else openEditor(rowE);
    return;
  }
  const ed = ev.target.closest('[data-ed]');
  if (ed) {
    const edEl = ed.closest('.editor'), rowE = ed.closest('.row,.trow'), path = rowE.dataset.path;
    if (ed.dataset.ed==='save') {
      const prop = edEl.querySelector('[name=proposal]'); const cm = edEl.querySelector('[name=comment]');
      saveRec(path, {proposal: prop?prop.value.trim():undefined, comment: cm.value.trim()});
      closeEditor(); refreshRow(rowE); toast('保存しました');
    } else if (ed.dataset.ed==='clear') { store.del(path); closeEditor(); refreshRow(rowE); toast('レビューを取り消しました'); }
    else { closeEditor(); }
    return;
  }
  const tab = ev.target.closest('.tab');
  if (tab) { curTab = tab.dataset.tab; $$('.tab').forEach(t=>t.classList.toggle('on', t===tab)); $$('.panel').forEach(p=>p.classList.toggle('on', p.dataset.tab===curTab)); history.replaceState(null,'','#'+current+'/'+curTab); return; }
  const jump = ev.target.closest('[data-jump]');
  if (jump) { ev.preventDefault(); const t = $('#s-'+jump.dataset.jump); if (t) t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const gh = ev.target.closest('.group-h');
  if (gh) { const g = gh.closest('.group'); const c=g.dataset.cat; if(openGroups.has(c)) openGroups.delete(c); else openGroups.add(c); g.classList.toggle('open'); return; }
  if (ev.target.closest('#btnPrint')) { window.print(); return; }
  if (ev.target.closest('#btnConfirm')) {
    if (!ensureReviewer()) return; const e = BYREF[current]; let n=0;
    ITEMS[e.ref].forEach(i => { const r=store.get(i.path); if(!r||!r.status){ store.set(i.path,{status:'ok',reviewer:reviewer(),ts:now(),text:i.text,bulk:true}); n++; } });
    store.meta('entity:'+e.ref, {confirmed:true, reviewer:reviewer(), ts:now()}); touchRecent(e.ref);
    route(); toast(`確認済にしました（未レビューの ${n} 項目を OK に）`); return;
  }
  if (ev.target.closest('#btnUnconfirm')) {
    const e = BYREF[current]; let n=0;
    ITEMS[e.ref].forEach(i => { const r=store.get(i.path); if(r&&r.bulk){ store.del(i.path); n++; } });
    store.meta('entity:'+e.ref, {confirmed:false}); route(); toast(`確認を取り消しました（一括 OK の ${n} 項目を戻しました）`); return;
  }
});

/* ============ export / import / markdown ============ */
function exportJSON(){
  const items = store.allItems(); const entities = {};
  ENT.forEach(e => { const c = store.meta('entity:'+e.ref); if (c && c.confirmed) entities[e.ref]=c; });
  const out = {format:'nursing-review/1', exported: now(), reviewer: reviewer(), app:'看護計画レビュー', built: DATA.built||'', item_count: Object.keys(items).length, entities, items};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date(), p=n=>String(n).padStart(2,'0');
  a.download = `nursing-review_${reviewer()||'anon'}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`${Object.keys(items).length} 件のレビューを書き出しました`);
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = () => {
    let j; try { j = JSON.parse(fr.result); } catch(_) { toast('JSON として読めませんでした'); return; }
    if (!j || j.format!=='nursing-review/1' || !j.items) { toast('レビュー結果の JSON ではありません'); return; }
    let add=0, upd=0, skip=0;
    Object.entries(j.items).forEach(([path, rec]) => {
      if (!rec || !rec.status) return; const cur = store.get(path);
      if (!cur) { store.set(path, rec); add++; }
      else if (!cur.ts || (rec.ts && rec.ts > cur.ts)) { store.set(path, rec); upd++; }
      else skip++;
    });
    Object.entries(j.entities||{}).forEach(([ref, c]) => { if (c && c.confirmed) store.meta('entity:'+ref, c); });
    route(); toast(`読み込み：追加 ${add} · 更新 ${upd} · 既存を維持 ${skip}`);
  };
  fr.readAsText(file);
}
function markdown(){
  const items = store.allItems(); const lines = [];
  const d = new Date();
  lines.push(`# 看護計画レビュー結果`, ``, `- 書き出し：${fmtDate(d.toISOString())}`, `- レビュアー：${reviewer()||'（未入力）'}`, `- 件数：${Object.keys(items).length}`, ``);
  const LAB = {ok:'OK', fix:'修正案', drop:'不要'};
  ENT.forEach(e => {
    const its = ITEMS[e.ref].filter(i => items[i.path] && items[i.path].status);
    if (!its.length) return;
    const s = entStat(e); const c = store.meta('entity:'+e.ref);
    lines.push(`## ${e.kind==='d'?'疾患':'計画'}：${e.name}（\`${e.ref}\`）`, ``, `- レビュー済 ${s.reviewed}/${s.total}${s.fix+s.drop?`，要修正 ${s.fix+s.drop}`:''}${c&&c.confirmed?`，確認済（${c.reviewer||''} ${fmtDate(c.ts)}）`:''}`, ``);
    let lastSec = '';
    its.forEach(i => {
      const r = items[i.path];
      if (i.section !== lastSec) { lines.push(`### ${i.section}`, ``); lastSec = i.section; }
      lines.push(`- **[${LAB[r.status]}]** ${i.text}`);
      if (r.status==='fix' && r.proposal) lines.push(`  - 修正案：${r.proposal}`);
      if (r.comment) lines.push(`  - コメント：${r.comment}`);
      lines.push(`  - ${r.reviewer||'（名前なし）'}，${fmtDate(r.ts)}`);
    });
    lines.push(``);
  });
  if (lines.length <= 6) lines.push(`（レビューはまだありません）`);
  return lines.join('\n');
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(_) {}
  try { const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; } catch(_) { return false; }
}
function showDialog(title, desc, text){
  $('#dlgTitle').textContent = title; $('#dlgDesc').textContent = desc; $('#dlgText').value = text; $('#dlg').showModal();
}

/* ============ ui wiring ============ */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2400); }
function openDrawer(){ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); }
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
function applyTheme(t){ const r=document.documentElement; if (t) r.setAttribute('data-theme', t); else r.removeAttribute('data-theme'); const dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); $('#icoSun').hidden = dark; $('#icoMoon').hidden = !dark; }

$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.contains('open') ? closeDrawer() : openDrawer());
$('#overlay').addEventListener('click', closeDrawer);
$('#modeSeg').addEventListener('click', ev => { const b=ev.target.closest('button'); if(!b) return; mode=b.dataset.mode; syncMode(); renderTree(); });
$('#q').addEventListener('input', ev => { query = ev.target.value; renderTree(); });
$('#chips').addEventListener('click', ev => { const c=ev.target.closest('.chip'); if(!c) return; const s=c.dataset.st; if(filters.has(s)){ if(filters.size>1) filters.delete(s); } else filters.add(s); renderTree(); });
$('#reviewer').addEventListener('input', ev => store.meta('reviewer', ev.target.value));
$('#btnExport').addEventListener('click', exportJSON);
$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', ev => { const f=ev.target.files[0]; if(f) importJSON(f); ev.target.value=''; });
$('#btnMd').addEventListener('click', async () => { const t = markdown(); const ok = await copyText(t); showDialog('Markdown', ok?'クリップボードにコピーしました．そのまま貼り付けられます．':'自動コピーできませんでした．下の内容を選択してコピーしてください．', t); if(ok) toast('Markdown をコピーしました'); });
$('#btnTheme').addEventListener('click', () => { const cur = document.documentElement.getAttribute('data-theme'); const dark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme: dark)').matches); const next = dark?'light':'dark'; store.meta('theme', next); applyTheme(next); });
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
$('#dlgOk').addEventListener('click', () => $('#dlg').close());
$('#dlgCopy').addEventListener('click', async () => { const ok = await copyText($('#dlgText').value); toast(ok?'コピーしました':'コピーできませんでした'); });
document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName||'').toLowerCase(); const typing = tag==='input'||tag==='textarea';
  if (ev.key==='/' && !typing) { ev.preventDefault(); $('#q').focus(); $('#q').select(); if (innerWidth<=900) openDrawer(); }
  else if (ev.key==='Escape') { if ($('#dlg').open) return; if (typing && ev.target.id==='q' && query){ query=''; ev.target.value=''; renderTree(); } else if ($$('.editor').length) closeEditor(); else closeDrawer(); }
});
window.addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(store.meta('theme')||''));

/* init */
$('#reviewer').value = store.meta('reviewer') || '';
$('#brandSub').textContent = `${DISEASES.length} 疾患 · ${PLANS.length} 計画`;
applyTheme(store.meta('theme')||'');
route();
})();
</script>
