","皮膚の状態（乾燥・褥瘡のリスク上昇），便秘"],"TP":["医師の指示する水分量の範囲で「飲める量を確実に飲む」援助をする：飲み物を手の届く所に置く，好みの飲み物や温度にする，食事以外にも提供する時間を決める，自分で飲めない患者には介助する","水分制限がある患者には，医師の指示が『上限』『目標量』『範囲』のどれか，食事中の水分や輸液を含めるかを確認し，1 日の配分を一緒に決める（体液過剰の計画と同じ表を使う）．制限量は最低限飲む量ではない．脱水が疑われるときは制限の再評価を医師に依頼する","起立性低血圧がある患者：起き上がりは段階的に（座る → 足を下ろす → 立つ），各段階で症状がないことを確認する．初回歩行は見守りで（転倒計画と連動）","尿量減少・血圧低下・頻脈・意識の変化を見つけたら，発見時に速やかに医師へ報告する．輸液や利尿薬の調整は医師の指示で行い，独断で利尿薬を休止・減量しない","採血結果（Cr・BUN・Na・K）の変化は医師に報告し，K 補正・輸液の指示があれば投与後の反応と再採血の結果を確認する","発熱・下痢・嘔吐があるときは喪失量を記録し，早めに医師へ報告する．吐き気には制吐薬の指示を確認し，飲めるようになったら少量ずつ再開する","検査・手術前後の絶飲食は指示の時間を守り，解除後は速やかに飲水を再開する．造影剤検査の前後は医師の指示する輸液・飲水を確認し，尿量を追う","利尿薬の投与時刻を確認し，投与後の尿量・血圧・症状を追う．効きすぎ（尿量過多・血圧低下・めまい・Cr 上昇）は報告し，調整は医師と行う","口腔ケアと保湿で口の不快感を減らし，口渇による過剰な飲水や逆に飲めない状態を防ぐ","皮膚の保湿と褥瘡予防（脱水で皮膚が弱くなる），便秘があれば医師に緩下剤を相談する","高齢者・認知機能低下のある患者は「飲んだつもり」が多いため，提供量と実際に飲めた量を分けて記録し，家族にも協力を頼む"],"EP":["患者へ：水分の制限は『上限』であり，必ずその量まで飲むという意味ではないこと．口渇・立ちくらみ・尿が濃いなど脱水のサインがあれば知らせてほしいこと．飲む量の目安と分け方を一緒に確認する","患者へ：立ち上がったときのめまい・目の前が暗くなる感じは脱水のサインのことがある．ゆっくり起きる，症状があれば座って看護師を呼ぶ","患者へ：熱・下痢・吐き気・食べられないときは早めに知らせること（利尿薬を飲んだままだと脱水になりやすい）","患者へ：尿の色が濃い・回数が減った・口が乾く・だるいなどの変化を伝えてほしいこと","患者・家族へ：退院後，暑い日・発熱・下痢のときの飲み方と，利尿薬を休むかどうかは自己判断せず主治医に相談すること（シックデイの相談先を確認する）","家族へ：本人が飲み物を取りにくい場合は手の届く所に置く，飲んだ量を一緒に確認する","患者・家族へ：市販の下剤・風邪薬・痛み止めは脱水や腎機能に影響することがあるので，使う前に相談すること"],"evaluation":{"timing":"毎日（出納・体重・起立時の症状），採血結果が出たとき，利尿薬・輸液・絶飲食の指示変更時","indicators":["飲水量・尿量・体重が医師の指示する範囲にあり，急な減少がない","起立時のめまい・血圧低下・頻脈がない，または対応方法が定着している","Cr・BUN・Na・K が指示の範囲にある，または変化が報告され対応されている","口腔・皮膚の乾燥や意識の変化がない","本人・家族が制限量の範囲で飲む意味と，脱水のサイン・相談の目安を言える"],"revise_if":"尿量減少・血圧低下・起立性めまいが出た／Cr・BUN・Na・K が悪化した／発熱・下痢・嘔吐が始まった／利尿薬が増量された・絶飲食の予定が入った／逆に浮腫・呼吸苦が再燃した（体液過剰の計画へ）"},"cardio_ward_notes":["心不全の患者は「うっ血」と「脱水」を行き来する．利尿が進んで体重が目標を下回った時期，退院前に内服の利尿薬へ切り替えた時期は脱水に転じやすく，逆に飲水を増やしすぎると再うっ血する．どちらの方向にも目を配り，目標体重は医師の指示に従う","SGLT2 阻害薬・MRA・ACE 阻害薬／ARB・ARNI を導入した直後は多尿・血圧低下・腎機能変化が出やすい．採血と症状を合わせて報告し，薬の調整は医師・薬剤師と行う","造影剤を使うカテーテル検査・治療の前後は，絶飲食と造影剤による腎への負担が重なる．医師の指示する輸液・飲水と尿量の確認を徹底し，Cr の推移を追う（疾患別リスト「PCI 後」参照）","脱水は低 K・低 Mg と重なると不整脈（心室性不整脈・QT 延長）の引き金になる．下痢・嘔吐・利尿薬増量のときは早めに採血結果を確認する（不整脈の計画と連動）","降圧薬・硝酸薬・β遮断薬を使っている患者は脱水で起立性低血圧が強く出る．初回歩行・利尿薬静注後の歩行は見守りで（転倒計画と連動）","高齢の心不全患者は口渇を感じにくく，水分制限を「飲んではいけない」と受け取りがち．制限の意味を言い換えて伝え，飲めた量を記録で確認する"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, 15.2 Basic Fluid and Electrolyte Concepts（体液量不足の原因・リスク・尿量の意味）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/15-2-basic-fluid-and-electrolyte-concepts/","license":"CC BY 4.0（WisTech Open）","note":"利尿薬・下痢・嘔吐・摂取不足による脱水，尿量減少が早いサインであることを参考"},{"name":"Open RN Health Alterations, 5.8 Heart Failure（利尿薬と電解質異常のモニタリング）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-8-heart-failure/","license":"CC BY 4.0（WisTech Open）","note":""},{"name":"Open RN Health Alterations, 5.3 General Cardiovascular System Assessment（起立性低血圧・毛細血管再充満時間）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-3-general-cardiovascular-system-assessment/","license":"CC BY 4.0（WisTech Open）","note":""},{"name":"MedlinePlus: Dehydration（Health Topic）","url":"https://medlineplus.gov/dehydration.html","license":"パブリックドメイン","note":"患者向け説明の言い回しを参考"},{"name":"MedlinePlus: Fluid and Electrolyte Balance（Health Topic）","url":"https://medlineplus.gov/fluidandelectrolytebalance.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Potassium（Health Topic）","url":"https://medlineplus.gov/potassium.html","license":"パブリックドメイン","note":"低 K・高 K の患者向け説明を参考"},{"name":"NHLBI Heart Failure: Treatment（利尿薬の位置づけ）","url":"https://www.nhlbi.nih.gov/health/heart-failure/treatment","license":"パブリックドメイン","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"impaired_gas_exchange","group":"循環・呼吸","problem":"呼吸困難・ガス交換の障害がある","problem_plain":"肺で酸素を取り込み二酸化炭素を出す働きが落ちて，息が苦しい・血液の酸素が足りない状態．循環器病棟では肺うっ血（心不全で肺に水がたまる）・胸水・肺炎・肺塞栓・COPD の合併が主な原因で，酸素療法や NPPV（マスク式の人工呼吸）で支える．COPD がある人は酸素を与えすぎると二酸化炭素がたまるので，目標の範囲を守る．","applies_when":["安静時や軽い動作で息切れがあり，呼吸数の増加・SpO2 の低下（本人の普段の値と比べて）がある","肺うっ血・肺水腫・胸水（心不全）がある，または疑われる","酸素療法・NPPV（CPAP／BiPAP）・ハイフローを使用している","COPD・喘息・間質性肺炎など慢性の肺の病気を合併している（在宅酸素の有無を含む）","肺炎・無気肺（術後）・肺塞栓・気胸の疑いなど急に酸素化が落ちる病態がある","心臓手術後・長期臥床で痰が出しにくい，咳の力が弱い，嚥下障害がある","血液ガスで酸素化の低下や二酸化炭素の貯留がある"],"related_factors":["肺うっ血・肺水腫：左心不全で肺の毛細血管から水がしみ出し，酸素が取り込めない","胸水・無気肺・肺炎・肺塞栓・気胸：肺が広がらない，血流が届かない","COPD・喘息：気道が狭く空気が出しにくい，二酸化炭素がたまりやすい（酸素の与えすぎで悪化）","呼吸筋の疲労・痛み（胸骨切開・肋骨）・鎮静薬・オピオイドによる呼吸抑制","貧血・低心拍出：酸素を運ぶ力そのものが落ちている","痰の貯留・咳の力の低下・嚥下障害による誤嚥","不安・パニックによる過呼吸，臥位での呼吸苦（起坐呼吸）"],"assessment":{"scales":[{"name":"呼吸の観察セット（呼吸数・呼吸様式・補助呼吸筋の使用・会話の途切れ方（文章で話せるか，単語しか言えないか）・体位（前かがみ・起坐）・チアノーゼ・SpO2・意識）","license":"一般的手技（事実）．Open RN Health Alterations 6.3 に観察項目の記載あり","note":"SpO2 の数字だけでなく「呼吸の仕事量」を見る．SpO2 の目標範囲は医師の指示（COPD 合併時は低めの範囲が指示されることが多い）"},{"name":"息苦しさの数値評価（0〜10 の数値評価スケール）と，どの動作で出るか（安静・会話・食事・トイレ歩行）","license":"0〜10 の数値評価は一般的手技．修正 Borg スケール・mMRC 息切れスケールは利用条件を未確認のため，施設で使用中なら参照のみ","note":"同じ動作での変化を追うと改善・悪化がわかる"},{"name":"血液ガス（PaO2・PaCO2・pH・HCO3・乳酸値）と SpO2 の対応","license":"一般的検査（事実）","note":"COPD 合併時は PaCO2 と pH を必ず見る（SpO2 が保てていても CO2 がたまっていることがある）．採取と判断の閾値は医師の指示"},{"name":"厚労省 医療安全管理マニュアル作成例「酸素吸入」（指示の確認・流量計の読み方・ボンベ残量・火気厳禁）","license":"厚労省サイト（PDL1.0）","note":"機器・指示の確認項目の枠組みとして参考"}],"assessment_points":["本人の「普段の状態」を知る：在宅酸素の有無と流量，普段の SpO2，どの動作で息切れが出ていたか（COPD・慢性心不全の患者は普段から低め）．今の値をそれと比べて評価する","原因を分けて考える：心臓（肺うっ血・胸水）か，肺（肺炎・COPD 増悪・無気肺）か，血栓（肺塞栓）か，酸素を運ぶ力（貧血・低心拍出）か．原因によって体位・薬・報告先が変わる","悪化のサインを見逃さない：呼吸数の増加，補助呼吸筋の使用，会話が途切れる，落ち着かない・ぼんやり（低酸素・CO2 貯留），ピンク色の泡沫痰，SpO2 の低下傾向．呼吸の急な悪化は院内の緊急対応へ","酸素・NPPV の設定と実際（流量・濃度・マスクの密着・リーク・皮膚の圧迫・不快感・同調）を毎回確認し，指示どおりかを見る","COPD 合併の有無を最初に確認し，酸素の目標範囲（医師の指示）をベッドサイドとカルテで共有する"]},"goals":{"long_term":"呼吸が楽になり，酸素療法・NPPV から離脱（または在宅酸素へ移行）して，日常の活動を安全に広げられる","short_term":["毎勤務：SpO2・呼吸数が医師の指示する目標範囲にあり，範囲を外れたときは発見時に報告されている","24 時間以内：楽な体位（起坐位・前傾）がとれ，安静時の息苦しさの数値評価が入院時より下がっている","毎勤務：酸素・NPPV の設定が指示と一致し，マスクの当たりによる皮膚トラブルがない","3 日以内：痰を自分で出せる（または吸引で気道が保てる），呼吸音が改善している","本人が息苦しさの伝え方（ナースコール・数値）と，酸素・マスクを自分で外さない理由を理解している"]},"OP":["呼吸数・呼吸様式（浅い・速い・不規則）・補助呼吸筋の使用・鼻翼呼吸・胸の動きの左右差・会話の途切れ方","SpO2（安静時・労作時・睡眠時）と酸素の流量・濃度・デバイス，本人の普段の値との比較","呼吸音：湿性ラ音（肺うっ血）・喘鳴（気道狭窄）・呼吸音の減弱や消失（胸水・無気肺・気胸），痰の量・色・粘さ・出しやすさ，咳の力","息苦しさの程度（数値評価）と出る動作，起坐呼吸・夜間の呼吸苦・体位の好み（前かがみ）","意識・見当識・落ち着きのなさ・傾眠（低酸素と CO2 貯留のサイン），頭痛・手の震え（CO2 貯留）","循環：血圧・脈拍・リズム，四肢の冷感・チアノーゼ（唇・爪），頸静脈怒張・浮腫（心不全との関連）","血液ガス（PaO2・PaCO2・pH・乳酸値），採血（Hb・炎症反応・BNP・D ダイマー），胸部 X 線・CT の所見","NPPV：設定（モード・圧・酸素濃度）・マスクの種類とサイズ・リーク・同調・鼻根部や頬の皮膚・口腔の乾燥・腹部膨満・不快感と受け入れ","酸素機器：流量計の指示との一致・加湿・チューブの接続と長さ・搬送用ボンベの残量","体温・発熱・痰の性状の変化（肺炎），下肢の腫れ・痛み（深部静脈血栓→肺塞栓）","不安・恐怖の程度，睡眠の状態，食事摂取（呼吸苦で食べられない）","鎮静薬・オピオイド・睡眠薬の投与と呼吸数・意識の変化"],"TP":["楽な体位をとる：起坐位・ファーラー位，オーバーテーブルに枕を置いた前傾姿勢．体位を変えたら呼吸数・SpO2・本人の楽さで効果を確認する．褥瘡予防（背抜き・除圧）と両立させる","酸素は医師の指示する目標範囲を守って投与する．与えすぎない：特に COPD 合併時は指示された低めの範囲を守り，SpO2 が範囲を超えて高いときも報告して調整を仰ぐ（自己判断で上げ下げしない）．流量の変更後は SpO2・呼吸数・意識を続けて見る","SpO2 の低下・呼吸数の増加・意識の変化・ピンク色の泡沫痰を見つけたら，発見時に速やかに医師へ報告し，そばを離れない．呼吸の急な悪化は院内の緊急対応へ．酸素をつけて待つだけにしない","NPPV：開始時はそばで説明しながらマスクを合わせ，リークと同調を調整する．皮膚保護材で鼻根部・頬を守り，休憩や食事のタイミング（指示の範囲）と口腔ケア・保湿を計画する．受け入れが悪い・不穏・腹部膨満・嘔吐は報告する．嘔吐したら直ちにマスクを外して顔を横に向け，気道を守り，必要な吸引と応援要請を行う（吐物をマスク内にためない）．意識低下・痰を出せないときは NPPV を続けてよいか（気管挿管を含む対応）を直ちに医師に確認する．マスクの自己抜去に備え，せん妄予防を強める","痰を出す援助：加湿，体位ドレナージ（循環が許す範囲），深呼吸と咳の介助（胸骨切開後は創部を枕で押さえる），必要時の吸引，口腔ケアで誤嚥性肺炎を防ぐ","呼吸法の指導と練習：口すぼめ呼吸（COPD で有効），腹式呼吸，深呼吸・インセンティブスパイロメトリー（術後）．パニック時は一緒にゆっくり吐く","活動と休息の配分：呼吸苦が出ない範囲で動作を分割し，食事・清潔・排泄のあとに休憩を入れる．労作時は SpO2 と呼吸数を見ながら進め，安静度の指示を守る（活動耐性の計画と連動）","水分バランスの管理を心不全の計画と連動させる：肺うっ血が原因なら利尿薬の効果（尿量・体重・呼吸苦の変化）を追い，点滴の速度・総量を守る","酸素機器の安全：指示の流量が流量計・カードと一致しているか訪室ごとに確認，チューブの接続・屈曲・長さ，加湿水，搬送時のボンベ残量，火気厳禁の表示（厚労省 医療安全管理マニュアル作成例「酸素吸入」参照）","夜間：睡眠中の SpO2 低下・無呼吸（いびきの途切れ）に注意し，指示された酸素・NPPV を確実に装着する．睡眠薬・鎮静薬の追加は呼吸抑制の面から医師と慎重に相談する","不安への対応：短い言葉で状況を説明し，そばにいる時間をつくる．呼吸苦は恐怖を伴うため「一人にしない」を優先する","回復期：酸素の減量・離脱は指示に従い，減量後の労作時 SpO2 を確認する．在宅酸素が必要な場合は業者・家族と機器の説明と安全指導（火気・転倒・チューブ）を行う"],"EP":["患者へ：息苦しさは我慢せず，ナースコールで知らせること．「どのくらい苦しいか」を数字で伝えてもらう","患者へ：酸素や NPPV のマスクは自分で外したり流量を変えたりしないこと（ただし吐きそうなときはすぐ外してナースコールを押してよい）．外したくなったら理由を教えてほしいこと（皮膚の痛み・口の渇き・不安など対応できる）","患者へ：楽な体位（起坐位・前かがみ）のとり方と，口すぼめ呼吸・腹式呼吸の練習","患者へ：痰は出したほうがよいこと，深呼吸と咳の仕方（術後は創部を押さえる），水分は指示の範囲で","患者・家族へ：COPD がある場合，酸素は「多いほどよい」ではなく決められた範囲があることを説明する","患者・家族へ：酸素使用中は火気厳禁（たばこ・ライター・ろうそく），チューブに足を引っかけない，搬送や検査でボンベを使うときの注意","家族へ：面会時に呼吸が速い・話が途切れる・ぼんやりしているなど「いつもと違う」に気づいたら看護師に伝えてほしいこと","退院前（在宅酸素・NPPV 導入時）：機器の使い方，流量の変更は主治医の指示でのみ行うこと，息切れが強くなったときの連絡先"],"evaluation":{"timing":"毎勤務（急性期は施設基準の頻度で連続監視），酸素・NPPV の設定変更後，労作後，および状態変化時","indicators":["SpO2・呼吸数が医師の指示する目標範囲にあり，酸素・NPPV の設定が下げられている","息苦しさの数値評価が下がり，安静時の起坐呼吸・夜間の呼吸苦が減っている","呼吸音（湿性ラ音・喘鳴・減弱）が改善し，痰が出せている","意識がはっきりしており，血液ガスで CO2 の貯留・アシドーシスが改善している（採取は医師の指示）","マスク・カニューラによる皮膚トラブルや機器の事故がなく，本人が息苦しさの伝え方と機器の注意を理解している"],"revise_if":"SpO2・呼吸数が悪化した／酸素の必要量が増えた／NPPV・挿管が必要になった／意識の変化・CO2 貯留が出た／発熱・痰の変化・新しい胸痛や下肢の腫れが出た／酸素の減量・離脱が始まった"},"cardio_ward_notes":["循環器病棟の呼吸苦はまず「肺うっ血か」を疑う：起坐呼吸・湿性ラ音・体重増加・頸静脈怒張がそろえば心不全の悪化として利尿薬・NPPV の効果を追う（体液過剰の計画と連動）．肺炎・肺塞栓・気胸との区別は医師の評価に委ね，所見をそろえて報告する","COPD 合併の心不全患者への酸素は「与えすぎ」に注意：目標範囲は医師の指示に従い，SpO2 が範囲を上回っているときも報告する．CO2 貯留は SpO2 では見えず，傾眠・頭痛・手の震えで気づく","急性心筋梗塞・急性冠症候群でも酸素は SpO2 の指示値に合わせて投与し，一律に高流量を流さない（疾患別リスト「急性心筋梗塞」参照）","NPPV は急性心不全の肺水腫で使われることが多い．血圧低下・不整脈・意識の変化があるときは適応の見直しが必要になるため，循環の変化も合わせて報告する","心臓手術後（胸骨切開）は痛みで深呼吸・咳ができず無気肺・肺炎になりやすい．鎮痛と創部の保護（枕で押さえる）を組み合わせて呼吸訓練を進める（疼痛の計画と連動）","長期臥床・心房細動・カテーテル後の患者で急な息切れ・胸痛・SpO2 低下があれば肺塞栓を疑い，発見時に速やかに報告する（VTE の計画と連動）"],"sources":[{"name":"Open RN Health Alterations, 6.3 General Respiratory System Assessment and Interventions（呼吸の観察項目・体位・呼吸法・酸素機器）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/6-3-general-respiratory-system-assessment-and-interventions/","license":"CC BY 4.0（WisTech Open）","note":"起坐位・前傾姿勢，口すぼめ呼吸，CPAP／BiPAP の位置づけを参考"},{"name":"Open RN Health Alterations, 6.6 COPD（酸素の与えすぎと呼吸ドライブ，目標 SpO2 の考え方）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/6-6-copd/","license":"CC BY 4.0（WisTech Open）","note":"目標範囲の具体値は施設基準・医師の指示に置き換える"},{"name":"Open RN Nursing Skills 2e, 11.4 Nursing Process Related to Oxygen Therapy","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/11-4-nursing-process-related-to-oxygen-therapy/","license":"CC BY 4.0（WisTech Open）","note":"酸素開始時の問診・そばにいる介入を参考"},{"name":"Open RN Health Alterations, 5.8 Heart Failure（肺うっ血・起坐呼吸の看護）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-8-heart-failure/","license":"CC BY 4.0（WisTech Open）","note":""},{"name":"NHLBI COPD（Treatment を含む）","url":"https://www.nhlbi.nih.gov/health/copd","license":"パブリックドメイン","note":"https://www.nhlbi.nih.gov/health/copd/treatment も取得確認済"},{"name":"MedlinePlus: Oxygen Therapy（Health Topic）","url":"https://medlineplus.gov/oxygentherapy.html","license":"パブリックドメイン","note":"在宅酸素の安全（火気）の患者向け説明を参考"},{"name":"MedlinePlus: Breathing Problems（Health Topic）","url":"https://medlineplus.gov/breathingproblems.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Pleural Disorders（胸水）","url":"https://medlineplus.gov/pleuraldisorders.html","license":"パブリックドメイン","note":""},{"name":"厚生労働省 医療安全管理マニュアル作成例（酸素吸入）","url":"https://www.mhlw.go.jp/topics/bukyoku/isei/i-anzen/1/torikumi/naiyou/manual/2h.html","license":"PDL1.0","note":"指示確認・流量計・ボンベ・火気厳禁の項目を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"chest_pain_acute","group":"循環・呼吸","problem":"胸痛がある","problem_plain":"心臓の血管（冠動脈）が狭くなったり詰まりかけたりして，胸が締めつけられる・圧迫される痛みが出ている状態．急性冠症候群（不安定狭心症・心筋梗塞）は時間との勝負で，痛みの評価と 12 誘導心電図，硝酸薬，安静，そして「再び痛くなったとき」の対応が看護の要．痛みが弱い・息切れだけという人（高齢者・糖尿病）もいる．","applies_when":["急性冠症候群（不安定狭心症・心筋梗塞）の診断または疑いで入院した","狭心症で発作が起きている，または最近発作の頻度・強さが増した","カテーテル治療（PCI）や CABG の前後で，再閉塞・再狭窄・新しい虚血のリスクがある","冠攣縮性狭心症（安静時・夜間・早朝の胸痛）がある","胸痛の訴えがあり，原因（心臓・大動脈・肺・消化器・筋骨格）がまだ確定していない","硝酸薬（舌下・スプレー・持続点滴）・抗血小板薬・抗凝固薬が開始された","貧血・頻脈・低血圧・低酸素など心筋の酸素の需要と供給のバランスを崩す状態がある"],"related_factors":["冠動脈の狭窄・プラーク破裂と血栓（動脈硬化），ステント血栓症，冠攣縮","心筋の酸素需要の増加：頻脈・高血圧・発熱・不安・労作・いきみ・寒冷","酸素供給の低下：貧血・低酸素・低血圧・脱水","抗血小板薬の中断・飲み忘れ，硝酸薬の使い方の誤り","痛みを我慢する・言い出せない（迷惑をかけたくない，高齢・糖尿病で痛みが弱い）","強い不安・死への恐怖（痛みを増強し，交感神経を刺激する）","心臓以外の原因：大動脈解離・肺塞栓・心膜炎・気胸・逆流性食道炎・筋骨格の痛み（鑑別は医師）"],"assessment":{"scales":[{"name":"痛みの数値評価（0〜10 の数値評価スケール）と痛みの聞き取りの枠組み（きっかけ・性質・場所と放散・強さ・時間経過・随伴症状）","license":"一般的手技（事実）","note":"「締めつけ・圧迫・重い」「肩・腕・あご・背中・みぞおちへの放散」「冷汗・吐き気・息切れ」「安静・硝酸薬で治まるか」を毎回同じ枠で記録し，前回と比べる"},{"name":"12 誘導心電図（胸痛のたびに記録し，以前の心電図と比較：ST 上昇・ST 低下・T 波の変化・新しい不整脈）","license":"一般的検査（事実）","note":"記録の時刻と痛みの有無を心電図に残す．判読は医師だが，明らかな ST 変化は看護師も報告の根拠にする"},{"name":"トロポニン・CK・CK-MB の経時変化（採血の時刻と痛みの時刻の関係）","license":"一般的検査（事実）","note":"採血のタイミングは施設の急性冠症候群プロトコルに従う"},{"name":"施設の急性冠症候群（ACS）プロトコル・胸痛時の対応手順（硝酸薬の使用条件・報告先・緊急カテーテルの準備）","license":"施設の様式を使う","note":"ベッドサイドの初動を統一する"}],"assessment_points":["「痛みがあるか」を待たずに聞く：高齢者・糖尿病・女性では典型的な胸痛でなく，息切れ・冷汗・吐き気・倦怠感・みぞおちの不快感だけのことがある．本人の訴えを軽く見ない","痛みのたびに同じ枠で評価し，前回との違い（強さ・持続・放散・硝酸薬の効き方）を明確にする．安静・硝酸薬で治まらない，持続時間が長い，随伴症状が強いは緊急度が高い（判断の目安時間は施設の ACS プロトコルに従う）","循環と呼吸のサインを同時に見る：血圧低下・冷汗・頻脈・徐脈・不整脈・SpO2 低下・肺の湿性ラ音は心筋梗塞・ショック・心不全への進行を示す","心臓以外の原因を思い浮かべて所見をそろえる：引き裂かれるような背部痛・血圧の左右差（大動脈解離），急な息切れと下肢の腫れ（肺塞栓），呼吸で変わる痛み（心膜炎・胸膜），押すと痛い（筋骨格）．鑑別は医師に委ね，所見を報告する","抗血小板薬・抗凝固薬の服用状況と出血徴候，カテーテル後なら穿刺部の状態を合わせて確認する"]},"goals":{"long_term":"胸痛が心筋梗塞の進行や再発につながらず，本人が胸痛時の対処と再発予防（薬・生活）を理解して退院できる","short_term":["胸痛のたびに：発見時に安静・バイタル・12 誘導心電図・報告が施設のプロトコルどおりに行われ，痛みの評価が記録されている","24 時間以内：胸痛が再燃していない，または再燃時に速やかに対応され，痛みが指示された治療（硝酸薬・鎮痛）で軽減している","毎勤務：血圧・心拍数・リズム・SpO2 が施設基準・医師の指示する範囲にあり，ST 変化・不整脈・ショックのサインが見逃されていない","48 時間以内：本人が「胸の違和感はすぐ知らせる」ことを理解し，実際にナースコールで伝えられている","退院前：本人・家族が硝酸薬の使い方，救急車を呼ぶ目安，抗血小板薬をやめない理由を言える"]},"OP":["痛み：部位・性質（締めつけ・圧迫・重い・刺す）・放散（肩・腕・あご・背中・みぞおち）・強さ（数値評価）・始まった時刻と持続時間・きっかけ（労作・安静・食事・夜間早朝）・安静や硝酸薬での変化","随伴症状：冷汗・吐き気・嘔吐・息切れ・動悸・めまい・不安・顔面蒼白・「何かおかしい」という漠然とした訴え","バイタル：血圧（左右差も 1 回は確認）・脈拍・リズム・呼吸数・SpO2・体温，低下や頻脈・徐脈はショック・不整脈の前触れ","モニタ心電図：ST 変化・心室性不整脈（PVC の増加・VT）・房室ブロック・心房細動，警報の設定が患者に合っているか","12 誘導心電図：胸痛時と消失後，以前との比較（記録時刻と痛みの有無を残す）","採血：トロポニン・CK・CK-MB の推移，K・Mg，Hb（貧血），腎機能，血糖，凝固（ヘパリン中の APTT）","心不全のサイン：肺の湿性ラ音・起坐呼吸・頸静脈怒張・尿量減少，新しい心雑音（機械的合併症）","薬の効果と副作用：硝酸薬（頭痛・血圧低下），β遮断薬（徐脈・血圧低下・喘鳴），抗血小板薬・抗凝固薬（歯ぐき・鼻・便・尿・穿刺部の出血），モルヒネ（呼吸抑制・血圧低下・吐き気）","カテーテル後：穿刺部の出血・血腫・末梢の脈・冷感，造影剤後の尿量（疾患別リスト「PCI 後」参照）","安静度の遵守状況，排便の状態（いきみ），食事・絶飲食の指示","不安・恐怖の程度，睡眠，家族の状況，「痛みを我慢していないか」"],"TP":["胸痛の訴えや疑いがあれば直ちに：安静（動作を止め，楽な体位），バイタル・SpO2・モニタ波形の確認，12 誘導心電図の記録，医師への報告を施設の ACS プロトコルどおりに行う．血圧低下・意識の変化・呼吸の悪化・致死性不整脈があれば院内の緊急対応へ","硝酸薬（舌下錠・スプレー・持続点滴）は医師の指示と施設プロトコルの条件（血圧の下限・回数・間隔・PDE5 阻害薬の服用の有無）を確認して投与し，投与後の痛みの変化と血圧・頭痛を記録する．指示の回数で治まらない場合は次の指示を仰ぐ","酸素は SpO2 の指示値に合わせて投与し，一律に高流量を流さない（COPD 合併時は特に目標範囲を守る）","痛みを我慢させない：数値評価で追い，鎮痛薬（モルヒネなど）の指示があれば投与後の呼吸数・血圧・吐き気を観察する","緊急カテーテルに備える：点滴ルートの確保・絶飲食の管理・同意の確認・アレルギー（造影剤・薬）・抗血小板薬の投与状況・穿刺部の準備を施設手順に従って進める（除毛は処置の妨げになる場合だけ必要な範囲をクリッパーで行い，かみそりでの剃毛はしない．院内の感染対策手順に合わせ，緊急の再灌流を除毛待ちで遅らせない）","安静度は指示を厳守し，本人にも理由を説明する．ベッド上安静中の排泄・清潔・食事は介助し，安静の解除・離床は心臓リハビリのプログラムと医師の指示に沿って段階的に進め，離床前後で症状・バイタル・心電図を確認する","心筋の酸素需要を増やさない：発熱・不安・痛み・便秘（いきみ）・寒さへの対応，急な労作を避ける，室温と静かな環境を整える．便秘には医師に緩下剤を相談する","抗血小板薬・抗凝固薬は指示どおり確実に投与し（中断は再閉塞・ステント血栓の危険），出血徴候の観察を続ける（出血リスクの計画と連動）","モニタ心電図は電極の貼付と警報設定を確認し，警報が鳴ったらまず患者を見る．消音・減音を対策にしない（不整脈の計画と連動）","不安への対応：処置の前に短い説明をする，そばにいる，家族の面会を調整する．「痛みを言うと迷惑」と思わせない声かけをする","胸痛の記録は「時刻・痛みの評価・バイタル・心電図・投与した薬・効果・報告先」をセットで残し，次の勤務へ引き継ぐ","回復期：心臓リハビリ・禁煙・薬・生活の指導へつなぎ，退院後の胸痛時の対応（硝酸薬・救急車）を家族と一緒に確認する（セルフケア・退院支援の計画と連動）"],"EP":["患者へ：胸の痛み・圧迫感・違和感・息切れ・冷汗は我慢せず，すぐナースコールで知らせること（「気のせいかも」でも呼んでよい）","患者へ：痛みが出たら動作を止めて楽な姿勢で休み，看護師が来るのを待つこと．トイレなどに一人で行かないこと","患者へ：安静度の意味（心臓を休ませて回復させる）と，段階的に活動を広げていくこと","患者へ：硝酸薬の舌下錠・スプレーの使い方（使う条件・回数・間隔は主治医の指示と施設の説明書に従う），使った後は座って休む，頭痛やふらつきが出ることがある，保管は遮光容器で","患者へ：抗血小板薬は自己判断で絶対にやめないこと（ステントが詰まる危険），歯科や他科の受診時にも伝えること","患者・家族へ：退院後の救急車を呼ぶ目安（硝酸薬で治まらない・持続する・冷汗や息切れを伴う）は主治医の指示に沿って具体的に伝える．2 回目は症状が違うこともある","患者・家族へ：禁煙・減塩・体重・血圧・脂質・血糖の管理と心臓リハビリの意味．家族に AED の場所・使い方を知っておいてもらう","家族へ：面会時に顔色が悪い・冷汗・落ち着かない様子に気づいたら看護師に伝えてほしいこと"],"evaluation":{"timing":"胸痛のたびと毎勤務，安静度の変更・離床のたび，カテーテル前後，および退院前","indicators":["胸痛が再燃していない，または再燃時にプロトコルどおりの初動（安静・心電図・報告・硝酸薬）が行われ，痛みが軽減している","血圧・心拍数・リズム・SpO2 が指示の範囲にあり，ST 変化・致死性不整脈・ショック・心不全への進行がない","安静度内で活動でき，離床の段階が予定どおり進んでいる","出血徴候がなく，抗血小板薬・抗凝固薬が中断なく投与されている","本人が胸痛時の対処（知らせる・休む・硝酸薬）と退院後の救急の目安・薬の重要性を言える"],"revise_if":"胸痛が再燃・増強した／ST 変化・トロポニン上昇が新たに出た／血圧低下・冷汗・意識の変化（ショック）が出た／新しい不整脈・心雑音・呼吸苦が出た／出血が起きた／カテーテル治療・手術が決まった／安静度が変わった"},"cardio_ward_notes":["胸痛の初動（安静・バイタル・12 誘導・報告・硝酸薬）は施設の ACS プロトコルで統一し，「治まった後の心電図」も必ず記録する．痛みの持続時間や硝酸薬の回数の判断基準はプロトコルの値に従う（疾患別リスト「不安定狭心症」「急性心筋梗塞」参照）","冠攣縮性狭心症は夜間・早朝の安静時に起こる．夜勤帯の訴えを軽く見ず，発作時の心電図を残す（疾患別リスト「冠攣縮性狭心症」参照）","心筋梗塞後数日は再閉塞・致死性不整脈・心破裂などの機械的合併症・心不全が起こりうる．胸痛の再燃＋血圧低下＋新しい心雑音は院内の緊急対応へ","硝酸薬は血圧低下・徐脈・右室梗塞・PDE5 阻害薬の服用で危険になる．投与条件を確認し，投与後の血圧は必ず追う","カテーテル後の胸痛は再閉塞のほか，穿刺部や造影剤の問題と重なって見える．穿刺部の出血・血腫・末梢の脈も同時に確認する（出血・末梢循環の計画と連動）","「胸が痛いと言うと検査や安静が増える」と我慢する患者がいる．訴えやすい関係づくりと，表情・冷汗・落ち着きのなさなど言葉以外のサインの観察が重要"],"sources":[{"name":"Open RN Health Alterations, 5.7 Coronary Artery Disease（安定・不安定狭心症の比較，ACS，硝酸薬の患者教育，看護介入）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-7-coronary-artery-disease/","license":"CC BY 4.0（WisTech Open）","note":"酸素・硝酸薬・アスピリン・β遮断薬の位置づけと硝酸薬の指導項目を参考（回数・SpO2 の値は施設基準に置き換え）"},{"name":"Open RN Health Alterations, 5.3 General Cardiovascular System Assessment（心電図・不整脈・検査）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-3-general-cardiovascular-system-assessment/","license":"CC BY 4.0（WisTech Open）","note":""},{"name":"NHLBI Heart Attack（Symptoms／Treatment）","url":"https://www.nhlbi.nih.gov/health/heart-attack","license":"パブリックドメイン","note":"https://www.nhlbi.nih.gov/health/heart-attack/symptoms ，/treatment も取得確認済"},{"name":"NHLBI Angina（Symptoms／Treatment）","url":"https://www.nhlbi.nih.gov/health/angina","license":"パブリックドメイン","note":"https://www.nhlbi.nih.gov/health/angina/symptoms ，/treatment も取得確認済"},{"name":"MedlinePlus: Chest Pain（Health Topic）","url":"https://medlineplus.gov/chestpain.html","license":"パブリックドメイン","note":"心臓以外の胸痛の原因の整理を参考"},{"name":"MedlinePlus: Troponin Test","url":"https://medlineplus.gov/lab-tests/troponin-test/","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Heart Attack（Health Topic）","url":"https://medlineplus.gov/heartattack.html","license":"パブリックドメイン","note":"患者向け説明の言い回しを参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"arrhythmia_hemodynamic","group":"循環・呼吸","problem":"不整脈により循環動態が変動するリスクがある","problem_plain":"脈が速すぎる・遅すぎる・乱れることで，血圧が下がったり，めまい・失神・心不全の悪化・心停止につながる危険がある状態．心電図モニタで波形を見張り，警報が鳴ったら「まず患者を見て，症状と血圧で安定か不安定かを判断して報告する」のが基本．カリウム・マグネシウムの異常や薬が引き金になることが多く，ペーシングや除細動の準備も看護師の仕事．","applies_when":["心電図モニタ装着の指示があり，不整脈の既往または新しい不整脈がある","急性心筋梗塞・急性心不全・心原性ショック・心臓手術後・カテーテルアブレーション後など不整脈が出やすい時期","心房細動・心房粗動・発作性上室頻拍・心室頻拍の既往，ICD・ペースメーカ植込み（前後を含む），一時ペーシング中","徐脈性不整脈（洞不全・房室ブロック）で失神・めまいがある，または徐脈を起こす薬を使っている","抗不整脈薬・QT を延ばす薬（一部の抗菌薬・抗精神病薬・制吐薬）の開始・増量・併用","K・Mg・Ca の異常，利尿薬・下痢・嘔吐・脱水・腎機能低下がある","発熱・貧血・低酸素・痛み・不安・甲状腺機能異常など頻脈の誘因がある"],"related_factors":["心臓の病気：虚血・梗塞（特に発症後数日），心不全・心筋症（低心機能），弁膜症，心筋炎，術後の心筋の刺激","電解質異常：低 K・低 Mg・高 K・低 Ca（利尿薬・腎不全・下痢・嘔吐・輸血）","薬剤：抗不整脈薬・ジゴキシン・β遮断薬・Ca 拮抗薬（徐脈），カテコラミン・気管支拡張薬（頻脈），QT を延ばす薬，β遮断薬の急な中止","全身状態：低酸素・発熱・感染・貧血・脱水・出血・甲状腺機能亢進・痛み・不安・睡眠不足・カフェイン・飲酒","刺激：中心静脈カテーテル・ペーシングリード・術後ドレーン，一時ペーシングの不具合","モニタ側の問題：電極の外れ・ノイズを不整脈と誤認する，警報設定が患者に合っていない，警報の見逃し"],"assessment":{"scales":[{"name":"「安定か不安定か」の判断セット（症状：胸痛・呼吸苦・めまい・失神・意識の変化／血圧の低下／低灌流のサイン：冷感・尿量減少／心不全のサイン）","license":"一般的手技（事実）","note":"不安定なら院内の緊急対応（応援・除細動器・救急カート）へ．安定なら 12 誘導心電図と報告．判断の閾値（心拍数・血圧・休止の長さ）は施設のモニタ管理基準に従う"},{"name":"施設のモニタ心電図管理基準（装着の適応・警報の上下限と設定の見直し・報告基準・電極交換・退室基準）","license":"施設の様式を使う","note":"警報の減音・消音は対策にせず，設定は患者ごとに医師と決める"},{"name":"12 誘導心電図（QRS 幅・P 波・RR 間隔・QTc・ST 変化）と以前の心電図との比較","license":"一般的検査（事実）","note":"症状のある不整脈のときは必ず記録．QTc の基準値と報告の閾値は施設のプロトコル"},{"name":"厚労省「重症度，医療・看護必要度」A 項目（自院が届け出ている病棟区分・必要度 I／II・適用年度の評価票の正式な項目名で確認する）","license":"厚労省サイト（PDL1.0）","note":"評価票の項目であり不整脈の重症度尺度ではない．心電図モニターの管理は一般病棟用の評価票にはなく，ICU・HCU 等の評価票の項目なので，臨床上のモニタ観察と診療報酬上の評価は分け，当該評価票の定義を満たす場合だけ評価する"}],"assessment_points":["警報が鳴ったら波形より先に患者を見る：意識・脈（触診）・血圧・症状．電極の外れ・ノイズ・体動を不整脈と誤認せず，本物の不整脈を見逃さない","不整脈の「型」と「循環への影響」を分けて評価する：型（頻脈か徐脈か，QRS が広いか狭いか，規則的か不規則か，休止の長さ）は報告の材料，影響（症状・血圧・低灌流）は緊急度の判断材料","引き金を探す：K・Mg・Ca，低酸素・発熱・貧血・脱水・痛み・不安，薬の開始・増量・中止（特に β遮断薬の中止と QT 延長薬の併用），虚血（胸痛・ST 変化）","本人の「普段」を知る：慢性心房細動の心拍数の範囲，ペースメーカの設定，ICD の有無と作動歴，抗凝固薬の有無．普段と比べて変化しているかで見る","モニタの状態を毎勤務確認する：電極の貼付と皮膚，送信機の電池，警報の上下限と患者の実際の心拍数の関係，検査や入浴などで外す時間帯の取り決め"]},"goals":{"long_term":"不整脈による失神・転倒・心不全の悪化・心停止を起こさず，原因（電解質・薬・虚血）が是正され，必要な治療（薬・アブレーション・デバイス）につながって退院できる","short_term":["毎勤務：モニタが確実に装着され，警報の設定が患者に合っており，警報時は「まず患者を見る」対応がとれている","不整脈出現時：症状・血圧・意識で安定か不安定かを判断し，不安定なら院内の緊急対応，安定なら 12 誘導心電図と報告が発見時に行われている","採血のたびに：K・Mg が施設基準・医師の指示する範囲にあり，異常は報告され補正の指示に沿って対応されている","薬の開始・変更後 3 日間：心拍数・血圧・QTc・症状の変化が記録され，副作用（徐脈・低血圧・QT 延長）が見逃されていない","本人がナースコールを使って動悸・めまい・胸痛を伝えられ，モニタの電極や送信機の扱いを理解している"]},"OP":["モニタ心電図：心拍数（上限・下限），リズム（規則的か），QRS の幅，P 波の有無，RR 間隔と休止の長さ，PVC の頻度と形（連発・R on T），ST 変化，QT の延長，ペーシングスパイクと捕捉","警報の内容と頻度・時刻，警報時の患者の状態（症状の有無・脈の触診・血圧），電極の状態・ノイズ・送信機の電池","症状：動悸（速い・遅い・飛ぶ・バラバラ）・めまい・目の前が暗くなる・失神・胸痛・息切れ・冷汗・倦怠感（徐脈で見逃しやすい），高齢者は言葉にしにくいので表情・落ち着きも見る","循環：血圧（頻脈・徐脈時の低下），脈拍の触診（聴診との差＝脈の欠損），四肢の冷感・意識・尿量（低灌流），心不全のサイン（呼吸音・浮腫）","12 誘導心電図：症状時と消失後，薬の開始前後（QTc），以前との比較","採血：K・Mg・Ca・Hb・腎機能・甲状腺機能・炎症反応・薬物濃度（ジゴキシンなど），血液ガス（低酸素・アシドーシス）","薬：抗不整脈薬・β遮断薬・Ca 拮抗薬・ジゴキシンの投与と投与後の心拍数・血圧，QT を延ばす薬の追加・併用，β遮断薬の中止・飲み忘れ，カテコラミン・気管支拡張薬","誘因：発熱・痛み・不安・脱水・出血・低酸素・睡眠不足・カフェイン・飲酒歴，中心静脈カテーテルの位置","一時ペーシング中：設定（レート・出力・感度）と実際の脈の一致，ペーシング不全・センシング不全，刺入部・固定・接続，本人の体動","ICD・ペースメーカ：作動（ショック）の有無と状況，創部（植込み後），遠隔モニタリングの通知，磁石・電気機器の近接","抗凝固薬（心房細動）の投与状況と出血徴候，脳梗塞の症状（片側の脱力・ろれつ）","除細動器・救急カート・経皮ペーシングの位置と点検状況（毎勤務）"],"TP":["警報が鳴ったらすぐ訪室し，患者の意識・脈・血圧・症状を確認する．反応がなく正常な呼吸がない（死戦期呼吸を含む）なら，応援要請と胸骨圧迫を開始し，脈拍確認は 10 秒以内にとどめる．ショック適応（VF・無脈性 VT）かは AED・モニタで判定し，PEA・心静止には除細動しない．脈があり呼吸だけ止まっているなら換気を優先（いずれも院内 BLS 手順に従う）．不安定（症状＋血圧低下・意識低下）なら応援要請と院内の緊急対応，除細動器・救急カート・経皮ペーシングの準備．安定なら 12 誘導心電図を記録して医師に報告する","警報は消音・減音を対策にしない．設定の上下限は患者の普段の心拍数と病態に合わせて医師と決め，変更は記録する．不要な警報（電極外れ・ノイズ）は電極の貼り替え・皮膚の準備・コードの整理で減らす","電極は毎日（または施設基準で）貼り替え，皮膚を観察する．送信機の電池・電波の届く範囲・検査や入浴で外す時間帯をチームで共有し，外している間の観察方法を決める","原因への対応を医師と協働で進める：K・Mg の補正（指示のもと投与し，投与後の再採血を確認），低酸素・発熱・痛み・不安・脱水の是正，薬の見直し（徐脈を起こす薬・QT を延ばす薬の中止や変更は医師・薬剤師と相談し，独断で中止しない．β遮断薬の急な中止は反跳性の頻脈を起こす）","抗不整脈薬・レートコントロール薬の投与後は心拍数・血圧・QTc・症状を追い，徐脈・低血圧・QT 延長は発見時に報告する．静注薬は指示の速度を守り，投与中はモニタから目を離さない","徐脈・失神のリスクがある患者は転倒予防を強める：ナースコールの位置，離床時の付き添い，起立時の症状確認，ベッドの高さ（転倒計画と連動）","一時ペーシング中：設定と実際の脈の一致を毎勤務確認し，ペーシング不全・センシング不全・刺入部の異常は発見時に報告する．リードの固定と体動時の注意を本人に説明し，接続部を保護する","ICD の作動（ショック）があれば，時刻・回数・前後の症状・意識を記録して医師に報告する．短時間に複数回の作動は院内の緊急対応へ．作動後の恐怖に寄り添い，「装置が守ってくれた」と伝える（疾患別リスト「心室頻拍・心室細動（ICD 含む）」参照）","心房細動のある患者は抗凝固薬の確実な投与と出血徴候の観察，脳梗塞の症状の観察を並行する（出血リスクの計画と連動）","頻脈の誘因を減らす環境づくり：痛み・不安・不眠への対応，カフェインの制限，安静度の遵守，処置前の説明","記録は「時刻・波形（ストリップ保存）・心拍数・症状・血圧・対応・報告先」をセットで残し，夜勤帯・引き継ぎ時に不整脈の傾向（時間帯・誘因）を共有する","除細動器・救急カート・経皮ペーシングの位置と点検を毎勤務確認し，急変時の役割（誰が呼ぶ・誰が押す・誰が記録する）を共有しておく"],"EP":["患者へ：動悸・めまい・目の前が暗くなる・胸痛・息切れは我慢せずナースコールで知らせること．失神したことがあれば必ず伝えること","患者へ：モニタの警報は看護師が確認するので慌てなくてよいこと，電極が外れたり送信機を落としたりしたら教えてほしいこと，電極や送信機は入浴・検査のときに看護師が外すこと","患者へ：起き上がりや歩き出しはゆっくり，ふらついたら座って呼ぶこと（徐脈・失神の予防）","患者へ：薬（β遮断薬・抗不整脈薬・抗凝固薬）は指示どおりに飲み，急にやめないこと．新しい薬・市販薬・サプリは脈に影響することがあるので相談すること","患者へ：利尿薬・下痢・嘔吐・大量の汗でカリウムが下がると不整脈が出やすいこと，食べられない・下痢が続くときは早めに知らせること","患者・家族へ：自分で脈を測る方法（手首で 1 分間，速さと乱れ），退院後に受診・救急車を呼ぶ目安（失神・続く動悸・胸痛・ICD の作動）は主治医の指示に沿って伝える","ペースメーカ・ICD のある患者・家族へ：手帳の携帯，強い磁石・IH 調理器の直上・電気工具の注意，携帯電話は反対側で，MRI・手術・歯科の前に必ず申し出ること，創部の異常（赤い・腫れ・熱い・膿）は連絡（詳細は疾患別リスト「洞不全症候群・房室ブロック」「心室頻拍・心室細動」参照）","家族へ：CPR・AED の使い方を学んでおくこと，本人の失神や動悸に気づいたときの対応"],"evaluation":{"timing":"毎勤務（警報の内容と対応を含む），不整脈出現時と対応後，薬の開始・変更後 3 日間，採血結果が出たとき，デバイス植込み・ペーシング設定変更後","indicators":["症状を伴う不整脈・血圧低下・失神・転倒・心停止が起きていない，または発見時に施設手順どおりに対応されている","警報への対応（まず患者を見る・判断・報告）が記録され，電極外れ・ノイズによる不要な警報が減っている（消音・減音による減少ではない）","K・Mg が指示の範囲にあり，引き金となる薬・誘因が特定され是正されている","抗不整脈薬・レートコントロール薬の副作用（徐脈・低血圧・QT 延長）が出ていない，または報告・調整されている","本人が症状を伝えられ，モニタと薬の注意点・退院後の脈の見方と受診の目安を言える"],"revise_if":"新しい不整脈や症状を伴う不整脈が出た／血圧低下・失神・低灌流のサインが出た／K・Mg・腎機能が悪化した／不整脈に影響する薬が開始・変更・中止された／一時ペーシング・ICD・ペースメーカが導入・設定変更された／ICD が作動した／モニタの離脱基準に達した"},"cardio_ward_notes":["「安定か不安定か」を症状・血圧・意識で判断するのが初動の要．心拍数や休止の長さの報告基準は施設のモニタ管理基準に従い，一律の値で判断しない（疾患別リスト「頻脈・徐脈の観察の基本」参照）","心筋梗塞の発症後数日と心臓手術後は心室性不整脈・房室ブロック・心房細動が出やすい時期．胸痛・ST 変化と不整脈をセットで見る","利尿薬・下痢・嘔吐で K・Mg が下がると心室性不整脈・QT 延長の引き金になる．「薬を足すときは QT を思い出す」：抗菌薬・抗精神病薬・制吐薬などの追加時は薬剤師と QT 延長のリスクを確認する（疾患別リスト「QT 延長・薬剤性不整脈」参照）","徐脈（洞不全・房室ブロック）は前兆なく失神することがある．β遮断薬・Ca 拮抗薬・ジゴキシン・抗不整脈薬・一部の点眼薬など徐脈を起こす薬を洗い出し，医師と調整する．一時ペーシング・経皮ペーシングの準備を施設手順で確認","心房細動では「脈の速さ」「脳梗塞予防（抗凝固薬）」「出血」の 3 本柱で見る．頻脈が続くと心不全が悪化し，心不全の悪化が頻脈を招く（体液過剰の計画と連動）","モニタの警報を「鳴りっぱなし」にすると本物を見逃す（警報疲労）．消音・減音ではなく，電極・皮膚・設定の見直しと，患者ごとの上下限を医師と決めることで対応する"],"sources":[{"name":"Open RN Health Alterations, 5.3 General Cardiovascular System Assessment（心電図と主な不整脈：心房細動・心房粗動・心室頻拍・心室細動・房室ブロック，ペースメーカ）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-3-general-cardiovascular-system-assessment/","license":"CC BY 4.0（WisTech Open）","note":"各不整脈と心拍出量の関係，緊急対応の必要性を参考"},{"name":"Open RN Nursing Skills 2e, 9.3 Cardiovascular Assessment（脈の触診・聴診との差・末梢循環）","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/9-3-cardiovascular-assessment/","license":"CC BY 4.0（WisTech Open）","note":""},{"name":"NHLBI Arrhythmias（Symptoms／Treatment）","url":"https://www.nhlbi.nih.gov/health/arrhythmias","license":"パブリックドメイン","note":"https://www.nhlbi.nih.gov/health/arrhythmias/symptoms ，/treatment も取得確認済"},{"name":"NHLBI Conduction Disorders（徐脈性不整脈・房室ブロック）","url":"https://www.nhlbi.nih.gov/health/conduction-disorders","license":"パブリックドメイン","note":""},{"name":"NHLBI Pacemakers／Defibrillators","url":"https://www.nhlbi.nih.gov/health/pacemakers","license":"パブリックドメイン","note":"https://www.nhlbi.nih.gov/health/defibrillators も取得確認済．生活上の注意（磁石・携帯電話・MRI）を参考"},{"name":"MedlinePlus: Arrhythmia（Health Topic）","url":"https://medlineplus.gov/arrhythmia.html","license":"パブリックドメイン","note":"患者向け説明の言い回しを参考"},{"name":"MedlinePlus: Pacemakers and Implantable Defibrillators（Health Topic）","url":"https://medlineplus.gov/pacemakersandimplantabledefibrillators.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Potassium（Health Topic）","url":"https://medlineplus.gov/potassium.html","license":"パブリックドメイン","note":"低 K の患者向け説明を参考"},{"name":"厚生労働省 重症度，医療・看護必要度 評価票（令和 8 年度 通知 別紙 7）A 項目「心電図モニターの管理」","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0","note":"参考情報として"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"peripheral_perfusion","group":"循環・呼吸","problem":"末梢循環障害がある（手足の血流が保てず，冷感・色調変化・痛み・組織障害のおそれがある）","problem_plain":"足や手の先まで血液が十分に届かない状態．動脈の詰まり（閉塞性動脈硬化症・急性動脈閉塞），カテーテルや補助循環の穿刺側の血流低下，ショックや昇圧薬による手足の冷えが原因になる．放置すると痛み・傷が治らない・壊死につながる．","applies_when":["閉塞性動脈硬化症（間欠性跛行・安静時痛・足の傷）で入院中，または下肢の血行再建（バイパス・カテーテル治療）の前後","急性動脈閉塞（突然の足の痛み・冷感・蒼白）を疑う，または治療後","大腿・橈骨からのカテーテル穿刺後（止血デバイス圧迫中・圧迫解除後を含む）","IABP・ECMO・Impella などの補助循環で太い管が大腿動脈に入っている","ショック・低心拍出で昇圧薬（ノルアドレナリンなど）を使っている，または末梢が冷たい・網状皮斑がある","糖尿病・透析・喫煙者で足の傷や感覚低下がある","弾性ストッキング・固定帯・ギプスなど末梢を締めつける物を使っている"],"related_factors":["動脈の狭窄・閉塞：動脈硬化，血栓・塞栓（心房細動からの塞栓を含む），血管の攣縮","医療処置：穿刺部の圧迫止血，止血デバイスの圧が強い・長い，シース・補助循環の管による血管の閉塞","低灌流：低血圧・ショック・低心拍出，脱水","薬剤：昇圧薬による末梢血管の収縮","外からの圧迫：弾性ストッキングの縁，固定帯，浮腫のある足の靴","感覚低下：糖尿病性神経障害で痛みや冷えに気づかない","皮膚の脆弱さ：乾燥・ひび割れ・水虫・深爪"],"assessment":{"scales":[{"name":"足背動脈・後脛骨動脈の触知（左右差・強さ．触れなければドップラーで確認）","license":"一般的手技（事実）","note":"脈の強さは施設の記載法（0〜3 段階など）に合わせる．触れないときは『新しい変化か，もともと触れにくいか』を入院時の記録と比べる"},{"name":"皮膚の色・温度・動き・感覚（左右を比べる），毛細血管再充満時間（爪を押して色が戻るまでの秒数）","license":"一般的手技（事実）","note":"色が戻るまでの目安は 2〜3 秒．ただし低体温・高齢・寒い部屋では延びるので，値だけで判断せず左右差と経時変化を見る"},{"name":"ABI（足首と上腕の血圧の比）","license":"検査手技（事実）","note":"医師の指示で測定．基準値の解釈は疾患別リスト（閉塞性動脈硬化症）と医師の評価に従う"},{"name":"急性動脈閉塞の 6 つのサイン（痛み・脈が触れない・蒼白・感覚異常・麻痺・冷感）","license":"一般的な観察の枠組み（事実）","note":"1 つでも新しく出たら発見時に速やかに医師へ報告し，院内の緊急対応につなぐ"}],"assessment_points":["入院時・穿刺前・補助循環の挿入前に『もとの状態』を記録する：両足の脈の触知・色・温度・傷の有無．以後の比較の基準になる","観察の間隔は処置と状態で決める：穿刺後・補助循環中は施設の観察プロトコルの間隔で，安定した閉塞性動脈硬化症は毎日","『足が冷たい』『しびれる』『痛い』の訴えは，まず脈と色を確認し，新しい変化なら報告（我慢させない）","足の傷は部位・大きさ・深さ・色・臭い・周囲の赤みを記録し，写真で経過を追う（施設の規定に従う）","痛みの性質を分ける：歩くと出て休むと治る（跛行），横になると出て足を下げると楽（安静時痛），突然の激痛＋冷感（急性閉塞）"]},"goals":{"long_term":"入院中，末梢循環の悪化による組織障害（壊死・切断）や医療処置に伴う血流障害を起こさず，退院時に足の状態と受診の目安を本人が説明できる","short_term":["穿刺後・補助循環中：施設のプロトコルの間隔で末梢循環（脈・色・温度・感覚）が観察され，新しい左右差が発見時に報告されている","3 日以内：足の傷が新しくできていない，既にある傷が悪化していない","1 週間以内：足を温めすぎない・締めつけない・傷を作らないケアが本人・看護師で実施できている","退院までに：足の観察方法と『すぐ受診するサイン』（急な痛み・冷感・色の変化・傷の黒色化）を本人が言える"]},"OP":["足背動脈・後脛骨動脈（穿刺後は橈骨動脈も）の触知と左右差，触れないときはドップラー音の有無","皮膚の色（蒼白・チアノーゼ・暗赤色・網状皮斑），温度（左右差・境目の高さ），乾燥・ひび割れ","毛細血管再充満時間の左右差と経時変化","感覚（しびれ・触った感じの鈍さ）と運動（足首・足指を動かせるか）","痛みの性質・部位・出るとき（歩行時・安静時・夜間・足を上げたとき）と鎮痛薬の効き方","穿刺部：出血・血腫・拍動性の腫れ，止血デバイスの圧と経過時間，圧迫帯より先の色と腫れ","補助循環中：管の入っている側の下肢全体の色・温度・脈，固定と屈曲の有無","足の傷・潰瘍：大きさ・深さ・浸出液・臭い・周囲の赤み・黒色化","全身の循環：血圧・脈拍・尿量・意識，昇圧薬の量とその変更","締めつけている物：弾性ストッキングの縁の跡，固定帯・ギプス・靴の当たり","血液データ：Hb（出血），腎機能（造影剤後），血糖，凝固（抗凝固薬中）","本人が足を見る習慣・靴下や靴の状態・感覚の低下（糖尿病）"],"TP":["観察のたびに左右を比べ，新しい左右差・脈の消失・蒼白・激痛は発見時に速やかに医師へ報告する（急性閉塞は時間との勝負）","足を冷やさない工夫：室温・掛け物・靴下で保温する．湯たんぽ・カイロ・電気毛布で直接温めない（感覚が鈍い足は低温やけどをする）","足の位置：動脈の血流障害では足を下げた姿勢が楽なことが多い．心臓より高く上げない．浮腫が合併するときは医師と相談して軽く挙上する","締めつけを避ける：弾性ストッキング・固定帯・靴下のゴム・足を組む姿勢．圧迫止血中の帯は指示の圧と時間を守り，先の色と痛みを見て報告","穿刺部の圧迫解除は施設の手順どおり段階的に行い，解除後も末梢循環と出血を観察する（疾患別リスト PCI 後・カテーテル検査の前後と同じ）","補助循環中：管の固定・屈曲を確認し，下肢の色・温度・脈の変化は循環補助の中断につながる問題として速やかに報告する","スキンケア：足を洗い，指の間は乾かし，かかとや甲は保湿する．爪は真っすぐ切り深爪しない（傷や糖尿病があれば自己処置させずフットケア担当につなぐ）","傷があるときは創傷ケアの担当（医師・皮膚排泄ケア認定看護師）と相談し，圧迫のかからない体位と靴を選ぶ","歩行訓練が指示されている患者：痛みが出たら休み，治まったら再開する方法を一緒に行う（急性期・傷のある足は医師の指示を確認）","ショック・昇圧薬使用中：末梢の冷感は全身の低灌流のサインでもある．血圧・尿量・意識と合わせて報告し，褥瘡予防（かかと・仙骨部の除圧）を強化する","抗凝固薬・抗血小板薬の内服を確認し，飲み忘れがないようにする（中止・変更は医師の判断）"],"EP":["患者へ：足の冷え・しびれ・痛み・色の変化は我慢せず，気づいたときにすぐ知らせてほしい","患者へ：足を直接温めない（カイロ・湯たんぽは低温やけどのもと），足を締めつけない，足を組まない","患者へ：毎日足を見る（指の間・かかと・爪）．見えにくいときは鏡や家族の助けを借りる","患者へ：素足で歩かない，靴の中を確認してから履く，傷ができたら自分で処置せず相談する","患者へ：禁煙が最も効果のある治療であること，血圧・血糖・脂質の管理と歩行習慣を続けること","患者・家族へ：退院後に『突然の足の激痛・冷たい・白い・動かない』が出たら救急受診すること","家族へ：糖尿病や感覚低下がある患者は本人が気づきにくいので，家族も足を見てほしい"],"evaluation":{"timing":"穿刺後・補助循環中は施設プロトコルの間隔ごと，安定期は毎日と 1 週間ごと，治療（血行再建・補助循環の抜去）の前後","indicators":["脈の触知・色・温度・毛細血管再充満時間に新しい左右差や悪化がない（あった場合は発見時に報告され対応されている）","新しい傷・潰瘍がなく，既存の傷が悪化していない","穿刺部・補助循環の管に関連する末梢循環障害が起きていない","本人が足の観察と受診の目安を説明できる"],"revise_if":"新しい左右差や脈の消失が出た／足の傷ができた・悪化した／穿刺・補助循環が加わった／昇圧薬が始まった・増えた／安静度が変わった"},"cardio_ward_notes":["カテーテル後の穿刺側の末梢循環（動脈触知・色・温度・毛細血管再充満）は，疾患別リスト（PCI 後・心臓カテーテル検査の前後）と同じ項目で観察し，橈骨穿刺では止血デバイスの減圧の手順どおりに進める","IABP・ECMO・Impella の大腿動脈の管は下肢虚血の主な原因．管側の下肢の色・温度・脈を毎回確認し，変化は循環補助の問題として速やかに報告する","心原性ショックで昇圧薬を使うと末梢は冷たくなる．『冷たいから温める』ではなく，全身の灌流（血圧・尿量・乳酸・意識）と合わせて評価する","心房細動の患者の急性動脈閉塞は心臓からの塞栓が多い．突然の足の激痛・冷感・脈の消失は院内の緊急対応につなぐ","閉塞性動脈硬化症は冠動脈・脳血管の動脈硬化と重なることが多い．足の観察と同時に胸痛・神経症状にも注意する","閉塞性動脈硬化症の薬シロスタゾールは，添付文書でうっ血性心不全が禁忌．心不全と PAD を合併した患者の持参薬・処方は，投与前に医師・薬剤師へ照会する"],"sources":[{"name":"Open RN Nursing Skills 2e, Ch.9 Cardiovascular Assessment（9.3：末梢の色・温度・動き・感覚，脈の触知と段階，毛細血管再充満時間，浮腫の評価）","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/9-3-cardiovascular-assessment/","license":"CC BY 4.0","note":"末梢血管のアセスメント項目を参考"},{"name":"Open RN Health Alterations, Ch.5 Cardiovascular Alterations（5.9 Peripheral Arterial Disease：跛行・脈の減弱・毛細血管再充満の延長・足の位置・歩行療法・術後の遠位脈の観察）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-9-peripheral-arterial-disease/","license":"CC BY 4.0","note":"看護介入の体系を参考"},{"name":"NHLBI: Peripheral Artery Disease","url":"https://www.nhlbi.nih.gov/health/peripheral-artery-disease","license":"米国政府著作物（パブリックドメイン）","note":"症状・リスク因子・患者向け説明の言い回しを参考"},{"name":"NHLBI: Cardiogenic Shock","url":"https://www.nhlbi.nih.gov/health/cardiogenic-shock","license":"パブリックドメイン","note":"ショック時の末梢のサイン"},{"name":"MedlinePlus: Peripheral Arterial Disease（Health Topic）","url":"https://medlineplus.gov/peripheralarterialdisease.html","license":"パブリックドメイン","note":"患者向け説明を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"bp_control","group":"循環・呼吸","problem":"血圧の管理が必要である（高すぎる・低すぎる・変動が大きいことで臓器障害や転倒のおそれがある）","problem_plain":"血圧が目標の範囲から外れると，脳・心臓・腎臓・大動脈に負担がかかったり，逆に血流が足りなくなったりする．高血圧緊急症や大動脈解離では『下げすぎず，上げすぎず』を点滴で細かく調整し，術後や降圧薬の開始時には低血圧・立ちくらみにも注意する．","applies_when":["高血圧緊急症（頭痛・視力障害・胸痛・神経症状を伴う著しい高血圧）で降圧薬を静注している","急性大動脈解離・大動脈瘤で厳格な血圧・心拍数の管理が指示されている","心臓手術・カテーテル治療・脳外科手術の術後で血圧の上限・下限が指示されている","低血圧（収縮期血圧が施設基準・医師の指示する下限を下回る），ショック，昇圧薬の使用中","起立性低血圧（立ち上がると血圧が下がりめまい・失神を起こす）がある，または降圧薬・利尿薬・硝酸薬の開始・増量直後","脳卒中（脳梗塞・脳出血）の急性期で血圧の目標が個別に指示されている","血圧が測定のたびに大きく変動する（痛み・不安・尿閉・便秘・睡眠不足が影響）"],"related_factors":["疾患：高血圧の服薬中断，大動脈解離，脳血管障害，急性心不全，腎障害，内分泌疾患","薬剤：降圧薬の静注・増量（下げすぎ），利尿薬（脱水），硝酸薬・β遮断薬（徐脈・低血圧），鎮静薬・オピオイド，市販薬・違法薬物（上昇）","循環血液量：脱水，出血，除水，逆に輸液過剰","自律神経：長期臥床，糖尿病性神経障害，高齢，食後・入浴後・排尿後の血圧低下","血圧を上げる要因：痛み，不安，尿閉，便秘・いきみ，寒さ，睡眠不足，測定時の会話","測定の問題：カフの大きさ，腕の高さ，左右差（大動脈解離では左右差そのものが所見）"],"assessment":{"scales":[{"name":"血圧測定の基本手技（適切なカフ幅，心臓の高さ，安静後，初回は両腕，測定条件の記録）","license":"一般的手技（事実）","note":"動脈圧ラインとカフ血圧を併用するときは，どちらを指示の基準にするか医師に確認する"},{"name":"起立性低血圧の確認（臥位で 5 分安静後 → 立位 1 分・3 分の血圧・脈拍・症状）","license":"一般的手技（事実）","note":"転倒転落計画と同じ手順．収縮期 20 mmHg 以上または拡張期 10 mmHg 以上の低下で陽性．症状が出れば数値にかかわらず中止して座らせる．安全に立てない患者は座位で代用し記録に明記"},{"name":"家庭血圧の記録（朝・晩の測定条件と値を記録する表）","license":"自前実装可（一般的な記録様式）","note":"退院指導で使う．目標値は医師の指示"}],"assessment_points":["入院時に『目標の範囲（上限・下限）と心拍数の目標』『目標を外れたときの報告先と対応』を指示書で確認し，ベッドサイドの情報として共有する","初回は両腕で測り左右差を記録する（大動脈解離・血管の狭窄では左右差が出る．以後は高い側で統一する）","血圧の値だけでなく症状（頭痛・視力障害・胸痛・意識・麻痺・めまい・尿量）を必ず一緒に見る","変動の原因を探す：痛み・不安・尿閉・便秘・寒さ・睡眠不足・測定条件．薬の投与時刻と値の推移を突き合わせる","静注降圧薬・昇圧薬の投与中は，投与量を変えた後の血圧の推移（下がりすぎ・戻り）を頻回に見る（間隔は施設プロトコルと医師の指示）"]},"goals":{"long_term":"入院中，血圧が医師の指示する目標の範囲で安定し，高血圧・低血圧による臓器障害や転倒・失神を起こさず，退院後の血圧管理（測定・服薬）を本人が続けられる","short_term":["指示があった時点から：目標範囲と報告基準が共有され，範囲を外れたときに発見時に報告・対応されている","静注薬の使用中：投与量の変更後の血圧が施設プロトコルの間隔で確認され，急激な低下や意識・神経症状の変化が起きていない（起きた場合は速やかに報告されている）","3 日以内：痛み・不安・尿閉・便秘など血圧を変動させる要因が把握され，対応されている","初回離床前と降圧薬の変更後：起立性低血圧の有無が確認され，移動方法（段階的な起き上がり・見守り）が決まっている","退院までに：家庭血圧の測り方と記録，薬を自己判断でやめないこと，受診の目安を本人が言える"]},"OP":["血圧・脈拍（測定条件・体位・腕を記録），指示の範囲に対する位置，前回からの変化幅","動脈圧ライン使用時：波形・ゼロ点・カフ血圧との差","静注薬（降圧薬・昇圧薬）の種類・投与量・変更時刻とその後の血圧の推移","内服の降圧薬・利尿薬・硝酸薬・β遮断薬の投与時刻，飲み忘れ，静注から内服へ切り替えた後の再上昇","高血圧側の症状：頭痛，吐き気・嘔吐，見えにくさ，胸痛・背部痛，意識のぼんやり，けいれん，麻痺・ろれつ","低血圧側の症状：めまい・目の前が暗くなる，冷汗，あくび，意識の変化，尿量の減少，末梢の冷感","起立時の血圧・脈拍の変化と症状（初回離床前，薬の変更後，訴えがあったとき）","血圧を変動させる要因：痛みの程度，不安・興奮，尿意・尿閉，最終排便日・いきみ，寒さ，睡眠","水分バランス：飲水量・輸液量・尿量・体重，脱水のサイン（口渇・皮膚の乾燥・頻脈）","心電図モニタ：徐脈・頻脈・不整脈（血圧変動の原因にも結果にもなる）","血液データ：腎機能・電解質（利尿薬・降圧薬の影響），Hb（出血による低血圧）","本人の理解：目標値・服薬の意味・家庭血圧の経験，服薬中断の背景（費用・副作用・理解）"],"TP":["目標範囲を外れたら，まず測定条件（カフ・体位・会話・痛み）を確認して再測定し，症状と合わせて医師へ報告する．症状を伴う著しい高血圧・低血圧，意識や神経症状の変化は院内の緊急対応へ","静注降圧薬・昇圧薬は専用ルートで，投与量の変更は指示に基づいて行い，変更後は施設プロトコルの間隔で血圧を確認する（『段階的に下げる』が原則で，急に正常まで下げない）","内服薬は指示の時刻に確実に投与し，静注から内服へ切り替える時期は血圧の再上昇を見る","血圧を上げる要因を取り除く：痛みは我慢させず先回りで鎮痛（大動脈解離では特に重要），排尿・排便の援助といきみの回避（緩下薬は医師と相談），保温，静かな環境と照明の調整","起立性低血圧がある・降圧薬を変更した患者：起き上がりは段階的に（座る → 足を下ろす → 立つ），各段階で症状がないことを確認し，初回歩行は見守りで（転倒転落計画と同じ）","利尿薬は可能なら午前中に投与し，夜間のトイレ歩行時の血圧低下と転倒を減らす（医師と相談）","低血圧時：まず臥床・下肢挙上（心不全・呼吸困難があれば体位は呼吸を優先），出血・脱水・薬の投与直後・迷走神経反射・不整脈のどれかを考えながら報告する","厳格な血圧管理中（大動脈解離など）の安静解除は段階的に，血圧の変動を見ながら進める（安静度は医師の指示）","測定を統一する：同じ腕・同じ体位・同じ時刻，測定前の安静，記録には条件を書く","退院前に家庭血圧計の使い方を実際に練習し，記録表を渡す．服薬中断の背景があれば薬剤師・医師・ソーシャルワーカーと対策を立てる","薬の減量・中止・追加は看護師が独断で行わず，報告と指示に基づいて対応する"],"EP":["患者へ：血圧の目標は人によって違うこと，入院中の目標値と『こんな症状が出たらすぐ呼ぶ』（頭痛・胸痛・見えにくい・めまい・麻痺）を伝える","患者へ：起き上がるときはゆっくり，座ってから立つ．めまいがしたら座って待ち，ナースコールを押す","患者へ：痛み・尿意・便秘・不安は血圧を上げるので我慢せず知らせてほしい","患者へ：降圧薬は自己判断でやめない・減らさない．副作用や費用の悩みは相談できること","患者・家族へ：家庭血圧は朝（起床後・排尿後・服薬前）と晩に同じ条件で測り，記録して受診時に持参する．市販薬・サプリの中には血圧を上げるものがあること","患者へ：減塩・節酒・禁煙・睡眠・運動の見直しは薬と同じくらい大切であること（具体策は栄養士・心臓リハと連携）","家族へ：本人が『いつもと違う』（ぼんやり，言葉が出にくい，強い頭痛）ときは看護師にすぐ伝えてほしい"],"evaluation":{"timing":"静注薬使用中は施設プロトコルの間隔ごと，安定後は毎勤務と 1 週間ごと，薬の変更・安静度の変更・離床開始時","indicators":["血圧・心拍数が指示の範囲に入っている時間が増え，範囲外のときに発見時に報告・対応されている","高血圧・低血圧による症状（頭痛・視力障害・胸痛・意識変化・めまい・失神）や臓器障害の進行がない","起立性低血圧による転倒・失神がなく，段階的な起き上がりが定着している","血圧を変動させる要因（痛み・排泄・不安）が管理されている","本人が家庭血圧の測定と記録，服薬継続の理由，受診の目安を説明できる"],"revise_if":"目標範囲が変更された／静注薬が開始・終了した／範囲外が続く／神経症状・胸痛・尿量減少が出た／起立性低血圧が出た／内服へ切り替えた"},"cardio_ward_notes":["高血圧緊急症では『段階的に下げる（急に正常まで下げない）』が原則．下げすぎは脳・腎の虚血（意識変化・尿量減少）を招く（疾患別リスト 高血圧緊急症と同じ）","急性大動脈解離では血圧と心拍数の両方に目標があり，痛みそのものが血圧を上げる．鎮痛と血圧管理は一体で考え，痛みの再燃は解離の進行のサインとして速やかに報告する","血圧の左右差は大動脈解離や血管狭窄の所見．初回に両腕で測って記録し，以後の測定側を統一する","降圧薬・硝酸薬・β遮断薬・利尿薬の開始や増量の直後は起立性低血圧が出やすく，転倒の主な原因になる（転倒転落計画の cardio_ward_notes と同じ）","術後・カテーテル後の低血圧は出血（穿刺部・後腹膜・ドレーン），心タンポナーデ，迷走神経反射，不整脈を鑑別する必要がある．『薬のせい』と決めつけない","透析患者・心不全患者では除水・利尿の量と血圧が連動する．体重・水分出納と合わせて評価する"],"sources":[{"name":"Open RN Health Alterations, Ch.5 Cardiovascular Alterations（5.5 Hypertension：高血圧の分類，高血圧緊急症の考え方，生活指導，家庭血圧の記録）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-5-hypertension/","license":"CC BY 4.0","note":"看護介入の体系を参考．本文の目標値は米国基準のため本計画では採用せず『医師の指示』とした"},{"name":"Open RN Nursing Fundamentals 2e, Ch.13 Mobility（13.3 Applying the Nursing Process：起立性低血圧の定義と離床前の確認）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-3-applying-the-nursing-process/","license":"CC BY 4.0","note":""},{"name":"NHLBI: High Blood Pressure","url":"https://www.nhlbi.nih.gov/health/high-blood-pressure","license":"パブリックドメイン","note":"患者向け説明・生活指導の言い回しを参考"},{"name":"NHLBI: Low Blood Pressure","url":"https://www.nhlbi.nih.gov/health/low-blood-pressure","license":"パブリックドメイン","note":"起立性低血圧・症状・原因の整理を参考"},{"name":"MedlinePlus: High Blood Pressure（Health Topic）","url":"https://medlineplus.gov/highbloodpressure.html","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Low Blood Pressure（Health Topic）","url":"https://medlineplus.gov/lowbloodpressure.html","license":"パブリックドメイン","note":""}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"activity_intolerance","group":"活動・休息","problem":"活動耐性が低下している（少しの動作で息切れ・疲労・胸部症状が出て，必要な活動ができない）","problem_plain":"心臓の働きが落ちていたり，長い安静で体力が落ちていたりして，歩く・座る・身の回りのことをするだけで息が切れたり，脈や血圧が大きく変わったりする状態．無理をすると心臓に負担がかかり，安静にしすぎると体力がさらに落ちるので，症状とバイタルを見ながら段階的に活動を広げる．","applies_when":["心不全（急性期の安静解除から，慢性心不全の増悪後）で離床を進めている","急性心筋梗塞・不安定狭心症の治療後で心臓リハビリの段階的な離床プログラム中","心臓手術・弁膜症治療後で活動を再開している","軽い動作（着替え・トイレ歩行・病棟内歩行）で息切れ・動悸・疲労が出る，または動作後のバイタルの戻りが遅い","貧血・低栄養・フレイル・COPD・肺高血圧など，活動を制限する併存疾患がある","『動くと心臓に悪い』と不安で動かない，逆に無理をしすぎる傾向がある","β遮断薬・利尿薬・降圧薬を使っており，活動時の脈や血圧の反応が薬で変わっている"],"related_factors":["心機能：心拍出量の低下，虚血，弁の狭窄・逆流，不整脈（心房細動・徐脈）","呼吸：肺うっ血，胸水，無気肺，COPD，酸素化の低下","全身：貧血，脱水，低栄養，電解質異常，発熱・感染","体力：長期臥床による筋力低下（廃用），高齢・フレイル・サルコペニア","薬剤：β遮断薬（脈が上がりにくい），利尿薬（脱水・ふらつき），降圧薬（活動後の血圧低下），鎮静薬","心理：不安・恐怖・抑うつ，「安静にしていれば安全」という思い込み，家族の過保護","痛み：創部痛・胸骨痛・穿刺部痛が動作を妨げる"],"assessment":{"scales":[{"name":"活動前・中・後のバイタルと症状の記録（血圧・脈拍・SpO2・呼吸数，胸痛・息切れ・めまい・冷汗，回復までの時間）","license":"一般的手技（自前実装可）","note":"施設の心臓リハビリプロトコルの様式があればそれを使う．中止基準は施設プロトコルと医師の指示に従う"},{"name":"会話テスト（歩きながら普通に会話できる強さか）と『ややきつい』の言葉での確認","license":"一般的な方法（事実）","note":"Borg スケール（RPE・CR10）は Borg Perception 社が権利を管理しライセンスが必要（借用不可）．施設で使用中なら参照のみとし，アプリには数値表を載せない"},{"name":"6 分間歩行試験（決められた区間を 6 分間歩いた距離と症状・SpO2）","license":"検査手技（事実）","note":"心臓リハビリの担当者が実施．看護計画では結果を共有して活動範囲の目安にする"},{"name":"心不全の症状による重症度の区分（安静時にも症状があるか，軽い動作で出るか，強い動作で出るか）","license":"臨床上の分類（事実として記述．特定の団体の分類表は転載しない）","note":"医師の診療録の記載を参照し，看護師は『どの動作で症状が出るか』を具体的に記録する"}],"assessment_points":["『どの動作で・どのくらいで・どんな症状が出て・どのくらいで戻るか』を具体的に記録する（例：トイレまで 20 m 歩行で息切れ，座って 3 分で回復）","安静度と離床の段階（ベッド上 → 端座位 → 立位 → 室内歩行 → 病棟内歩行）を医師・リハビリと共有し，現在どの段階かをベッドサイドで見えるようにする","活動を止める基準（胸痛，強い息切れ，冷汗，めまい，新しい不整脈，血圧の低下や過度の上昇，SpO2 の低下など）は施設のプロトコルで確認し，値を独自に決めない","薬の影響を織り込む：β遮断薬では心拍数が上がりにくいので，脈拍だけで負荷の強さを判断せず症状と血圧を重視する","活動を妨げているもの（痛み・不安・貧血・睡眠不足・ルート類）を探し，取り除けるものから対応する"]},"goals":{"long_term":"退院時に，必要な日常生活動作と退院後の活動（自宅内の移動・外来リハビリへの通院）を，症状の悪化なく安全に行える","short_term":["離床の各段階：活動前後のバイタルと症状が記録され，中止基準に該当した場合は中止して報告されている","1 週間以内（または施設プロトコルの段階に沿って）：現在の段階の活動を症状の悪化なく行え，次の段階へ進む判断が医師・リハビリと共有されている","3 日以内：活動を妨げる要因（痛み・不安・睡眠不足）への対応が始まっている","退院までに：本人が自分の活動の目安（『ややきつい』程度・会話できる強さ）と，止めて休むべき症状を言える"]},"OP":["活動前・活動中・活動後の血圧・脈拍・SpO2・呼吸数と，安静時の値に戻るまでの時間","活動中の症状：胸痛・胸部圧迫感，息切れ（会話ができるか），動悸，めまい・ふらつき，冷汗，顔色，強い疲労","心電図モニタ：活動中・活動後の不整脈（心房細動の新出・心室性期外収縮の増加・徐脈），ST 変化","翌日まで残る疲労，活動後の食欲低下・眠れないなど負荷が強すぎたサイン","心不全のサイン：体重（毎日同じ条件で），浮腫，頸静脈の怒張，夜間の呼吸困難・起坐呼吸，尿量","呼吸：呼吸音（湿性ラ音），痰，酸素の使用量と SpO2 の目標（医師の指示）","血液データ：Hb（貧血），電解質，腎機能，BNP の推移（心機能の目安）","薬：β遮断薬・利尿薬・降圧薬・硝酸薬の投与時刻と活動時の反応，服薬直後の活動になっていないか","筋力・バランス：立ち上がり・歩き方・つかまる動作，歩行距離の推移","本人の認識と気持ち：活動への不安・恐怖，意欲の低下，無理をする傾向，家族の考え","痛み・睡眠・食事量など活動を妨げる要因"],"TP":["離床は施設の心臓リハビリプロトコルに沿って段階的に進め，各段階の前後でバイタルと症状を確認してから次へ進む（進める判断は医師・リハビリと共有）","中止基準に該当する症状・バイタルが出たら活動を止めて安静にし，バイタルと心電図を確認して医師へ報告する．胸痛は 12 誘導心電図とともに速やかに報告，呼吸・循環の異常は院内の緊急対応へ","活動は『ややきつい』程度・会話ができる強さにとどめ，準備運動と整理運動を省かない（強度の具体的な目安は施設プロトコル）","活動の時間帯を選ぶ：食後すぐ・利尿薬や降圧薬の直後・体調不良時を避け，午前中の体力のあるときに行う","活動を小分けにする：一度に長く動かず，休憩を挟む．必要な動作（洗面・食事・排泄）を優先し，ベッド上でもできる運動（足首の運動・下肢の等尺運動）は安静度内で続ける","呼吸を整える：動作中に息を止めない（いきまない）．酸素を使用中は活動時の SpO2 と流量の指示を確認し，チューブの長さを確保する","活動を妨げる要因への対応：活動前の鎮痛，睡眠の確保，貧血・脱水の是正（医師と協働），ルート類の整理","エネルギーの節約：物品を手の届く位置に，椅子を用意して座って行う動作を増やす，シャワーは椅子に座って","不安が強い患者には，実際にバイタルが安定していることを一緒に確認し，『動いてよい範囲』を具体的に伝える．逆に無理をする患者には中止基準を共有する","多職種連携：理学療法士・作業療法士・心臓リハビリ担当・管理栄養士と目標と進み具合を共有し，退院後の外来リハビリにつなぐ","活動後の回復（症状の消失・バイタルの戻り）を確認してから患者のもとを離れる"],"EP":["患者へ：安静にしすぎると体力が落ちるので，決められた範囲で動くことが回復につながること","患者へ：『ややきつい』『会話ができる』程度が目安で，胸痛・強い息切れ・冷汗・めまいが出たら止めて休み，ナースコールを押すこと","患者へ：動作は小分けにし，息を止めていきまない．食後すぐ・薬の直後・体調不良時は無理をしない","患者へ：β遮断薬を飲んでいると脈が上がりにくいので，脈拍より息切れの感じを目安にすること","患者・家族へ：毎日の体重測定と，短期間の増加・浮腫・夜間の息苦しさは連絡すること","家族へ：過保護になりすぎず，本人が決められた範囲で動くことを支えてほしい．逆に無理をしていたら止めてほしい","患者へ：退院後の運動・仕事・運転・性生活の再開時期は主治医に確認し，外来の心臓リハビリを続けること"],"evaluation":{"timing":"離床の段階が変わるごと，毎日（活動の記録），1 週間ごと，心不全の増悪・不整脈・薬の変更時","indicators":["現在の段階の活動を，中止基準に該当する症状・バイタルの変化なく行えている","活動後のバイタルが安静時の値に戻る時間が短くなり，歩行距離や行える動作が広がっている","活動を妨げる要因（痛み・不安・貧血・睡眠）への対応が進んでいる","本人が活動の目安と止めるべき症状を説明でき，実際にそのように行動している","退院後の活動計画（外来リハビリ・自宅での運動）が本人・家族と共有されている"],"revise_if":"活動中に中止基準に該当した／心不全の増悪・新しい不整脈が出た／段階が進んだ・戻った／薬が変わった／貧血・発熱など新しい制限要因が出た"},"cardio_ward_notes":["急性心筋梗塞後・心不全急性期・開心術後の離床は施設の心臓リハビリプロトコルで段階が決まっている．看護師は各段階の前後の観察と中止基準の確認を担い，段階を独自に進めない（疾患別リスト 心臓リハビリテーションと同じ）","β遮断薬を使う患者は運動中に心拍数が上がりにくい．心拍数だけで負荷を判断せず，症状（息切れ・疲労）と血圧を重視する","運動で血圧が下がる（上がらない）のは心機能低下の徴候で，中止して報告する対象．活動後の血圧低下は降圧薬・利尿薬の影響も考える","開心術後は胸骨を守る動作（腕で体を押し上げない・胸を抱えて咳をする）と創部痛の先回りの鎮痛を離床とセットにする","心不全患者は活動量が増える時期に体重・浮腫・夜間の呼吸困難を毎日確認し，活動による増悪を早く見つける","ICD・ペースメーカ植込み後は術側上肢の動作制限が指示されることがある．活動の段階と上肢の制限を分けて確認する"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.13 Mobility（13.2 Basic Concepts：不動の影響，13.3 Applying the Nursing Process：活動前後のバイタル監視・段階的な離床・起立性低血圧）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-2-basic-concepts/","license":"CC BY 4.0（NANDA-I の表は対象外）","note":"離床の進め方と観察の枠組みを参考"},{"name":"Open RN Health Alterations, Ch.5 Cardiovascular Alterations（5.8 Heart Failure：活動制限・症状・セルフケア）","url":"https://wtcs.pressbooks.pub/healthalts/chapter/5-8-heart-failure/","license":"CC BY 4.0","note":""},{"name":"NHLBI: Heart Failure - Living With","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"パブリックドメイン","note":"体重測定・活動・症状の見方の患者向け説明を参考"},{"name":"NHLBI: Heart Surgery - Recovery","url":"https://www.nhlbi.nih.gov/health/heart-surgery/recovery","license":"パブリックドメイン","note":"術後の活動再開の考え方を参考"},{"name":"MedlinePlus: Cardiac Rehabilitation（Health Topic）","url":"https://medlineplus.gov/cardiacrehabilitation.html","license":"パブリックドメイン","note":"心臓リハビリの目的と構成の説明を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"disuse_syndrome","group":"活動・休息","problem":"安静・臥床に伴う廃用症候群（筋力低下・関節拘縮・起立性低血圧・便秘・無気肺など）を起こすリスクがある","problem_plain":"ベッドで寝ている時間が長いと，数日のうちに筋肉がやせて関節が硬くなり，立つと血圧が下がり，肺の奥がつぶれて痰が出しにくくなり，便秘や血栓もできやすくなる．病気そのものより『動かなかったこと』で退院後の生活が難しくなるのを防ぐため，安静度の範囲でできる運動と体位の工夫を毎日行う．","applies_when":["ベッド上安静の指示がある（心不全急性期，大動脈解離の保存的治療，大腿穿刺後，補助循環中，人工呼吸中）","安静度は緩んでいるが自分からほとんど動かない（高齢，痛み，不安，倦怠感，抑うつ）","高齢・フレイル・サルコペニア・低栄養があり，短期間の臥床でも機能が落ちやすい","麻痺・意識障害・鎮静で自分で関節を動かせない","手術後・検査後で臥床が予定より長引いている","入院前より歩行・立ち上がり・食事などの動作が落ちてきている"],"related_factors":["安静の指示：循環器疾患の急性期治療，穿刺部・補助循環の管の保護","身体：筋力低下（臥床では 1 週間に 2 割程度落ちるとの推定），関節の可動域の低下，骨からのカルシウムの流出","循環・呼吸：起立性低血圧，静脈血のうっ滞（血栓），横隔膜の動きの低下による無気肺・痰の貯留","消化・排泄：腸の動きの低下による便秘，臥位での排泄の困難・尿の停滞","心理・認知：意欲の低下，抑うつ，せん妄，『動くと危ない』という思い込み","環境・ケア：ルート類・モニタで動きにくい，離床の援助の人手・時間，痛みの管理不足"],"assessment":{"scales":[{"name":"厚労省 重症度，医療・看護必要度 B 項目（寝返り，移乗，口腔清潔，食事摂取，衣服の着脱，指示が通じる，危険行動）と日常生活自立度","license":"厚労省サイト（PDL1.0）","note":"入院時の機能の記録と経過の比較に使う．廃用専用の尺度ではない"},{"name":"徒手による筋力の確認（主要な関節を重力に逆らって動かせるか・抵抗に耐えられるか）と関節可動域の確認（自動・他動），立ち上がり・歩行の観察","license":"一般的手技（事実）","note":"段階の記載法は施設・リハビリの様式に合わせる．詳しい評価はリハビリ担当が行う"},{"name":"起立性低血圧の確認（臥位で 5 分安静後 → 立位 1 分・3 分の血圧・脈拍・症状）","license":"一般的手技（事実）","note":"転倒転落計画・血圧管理計画と同じ手順．安全に立てない患者は座位で代用し記録に明記"},{"name":"ADL の総合評価尺度（Barthel Index・FIM など）","license":"権利者の条件あり（Barthel Index は原著者・学会の許諾条件，FIM は有償ライセンス）．施設で使用中なら参照のみ","note":"アプリには項目文言を載せない．病棟内の経過観察は看護必要度 B 項目と具体的な動作の記録で行う（B 項目は構成も目的も違うため BI・FIM の代わりにはならない）．BI・FIM が必要な場面（リハビリ評価・診療報酬上の評価）はリハビリ部門等の実施結果と評価日を参照する"}],"assessment_points":["入院時に『入院前にできていたこと』（歩行距離・階段・入浴・排泄・家事）を本人・家族から聞き，現在との差を記録する（回復の目標になる）","安静度の指示を具体的に確認する：『ベッド上安静』でも足首の運動・体位変換・端座位・排泄方法のどこまで許可されているか医師に確認し，ベッドサイドに表示する","臥床が 3 日程度を超えると関節の変化が始まるとされる（Open RN）．安静開始日を記録し，日数が長引くほど評価を増やす","廃用の各側面を分けて見る：筋力（立ち上がり・握力），関節（足首・膝・肩の可動域），循環（起立時の血圧），呼吸（無気肺・痰），排泄（便秘・尿），皮膚（褥瘡），心理（意欲）","DVT・褥瘡・誤嚥のリスク評価は各計画（vte_risk，pressure_injury，aspiration_risk）で行い，本計画は『動く機会を作る』ことに集中する"]},"goals":{"long_term":"退院時に，入院前の生活動作（歩行・排泄・食事・更衣）の水準を保つ，または回復の見通しをもって退院後のリハビリにつながっている","short_term":["安静指示の当日から：安静度内でできる運動（足首の運動・下肢の等尺運動・上肢の運動・深呼吸）が 1 日数回行われ記録されている（回数は施設・リハビリの指示）","1 週間以内：主要な関節（足首・膝・股・肩・肘）の可動域が入院時から狭くなっていない","安静解除の初回離床：起立性低血圧の確認と段階的な起き上がりで，失神・転倒なく端座位・立位ができている","1 週間以内：排便が本人の普段の間隔で保たれ，無気肺・痰の貯留による発熱や SpO2 低下が起きていない","退院までに：自宅で続ける運動と，動く機会を増やす生活の工夫を本人・家族が言える"]},"OP":["安静度の指示内容と実際の 1 日の活動量（ベッドから離れた回数・時間，歩行距離），自分から動く様子","筋力：立ち上がりに要する時間・つかまりの有無，握力の左右差，足首を上下に動かす力","関節：足首（尖足になっていないか），膝・股関節・肩の可動域，痛みを伴う硬さ","起立時の血圧・脈拍の変化とめまい・目の前が暗くなる訴え","呼吸：呼吸音の左右差・下葉の減弱，痰の量と出しやすさ，SpO2，発熱，深呼吸ができるか","排泄：最終排便日・便の硬さ・いきみの有無，尿量・排尿の間隔・残尿感，臥位での排泄の困難","皮膚：好発部位（仙骨部・かかと）の赤み（褥瘡計画と共有）","下肢：片側の腫れ・痛み・熱感（DVT のサイン．発見時に速やかに報告）","栄養：食事摂取量，たんぱく質の摂取，体重・筋肉量の減少（浮腫と区別）","心理・認知：意欲，抑うつ的な言動，せん妄，『動くのが怖い』という訴え","ルート類・モニタ・酸素チューブが動きを妨げていないか，離床の援助の体制"],"TP":["安静度内の運動を毎日組み込む：足首の上下運動，膝を伸ばして太ももに力を入れる等尺運動，上肢の挙上（術後や上肢制限のある患者は指示を確認），深呼吸．回数と時間帯を決めて記録する","他動運動：自分で動かせない関節（麻痺・鎮静・意識障害）は看護師・リハビリが 1 日数回ゆっくり動かす．痛みや抵抗があるところで無理に伸ばさない","体位の工夫：足首が下がったままにならないよう足底を支える（クッション・足底板），かかとは浮かせる，ベッド上でも数時間ごとに体の向きを変える（褥瘡計画と共有）","呼吸の廃用予防：深呼吸と咳の練習（開心術後は胸を抱えて創を守る），可能なら頭側挙上・座位の時間を作る（呼吸・循環の指示を優先），水分は心不全の制限内で確保する","安静解除後は段階的に離床する：端座位 → 足を下ろす → 立位 → 歩行，各段階で症状と血圧を確認し，初回は見守り（転倒転落計画・活動耐性計画と同じ）","動く機会を生活に組み込む：食事は座位で，洗面は洗面台で，排泄はできる範囲でポータブルトイレやトイレへ（安静度と穿刺部の指示を守る）","便秘対策：水分（制限内）・食物繊維・腹部マッサージ・排便姿勢の工夫，緩下薬は医師と相談し，いきみを避ける（便秘計画と共有）","痛みがあるときは離床・運動の前に鎮痛を先回りし，運動を痛みで中断させない（疼痛計画と共有）","ルート類を整理し，離床時に外せるものは医師と相談する．酸素チューブは歩行に必要な長さを確保する","リハビリ担当と目標・段階・自主練習のメニューを共有し，ベッドサイドに表示する．家族にも見せて協力を得る","意欲の低下・せん妄があるときは，短時間でも日中に座位・会話・日光の時間を作り，昼夜のリズムを整える（せん妄計画と共有）"],"EP":["患者へ：寝ている時間が長いと数日で筋力が落ち，退院後の生活に響くこと．安静の指示の範囲でも足首や太ももの運動はできること","患者へ：決められた運動を 1 日数回，食事や検温などのタイミングに合わせて行うと続けやすいこと","患者へ：起き上がるときはゆっくり，座ってから立つ．めまいがしたら座って待つ","患者へ：深呼吸と痰を出す練習の意味（肺の奥がつぶれるのを防ぐ）と，術後は創を守る方法","患者・家族へ：食事，特にたんぱく質をしっかり取ることが筋肉を守ること．食べにくいときは栄養士に相談できること","家族へ：面会時に一緒に足首の運動をする，日中は起きて過ごせるよう声をかける，本人ができることは手を出しすぎないこと","患者・家族へ：退院後も続ける運動と，通所・訪問リハビリなどの利用について退院支援に相談できること"],"evaluation":{"timing":"毎日（運動の実施と活動量の記録），1 週間ごと，安静度の変更時，安静解除の初回離床時","indicators":["安静度内の運動が計画どおり実施され記録されている","関節可動域・筋力（立ち上がり・歩行）が入院時から低下していない，または回復している","起立性低血圧による失神・転倒がなく，離床が段階どおり進んでいる","無気肺・肺炎・便秘・DVT・褥瘡が起きていない（各計画の評価と共有）","本人が運動の意味と方法を説明でき，自分から動く場面が増えている"],"revise_if":"安静度が変わった／臥床が長引いている／筋力・可動域の低下が見られた／起立性低血圧・DVT・無気肺・便秘が出た／意欲の低下やせん妄が出た"},"cardio_ward_notes":["心不全急性期・大動脈解離の保存的治療・補助循環中は安静が治療そのものである．安静度内で許可される運動（足首の運動・等尺運動）を医師に確認し，『安静＝何もしない』にしない","大腿穿刺後の安静は穿刺側の下肢を曲げない指示が中心で，反対側の下肢や上肢の運動は通常可能．指示の範囲を具体的に確認する","抗凝固薬・抗血小板薬を使う患者は，離床開始時の転倒による出血のリスクが高い．段階的な離床と見守りを徹底する","利尿薬・降圧薬・β遮断薬の使用中は起立性低血圧が出やすく，長期臥床でさらに強くなる．初回離床は必ず血圧と症状を確認する","開心術後の上肢の運動は胸骨を守る制限（腕で押し上げない・重い物を持たない）の範囲で行い，ペースメーカ・ICD 植込み後は術側上肢の制限を確認する","高齢の心疾患患者ではフレイル・サルコペニアが重なり，短期間の臥床でも歩行不能になりうる．入院前の機能と栄養（たんぱく質）の確保を早期から行う（疾患別リスト フレイル・サルコペニアと同じ）"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.13 Mobility（13.2 Basic Concepts：不動が各臓器に与える影響〔起立性低血圧・無気肺・筋萎縮・関節拘縮・便秘〕，関節可動域運動，体位と拘縮予防）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-2-basic-concepts/","license":"CC BY 4.0（NANDA-I の表は対象外）","note":"筋力低下の推定（1 週間に約 2 割）と『3 日で関節の変化』の記述はこの章に基づく目安"},{"name":"Open RN Nursing Fundamentals 2e, Ch.13 Mobility（13.3 Applying the Nursing Process：不動患者の全身アセスメント，早期離床，深呼吸・咳，起立性低血圧の監視）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/13-3-applying-the-nursing-process/","license":"CC BY 4.0","note":""},{"name":"Open RN Nursing Skills 2e, Ch.13 Musculoskeletal Assessment（13.4 Musculoskeletal Assessment：筋力・可動域の確認）","url":"https://wtcs.pressbooks.pub/nursingskills/chapter/13-4-musculoskeletal-assessment/","license":"CC BY 4.0","note":""},{"name":"厚生労働省 重症度，医療・看護必要度 評価票（令和 8 年度 通知 別紙 7）","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0","note":"B 項目を機能の記録に利用（転倒転落計画と同じ資料）"},{"name":"MedlinePlus: After Surgery（Health Topic）","url":"https://medlineplus.gov/aftersurgery.html","license":"パブリックドメイン","note":"術後の早期離床・深呼吸の患者向け説明を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"sleep_disturbance","group":"活動・休息","problem":"睡眠が妨げられている（入院環境・夜間の呼吸困難・頻尿・痛み・不安などで眠れず，回復とせん妄予防に影響している）","problem_plain":"病院では音・光・処置・慣れないベッドで眠りが浅くなりやすく，心臓の病気では夜の息苦しさや利尿薬によるトイレの回数も加わる．眠れないと血圧が上がり，せん妄や転倒が増え，回復が遅れる．睡眠薬に頼る前に，原因を探して環境と生活リズムを整える．","applies_when":["入院後に『眠れない』『何度も目が覚める』『日中眠い』の訴えがある，または夜勤帯の記録で睡眠が細切れになっている","夜間の呼吸困難・起坐呼吸・咳で目が覚める（心不全の症状）","夜間のトイレの回数が多い（利尿薬の投与時刻，前立腺肥大，心不全の夜間多尿）","痛み（創部・胸骨・穿刺部・安静による腰痛）や不安・抑うつで眠れない","CCU・ICU など音と光の多い環境にいる，モニタ・点滴・酸素で体動が制限されている","睡眠時無呼吸症候群がある，または大きないびき・呼吸停止を家族が見ている","睡眠薬・抗不安薬を常用している，または入院を機に新たに希望している","せん妄のリスクが高い（高齢・認知症・術後・ICU 入室）"],"related_factors":["環境：音（モニタ警報・話し声・他患者），光，室温，慣れないベッド・枕，夜間の処置・検温・採血","身体症状：夜間の呼吸困難・咳，痛み，かゆみ，頻尿，便秘，しびれ・こむら返り，発熱","薬剤：利尿薬の投与時刻，β遮断薬（悪夢・不眠の報告），ステロイド，気管支拡張薬，カフェイン，睡眠薬・抗不安薬の離脱や持ち越し","生活リズム：日中の臥床・昼寝，日光を浴びない，活動不足，夕方以降のカフェインや喫煙","心理：不安（病状・手術・ICD の作動），抑うつ，家族と離れる寂しさ，心配ごと","睡眠障害：睡眠時無呼吸症候群，むずむず脚，もともとの不眠症"],"assessment":{"scales":[{"name":"睡眠の聞き取り 5 項目（何時間眠れたか，眠りの質，寝つき・起床の時刻，日中の眠気，いびき・呼吸停止・脚の不快感などの睡眠障害のサイン）と睡眠日誌","license":"一般的な問診項目（Open RN 12.3 の枠組みを参考に自前実装可）","note":"入院時に『普段の就寝・起床時刻と寝る前の習慣』を聞き，入院中もできるだけ再現する"},{"name":"夜勤帯の客観的な観察記録（入眠・覚醒の時刻，覚醒の理由〔処置・トイレ・呼吸困難・痛み〕，いびき・無呼吸，昼寝の時間）","license":"自前実装可（施設の看護記録様式）","note":"訴えと観察を突き合わせる．『静かにしていた』と『眠っていた』を区別する"},{"name":"Epworth 眠気尺度・PSQI（ピッツバーグ睡眠質問票）・アテネ不眠尺度などの質問票","license":"権利者の条件あり（Epworth は権利者のライセンス管理，PSQI は Pittsburgh 大学の著作権で商用は要許諾）．施設で使用中なら参照のみ","note":"アプリには質問文を載せない"},{"name":"せん妄のスクリーニング（4AT：CC BY 4.0，CAM-ICU：著作権表示つきで臨床使用可）","license":"せん妄計画と同じ","note":"夜間の不眠と興奮が続くときはせん妄を疑い，せん妄計画に沿って評価する"}],"assessment_points":["入院時に普段の睡眠（就寝・起床時刻，寝る前の習慣，睡眠薬の常用，いびき・無呼吸，CPAP の使用）を聞き，家族からも情報を得る","『眠れない原因』を身体・環境・薬・心理に分けて探す．特に心不全患者の夜間の覚醒は『呼吸困難で目が覚める』ことが多く，不眠ではなく心不全の増悪のサインとして扱う","夜間のトイレの回数と時刻を記録し，利尿薬の投与時刻・夕方以降の水分摂取と照らし合わせる","日中の様子（臥床時間・昼寝・活動・日光）を見る．昼夜逆転はせん妄の前ぶれにもなる","睡眠薬・抗不安薬の常用があれば種類・量・期間を確認し，急な中止による離脱を避けるため医師・薬剤師と方針を決める"]},"goals":{"long_term":"入院中，本人が『眠れた』と感じられる夜が増え，睡眠不足によるせん妄・転倒・血圧上昇を起こさず，退院後の睡眠の整え方を本人が言える","short_term":["入院当日から：普段の睡眠習慣と睡眠を妨げる要因が把握され，環境調整（音・光・室温・処置の時刻）が始まっている","3 日以内：夜間の覚醒の原因（呼吸困難・頻尿・痛み・不安）が特定され，それぞれの対応（医師への報告・投与時刻の調整・鎮痛・傾聴）が行われている","3 日以内：昼は起きて夜は眠るリズムがつくれている（夜間睡眠の時間は個人差があるため，本人の普段と比べて評価する）","毎勤務：睡眠薬を新たに使う・増やす場合は医師と相談し，転倒・呼吸抑制・持ち越しの観察が計画されている"]},"OP":["夜間の睡眠：入眠時刻，覚醒の回数と理由，合計の睡眠時間（本人の訴えと夜勤の観察の両方）","覚醒の原因：呼吸困難・起坐呼吸・咳（心不全），尿意・トイレの回数，痛み，かゆみ，こむら返り，不安・心配ごと，環境の音・光","夜間の呼吸：SpO2 の低下，いびき・無呼吸，呼吸数，CPAP を使用中は装着の状況","日中の様子：眠気・昼寝の時間，活動量・離床，日光を浴びる時間，食事の時間","薬：利尿薬の投与時刻，睡眠薬・抗不安薬の使用と翌朝のふらつき・眠気，ステロイド・β遮断薬など睡眠に影響する薬の開始","カフェイン（コーヒー・お茶・エナジードリンク）・喫煙・アルコールの習慣と入院中の状況","見当識・注意力の変化，夜間の落ち着きのなさ（せん妄の兆し）","血圧・脈拍（睡眠不足で上がる），体重・浮腫（夜間多尿・呼吸困難の背景に心不全）","環境：夜間の警報・話し声・照明，室温，ベッド・枕，同室者の状況，夜間の処置と検温の時刻","本人の気持ち：病状・手術・退院後の不安，眠れないことへの焦り"],"TP":["環境を整える：夜間は照明を落とし，会話と足音を小さくし，ナースステーションの音を減らす．室温・掛け物・枕を本人に合わせる．生命監視モニタの警報音は院内基準どおり確保し，消音・減音を睡眠対策にしない（電極の貼り替えなどで不要な警報を減らす）","夜間の処置・検温・採血は医師と相談してまとめ，睡眠を分断しない．必要な観察（術後・静注薬中）は指示の間隔を守る","昼夜のリズム：朝はカーテンを開けて日光を入れ，日中は離床・会話・リハビリで覚醒を促す．昼寝は短く午後遅くを避ける（時間の目安は本人の普段の習慣と施設の方針に合わせる）","夜間の呼吸困難で覚醒する患者：起坐位・頭側挙上で楽な姿勢を作り，SpO2・呼吸音・体重の推移とともに医師へ報告する（心不全の増悪として扱う）","頻尿への対応：利尿薬は可能なら午前中に投与し（医師と相談），夕方以降の水分は制限の範囲で調整する．就寝前の排尿，夜間のトイレ動線の安全（足元灯・ポータブルトイレの検討）","痛み・かゆみ・こむら返りは就寝前に先回りで対応する（鎮痛・保湿・体位の工夫．薬の追加は医師に相談）","寝る前の習慣を再現する：普段の就寝時刻，温かい飲み物（制限内），読書・音楽，足浴・手浴，リラックスの呼吸法．夕方以降のカフェインを避ける","不安が強いときは就寝前に短時間でも話を聞き，翌日の予定や治療の見通しを伝える．必要に応じて心理的支援・医師への相談","睡眠薬の使用は医師・薬剤師と相談し，種類（ベンゾジアゼピン系は転倒・せん妄・無呼吸の悪化に注意）と時刻を確認する．投与後は夜間のトイレ歩行の見守りと翌朝の持ち越しを観察する．常用薬の急な中止はしない","睡眠時無呼吸症候群の患者：自宅の CPAP を持参して入院中も使う．鎮静薬・オピオイド使用後は SpO2 と呼吸数を確認し，側臥位・頭側挙上を勧める","同室者との調整（いびき・夜間の処置が多い患者の配置）を病棟で検討する"],"EP":["患者へ：入院中は環境の変化で眠れないことが多く，眠れない日が続くときは原因を一緒に探すこと．眠れない・息苦しい・トイレが近いことは遠慮なく伝えてほしい","患者へ：夜に息苦しくて目が覚めるのは心臓の負担のサインのことがあるので，我慢せずすぐ呼ぶこと","患者へ：日中はできるだけ起きて過ごし，昼寝は短く，夕方以降のコーヒー・お茶・喫煙を控えると夜の眠りが深くなること","患者へ：睡眠薬を飲んだ後はふらつきやすいので，夜のトイレは必ずナースコールを押すこと（転倒転落計画と同じ）","患者・家族へ：眠りの記録（睡眠日誌）をつけると原因が見えやすいこと．退院後も就寝・起床の時刻をそろえ，朝の光と日中の活動を習慣にすること","患者・家族へ：いびきや呼吸の停止を家族が見ている場合は睡眠時無呼吸の検査を主治医に相談できること，CPAP は入院・手術のときも持参すること","家族へ：面会は日中に，本人が安心できる物（枕・時計・写真）の持ち込みを相談できること"],"evaluation":{"timing":"毎勤務（夜勤の記録と翌朝の本人の訴え），3 日ごと，睡眠薬の開始・変更時，心不全の増悪や手術後","indicators":["本人が『眠れた』と感じる夜が増え，夜間の覚醒回数が減っている（本人の普段と比べる）","夜間覚醒の原因（呼吸困難・頻尿・痛み・不安・環境）への対応が行われ，原因そのものが減っている","日中の覚醒と活動が保たれ，昼夜逆転・せん妄が起きていない","睡眠薬の新規使用・増量がなく，使った場合も転倒・持ち越し・呼吸抑制が起きていない","本人が退院後の睡眠の整え方を説明できる"],"revise_if":"夜間の呼吸困難が出た／せん妄の兆しがある／睡眠薬を開始・変更した／術後・ICU 退室後／頻尿や痛みが増えた／転室した"},"cardio_ward_notes":["『眠れない』の背景に心不全の夜間呼吸困難（横になると息苦しく，起きると楽）があることが多い．不眠として睡眠薬を求める前に，体重・浮腫・SpO2・呼吸音を確認して報告する","利尿薬の静注後は数時間トイレが増える．投与時刻を午前中に寄せる工夫（医師と相談）は睡眠と転倒予防の両方に効く（転倒転落計画と同じ）","睡眠時無呼吸症候群は心房細動・高血圧・心不全と関係が深い．夜間の SpO2 低下や徐脈・ポーズがモニタで見えたら無呼吸の可能性を報告し，CPAP の持参・装着を援助する（疾患別リスト 睡眠時無呼吸症候群と同じ）","ベンゾジアゼピン系の睡眠薬・抗不安薬は高齢の心疾患患者でせん妄・転倒・無呼吸の悪化を招きやすい．使用は医師・薬剤師と相談し，術後・鎮静後の呼吸抑制に注意する","CCU・ICU では警報音と処置が睡眠を分断する．警報は消音せず，電極管理・処置の集約・照明の調整で対応し，昼夜のリズムづくりをせん妄予防と一体で行う（せん妄計画と同じ）","ICD 植込み後や心臓手術後は『寝ている間に作動したら』『心臓が止まったら』という不安で眠れない患者がいる．不安を聞き，必要なら医師・心理職につなぐ"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.12 Sleep & Rest（12.2 Basic Concepts：睡眠の仕組み，不眠・睡眠時無呼吸，睡眠衛生，睡眠薬の注意）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/12-2-basic-concepts/","license":"CC BY 4.0","note":""},{"name":"Open RN Nursing Fundamentals 2e, Ch.12 Sleep & Rest（12.3 Applying the Nursing Process：入院患者の睡眠の聞き取り 5 項目，睡眠日誌，客観的観察，睡眠を促す介入）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/12-3-applying-the-nursing-process/","license":"CC BY 4.0（NANDA-I の表は対象外）","note":"アセスメント項目と介入の体系を参考"},{"name":"厚生労働省 健康づくりのための睡眠ガイド 2023（令和 6 年 2 月）","url":"https://www.mhlw.go.jp/content/001305530.pdf","license":"PDL1.0","note":"成人・高齢者の睡眠の推奨事項（日中の活動・光・カフェイン・昼寝）を退院指導の参考に"},{"name":"厚生労働省 Good Sleep ガイド（ぐっすりガイド）高齢者版","url":"https://www.mhlw.go.jp/content/001288007.pdf","license":"PDL1.0","note":"患者向けリーフレット"},{"name":"NHLBI: Sleep Deprivation and Deficiency","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation","license":"パブリックドメイン","note":"睡眠不足と心血管への影響の説明を参考"},{"name":"NHLBI: Sleep Apnea","url":"https://www.nhlbi.nih.gov/health/sleep-apnea","license":"パブリックドメイン","note":""},{"name":"MedlinePlus: Insomnia／Healthy Sleep（Health Topic）","url":"https://medlineplus.gov/insomnia.html","license":"パブリックドメイン","note":"患者向け説明の言い回しを参考（Healthy Sleep: https://medlineplus.gov/healthysleep.html）"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"pain_management","group":"活動・休息","problem":"疼痛がある（手術の創部・胸骨・カテーテル穿刺部などの痛みで，呼吸・離床・睡眠が妨げられ，血圧や脈にも影響している）","problem_plain":"開心術後の胸の傷や胸骨の痛み，カテーテルの穿刺部の痛み，安静による腰痛などは，我慢すると深呼吸や歩行ができず回復が遅れ，血圧や脈も上がる．一方で循環器病棟では『心臓の痛み（狭心症・心筋梗塞・大動脈解離）』と区別することが最も大切で，痛みの性質を必ず確かめてから対応する．","applies_when":["心臓手術（胸骨正中切開・側開胸），ペースメーカ・ICD 植込み，血管手術の術後","カテーテル検査・治療・アブレーション後の穿刺部（橈骨・大腿）の痛みや圧迫止血中の痛み","安静・臥床による腰痛・肩こり，体位の制限による痛み","胸痛の訴えがあり，心臓由来か（狭心症・心筋梗塞・心膜炎・大動脈解離），創部・筋骨格・消化器由来かの判断が必要","閉塞性動脈硬化症の足の痛み（歩行時・安静時），静脈血栓の痛み","鎮痛薬（オピオイド・NSAIDs・アセトアミノフェン）を使っており，副作用（眠気・呼吸抑制・便秘・腎機能・出血）の観察が必要","痛みを言葉で伝えにくい（認知症・鎮静中・人工呼吸中・言語障害）"],"related_factors":["組織の損傷：手術創・胸骨の切開・ドレーン・グラフト採取部（下肢），穿刺部の血腫・圧迫","虚血：狭心症・心筋梗塞（絞めつけ・圧迫感，冷汗・放散痛を伴う），下肢の動脈閉塞","炎症：心膜炎（吸気・臥位で増強），創感染，胸膜炎","血管：大動脈解離（突然の引き裂かれる胸背部痛），血腫による圧迫","筋骨格：長い臥床・同一体位，咳による胸壁の痛み，肋間神経痛","心理：不安・恐怖・睡眠不足で痛みを強く感じる，『痛み止めは体に悪い』という思い込み","薬剤：鎮痛薬の不足・時間切れ，動作前の鎮痛がない，副作用を恐れて使わない"],"assessment":{"scales":[{"name":"NRS（0〜10 の数字で痛みの強さを答えてもらう），VRS（『なし・軽い・中等度・強い』の言葉），VAS（線上に印をつける）","license":"一般的な方法（自前実装可）","note":"本人が『これなら深呼吸・歩行ができる』と言える強さ（快適に動ける目標）を一緒に決め，その目標を評価の基準にする"},{"name":"痛みの問診の枠組み（きっかけと和らぐこと，性質，部位と放散，強さ，時間経過と治療，本人の受け止め：いわゆる PQRST/OLDCARTS）","license":"一般的な方法（自前実装可）","note":"循環器病棟では『性質』（絞めつけ・圧迫・引き裂かれる・鋭い・体動で変わる）と『随伴症状』（冷汗・吐き気・呼吸困難）を必ず聞く"},{"name":"言葉で伝えられない患者の行動観察（表情・うめき・体の緊張・落ち着きのなさ・処置への反応・バイタルの変化）","license":"観察項目は自前実装可．行動評価尺度（FLACC・PAINAD・CPOT・BPS など）は権利者の条件が未確認のため，施設で使用中なら参照のみ","note":"アプリには尺度の表を載せず，観察項目として記録する"},{"name":"Wong-Baker FACES（顔の絵の尺度）","license":"Wong-Baker FACES Foundation がライセンス区分（医療機関・商用など）を設けている（wongbakerfaces.org）．アプリへの搭載は許諾を確認．施設で使用中なら参照のみ","note":"言葉や数字での評価が難しい患者向け"}],"assessment_points":["痛みの訴えがあったら，まず『心臓の痛みか』を確かめる：絞めつけ・圧迫感，肩・腕・あご・背中への放散，冷汗・吐き気・呼吸困難を伴う，体動や呼吸で変わらない → 12 誘導心電図とバイタルを取り速やかに医師へ報告（疾患別リスト 急性心筋梗塞・胸痛と同じ）．突然の引き裂かれる胸背部痛や痛みの移動は大動脈解離として院内の緊急対応へ","創部・筋骨格の痛みの特徴：体動・咳・深呼吸・押すことで強くなり，安静や体位で和らぐ．心膜炎は吸気と臥位で増し前かがみで楽になる．消化器の痛みは食事・胸やけと関係する．これらでも『いつもと違う』『強い』は報告する","強さは NRS などで安静時と動作時（深呼吸・咳・歩行）の両方を記録し，本人の『快適に動ける目標』と比べる","穿刺部の痛みは腫れ・拍動性の腫瘤・出血・末梢の冷感と一緒に見る（血腫・仮性動脈瘤・動脈閉塞のサイン）","鎮痛薬の効き方（投与時刻・効果が出るまで・持続時間）と副作用（眠気・呼吸数・便秘・吐き気・かゆみ・尿閉・腎機能・出血）を毎回セットで記録する"]},"goals":{"long_term":"入院中，痛みが本人の『快適に動ける目標』の範囲に保たれ，深呼吸・咳・離床・睡眠が妨げられず，鎮痛薬の重い副作用を起こさずに退院できる","short_term":["訴えのあった時点から：痛みの性質と随伴症状が評価され，心臓由来を疑う痛みは発見時に心電図・バイタルとともに医師へ報告されている","24 時間以内：本人の『快適に動ける目標』が決まり，安静時・動作時の NRS が毎勤務記録されている","3 日以内（術後はプロトコルの期間）：深呼吸・咳・離床の前に先回りで鎮痛が行われ，痛みで呼吸練習や歩行が中断していない","毎勤務：鎮痛薬の副作用（眠気・呼吸数・便秘・吐き気・腎機能・出血）が観察され，異常は報告されている","退院までに：本人が痛み止めの使い方（時間・量・避けるべき市販薬）と受診の目安を言える"]},"OP":["痛みの部位・性質・強さ（NRS 安静時／動作時）・持続・きっかけ・和らぐこと，本人の目標との差","心臓由来を疑うサイン：絞めつけ・圧迫感，放散痛，冷汗・吐き気・呼吸困難，体動で変わらない痛み，硝酸薬への反応（使用は指示に基づく），心電図モニタの ST 変化・不整脈","大動脈解離を疑うサイン：突然の引き裂かれる痛み，痛みの移動，血圧の左右差，四肢の脈の左右差","創部：発赤・腫れ・浸出液・離開，胸骨の動揺（カクッとした動き）・音，下肢のグラフト採取部の腫れ","穿刺部：腫れ・拍動性の腫瘤・出血・圧迫デバイスの圧と時間，末梢の色・温度・脈","痛みが日常動作に与える影響：深呼吸・咳ができるか，離床・歩行の距離，睡眠，食事","鎮痛薬：投与時刻・量・効果が出るまで・持続時間，定時と頓用の使い方，PCA の設定と使用回数（施設の手順で確認）","オピオイドの副作用：眠気（鎮静が呼吸抑制に先行する），呼吸数・SpO2，便秘（最終排便日），吐き気，かゆみ，尿閉","NSAIDs・アセトアミノフェンの副作用：腎機能（Cr・尿量），消化器症状・出血（抗凝固薬・抗血小板薬併用），肝機能，1 日の総量","言葉で伝えられない患者：表情・うめき・体の緊張・落ち着きのなさ・処置への反応・バイタルの変化","バイタル：痛みによる血圧上昇・頻脈，鎮痛後の低下","本人の受け止め：痛み止めへの不安・我慢する傾向，過去の痛みの経験，眠れているか"],"TP":["心臓由来を疑う痛み・突然の強い痛みは，安静にして 12 誘導心電図・バイタル・SpO2 を取り，速やかに医師へ報告する（呼吸・循環の異常は院内の緊急対応へ）．硝酸薬・鎮痛薬の使用は指示に基づく","痛みは我慢させない：本人の『快適に動ける目標』を超えたら報告し，指示の鎮痛薬を時間どおりに使う．術後早期は施設プロトコルに沿って定時投与と頓用を組み合わせる（鎮静・呼吸状態が悪ければ投与前に報告）","先回りの鎮痛：深呼吸・咳・体位変換・離床・処置・ドレーン抜去の前に，効果が出る時間を見込んで鎮痛薬を使う（時間は薬剤と投与経路で異なるため薬剤師・医師と確認）","開心術後：咳やくしゃみのときに枕・タオルで胸を抱えて創を守る，腕で体を押し上げない，起き上がりは横向きから．胸骨の動揺があれば報告","穿刺部の痛み：腫れ・出血と末梢循環を分けて確認する．活動性出血なら用手圧迫して報告（血腫・仮性動脈瘤は医師の評価）．冷感・蒼白・しびれ・運動障害・増悪する痛みは圧迫を追加せず，末梢血流を再評価し，施設手順で圧迫デバイスを調整して直ちに医師へ連絡（bleeding_risk と同じ手順）","非薬物の方法を組み合わせる：体位の工夫（枕で支える），冷罨法・温罨法（医師の指示・皮膚と循環の状態を確認），リラックスの呼吸法，音楽・会話による気分転換，マッサージ（創部・血栓の部位は避ける）","安静による腰痛：許可された範囲での小さな体位のずらし，膝下の枕，マットレスの調整（褥瘡計画と共有）","オピオイド使用中：鎮静の程度と呼吸数を投与前後に確認し，眠気が強い・呼吸数が少ないときは投与を保留して報告する．呼吸抑制が重い（呼び掛けに反応しない・呼吸が浅く遅い・SpO2 低下）ときは応援を呼び，投与を止め，気道確保と換気を支え，拮抗薬の指示を確認して院内の緊急対応へ．便秘対策を初回から始める（緩下薬は医師と相談）．PCA は施設の手順でポンプ設定と使用回数を勤務交代ごとに確認し，ボタンは本人だけが押す（家族や看護師が代わりに押さない）ことを本人・家族に説明して，本人が操作できるかを確認する","NSAIDs・アセトアミノフェン：腎機能・心不全・抗凝固薬の併用を確認し，配合薬を含めた 1 日の総量を把握する（心不全・腎機能低下では NSAIDs を避けることが多いため，選択は医師・薬剤師に確認）","鎮痛薬の変更・追加・中止は看護師が独断で行わず，効き方と副作用を報告して指示に基づいて対応する","言葉で伝えられない患者は行動観察とバイタルから痛みを推定し，試みに鎮痛して反応を見る（医師と相談），家族に普段の痛みの表し方を聞く","睡眠・不安への対応を並行する（睡眠計画・不安計画と共有）．痛みと不安は互いを強める"],"EP":["患者へ：痛みは我慢しないほうが回復が早いこと，深呼吸・咳・歩行のためにも痛み止めを使ってよいこと，『動ける程度の痛み』を一緒に目標にすること","患者へ：胸が絞めつけられる・押される痛み，冷汗・吐き気・息苦しさを伴う痛み，突然の引き裂かれるような痛みは，創の痛みとは別で，すぐナースコールを押すこと","患者へ：痛み止めは動く前・寝る前に先回りで使うと効きやすいこと，効かないときは我慢せず知らせること","患者へ：痛み止めの副作用（眠気・便秘・吐き気）と，眠気が強い・息が浅いと感じたら知らせること．オピオイドを使う間はトイレ歩行時にナースコールを押すこと．PCA のボタンは本人だけが押し，家族は代わりに押さないこと","患者へ（開心術後）：咳のときは胸を抱える，腕で体を押し上げない，重い物は医師の許可まで持たない","患者へ（退院時）：処方された痛み止めの飲み方，市販の痛み止め（NSAIDs）は腎臓や出血・心不全に影響することがあるので薬剤師・医師に相談してから使うこと，創の赤み・腫れ・浸出液・発熱は受診すること","家族へ：本人が痛みを我慢しているサイン（表情・動かない・眠れない）に気づいたら看護師に伝えてほしい"],"evaluation":{"timing":"毎勤務（安静時・動作時の NRS と副作用），鎮痛薬の投与ごとの効果判定（効果が出る時間に合わせて），術後はプロトコルの期間ごと，痛みの性質が変わったとき","indicators":["安静時・動作時の痛みが本人の『快適に動ける目標』の範囲にある時間が増えている","深呼吸・咳・離床・睡眠が痛みで妨げられていない","心臓由来を疑う痛みが出た場合，発見時に心電図・バイタルとともに報告され対応されている","鎮痛薬の重い副作用（呼吸抑制・過鎮静・腎機能悪化・消化管出血）が起きていない，便秘・吐き気は対応されている","本人が痛み止めの使い方と受診の目安を説明できる"],"revise_if":"痛みの性質・部位が変わった／心臓由来を疑う痛みが出た／鎮痛薬を変更した／副作用が出た／創部・穿刺部に異常が出た／痛みで離床や呼吸練習が進まない"},"cardio_ward_notes":["循環器病棟の痛みの評価は『心臓の痛みとの区別』が最優先．創部痛や筋骨格痛と決めつけず，性質・随伴症状・心電図で確認し，迷えば報告する（疾患別リスト 急性心筋梗塞・不安定狭心症・大動脈解離・肋間神経痛と整合）","急性大動脈解離では痛みが血圧を上げ，痛みの再燃は解離の進行のサイン．鎮痛と血圧管理を一体で行い，再燃は速やかに報告する（血圧管理計画と同じ）","開心術後の胸骨痛は深呼吸・咳・離床を妨げ，無気肺・肺炎・廃用につながる．先回りの鎮痛と胸骨を守る動作をセットにする（疾患別リスト 開心術後の共通管理と同じ）","抗凝固薬・抗血小板薬を使う患者では NSAIDs による出血リスクが上がり，心不全・腎機能低下では NSAIDs で悪化することがある．鎮痛薬の選択は医師・薬剤師に確認する","オピオイドと睡眠時無呼吸症候群・心不全の組み合わせは呼吸抑制のリスクが高い．鎮静の程度・呼吸数・SpO2 を投与前後に確認し，側臥位・頭側挙上を勧める","カテーテル穿刺部の痛みは血腫・仮性動脈瘤・後腹膜出血（大腿穿刺後の腰背部痛＋血圧低下）の最初のサインになりうる．『穿刺部が痛い』は腫れ・出血・末梢循環・血圧と一緒に見る（疾患別リスト PCI 後・カテーテル検査の前後と同じ）"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.11 Comfort（11.3 Pain Assessment Methods：0〜10 の数値評価，快適に動ける目標，PQRSTU／OLDCARTS の問診）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/11-3-pain-assessment-methods/","license":"CC BY 4.0（Wong-Baker FACES の図は『Used with permission』で対象外，FLACC 表も転載しない）","note":"問診の枠組みを参考"},{"name":"Open RN Nursing Fundamentals 2e, Ch.11 Comfort（11.4 Pain Management：アセトアミノフェン・NSAIDs・オピオイドの注意，PCA，オピオイドの副作用〔鎮静が呼吸抑制に先行，便秘対策は初回から〕）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/11-4-pain-management/","license":"CC BY 4.0","note":"薬剤の副作用観察の体系を参考．用量の数値は本計画に転記しない"},{"name":"Open RN Nursing Fundamentals 2e, Ch.11 Comfort（11.5 Applying the Nursing Process：急性痛の管理〔活動前の鎮痛，鎮静と呼吸の監視，非薬物療法との併用〕，胸痛は即時報告）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/11-5-applying-the-nursing-process/","license":"CC BY 4.0（NANDA-I の表は対象外）","note":""},{"name":"NHLBI: Heart Surgery - Recovery","url":"https://www.nhlbi.nih.gov/health/heart-surgery/recovery","license":"パブリックドメイン","note":"術後の痛み・創の観察・活動再開の患者向け説明を参考"},{"name":"MedlinePlus: Pain／Pain Relievers（Health Topic）","url":"https://medlineplus.gov/pain.html","license":"パブリックドメイン","note":"患者向け説明の言い回しを参考（Pain Relievers: https://medlineplus.gov/painrelievers.html）"},{"name":"Wong-Baker FACES Foundation：Scale Access（ライセンス区分の一覧）","url":"https://wongbakerfaces.org/instructions-use/","license":"権利あり（ライセンス区分ごとに条件．本計画では文言・図を使わない）","note":"ライセンス確認の出典としてのみ記載"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"nutrition_deficit","group":"栄養・排泄","problem":"栄養摂取が不足している（食欲低下・減塩食で食べられない・心臓悪液質・嚥下障害）","problem_plain":"体に必要なエネルギーやたんぱく質が食事から取れていない状態．心臓が悪いと息切れ・だるさ・薬・減塩や水分制限の食事で食欲が落ちやすく，長引くと筋肉と体重が減って（心臓悪液質），回復や離床が遅れ，褥瘡や感染も起きやすくなる．","applies_when":["食事摂取量が必要量に届かない日が続いている，または続く見込みがある（絶食・検査・手術を含む）","体重が減り続けている（心不全では利尿による水分の減少と区別して判断）","やせ・筋肉のやせ（腕や太ももの細さ，握力の弱さ），または肥満でも食事の中身が偏っている","減塩食・水分制限・カリウム制限などの制限食で「味がない」「食べられない」と言う","むせる・飲み込みにくい・食事に時間がかかる（脳卒中の合併，高齢，挿管後）","息切れ・だるさ・吐き気（薬の副作用を含む）で食事が進まない","口の中の問題（義歯が合わない，口内炎，乾燥）がある","食事の準備や買い物ができない（独居・介護力不足），経済的な理由で食事が偏る"],"related_factors":["心不全・低心拍出：腸のうっ血や低灌流による食欲低下・早期満腹感・吐き気，慢性炎症によるたんぱく質の分解（心臓悪液質）","呼吸：息切れで食べる余裕がない，酸素マスクや NPPV で食事が中断される","薬：ジゴキシン・一部の抗不整脈薬・利尿薬・鉄剤などによる食欲低下や味覚の変化，多剤併用","制限食：減塩・水分制限・カリウム制限で食事の楽しみが減る","嚥下障害：脳卒中，高齢，長期挿管後，意識レベル低下","活動低下・安静：空腹感が出ない，筋肉が減る","心理・環境：不安・抑うつ・せん妄，病院食への不慣れ，食事姿勢が取れない","検査・手術：絶食の繰り返し，術後の消化管の動きの低下"],"assessment":{"scales":[{"name":"厚労省「褥瘡対策に関する診療計画書」の栄養管理欄（GLIM 基準の考え方：体重減少・低 BMI・筋肉量の減少と，食事摂取量の低下・炎症の組み合わせで低栄養を判断）","license":"厚労省サイト（PDL1.0）．参考様式．GLIM 基準の詳しい判定基準（カットオフ値）は院内の栄養サポートチーム（NST）・管理栄養士の運用に従う","note":"褥瘡の様式だが，低栄養の見方（体重・BMI・筋肉・摂取量・炎症）はそのまま栄養の評価に使える．該当があれば管理栄養士へ"},{"name":"食事摂取量の記録と体重の推移（自前で実装可能）","license":"一般的な看護記録（ライセンス不要）","note":"主食・副菜を分けて何割食べたかを毎食記録し，体重は毎朝同じ条件で測る．心不全では体重の変化＝水分の変化が大きいので，浮腫・うっ血所見・利尿薬の効きと合わせて「体の実質が減っているか」を判断する"},{"name":"嚥下スクリーニング（反復唾液嚥下テスト，改訂水飲みテスト，食事場面の観察など院内で採用している方法）","license":"一般的な手技．実施方法・判定基準は施設の嚥下評価手順に従う","note":"むせ・湿った声・食後の痰・発熱があれば早めに実施し，言語聴覚士（ST）・医師に相談"},{"name":"MNA-SF などの栄養スクリーニング票","license":"各権利者（MNA は Nestlé Nutrition Institute）の管理下．施設で使用中なら参照のみ","note":"点数化された票を使う場合は施設の許諾状況を確認する"}],"assessment_points":["入院時に「普段の食事量・好み・制限食の経験・体重の変化・むせの有無・義歯」を本人と家族から聞き，病院食との差を把握する","食べられない理由を分けて考える：息切れか，吐き気か，味か，口の問題か，飲み込みか，気持ちか，環境（姿勢・時間・器）か．理由によって対応が変わる","「配膳の 7 割食べた」ではなく，必要エネルギー・たんぱく質に対してどれだけ取れているかで見る．必要量は管理栄養士・医師が決める","血液データ（アルブミンなど）は炎症・脱水・うっ血の影響を受けるので単独で判断せず，体重・摂取量・筋肉の見た目と合わせて読む","減塩・水分制限が食欲を落としていないか，本人の言葉で確認する（「味がない」「飲めなくて口が渇く」）"]},"goals":{"long_term":"必要な栄養を食事（必要なら補助食品・経腸栄養）から取れて，体重・筋肉が保たれ，心臓に合った食事を退院後も続けられる","short_term":["入院時から数日以内（施設の基準に従う）：栄養リスクの評価と，必要量の設定を管理栄養士と共有している","1 週間以内：食べられない理由に応じた工夫（形態・味・量・時間・姿勢）が実施され，摂取量が必要量に近づいている","1 週間以内：むせ・誤嚥のサインなく，安全な形態で食事ができている","退院までに：本人・家族が減塩・水分制限と栄養確保を両立する食べ方を説明できる"]},"OP":["毎食の摂取量（主食・副菜・補助食品を分けて），食べるのにかかった時間，残した理由","体重（毎朝同じ条件）．心不全では浮腫・うっ血所見・利尿薬の効きと合わせて「水分の減少か実質の減少か」を見る","食欲・吐き気・早期満腹感・味覚の変化と，その時刻（薬の内服時刻との関係）","息切れ・SpO2・食事中の脈拍の変化（食べる労作で悪化しないか），酸素・NPPV の中断の可否","嚥下：むせ，湿った声，食後の痰の増加，口の中の残留，発熱（誤嚥性肺炎の早期サイン）","口の中：乾燥，口内炎，義歯の適合，舌の汚れ","筋肉のやせ（上腕・大腿），握力や立ち上がりの力の変化，褥瘡好発部位の皮膚","血液データ：アルブミン・総たんぱく・ヘモグロビン・電解質（ナトリウム・カリウム・マグネシウム・リン．栄養の再開後は特に）・腎機能・炎症反応（単独では判断しない）","水分：飲水量と制限量の差，口渇の訴え，尿量，水分出納","便通（便秘は食欲を落とす），腹部膨満","気持ち：不安・落ち込み・せん妄の有無と食事への影響","退院後の食事環境：誰が作るか，買い物，経済面，配食サービスの利用"],"TP":["管理栄養士に早めにつなぎ，必要エネルギー・たんぱく質と食事の形態・補助食品を決めてもらう（必要量の算定は看護師が独自に行わない）","減塩の範囲で味を工夫する：酸味・香辛料・だし・香味野菜を使う，温かいものは温かく出す，一品に塩味を集中させる（塩分の指示量は医師・管理栄養士）","水分制限がある場合は，飲み物と食事中の水分（汁物・ゼリー・果物）を合わせて配分し，制限内で口渇を和らげる（氷片・含嗽・口腔ケア）","息切れがある患者は，少量を回数多く（分食），食べる前に休息，食事中は酸素を継続し，起坐位で食べる．食事の直前に負担の大きい処置やリハビリを入れない","嚥下障害が疑われたら食事を止めて評価し，ST・医師と食形態（とろみ・ペースト・ゼリーなど．きざみ食は口の中でまとまりにくく，必ずしも飲み込みやすい形態ではない）・一口量・姿勢を決める．食事は座位で，顎を引く姿勢は評価で有効と確認された患者に限って行う．決めた食形態の名称と性状は厨房と病棟で一致させ，食後は院内の基準に沿って座位を保つ","毎食前後の口腔ケア．義歯が合わなければ歯科へつなぐ","吐き気・食欲低下が薬の副作用と考えられる場合は医師・薬剤師に報告し，内服の時刻や薬の見直しを相談する（自己判断で中止しない）","食事環境を整える：起坐位で足を床につける，配膳前にトイレを済ませる，食器や箸を使いやすいものにする，可能なら家族と食べる","本人の好み・食べ慣れたものを取り入れる（家族の持ち込みは制限食との整合を確認し，院内規則に従う）","絶食・検査が続くとき，長く食べられていなかったとき，体重が大きく減ったときは，再開後の食事と補助食品を管理栄養士と早めに計画する．栄養の再開で電解質（リン・カリウム・マグネシウム）が急に下がり，不整脈・心不全・呼吸筋の弱りを起こすことがある（リフィーディング症候群）ため，摂取不足の期間と体重減少から高リスクと考えられれば再開前に医師・管理栄養士に相談し，開始量・増やし方・ビタミン B1 の投与は個別指示として共有する．再開後は電解質・むくみ・呼吸と循環を観察する","経口で足りないときは，補助食品・経腸栄養・静脈栄養を医師・管理栄養士・薬剤師と検討する（心不全では水分量・ナトリウム量を含めて）","離床・リハビリと組み合わせる（動くことで食欲と筋肉を保つ）"],"EP":["患者へ：食べることは心臓を治す治療の一部で，減塩は「食べない」ことではない．食べにくいときは我慢せず相談してほしい","患者・家族へ：減塩の具体的な工夫（汁物を減らす，漬物・加工食品を控える，酸味や香りを使う）と，たんぱく質（肉・魚・卵・大豆・乳製品）を毎食取ること","患者へ：水分制限がある場合の数え方（薬の水・汁物・果物も含む）と口渇の和らげ方","嚥下障害のある患者・家族へ：安全な姿勢・一口量・形態を守ること，むせ・発熱・痰の増加は早めに知らせること","患者・家族へ：体重は毎朝同じ条件で測り，減り続ける・急に増えるどちらも連絡すること（増加は水分，減少は栄養の問題の可能性）","家族へ：食事の持ち込みや差し入れは看護師・管理栄養士に確認してから．配食サービス・介護保険の利用は退院前に相談","患者へ：食欲が出ない・吐き気がある場合は薬の影響もあるので，医師・薬剤師に伝えてほしい"],"evaluation":{"timing":"毎食の記録をもとに 1 週間ごと．絶食・手術・嚥下状態の変化・体重減少があったときは早めに再評価","indicators":["必要量に対する摂取量が設定した割合に達している（管理栄養士と設定）","浮腫・水分の変化を考慮した体重・筋肉が維持または改善している","むせ・発熱・肺炎のサインがなく，安全な形態で食べられている","本人が「食べられない理由」を言え，工夫が実行されている","退院後の食事の準備・支援先が決まっている"],"revise_if":"摂取量が改善しない／体重減少が続く／むせ・発熱が出た／絶食や手術が入った／制限食の内容が変わった／経腸・静脈栄養が始まった"},"cardio_ward_notes":["心臓悪液質（心不全に伴うやせ）は食べても追いつかないことがある．「食べさせれば治る」ではなく，炎症・うっ血・低心拍出の治療と並行して管理栄養士・医師と目標を決める．体重は利尿で減るので，むくみが取れた後の体重で栄養を評価する","減塩・水分制限は心不全治療の柱だが，厳しすぎて食べられなければ本末転倒．「食べられていない」ことを医師・管理栄養士に報告し，制限の範囲内で優先順位を決めてもらう（制限量は施設・主治医の指示）","ワルファリン内服中はビタミン K を多く含む食品（納豆・青汁・クロレラなど）を避ける指導があるため，補助食品や持ち込み食品も薬剤師・管理栄養士と確認する","腎機能低下・透析患者はカリウム・リン・水分の制限が加わる．たんぱく質を増やすときは腎機能との兼ね合いを医師・管理栄養士と確認する","ジゴキシン・アミオダロンなどは食欲低下・吐き気を起こすことがある．「食べない」を高齢のせいにせず，薬の中毒サインの可能性も報告する","脳卒中を合併した患者（心原性塞栓など）は嚥下障害が隠れていることがある．心不全の食事指導の前に嚥下の安全を確認し，脳神経外科・ST と連携する"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.14 Nutrition（14.2 Basic Concepts，14.3 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/14-3-applying-the-nursing-process/","license":"CC BY 4.0","note":"栄養アセスメント（主観・客観・検査）の体系と，アルブミンなど検査値の読み方を参考"},{"name":"厚生労働省 褥瘡対策に関する診療計画書（令和 8 年度 基本診療料の施設基準等 通知 別紙 3）の栄養管理欄","url":"https://www.mhlw.go.jp/content/12400000/001732097.pdf","license":"PDL1.0","note":"低栄養の見方（GLIM 基準の考え方）を参考"},{"name":"NHLBI Heart Failure: Living With Heart Failure","url":"https://www.nhlbi.nih.gov/health/heart-failure/living-with","license":"パブリックドメイン","note":"塩分・水分制限と体重の見方，家族の関わりを参考"},{"name":"MedlinePlus: Heart failure - fluids and diuretics","url":"https://medlineplus.gov/ency/patientinstructions/000112.htm","license":"パブリックドメイン","note":"減塩の考え方・体重測定の方法・家族の役割を参考"},{"name":"NHLBI Heart-Healthy Living: Choose Heart-Healthy Foods","url":"https://www.nhlbi.nih.gov/health/heart-healthy-living/healthy-foods","license":"パブリックドメイン","note":"心臓に良い食事の内容を参考"},{"name":"MedlinePlus: Swallowing Disorders（Dysphagia）","url":"https://medlineplus.gov/swallowingdisorders.html","license":"パブリックドメイン","note":"嚥下障害の原因と対応（姿勢・形態・ST）を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"constipation_straining","group":"栄養・排泄","problem":"便秘があり，排便時のいきみを避ける必要がある","problem_plain":"安静・利尿薬・鎮痛薬・水分制限などで便が硬くなり出にくくなる状態．排便時に強くいきむと血圧が急に上がったり，逆に迷走神経の反射で脈が遅くなって血圧が下がり，胸痛・不整脈・失神・大動脈や創部への負担につながる．心臓の患者では「出す」だけでなく「いきまずに出す」ことが目標になる．","applies_when":["ベッド上安静・活動制限がある（急性心筋梗塞・大動脈解離・カテーテル後の穿刺部安静・術後）","利尿薬・水分制限で便が硬くなりやすい","オピオイド（鎮痛薬）・抗コリン作用のある薬・カルシウム拮抗薬・鉄剤・カリウム吸着薬などを使っている","いきみで危険が増す状態：急性冠症候群，大動脈解離・大動脈瘤，開心術後（胸骨），頭蓋内出血・動脈瘤，重症心不全，コントロール不良の高血圧","普段から便秘がある，排便のパターンが入院で崩れた（トイレ環境・時間・恥ずかしさ）","高齢，食事量・食物繊維の減少，嚥下障害でとろみ食","排便時に胸痛・動悸・ふらつき・失神をしたことがある"],"related_factors":["腸の動きの低下：安静・臥床，低心拍出による腸のうっ血・低灌流，術後の麻酔・手術侵襲","便の硬化：利尿薬・水分制限・脱水，食物繊維不足，食事量の減少","薬：オピオイド，抗コリン作用薬（抗不整脈薬の一部・睡眠薬・抗うつ薬），カルシウム拮抗薬，鉄剤，カリウム・リン吸着薬","排便環境：床上排泄への抵抗，同室者への気兼ね，ナースコールをためらう，トイレまでの移動制限","電解質異常：利尿薬による低カリウム・高カルシウム","心理：緊張・抑うつ・せん妄，「いきむのが怖い」と我慢する"],"assessment":{"scales":[{"name":"排便日誌（最終排便日・回数・量・硬さ・いきみの程度・下剤の使用と反応・排便時の症状）","license":"一般的な看護記録（ライセンス不要，自前で実装可能）","note":"「出たか」だけでなく「いきんだか」「排便中・後に胸痛・動悸・ふらつきがなかったか」を毎回記録する"},{"name":"便の形状の分類（ブリストル便形状スケールの 7 段階：コロコロ〜水様）","license":"分類の考え方は自前の言葉で記述可能．図版には権利者がある（Open RN 掲載図は Cabot Health 作成の CC BY-SA 3.0 版）．施設で使用中の版を参照する","note":"硬い便（1〜2 型）が続けば下剤の調整を医師に相談，軟便〜水様（6〜7 型）なら下剤の減量を相談"},{"name":"腹部のフィジカルアセスメント（視診・聴診・触診：膨満，腸蠕動音，圧痛，左下腹部の便の触知）","license":"一般的な手技","note":"腸蠕動音の消失・強い膨満・嘔吐・排ガスなしはイレウスの可能性．深く押さず医師へ速やかに報告．大動脈瘤がある患者の腹部は強く押さない"}],"assessment_points":["入院時に普段の排便パターン（回数・時間帯・下剤の習慣）と「いきまないと出ない」かを聞き，安静度・使っている薬・水分制限と合わせてリスクを見積もる","最終排便日を毎勤務確認し，何日出ていないかを申し送る（何日で介入するかは施設基準に従う）","便が出ないとき，便が直腸に溜まっている（宿便）のか，腸が動いていない（イレウス）のかを分ける．液状便が少量ずつ漏れるのは下痢ではなく宿便のサインのことがある","排便中・後のバイタル・症状（胸痛・動悸・冷汗・ふらつき・失神）を確認し，モニタ装着中は排便時の心拍・不整脈の変化も見る","下剤の使いすぎ（下痢・脱水・電解質異常）にも注意する．利尿薬との併用で脱水になりやすい"]},"goals":{"long_term":"強いいきみなしに定期的な排便があり，排便に伴う胸痛・不整脈・血圧変動・失神・創部や大動脈への負担が起きない","short_term":["入院時から：排便パターン・薬・安静度を踏まえた排便コントロールの方針（下剤の予防的使用を含む）が医師と共有されている","安静度や治療の状況に応じた間隔（施設基準）で，柔らかい便が出ている","毎回：排便時に強くいきまず，排便中・後に胸痛・動悸・ふらつきがない","退院までに：本人が「いきまない排便」の方法と，下剤の使い方・相談の目安を説明できる"]},"OP":["最終排便日・回数・量・硬さ（形状の分類），いきみの程度，残便感","排便中・後の血圧・脈拍・心電図モニタの変化，胸痛・動悸・冷汗・ふらつき・失神","腹部：膨満，腸蠕動音，圧痛，排ガスの有無，吐き気・嘔吐（イレウスの早期発見）","水分：飲水量・水分制限量・尿量・脱水のサイン（口渇・皮膚の乾燥・血圧低下）","食事：摂取量，食物繊維の量，とろみ食・経腸栄養の内容","薬：下剤の種類・量・効き方，便秘を起こす薬（オピオイド・抗コリン薬・カルシウム拮抗薬・鉄剤・吸着薬）の開始と増量","電解質：カリウム・カルシウム・マグネシウム（酸化マグネシウム使用中で腎機能が低い患者は高マグネシウム血症に注意）","活動：安静度，離床の進み具合，ベッド上での体の動き","排便環境：床上か，ポータブルトイレか，トイレか．本人の抵抗感・恥ずかしさ・我慢","痔・肛門の痛み・出血（抗凝固薬・抗血小板薬使用中は出血に注意）","直腸内の便の貯留（宿便）が疑われるときの所見（液状便の漏れ，下腹部の張り）"],"TP":["いきみで危険が増す患者（急性冠症候群・大動脈解離・開心術後・頭蓋内病変など）は，便秘になってから対応するのではなく，入院時から予防的な下剤の使用を医師に相談する（種類・量は医師・薬剤師が決める）","下剤は「便を柔らかくする薬（浸透圧性）」と「腸を動かす薬（刺激性）」を組み合わせて調整する．便の硬さと回数を見て医師に報告し，指示に基づいて増減する（看護師の判断で独自に変えない）","排便は安静度が許す範囲で最も楽な姿勢で：ベッド上での排泄はいきみが強くなりやすいので，許可があればポータブルトイレ・トイレへ．ベッド上のときは可能な範囲で上体を起こし，膝を曲げる","「いきまない排便」の方法を実践する：息を止めて力まず，口を軽く開けて息を吐きながら，便意が来たときに時間をかけて出す．便意を我慢させない（すぐ対応できる体制）","排便時は一人にしすぎない：床上排泄・ポータブルトイレでは近くで待機し，モニタ装着中は排便中の心拍・不整脈を見る．トイレへ行く患者はナースコールの位置を確認し，迷走神経反射（顔面蒼白・冷汗・徐脈・失神）に備える","水分：水分制限がない患者は飲水を促す．制限がある患者は「水を多く飲む」指導はできないので，制限内での配分と下剤の調整で対応する（制限量は医師の指示）","食事：食物繊維・乳製品・果物などを管理栄養士と相談して取り入れる（カリウム制限・水分制限との整合を確認）","活動：安静度の範囲で離床・歩行・ベッド上での下肢運動・腹部のマッサージ（大動脈瘤・術直後の創部がある場合は医師に確認）","排便の習慣づけ：朝食後など腸が動きやすい時間にトイレ・ポータブルトイレへ誘導し，プライバシーを確保する（カーテン・消臭・同室者への配慮）","坐薬・浣腸・摘便は迷走神経反射・血圧変動・出血（抗血栓薬）の危険があるため，医師の指示のもとで行い，前後のバイタル・症状を確認し，実施中は近くで観察する","宿便が疑われたら医師に報告し，指示に沿って対応する（イレウスとの区別がつかないときは腹部所見・嘔吐・排ガスの有無を伝える）","便秘を起こす薬の見直し（鎮痛薬の変更や下剤の併用など）を医師・薬剤師に相談する"],"EP":["患者へ：強くいきむと血圧が急に上がったり脈が遅くなって，心臓や血管・傷に負担がかかること．「出す」より「いきまずに出す」が大切","患者へ：便意が来たら我慢せずナースコールを押してよい．恥ずかしさで我慢するほうが体に悪い","患者へ：息を止めずに吐きながら出す方法，前かがみや足台で楽な姿勢を作る方法（安静度の範囲で）","患者へ：排便中・後に胸が痛い・動悸・冷汗・ふらつきがあれば，その場で知らせること（トイレなら鍵をかけずナースコールを使う）","患者・家族へ：下剤は指示どおりに使い，下痢や便が出すぎるときも自己判断でやめず相談すること","患者・家族へ：退院後も水分（制限がある場合は制限内）・食物繊維・体を動かすことで便秘を防ぐこと，硬い便が続くときは受診時に伝えること","患者へ：市販の下剤や便秘薬を使う前に，心臓の薬や腎臓との相性を薬剤師・医師に確認すること"],"evaluation":{"timing":"毎勤務（最終排便日の確認），および安静度・薬・食事内容が変わったとき．いきみ厳禁の病態では毎日","indicators":["施設基準の間隔内に柔らかい便が出ている","排便時に強いいきみがなく，排便中・後の胸痛・動悸・血圧変動・失神がない","腹部膨満・嘔吐・イレウスの徴候がない","下剤による下痢・脱水・電解質異常が起きていない","本人がいきまない排便の方法と相談の目安を説明できる"],"revise_if":"便が出ない日数が施設基準を超えた／排便時に症状が出た／イレウスや宿便が疑われる／オピオイドなど便秘を起こす薬が始まった・増えた／安静度や水分制限が変わった／下痢が続く"},"cardio_ward_notes":["急性心筋梗塞・不安定狭心症・大動脈解離・大動脈瘤・開心術後は，いきみによる血圧上昇と迷走神経反射のどちらも危険．便秘の予防を入院時の計画に入れ，「排便で悪化した」を作らない","利尿薬と水分制限で便は硬くなりやすいが，「水を飲んで便を柔らかく」は心不全では使えない．下剤の調整と食事の工夫で対応し，制限量の変更は医師に相談する","酸化マグネシウムは腎機能が低い患者（高齢・CKD・透析）で高マグネシウム血症を起こしうる．腎機能・血中マグネシウムの確認を医師・薬剤師と行う","大腿動脈穿刺後の臥床安静中や IABP 挿入中は，床上排泄でいきみが強くなりやすく，穿刺部の出血・血腫やデバイスの位置ずれにつながる．安静解除までの排便管理（下剤の前倒し，穿刺部の観察）を医師と相談する","浣腸・摘便での迷走神経反射は徐脈・血圧低下・失神を起こす．ペースメーカ植込み前の徐脈患者や低心拍出の患者では特に，医師の指示とモニタ下で行う","抗凝固薬・抗血小板薬使用中は痔や肛門からの出血，摘便での粘膜損傷に注意．黒色便・血便は消化管出血のサインとして速やかに報告する"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.16 Elimination（16.6 Constipation，16.9 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/16-6-constipation/","license":"CC BY 4.0（16.6 のブリストル便形状図は Cabot Health 作成 CC BY-SA 3.0）","note":"便秘の原因・宿便とイレウスの区別・排便アセスメントの体系を参考"},{"name":"MedlinePlus: Constipation - self-care","url":"https://medlineplus.gov/ency/patientinstructions/000120.htm","license":"パブリックドメイン","note":"食事・活動・下剤の使い方の患者向け説明を参考（水分量の数値は心不全では適用しないため転記していない）"},{"name":"NIDDK: Constipation","url":"https://www.niddk.nih.gov/health-information/digestive-diseases/constipation","license":"パブリックドメイン","note":"便秘の定義・受診の目安を参考"},{"name":"NIA: Concerned About Constipation?","url":"https://www.nia.nih.gov/health/constipation/concerned-about-constipation","license":"パブリックドメイン（出典表記：National Institute on Aging, National Institutes of Health）","note":"高齢者の便秘の原因（病気・薬・食事・活動）を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"urinary_issues","group":"栄養・排泄","problem":"排尿の問題がある（利尿薬による頻尿と夜間の転倒，尿閉，尿道カテーテル）","problem_plain":"利尿薬で尿の回数が増えて夜中に何度もトイレへ行き転びやすくなる，尿が出せず膀胱に溜まる（尿閉），尿道カテーテルが入っていて感染や抜去の時期の判断が要る，といった排尿にまつわる困りごと．循環器病棟では尿量が「心臓と腎臓の状態を映す指標」でもあるので，測る意味を理解して管理する．","applies_when":["利尿薬（内服・点滴）を使っていて，頻尿・尿意切迫・夜間頻尿がある","夜間にトイレへ行くときのふらつき・転倒リスクがある（高齢，降圧薬，睡眠薬，モニタやルート類）","尿が出にくい・出ない・残尿感がある（前立腺肥大，抗コリン作用薬，術後・カテーテル後，臥床で排尿できない）","尿道カテーテルが留置されている（急性心不全・ショックの尿量管理，術後，安静）","厳密な尿量測定が必要な状態（急性心不全，ショック，腎機能悪化，造影剤使用後）","尿失禁があり皮膚トラブルや活動の制限につながっている","尿路感染の症状（発熱・排尿時痛・濁り）がある，またはカテーテル抜去直後"],"related_factors":["利尿薬：投与時刻・量・効き方，SGLT2 阻害薬による尿量増加","低心拍出・腎機能低下：尿量減少（脱水・腎前性・心腎連関）","尿閉の原因：前立腺肥大，抗コリン作用のある薬（一部の抗不整脈薬・睡眠薬・抗うつ薬・過活動膀胱薬），オピオイド，術後・麻酔後，便秘，臥床での排尿困難，カテーテル抜去直後","転倒の要因：夜間のトイレ移動，起立性低血圧（降圧薬・利尿薬），ルート・モニタ類，暗さ，睡眠薬，せん妄","カテーテル関連：留置期間の長さ，固定・閉鎖回路の管理，尿道の刺激，抜去の判断が遅れる","心理・環境：トイレまで遠い，恥ずかしさ，尿器・ポータブルトイレへの抵抗"],"assessment":{"scales":[{"name":"排尿日誌（排尿時刻・量・尿意切迫・漏れ・夜間の回数，利尿薬の投与時刻，飲水量）","license":"一般的な看護記録（ライセンス不要，自前で実装可能）","note":"利尿薬の効く時間帯と夜間頻尿の関係，飲水パターン，転倒しやすい時間帯が見える"},{"name":"残尿測定（膀胱スキャナまたは導尿による排尿後残尿量）","license":"一般的な手技．実施の要否・報告する残尿量の基準は施設基準に従う","note":"「出ない」「少ししか出ない」「下腹部が張る」ときに行い，尿閉と乏尿（腎・心臓の問題）を区別する"},{"name":"前立腺症状・過活動膀胱の症状質問票（IPSS，OABSS など）","license":"各権利者の管理下．施設で使用中なら参照のみ","note":"泌尿器科と連携するときに施設の運用に合わせて使う"}],"assessment_points":["入院時に普段の排尿（回数・夜間の回数・出にくさ・漏れ・前立腺の病歴・排尿の薬）と，利尿薬の飲み方（時刻）を聞く","尿量は「利尿薬が効いているか」「腎臓と心臓が保てているか」の指標．減っているときは，脱水・低心拍出・腎機能悪化・尿閉（膀胱に溜まっている）のどれかを分けて考え，速やかに医師へ報告する（報告する尿量の基準は施設基準）","尿閉のサイン：下腹部の膨満・痛み，少量ずつの頻尿や漏れ（溢流），落ち着かない・血圧上昇・せん妄（高齢者では尿閉が混乱として出ることがある）","夜間のトイレ移動の危険：起き上がりでの血圧低下，ルート・モニタコード，照明，履物，睡眠薬の影響を実際に見て評価する","カテーテル留置中は毎日「まだ必要か」を評価し，抜去後は自排尿の有無・残尿・尿路感染の症状を観察する"]},"goals":{"long_term":"排尿の問題による転倒・尿閉・尿路感染・皮膚トラブルが起きず，尿量が治療の指標として正確に把握され，本人が安心して排尿できる","short_term":["24 時間以内：排尿パターンと利尿薬の投与時刻を踏まえた夜間のトイレ対策（環境・介助の方法）が決まっている","入院中：夜間のトイレ移動で転倒・けががない","尿閉が疑われたら残尿測定と報告がされ，膀胱の過伸展・尿路感染が起きていない","尿道カテーテルは必要性が毎日評価され，不要になった時点で医師と相談して抜去され，抜去後に自排尿が確認されている","指示された尿量測定が正確に記録され，水分出納が治療に反映されている"]},"OP":["排尿：回数・量・時刻，夜間の回数，尿意切迫，漏れ，出にくさ，残尿感，排尿時痛","尿量と水分出納（時間尿の指示があるときは正確に），尿の色・濁り・血尿・においの変化","利尿薬の投与時刻と，その後の尿量・血圧・ふらつき・電解質（カリウム・ナトリウム）・腎機能","夜間のトイレ移動の様子：起立時の血圧低下・ふらつき，ルートやコードの取り回し，照明・履物・ナースコールの使用","尿閉のサイン：下腹部の膨満・痛み，残尿量，落ち着きのなさ・血圧上昇・混乱","尿閉を起こしやすい薬（抗コリン作用薬・オピオイド・一部の抗不整脈薬）の開始・増量，便秘の有無","尿道カテーテル：留置の理由と必要性（毎日），固定・閉鎖回路・バッグの位置，尿の流出，尿道口の痛み・分泌物，発熱","尿路感染の症状：発熱・悪寒，排尿時痛，腰背部痛，混濁尿（高齢者では発熱がなく食欲低下や混乱だけのことがある）","失禁による皮膚の状態（発赤・びらん），オムツ・パッドの使用状況","腎機能・電解質の検査値，造影剤使用後の尿量の推移","本人の気持ち：恥ずかしさ・遠慮，尿器・ポータブルトイレへの抵抗，夜間に一人で行こうとする傾向"],"TP":["利尿薬の投与時刻を見直す：夜間頻尿と転倒を減らすため，内服の時刻（朝・昼への集中）を医師・薬剤師に相談する（看護師の判断で時刻や量を変えない）","夜間のトイレ対策：ベッドの高さ・照明（足元灯）・ナースコール・履物・ルートやコードの整理，ポータブルトイレや尿器を安静度と本人の希望に合わせて置く．起き上がりはゆっくり，必要なら介助や見守り","利尿薬投与後の効き始めの時間帯に排尿誘導・訪室を増やし，「トイレに間に合わない」焦りによる転倒を防ぐ","尿閉が疑われたら残尿測定を行い，施設基準に沿って医師に報告．指示に基づいて導尿（可能なら間欠的導尿を優先し，留置は必要なときだけ）","排尿しやすい環境：可能なら座位・立位（男性）で，プライバシーを確保し，流水音や下腹部の温罨法など自然な排尿を促す工夫をする","尿道カテーテル留置中：閉鎖回路を保ち，バッグは膀胱より低く床につけない，チューブの屈曲・牽引を避けて固定する，陰部の清潔を保つ，尿の流出を定期的に確認する（管理の細部は院内の CAUTI 予防手順）","カテーテルの必要性を毎日評価し，留置の理由（厳密な尿量管理・尿閉・創部保護など）がなくなったら医師に抜去を提案する","抜去後は自排尿の時刻・量を確認し，出ないときは残尿測定と報告．排尿時痛・発熱があれば尿路感染を疑って報告する","尿量測定が指示されているときは，測定の方法（尿器・採尿カップ・カテーテルの目盛）を統一し，本人にも「流さずに知らせる」ことを依頼する","失禁がある患者は排尿誘導（時間を決めてトイレへ）とパッドの選択，皮膚の保護（洗浄・保湿・撥水）を行い，「オムツにすれば楽」で済ませない","尿閉・頻尿を起こしている薬の見直しを医師・薬剤師に相談する（前立腺肥大の患者で抗コリン作用薬が始まったときなど）","便秘があれば同時に対応する（直腸に便が溜まると排尿が妨げられる）"],"EP":["患者へ：利尿薬は「余分な水分を出す薬」で，尿が増えるのは効いている証拠．回数が多くてつらいときは薬をやめずに時刻の相談ができる","患者へ：夜間トイレに行くときはナースコールを押す・ゆっくり起き上がる・足元灯をつける・ルートやコードを確認すること．「迷惑をかけたくない」で一人で行かない","患者へ：尿を測っている理由（心臓・腎臓・薬の効き方を見る）と，流さずに知らせてほしいこと","患者へ：尿が出にくい・下腹部が張る・排尿時に痛い・発熱があれば早めに知らせること","カテーテルが入っている患者・家族へ：バッグを膀胱より低く保つ，チューブを引っ張らない，触ったら手を洗う，尿の色や量の変化を伝えること","患者・家族へ：退院後も利尿薬の内服時刻・水分の取り方を守ること，夜間頻尿と転倒の対策（自宅のトイレまでの動線・照明）","患者へ：市販薬（風邪薬・鼻炎薬など抗コリン作用のあるもの）で尿が出にくくなることがあるので，薬剤師・医師に確認すること"],"evaluation":{"timing":"毎勤務（尿量・排尿状況・カテーテルの必要性），利尿薬の変更後・カテーテル抜去後は重点的に","indicators":["夜間のトイレ移動で転倒・けががない","尿閉・膀胱の過伸展が起きていない（残尿量が施設基準内）","尿道カテーテルの留置日数が必要最小限で，尿路感染が起きていない","指示された尿量測定が正確に記録され，治療の判断に使われている","本人が排尿の困りごとを遠慮なく伝えられている"],"revise_if":"尿量が減った／尿閉が出た／夜間の転倒やふらつきがあった／カテーテルを留置・抜去した／利尿薬や抗コリン作用薬が変わった／尿路感染の症状が出た"},"cardio_ward_notes":["尿量は循環器病棟では「心臓のポンプが腎臓に血を送れているか」を映す．尿量が減ったら，まず脱水・低心拍出・腎機能悪化・尿閉のどれかを考え，血圧・脈・うっ血所見・膀胱の張りを確認して速やかに報告する（乏尿の報告基準は施設基準）","急性心不全・心原性ショック・術直後は厳密な尿量管理のためにカテーテルを留置することが多い．循環が安定したら「まだ必要か」を毎日医師と確認し，早期抜去で尿路感染とせん妄・ルート抜去の危険を減らす","利尿薬の効く時間帯に転倒が起きやすい．降圧薬・血管拡張薬との併用で起立性低血圧が強くなるため，起き上がりの血圧・ふらつきを確認し，夜間の投与は避けられないか医師と相談する","前立腺肥大の患者に抗コリン作用のある抗不整脈薬（ジソピラミドなど）や睡眠薬が始まると尿閉を起こすことがある．開始後は残尿と下腹部の張りを見る","SGLT2 阻害薬は尿量増加・尿路感染・性器感染のもとになる．排尿回数の増加と陰部の症状を確認し，脱水（シックデイ）に注意する","大腿穿刺後の臥床安静中は臥位で排尿できず尿閉になりやすい．安静中の排尿方法（尿器の使い方，男性は側臥位など）を事前に説明し，出ないときは残尿測定と医師への報告を早めに行う"],"sources":[{"name":"Open RN Nursing Fundamentals 2e, Ch.16 Elimination（16.4 Urinary Incontinence，16.5 Urinary Retention，16.9 Applying the Nursing Process）","url":"https://wtcs.pressbooks.pub/nursingfundamentals/chapter/16-5-urinary-retention/","license":"CC BY 4.0","note":"尿閉・残尿測定・排尿日誌・失禁の種類と介入の体系を参考"},{"name":"NIDDK: Urinary Retention","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/urinary-retention","license":"パブリックドメイン","note":"急性・慢性尿閉の定義と診断・治療の概要を参考"},{"name":"NIDDK: Bladder Control Problems（Urinary Incontinence）","url":"https://www.niddk.nih.gov/health-information/urologic-diseases/bladder-control-problems","license":"パブリックドメイン","note":"失禁の原因と対応を参考"},{"name":"MedlinePlus: Indwelling catheter care","url":"https://medlineplus.gov/ency/patientinstructions/000140.htm","license":"パブリックドメイン","note":"カテーテル管理と感染サインの患者向け説明を参考"},{"name":"MedlinePlus: Urine drainage bags","url":"https://medlineplus.gov/ency/patientinstructions/000142.htm","license":"パブリックドメイン","note":"バッグの位置・清潔管理を参考"},{"name":"MedlinePlus: Heart failure - fluids and diuretics","url":"https://medlineplus.gov/ency/patientinstructions/000112.htm","license":"パブリックドメイン","note":"利尿薬の種類・副作用（頻尿・失禁・ふらつき）・内服時刻の考え方を参考"}],"generated_by":"Claude（看護知識．要看護師レビュー）"},{"id":"anxiety","group":"心理・社会・セルフケア","problem":"不安がある（急性期の死への恐怖・手術前・ICD 作動への恐れ・再発への不安・検査待ち）","problem_plain":"「死ぬかもしれない」「また発作が来るのでは」「手術や検査で何をされるのか」といった先の見えなさへの心の反応．胸がドキドキする・息が苦しい・眠れない・落ち着かないなど体の症状としても出るため，心臓の症状と区別しながら，話を聴き，必要な情報を伝え，家族と一緒に支える．","applies_when":["急性期（胸痛・呼吸困難・ショックからの回復期）で「死ぬかと思った」体験をした","手術・カテーテル治療・デバイス植込み・検査を控えている，または結果を待っている","ICD の作動（ショック）を経験した，作動を恐れて活動を控えている","再発・再入院・退院後の生活（仕事・運転・性生活・運動）への不安を口にする","落ち着かない・眠れない・何度も同じ質問をする・ナースコールが増える・涙もろい，など不安のサインがある","動悸・息苦しさ・胸の違和感を訴えるが心臓の検査で説明がつかない（心臓の病気の除外が前提）","家族が強い不安を抱え，本人にも影響している"],"related_factors":["病気そのもの：突然の発症，命に関わる体験，症状の再燃への恐れ，予後がわからない","治療・検査：手術・カテーテル・ICD への恐れ，説明の理解不足，結果待ちの時間","環境：CCU/ICU のモニタ音・照明・処置，安静による無力感，家族と会えない","身体：低酸素・低心拍出・頻脈・薬（β刺激薬・ステロイド・一部の気管支拡張薬）・カフェイン・離脱（アルコール・ベンゾジアゼピン）による不安に似た症状","本人の背景：不安になりやすい性格・既往（パニック障害など），過去のつらい医療体験，仕事・経済・家族の心配","情報：説明が専門用語だらけ，人によって言うことが違う，インターネットの情報"],"assessment":{"scales":[{"name":"GAD-2／GAD-7（全般性不安の 7 項目の自己記入式質問票．GAD-2 は最初の 2 項目）","license":"判定 5：開発者（Spitzer, Williams, Kroenke ら）が Pfizer の助成で作成．公式サイトに「複製・翻訳・表示・配布に許可は不要」と明記．翻訳版も同サイトで配布（日本語版の有無は掲載一覧で確認）","note":"スクリーニング用．点数だけで診断せず，高い場合は医師に報告して精神科・心療内科・心理士への相談を検討する"},{"name":"不安の強さの主観的評価（0〜10 の数値，または「軽い・中等度・強い・パニック」の 4 段階）と，本人の言葉での記録","license":"一般的な手法（自前で実装可能）","note":"「今どのくらい不安か」「何が一番心配か」「何があれば楽になるか」を毎回同じ聞き方で記録し，変化を追う"},{"name":"HADS・STAI などの質問票","license":"各権利者の管理下（有償または許諾が必要）．施設で使用中なら参照のみ","not
