<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看護 模擬対話コーパス ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menuBtn" class="menu" aria-label="絞り込み">☰ 絞り込み</button>
  <div class="ttl">
    <h1>看護 模擬対話コーパス ビューア <span id="total" class="total"></span></h1>
    <p>看護師と患者の模擬対話，看護記録（SOAP），情報収集のチェック項目です．登場する患者はすべて架空です．</p>
  </div>
  <div class="jtools"><button id="judgeBtn" class="jtog">確認モード：OFF</button><button id="nameBtn" class="jname" hidden></button><span class="sync" id="syncState" hidden><i></i><span></span></span></div>
  <input id="q" type="search" placeholder="キーワード検索（タイトル・タグ・対話・記録）">
</header>
<div class="layout">
  <aside id="side" class="side">
    <div id="filters"></div>
    <button id="reset" class="reset">絞り込みを解除</button>
  </aside>
  <main class="main">
    <div id="count" class="count"></div>
    <div id="list" class="list"></div>
    <button id="more" class="more" hidden>さらに表示</button>
  </main>
</div>
<div id="detail" class="detail" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
